  $('#fTr').innerHTML =
    opt('Tier 1', c.tier.T1, F.tier.T1, 'data-tier="T1"', '<span class="tick">✓</span>') +
    opt('Tier 2', c.tier.T2, F.tier.T2, 'data-tier="T2"', '<span class="tick">✓</span>') +
    opt('분야 제외', c.tier.EX, F.tier.EX, 'data-tier="EX"', '<span class="tick">✓</span>') +
    opt('안 읽은 것만', P.filter(function(p){ return !READ[kof(p)]; }).length, F.unread, 'data-unread="1"', '<span class="tick">✓</span>');
  TOPTAGS = Object.keys(c.tag).map(function(t){ return [t,c.tag[t]]; }).sort(function(a,b){ return b[1]-a[1]; }).slice(0,30);
  var open = $('#fTg').classList.contains('open');
  $('#fTg').innerHTML = TOPTAGS.slice(0, open?30:10).map(function(x){
    return opt(x[0], x[1], !!F.tags[x[0]], 'data-tag="'+esc(x[0])+'"', '<span class="tick">✓</span>'); }).join('');
  $('#more').textContent = open ? '접기' : '더 보기';
  var n1 = c.tier.T1, n2 = c.tier.T2;
  $('#sum').innerHTML = '<b>'+weeks.length+'</b>개 주차 · <b>'+js.length+'</b>개 저널<br>Tier 1 <b>'+n1+'</b>편 · Tier 2 <b>'+n2+'</b>편';
  $('#gen').textContent = D.generated;
}

function hay(p){
  if(p._h) return p._h;
  p._h = [p.ko,p.en,p.one,p.ab,p.bg,p.ap,p.sig,p.lim,p.lab,p.au,(p.kf||[]).join(' '),(p.tags||[]).join(' ')].join(' ').toLowerCase();
  return p._h;
}
function ok(p){
  var q = $('#q').value.trim().toLowerCase();
  if(q && hay(p).indexOf(q) < 0) return false;
  if(F.wk && p.w !== F.wk) return false;
  if(F.jn && p.j !== F.jn) return false;
  if(!F.tier[p.t]) return false;
  if(F.unread && READ[kof(p)]) return false;
  for(var t in F.tags){ if((p.tags||[]).indexOf(t) < 0) return false; }
  return true;
}

function detail(p){
  var figs = (p.figs||[]).map(function(f){
    return '<figure><img loading="lazy" src="'+esc(f.src)+'" alt="'+esc(f.label)+'">'+
           '<figcaption><i>'+esc(f.label)+'</i>'+esc(f.cap)+'</figcaption></figure>'; }).join('');
  var kf = (p.kf||[]).map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('');
  var links = '';
  if(p.url) links += '<a href="'+esc(p.url)+'" target="_blank" rel="noopener">원문 ↗</a>';
  if(p.doi) links += '<a href="https://doi.org/'+esc(p.doi)+'" target="_blank" rel="noopener">DOI '+esc(p.doi)+'</a>';
  return [
    p.au ? '<h3>저자</h3><p class="au">'+esc(p.au)+(p.aff?'<br>'+esc(p.aff):'')+'</p>' : '',
    p.ab ? '<h3>초록</h3><div class="abs"><p>'+esc(p.ab)+'</p></div>' : '',
    p.bg ? '<h3>연구 질문</h3><p>'+esc(p.bg)+'</p>' : '',
    p.ap ? '<h3>접근 방법</h3><p>'+esc(p.ap)+'</p>' : '',
    kf ? '<h3>핵심 결과</h3><ol class="kf">'+kf+'</ol>' : '',
    p.sig ? '<h3>의의</h3><p>'+esc(p.sig)+'</p>' : '',
    p.lim ? '<h3>한계</h3><p>'+esc(p.lim)+'</p>' : '',
    p.lab ? '<h3>연구실 연결</h3><p>'+esc(p.lab)+'</p>' : '',
    figs ? '<h3>그림</h3>'+figs : '',
    links ? '<div class="links">'+links+'</div>' : '',
    p.lic ? '<p class="lic">'+esc(p.lic)+'</p>' : ''
  ].join('');
}
function eye(p, withRead){
  var k = kof(p), done = !!READ[k];
  var mk = p.t==='T1' ? '<span class="t1">Tier 1</span>' : p.t==='T2' ? '<span class="t2">Tier 2</span>' : '<span class="t2">분야 제외</span>';
  var ty = (p.type && p.type!=='Article') ? '<span class="ty">'+esc(p.type)+'</span>' : '';
  var dm = p.dem ? '<span class="dm">전문 못 구함</span>' : '';
  var rd = withRead && p.t!=='EX' ? '<button class="rd'+(done?' on':'')+'" data-k="'+esc(k)+'" title="읽음 표시" aria-pressed="'+done+'">'+CHECK+'</button>' : '';
  return '<div class="eye"><span class="j">'+esc(p.j)+'</span>'+mk+ty+dm+rd+'</div>';
}
function item(p){
  var k = kof(p), c = JC[p.j] || '#777', done = !!READ[k];
  var cls = 'item '+(p.t==='T1'?'t1':p.t==='T2'?'t2':'ex')+(done?' done':'')+((SEL===k||OPEN[k])?' sel':'');
  if(p.t==='EX'){
    return '<article class="'+cls+'" style="--jc:'+c+'" data-k="'+esc(k)+'">'+eye(p,false)+
      '<h2 class="ttl">'+esc(p.en||p.ko)+'</h2></article>';
  }
  var tags = (p.tags||[]).map(esc).join(' · ');
  var link = p.url ? '<a href="'+esc(p.url)+'" target="_blank" rel="noopener">원문 ↗</a>'
           : p.doi ? '<a href="https://doi.org/'+esc(p.doi)+'" target="_blank" rel="noopener">DOI ↗</a>' : '';
  return '<article class="'+cls+'" style="--jc:'+c+'" data-k="'+esc(k)+'">'+eye(p,true)+
    '<h2 class="ttl">'+esc(p.ko || p.en)+'</h2>'+
    (p.en && p.ko ? '<div class="en">'+esc(p.en)+'</div>' : '')+
    (p.one ? '<p class="lead">'+esc(p.one)+'</p>' : '')+
    '<div class="meta"><span class="tg">'+tags+'</span>'+link+'</div>'+
    (OPEN[k] ? '<div class="det">'+detail(p)+'</div>' : '')+
    '</article>';
}
function activeChips(){
  var out = [];
  if(F.wk) out.push(['wk', kshort(F.wk)]);
  if(F.jn) out.push(['jn', F.jn]);
  Object.keys(F.tags).forEach(function(t){ out.push(['tag', t, t]); });
  if(F.unread) out.push(['unread', '안 읽은 것만']);
  var q = $('#q').value.trim(); if(q) out.push(['q', '“'+q+'”']);
  $('#active').innerHTML = out.map(function(x){
    return '<button data-clear="'+x[0]+'" data-v="'+esc(x[2]||'')+'">'+esc(x[1])+' ×</button>'; }).join('');
}
function render(){
  var hit = P.filter(ok);
  $('#cnt').textContent = hit.length + '편';
  activeChips();
  if(!hit.length){ $('#list').innerHTML = '<div class="none">조건에 맞는 논문이 없다. 필터를 풀어 보라.</div>'; return; }
  var byw = {};
  hit.forEach(function(p){ (byw[p.w] = byw[p.w] || []).push(p); });
  var out = '';
  Object.keys(byw).sort().reverse().forEach(function(w){
    var arr = byw[w].slice().sort(function(a,b){
      var o = {T1:0,T2:1,EX:2}; if(o[a.t]!==o[b.t]) return o[a.t]-o[b.t];
      if(a.j!==b.j) return a.j<b.j?-1:1; return a.i-b.i; });
    out += '<section class="week"><h2>'+kdate(w)+'<small>'+arr.length+'편</small></h2><div class="r"></div>'+
           arr.map(item).join('')+'</section>';
  });
  $('#list').innerHTML = out;
}
function pane(p){
  var el = $('#pane');
  if(!p){ el.innerHTML = '<div class="empty">제목을 고르면 여기에 펼쳐진다</div>'; return; }
  el.innerHTML = '<button class="close" id="pClose">닫기</button><div class="head" style="--jc:'+(JC[p.j]||'#777')+'">'+eye(p,false)+
    '<h2 class="ttl">'+esc(p.ko||p.en)+'</h2>'+(p.en&&p.ko?'<div class="en">'+esc(p.en)+'</div>':'')+
    (p.one?'<p class="one">'+esc(p.one)+'</p>':'')+'</div><div class="det">'+detail(p)+'</div>';
  el.scrollTop = 0;
}
function wide(){ return window.matchMedia('(min-width:1180px)').matches; }
function find(k){ for(var i=0;i<P.length;i++) if(kof(P[i])===k) return P[i]; return null; }

/* 이벤트 */
document.getElementById('sheet').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  if(b.id==='shClose'){ $('#sheet').hidden = true; return; }
  if(b.id==='more'){ $('#fTg').classList.toggle('open'); rail(); return; }
  if(b.id==='pTh'){
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    b.textContent = next === 'dark' ? '주간' : '야간';
    try { localStorage.setItem('shelfTheme', next); } catch(e2){}
    return;
  }
  if(b.dataset.wk !== undefined){ F.wk = b.dataset.wk; }
  else if(b.dataset.jn !== undefined){ F.jn = b.dataset.jn; }
  else if(b.dataset.tier){ F.tier[b.dataset.tier] = !F.tier[b.dataset.tier]; }
  else if(b.dataset.unread){ F.unread = !F.unread; }
  else if(b.dataset.tag){ if(F.tags[b.dataset.tag]) delete F.tags[b.dataset.tag]; else F.tags[b.dataset.tag] = 1; }
  else return;
  rail(); render();
});
$('#shOpen').addEventListener('click', function(){ $('#sheet').hidden = false; });
$('#active').addEventListener('click', function(e){
  var b = e.target.closest('button[data-clear]'); if(!b) return;
  var c = b.dataset.clear;
  if(c==='wk') F.wk=''; else if(c==='jn') F.jn=''; else if(c==='tag') delete F.tags[b.dataset.v];
  else if(c==='unread') F.unread=false; else if(c==='q') $('#q').value='';
  rail(); render();
});
$('#list').addEventListener('click', function(e){
  var rd = e.target.closest('.rd');
  if(rd){
    e.stopPropagation();
    var k = rd.dataset.k; READ[k] = !READ[k]; save();
    var it = rd.closest('.item');
    it.classList.toggle('done', !!READ[k]);
    rd.classList.toggle('on', !!READ[k]); rd.setAttribute('aria-pressed', !!READ[k]);
    rail();
    if(F.unread) render();
    return;
  }
  if(e.target.closest('a')) return;
  if(e.target.closest('.det')) return;
  var it = e.target.closest('.item'); if(!it) return;
  var k = it.dataset.k, p = find(k); if(!p || p.t==='EX') return;
  if(wide()){
    SEL = (SEL===k) ? null : k;
    document.querySelectorAll('.item.sel').forEach(function(x){ x.classList.remove('sel'); });
    if(SEL) it.classList.add('sel');
    pane(SEL ? p : null);
  } else {
    OPEN[k] = !OPEN[k];
    it.outerHTML = item(p);
  }
});
$('#pane').addEventListener('click', function(e){
  if(e.target.id==='pClose'){ SEL=null; document.querySelectorAll('.item.sel').forEach(function(x){ x.classList.remove('sel'); }); pane(null); }
});
$('#q').addEventListener('input', render);
try {
  var th = localStorage.getItem('shelfTheme');
  if(th){ document.documentElement.setAttribute('data-theme', th); $('#pTh').textContent = th === 'dark' ? '주간' : '야간'; }
} catch(e){}
if(window.matchMedia('(max-width:860px)').matches) $('#sheet').hidden = true;
window.matchMedia('(max-width:860px)').addEventListener('change', function(m){ $('#sheet').hidden = m.matches; });
rail(); render();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
