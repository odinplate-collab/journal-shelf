. 저자들은 표지와 염색, 고정, 절편이 모두 필요 없는 ULTRA 플랫폼을 제시한다. 50% urea를 60도에서 쓰는 한 단계 투명화와 stimulated Raman scattering 현미경을 결합하고, 확산 모형 노이즈 제거와 조건부 GAN, 변형 CycleGAN 세 단계 자기지도 학습으로 FFPE 수준 3차원 가상 H&E 영상을 만든다. 전체 처리 시간은 약 30분이다. 세포 밀도는 같은 환자의 표준 H&E 절편과 일치했고 astrocytoma는 핵 부피가 크고 oligodendroglioma와 GBM은 밀도가 높았다. GBM 경계 시료 약 1 세제곱밀리미터를 훑어 ULTRAscore로 침윤 경계를 구획했다. MRI FLAIR 부종에서 채취한 시료 2개에서도 종양 부담이 드러났다.","tags":["종양 영상","glioma","의료 인공지능","수술 중 진단"],"doi":"10.1016/j.cell.2026.07.026","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00824-X","au":"Liu Z, Li Y, …, Shi L","aff":"Shanghai Xuhui Central Hospital, Zhongshan-Xuhui Hospital, Institutes of Biomedical Sciences, Shanghai Medical College, Fudan University, Shanghai, China (제1저자 Liu Z, 교신저자 Shi L); State Key Laboratory of Surface Physics and Department of Physics, Fudan University, Shanghai, China (교신저자 Ji M)","type":"Resource","bg":"뇌종양 수술의 목표는 기능을 지키면서 종양을 최대한 제거하는 것이고, 절제 범위가 넓을수록 생존과 수술 결과가 좋아진다는 보고가 있다. 그런데 수술 중 조직학은 여전히 동결 절편에 의존한다. 동결 절편은 2차원 표본이고 동결 왜곡과 부정확한 절편, 들쭉날쭉한 염색 품질 같은 기술적 인공물이 있다. 보통 절편 2개에서 3개만 보기 때문에 표본 편향과 판독 변동이 생긴다. SRS 현미경은 표지 없이 화학 특이성을 주지만 산란 때문에 보통 조직 100에서 300 마이크로미터까지만 들어간다. 저자들은 SRS와 맞고 수술 중 시간 안에 끝나는 투명화 방법을 만들 수 있는지 물었다.","ap":"먼저 SRS와 맞는 한 단계 급속 투명화 조건을 탐색했다. 인지질 상전이 온도와 포화 지방산 사슬 길이의 관계를 근거로 막 유동성을 조절해 50% urea를 60도에서 10분 쓰는 조건을 찾고 cyclodextrin과 계면활성제 첨가제를 비교했다. 마우스와 사람 뇌 절편을 1mm와 2mm 두께로, 고정 시료와 신생 시료 모두에서 깊이별 신호 대 잡음비로 평가했다. 수술로 절제한 사람 뇌 시료는 10명에서 받아 검증했다. 영상은 CH2 진동 띠 2,850 cm-1에서 부피로 획득했다. 복원과 가상 염색은 세 단계 자기지도 딥러닝으로 처리했다. Poisson 노이즈를 가정한 확산 모형(PBDM)으로 깊이 인식 노이즈 제거를 하고, 조건부 GAN으로 단백질 채널 SRH 영상을 예측하고, 변형 CycleGAN으로 가상 H&E를 만들었다. 임상 적용은 glioma 아형별 종양 중심 시료와 수술 중 절제한 경계 시료에 적용했고, 경계 분석은 약 1 세제곱밀리미터 부피를 5 마이크로미터 z 간격으로 훑어 3D-CNN 기반 ULTRAscore로 구획했다.","kf":["투명화와 SRS 영상, ULTRA staining을 합친 전체 처리 시간이 약 30분이었다. 동결 절편 판독과 비슷한 시간에 3차원 맥락 정보를 준다.","가상 H&E 영상의 세포 밀도 측정값이 같은 환자의 표준 H&E 절편 값과 잘 일치해 정량 신뢰성을 확인했다.","astrocytoma는 oligodendroglioma와 GBM보다 핵 부피가 유의하게 컸고, oligodendroglioma와 GBM은 세포 밀도가 유의하게 높았으며 GBM에서는 광범위한 괴사 영역이 두드러졌다. 정상 뇌는 세포 분포가 훨씬 희박하고 핵 부피가 컸다.","GBM 경계 시료 약 1 세제곱밀리미터를 3차원으로 훑어 ULTRAscore로 침윤 경계를 구획했고, 고밀도에서 저밀도로 가는 점진적 전이를 3차원 밀도 지도로 보였다.","MRI FLAIR 부종 영역에서 전부 채취한 시료 2개에서 핵 밀도 상승과 glioma 형태를 보이는 상당한 종양 부담이 드러났다. 2차원 표본만 보면 위음성 판독 위험이 있음을 보여준다.","항법 오차 구간에서 채취한 시료 2개는 신경항법상 정상으로 보이고 신경생리 감시에서 음성이었던 비핵심 피질에서 왔는데도 종양이 확인됐다.","ULTRA는 비파괴적이어서 조직 100%를 보존했다. RNA 분석과 면역형광, 면역조직화학으로 거대분자 보전을 확인했다."],"sig":"3차원 조직학을 수술 중 시간 안으로 끌어와, 동결 절편의 2차원 표본 편향을 보완하는 경로를 제시한다. 비파괴적이라 같은 조직을 이후 분자 분석에 그대로 쓸 수 있어 다중 단백질 영상이나 공간 전사체와 묶을 수 있다. 저자들은 투명화 자체가 장기에 무관하게 작동하므로 유방, 위, 전립선, 췌장 암 등으로 넓힐 수 있다고 제안한다.","lim":"저자들은 네 가지 한계를 적는다. 점확산함수의 비등방성 때문에 축 방향 점확산함수보다 작은 구조는 z축으로 다소 늘어나 보일 수 있다. ULTRA staining에 쓰는 확산 모형이 느리고 장기나 조직별 조정이 필요할 수 있다. 시약은 저렴하지만 SRS 영상 장비가 연구기관과 일부 전문 임상 기관에만 있다. 기계적으로나 생화학적으로 성질이 다른 장기들에 걸친 공간 충실도 검증이 더 필요하다.","lab":"공간 정보를 가진 종양 조직 측정이라는 점에서 우리 연구실의 공간 오믹스와 접점이 있다. 다만 단일 채널 라벨 프리 화학 영상이고 분자 다중화가 없어 공간 오믹스 자체는 아니다. 저자들이 밝힌 대로 조직을 100% 보존하므로 같은 시료에 공간 전사체나 다중 단백질 영상을 이어 붙일 수 있고, 그 조합이 우리에게 실질적인 연결점이다. 암 조직의 이질성과 경계 판정이라는 주제도 우리 관심 분야다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CEL_2026-10-01_t1-4_fig1.jpg","label":"Figure 1","cap":"ULTRA 방법의 전체 흐름을 도식으로 보여준다. 한 단계 투명화를 거친 조직을 CH2 진동 띠 2,850 cm-1에서 SRS 현미경으로 부피 영상화하고, 얻은 지질 채널 영상을 확산 모형 기반 깊이 인식 노이즈 제거, 조건부 GAN의 단백질 채널 예측, 변형 CycleGAN의 가상 H&E 염색 세 단계로 FFPE 수준 3차원 가상 조직상으로 바꾼다."},{"src":"fig/CEL_2026-10-01_t1-4_fig7.jpg","label":"Figure 7","cap":"glioma 확산 경계를 ULTRA로 구획하는 과정을 보여준다. MRI 항법과 수술 중 신경생리 감시를 결합한 수술 안내 도식, 경계 분석과 3차원 침윤 경계 구획 흐름, 깊이 400 마이크로미터 단면 영상, 3D-CNN에서 얻은 ULTRAscore로 시각화한 3차원 확산 경계를 함께 담았다."}]},{"j":"Cell","w":"2026-10-01","t":"T1","i":5,"ko":"종을 가로지른 선조체 단일세포 아틀라스가 세포형과 아영역의 질병 취약성을 정의한다","en":"Cross-species single-cell atlas of the striatum defines cell-type and subregion disease vulnerabilities","one":"사람 시료 109개와 마우스 시료 22개의 단일핵 RNA 시퀀싱으로 선조체 아틀라스를 만들고, GWAS와 약리 자료, 단일세포 수준 HTT 반복 길이 측정을 결합해 아영역과 세포형별 질병 취약성을 정의한다.","ab":"선조체의 세포형과 아영역은 신경퇴행 및 신경정신 질환에 서로 다르게 관여하지만 그 취약성 기전은 알려지지 않았다. 저자들은 기증자 69명의 사람 시료 109건과 마우스 시료 22건을 단일핵 RNA 시퀀싱해 배측과 복측 선조체를 아우르는 아틀라스를 만들었다. medium spiny neuron 약 219,000개와 다른 신경세포 약 23,500개를 분석하고 mFISH와 Visium HD로 검증했다. 희귀 집단과 배측외측 복측내측 전사 구배를 정의했고 종 사이 차이가 뚜렷했다. GWAS 124건과 약리 자료를 통합해 사람에서 두드러지는 오피오이드 수용체 부위와 만성 항정신병약 작용의 복측 치우침을 찾았다. scMOSAIC로 전사체와 HTT CAG 반복 길이를 같은 세포에서 읽어, 초기 등급 HD 기증자 3명과 대조 3명에서 배측 우세 확장과 취약 MSN 아형을 확인했다.","tags":["단일세포 오믹스","공간 전사체","신경과학","대규모 자원"],"doi":"10.1016/j.cell.2026.08.006","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00933-5","au":"Linville RM, James BT, …, Heiman M","aff":"The Picower Institute for Learning and Memory, Massachusetts Institute of Technology, Cambridge, MA, USA (제1저자 Linville RM, 교신저자 Heiman M); The Broad Institute of MIT and Harvard, Cambridge, MA, USA 및 Computer Science and Artificial Intelligence Lab, Massachusetts Institute of Technology, Cambridge, MA, USA (교신저자 Kellis M); Department of Cancer Immunology and Virology, Dana-Farber Cancer Institute, Boston, MA, USA (교신저자 Gabuzda D)","type":"Article","bg":"선조체의 세포형과 아영역은 신경퇴행 질환과 신경정신 질환에 서로 다르게 관여한다. 그런데 그 취약성이 왜 생기는지는 알려지지 않았다. 앞선 연구들은 선조체의 특정 아영역만 다뤄 희귀 집단을 정확히 세포형으로 분류할 통계적 힘이 없었다. 저자들은 배측과 복측 선조체를 함께 담는 대규모 단일핵 전사체 아틀라스를 만들면, 연속적인 전사 구배와 불연속적인 세포형 차이를 모두 포착하고 유전 위험과 약물 작용, 질병 취약성을 세포 수준에서 연결할 수 있는지 물었다.","ap":"기증자 69명에서 얻은 사람 선조체 핵 시료 109건과 마우스 시료 22건을 단일핵 RNA 시퀀싱으로 측정했다. 사람 시료는 측좌핵, 조가비핵, 꼬리핵을 포함한다. medium spiny neuron 약 219,000개와 다른 신경세포 아형 약 23,500개를 분석했다. 다중 형광 in situ 교잡(mFISH)과 Visium HD 공간 전사체로 희귀 집단과 구배를 검증했다. GWAS 124건을 아틀라스에 통합해 세포형별 유전 위험을 매핑했다. 만성 항정신병약 작용은 마우스에 clozapine을 6주 증량 투여해 모델링했다. Huntington 병 분석에는 scMOSAIC(single-cell multi-omic somatic analysis with integrated capture)을 썼다. 초기 등급(Vonsattel 0/1) HD 기증자 3명과 연령을 맞춘 대조 3명의 관상 절편에서 꼬리핵과 측좌핵을 따로 떼어, 같은 세포에서 전사체와 대립형질별 HTT CAG 반복 길이를 함께 읽었다.","kf":["조화한 선조체 아틀라스를 만들어 matrix와 striosome 경계를 가로지르는 outlier MSN 두 아형과 복측 선조체의 분자적으로 이질적인 island 구조, 희귀 콜린성 집단을 정의했다. 상당수는 앞선 연구에서 세포형을 정하기에 너무 드물었던 집단이다.","CNR1과 CRYM의 비가 사람 선조체의 배측외측 복측내측 축을 정의하는 구배를 이루었고 mFISH로 검증했다.","오피오이드 신호에서 아영역 차이가 뚜렷했다. OPRM1과 OPRK1은 여러 MSN 아형에서 복측으로 농축됐고 OPRD1은 D2 matrix와 outlier MSN에서 배측으로 농축됐다. D1 outlier MSN은 OPRM1, RXFP1, CRHR2, TACR1, GHR 같은 펩타이드 수용체가 농축됐다.","GWAS 통합에서 오피오이드 사용 장애 위험 유전자 OPRM1과 FOXP2가 농축됐고, 조현병 위험 유전자 BCL11B, GRIN2A, CACNA1C, FOXP1, SLC39A8은 D1과 D2 MSN에서 배측으로 농축됐다.","마우스에 clozapine을 6주 증량 투여하면 대사, 리보솜, 산화 스트레스 관련 유전자가 변했고 즉시 초기 유전자는 변하지 않았다. 전사 효과는 복측으로 치우쳤다.","초기 등급 HD 뇌 4개의 배측 복측 축 조직 해부에서 정규화한 HTT CAG 반복 확장이 배측에서 더 컸고 소뇌에서는 확장이 거의 없었다.","scMOSAIC로 세포 단위 반복 길이를 읽어 보니 배측외측 복측내측 연속체를 따라 확장이 달라졌고, 저항성 MSN 아형과 취약 MSN 아형이 갈렸다. 긴 HTT CAG 확장을 가진 집단은 HOX 유전자를 발현하고 outlier MSN 근처에 있었다.","HD에서 나타난 MSN 전사 억제 해제는 단핵 내 mutant HTT 封入체와 연결된 단백질 독성 주도 상태를 반영했고 보상적 전사 반응과 임상적으로 의미 있는 생체표지가 함께 나타났다."],"sig":"사람 선조체의 세포형 구성과 아영역 특화를 대규모로 정리한 참조 자원을 만들었다. 사람과 마우스의 차이를 세포형 수준에서 짚어 설치류 질병 모델과 치료 표적 해석의 한계를 구체적으로 보여준다. 전사체와 같은 세포의 DNA 반복 길이를 함께 읽는 scMOSAIC는 체세포 반복 확장 질환에서 세포형별 취약성을 직접 측정하는 경로를 제시한다.","lim":"저자들은 여섯 가지 한계를 적는다. 사후 조직은 살아 있는 조직의 전사 차이를 가릴 수 있고 종 간 비교에 인공물을 넣을 수 있어, 연령과 사후 경과 시간 연관 전사체를 찾아 보정하고 종 간 차등 발현 기준을 엄격히 잡았다. 콜린성 중간뉴런의 분자 다양성은 세포 수확량이 적어 통계적 힘이 제한됐다. 연령 연관 분석은 주된 목표가 아니었다. 부검 시료의 성비가 맞지 않아 성별 의존 발현은 보지 못했다. CNR1과 CRYM 구배 외의 다른 공간 구배는 아직 규명되지 않았다. scMOSAIC는 분석한 세포 전체가 아니라 일부에서만 HTT CAG 반복 길이를 포착했으므로 희귀 세포형과 매우 긴 확장을 담으려면 더 큰 규모의 연구가 필요하다.","lab":"사람 조직 109건 규모의 단일핵 RNA 시퀀싱을 직접 생산하고 공간 전사체로 검증하는 설계는 우리 연구실의 단일세포 및 공간 오믹스 작업과 바로 맞닿는다. 같은 세포에서 전사체와 유전체 특징을 함께 읽는 scMOSAIC식 접근은 종양의 체세포 변이와 전사 상태를 연결할 때 참고할 만하다. 다만 질환 주제는 신경퇴행이라 암과의 직접 연결은 약하다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CEL_2026-10-01_t1-5_fig1.jpg","label":"Figure 1","cap":"성인 사람 선조체 신경세포 다양성의 전사체 아틀라스를 보여준다. 기증자 69명에서 얻은 시료 109건의 구성, medium spiny neuron 약 219,000개와 다른 신경세포 아형 약 23,500개의 UMAP, 세포형별 표지 유전자와 배측 복측 상대 빈도, 세포형별 경로 요약을 함께 담았다."},{"src":"fig/CEL_2026-10-01_t1-5_fig6.jpg","label":"Figure 6","cap":"초기 등급 Huntington 병에서 아영역과 세포형의 취약성을 보여준다. 세포 소실과 전사 교란, HTT 반복 불안정성을 함께 제시하고, scMOSAIC 실험 흐름과 대립형질별 HTT CAG 반복 길이 예측을 MSN 위에 겹쳐 배측외측 복측내측 확장 연속체를 나타낸다."}]},{"j":"Cell","w":"2026-10-01","t":"T2","i":1,"ko":"대사 조절의 수렴 진화가 Toxoplasma의 산화 환원 적응을 지배한다","en":"Convergent evolution of metabolic regulation governs redox adaptation in Toxoplasma","one":"","ab":"다양한 생물은 밀집 상태에서 영양 결핍과 산화 스트레스, 폐기물 축적을 겪으면서 대사 유전자 발현을 조정한다. Apicomplexa 기생충은 숙주 세포 안에서 성장하는 동안 이런 스트레스를 겪지만 대사 적응을 담당하는 조절자는 알려진 바가 없었다. 우리는 Apicomplexa 기생충 Toxoplasma gondii를 선별해 밀집 상태에서 기생충 적응도를 뒷받침하는 유전자를 찾았다. 높은 기생충 밀도에서는 nicotinamide adenine dinucleotide(NAD)(P)+ 생합성이 필요했고, 기생충 특이 인자 여럿도 함께 필요했다. 그 가운데 우리가 TgPRO(T. gondii parasite response to oxidation)라 이름 붙인 RNA 결합 단백질이 있다. TgPRO가 없으면 대기 조건에서 활성산소종이 늘었고 낮은 산소 농도에서 키우면 회복됐다. TgPRO는 탄소 대사와 철황 클러스터 조립에 관여하는 전사체의 발현을 조절한다. 철황 클러스터 조립 단백질 ISCU의 조절은 TgPRO가 그 전사체의 3' UTR에 결합하는 데 달려 있다. TgPRO는 수렴 진화를 통해 다른 종에서 알려진 대사 조절자와 유사한 역할을 수행하며, Apicomplexa에서 대사 유전자 발현을 전담하는 첫 조절자다.","tags":["기생충 대사","RNA 결합 단백질","CRISPR 스크린","다중 오믹스"],"doi":"10.1016/j.cell.2026.07.029","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00827-5","au":"Giuliano CJ et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Giuliano CJ et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.029. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":2,"ko":"Acanthamoeba ATP synthase 구조가 TCA 회로와 OXPHOS가 물리적으로 묶여 있음을 드러낸다","en":"Acanthamoeba ATP synthase structure reveals the TCA cycle is tethered to OXPHOS","one":"","ab":"산화적 인산화(OXPHOS)는 산화 환원 에너지를 ATP 생산에 연결하는 핵심 대사 과정이다. OXPHOS 핵심 복합체의 일부 소단위는 생물의 모든 영역에 걸쳐 발견되지만, 많은 소단위는 진화 과정에서 분기하거나 확장했다. 원생동물 병원체 Acanthamoeba castellanii가 그런 예다. 우리는 농축하지 않은 미토콘드리아 용해물의 저온전자현미경과 질량분석 단백체를 통합해 Acanthamoeba의 내재 미토콘드리아 ATP synthase(복합체 V), Hsp60, 호흡 복합체 III의 구조를 결정했다. Acanthamoeba ATP synthase를 IF1에 억제된 상태로 포착했고, Acanthamoeba 특유의 소단위와 연장 부위가 이 분자 기계를 안정화하는 방식을 밝혔다. 여기에는 주변 줄기와 접하는 베타 소단위 연장이 포함된다. 또한 ATP synthase의 주변 줄기 안에 구조적으로 통합된 활성 malate dehydrogenase(MDH) 이량체를 규명해, OXPHOS와 tricarboxylic acid 회로를 잇는 직접적인 단백질 연결을 드러냈다. 이 결과들은 원생동물의 대사를 조율할 수 있는 Acanthamoeba의 계통 특이적 적응에 대한 구조적 통찰을 제공한다.","tags":["구조생물학","미토콘드리아","OXPHOS","저온전자현미경"],"doi":"10.1016/j.cell.2026.08.057","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01068-8","au":"Fry MY et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Fry MY et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.057. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":3,"ko":"지열 아메바가 진핵생물의 상한 온도를 새로 올렸다","en":"A geothermal amoeba sets a new upper temperature limit for eukaryotes","one":"","ab":"생명의 온도 한계 연구는 주로 세균과 고세균을 대상으로 이루어졌고, 발견 이후 수십 년 동안 60도 위에서 증식하는 진핵생물은 보고되지 않았다. 저자들은 지열 온천에서 아메바 Incendiamoeba cascadensis를 분리했다. 이 생물은 63도에서 분열하고 64도까지 운동성을 유지해 기존 상한을 넘겼다. 중온성 아메바와 비교하면 단백질 항상성과 환경 감지 관련 유전자가 농축돼 있었다. 고온에서의 비교 RNA 시퀀싱에서는 단백질 항상성, DNA 수선, 막 수송 경로가 상향 조절됐다. 예측 단백질은 표면의 양전하 잔기가 농축되는 등 독특한 생물물리 성질을 보였는데, 이는 세균과 고세균 초고온성 생물과 같은 특징이다. 저자들은 이것이 온도 스트레스 아래에서 단백질 안정성을 얻는 수렴 기전이라고 제안한다. 연구는 생명이 어디에서 어떻게 버틸 수 있는지에 대한 이해를 넓힌다. 같은 호 Preview가 이 논문을 다룬다.","tags":["극한 생물","진화","비교 전사체"],"doi":"10.1016/j.cell.2026.08.043","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01016-0","au":"Rappaport HB et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":4,"ko":"조작한 바이러스 유사 입자로 살아 있는 세포의 전사체를 읽는다","en":"Live-cell transcriptomics with engineered virus-like particles","one":"","ab":"전사체 프로파일링은 세포의 유전자 발현을 특성화하는 데 널리 쓰이지만, 기존 방법은 세포를 용해하기 때문에 같은 시료에서 전사 역학을 직접 분석할 수 없다. 우리는 포유류 세포가 바이러스 유사 입자(VLP)로 mRNA를 내보내 자신의 전사 상태를 스스로 보고하도록 조작해 이 한계를 다뤘다. VLP를 만드는 세포 집단의 배양액을 반복해 채취하면 복잡한 생물학적 상황에서 변해 가는 전사 상태를 충실히 포착했다. 여기에는 1차 세포 스페로이드의 급성 염증 자극과 여러 날에 걸친 만능 줄기세포 분화가 포함된다. 우리는 공배양에서 서로 다른 세포 유형의 신호를 다중으로 읽고 자기 보고되는 RNA 프로파일을 조정할 수 있도록 VLP 구성 요소를 조작했다. 마지막으로, 닫힌 구조를 가진 미세생리계 공배양 안에서 내피세포의 동역학만 선택적으로 추적해 혈관 생성의 바탕이 되는 혈관 주변 간질 의존 시간 유전자 프로그램을 찾아내며 자기 보고의 고유한 유용성을 입증했다. 이 연구는 세포 자기 보고를 살아 있는 세포의 전사체 전역 유전자 발현 프로파일링을 가능하게 하는 폭넓은 기술로 자리매김한다.","tags":["전사체","신기술","세포 공학"],"doi":"10.1016/j.cell.2026.08.005","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00932-3","au":"Najia MA et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Najia MA et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.005. CC BY-NC 4.0에 따라 비영리 목적으로 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":5,"ko":"Gasdermin E가 바이러스성 pyroptosis와 치명적 간 지질 축적을 잇는다","en":"Gasdermin E couples viral pyroptosis to lethal hepatic lipid accumulation","one":"","ab":"진드기 매개 orthonairovirus인 wetland virus(WELV)의 병인 기전은 불분명했다. 저자들은 환자에서 간 효소 상승과 중성지방 축적, 과염증을 동반한 치명적 간 기능 장애를 확인했다. WELV는 미토콘드리아 경로와 Fas 경로를 거쳐 간세포에서 GSDME 의존 pyroptosis를 일으킨다. 바이러스 RNA가 RIG-I와 CASP3로 GSDME 절단을 활성화하고 nucleoprotein은 CASP3 의존 가공으로 음성 되먹임을 만든다. GSDME는 FASN에 결합해 K48 연결 유비퀴틴화를 막아 분해를 억제하고 지질 대사를 재편한다. UPLC-TQMS 표적 지질체에서 감염 간은 TAG와 DAG가 쌓이고 PE와 PC가 줄었다. GSDME 결손은 pyroptosis와 대사 교란을 없애 완전한 보호를 주었다. 임상 승인된 caspase 및 FASN 억제제는 감염 마우스의 간 병리를 줄이고 생존을 개선했다.","tags":["바이러스 감염","pyroptosis","지질 대사","간 손상"],"doi":"10.1016/j.cell.2026.07.011","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00809-3","au":"Wang C et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":6,"ko":"염색질 조절자 ANKRD11의 응축체가 과전사 유전자를 억제해 발생을 지킨다","en":"Condensates of the chromatin regulator ANKRD11 restrict hypertranscribed genes to safeguard development","one":"","ab":"세포 정체성을 정하는 유전자는 흔히 높게 전사되지만, 병적인 조절 이상을 막기 위해 그 활성이 어떻게 조절되는지는 아직 분명하지 않다. 우리는 두 단계 유전 스크린으로 과전사 좌위를 조절하는 유전자 네트워크를 찾았고, 이 네트워크는 발생 질환에서 돌연변이가 생기는 유전자가 두드러지게 농축돼 있었다. 그 가운데 KBG 증후군에서 반수체 부족을 보이는 염색질 조절자 ANKRD11은 전사가 높은 유전자일수록 점점 더 강하게 억제한다. ANKRD11은 과전사 좌위 주변에 농축되고 전하 블록 패턴을 가진 내재적 비구조 영역을 통해 생체분자 응축체를 만든다. 이 응축체는 신장 인자를 RNA 중합효소 II에서 공간적으로 격리해 전사 신장을 제한한다. 마우스에서 Ankrd11 소실은 이 제한을 없애 발생 유전자의 비정상 활성화와 기관 형성 교란, 배아 치사를 일으킨다. 중요하게도 ANKRD11 돌연변이를 가진 KBG 환자 세포는 응축체 형성에 결함이 있고 그 결과 과전사 유전자가 과활성화된다. 이 결과들은 과전사 유전자를 제한하는 응축체 매개 기전을 밝히고, 그 교란이 KBG 증후군 같은 발생 질환의 바탕에 있음을 시사한다.","tags":["염색질 조절","생체분자 응축체","발생 질환","CRISPR 스크린"],"doi":"10.1016/j.cell.2026.07.006","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00804-4","au":"Zhang T et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Zhang T et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.006. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":7,"ko":"본래 염색질 맥락에서 enhancer와 facilitator, promoter가 이루는 견고한 조절 상호작용","en":"Robust regulatory interplay of enhancers, facilitators, and promoters in a native chromatin context","one":"","ab":"enhancer가 내재적 염색질 맥락에서 어떻게 작동하는지는 기전으로 밝히기 어려웠다. 저자들은 Bxb1 재조합효소 landing pad를 쓰는 유전체 재작성 플랫폼을 만들어, 사람 원거리 enhancer eNMU가 본래 좌위에서 Neuromedin U(NMU)를 1만 배 활성화하는 방식을 해부했다. eNMU에는 기능이 다른 두 하위 요소가 있었다. 독립 작동하는 전형적 enhancer e1과, 자체로는 비활성이지만 e1의 활성을 크게 키우는 facilitator e2다. e1은 약 100 kb의 NMU와 eNMU 영역에서 e2와 다른 facilitator들, NMU promoter보다 기능적 상위에 있고 3차원 조절 허브 형성을 주도했다. e1 안에는 양방향 전사되는 레트로바이러스 LTR enhancer와 NMU 발현을 낮추는 인접 LTR promoter가 함께 있는 이분 구조가 들어 있었다.","tags":["전사 조절","enhancer","유전체 편집 기술"],"doi":"10.1016/j.cell.2026.06.033","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00753-1","au":"Zhou Z et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":8,"ko":"LRRK2의 활성화와 자가억제를 설명하는 구조적 기반","en":"The structural basis for LRRK2's activation and autoinhibition","one":"","ab":"leucine-rich repeat kinase 2(LRRK2)의 돌연변이는 자가우성 Parkinson 병(PD)의 두 번째로 흔한 원인이고, LRRK2 키나아제 활성 증가는 특발성 PD에서도 관찰돼 LRRK2는 중요한 실행 가능 치료 표적이다. LRRK2는 286 kDa 다중 도메인 효소로 Ras 유사 GTPase(ROC)와 키나아제 도메인을 가진다. 우리는 저온전자현미경과 생화학적 재구성, 세포 기반 분석을 써서 ROC GTPase가 자가억제 상태와 활성 상태 사이의 전환을 지배함을 보였다. GTP 결합은 활성화를 촉진하고 GDP 결합은 자가억제를 강제한다. 흔한 PD 연관 돌연변이 G2019S와 R1441C/G/H는 서로 다른 구조적 기전으로 LRRK2를 활성화해, 유전자형에 따라 조절 이상에 이르는 경로가 다름을 드러낸다. 이 결과들은 LRRK2 조절을 이해하는 통합된 틀을 제공하며 폭넓은 치료적 함의를 가진다. GDP 결합 상태를 안정화하면 자가억제를 유지해 LRRK2를 억제할 수 있고, 반대로 GTP 결합 상태를 촉진하는 것은 LRRK2 키나아제 활성이 보호적이거나 조절적 역할을 할 수 있는 폐 같은 특정 세포 맥락에서 유리할 수 있다.","tags":["구조생물학","Parkinson 병","키나아제 조절"],"doi":"10.1016/j.cell.2026.07.027","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00825-1","au":"Villagran Suarez A et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Villagran Suarez A et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.027. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":9,"ko":"DDIAS가 분열기에 단일가닥 DNA를 보호하고 척추동물 뇌 발생을 돕는다","en":"DDIAS shields single-stranded DNA in mitosis and promotes vertebrate brain development","one":"","ab":"DNA 이중가닥 절단과 해소되지 않은 DNA 복제 중간체는 분열기에 특히 위험하다. 역설적으로 세포는 염색체 분리 동안 표준 DNA 수선 기전을 끄고 TOPBP1과 CIP2A에 의존하는 대안 경로를 쓰지만, 이 경로가 어떻게 작동하는지는 아직 잘 정의되지 않았다. 여기서 우리는 DDIAS를 분열기 특이 DNA 손상 반응 단백질로 동정한 내용을 기술한다. 우리는 DDIAS가 인산화 의존적으로 TOPBP1-CIP2A 복합체의 구성 요소이자 실행 인자임을 확립하고, DDIAS가 단일가닥 DNA를 비정상적인 핵산분해 가공으로부터 보호해 분열기 염색체 완전성을 지킨다는 것을 보인다. 이 작용은 특히 BRCA1 또는 BRCA2가 결손된 세포에서 두드러진다. 우리는 또한 중증 신경발달 장애 환자에서 DDIAS의 양대립형질 불활성화 돌연변이를 동정하고, 사람 뇌 오가노이드와 제브라피시를 써서 DDIAS가 신경 전구세포에서 특이적으로 DNA 손상을 제한하는 결정적이고 진화적으로 보존된 역할을 한다는 것을 보인다. 이 결과들은 척추동물 신경 발생 동안 분열기 DNA 손상 반응이 생리적 역할을 가진다는 것을 입증한다.","tags":["DNA 손상 반응","염색체 안정성","신경 발생"],"doi":"10.1016/j.cell.2026.07.041","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00873-1","au":"Tsukada K et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Tsukada K et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.041. CC BY-NC 4.0에 따라 비영리 목적으로 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":10,"ko":"Trichoderma의 swollenin이 AtABCB5 의존 옥신 유출을 활성화해 식물 발달을 촉진한다","en":"Trichoderma swollenin activates AtABCB5-dependent auxin efflux to promote plant development","one":"","ab":"유익 진균 Trichoderma가 식물 생장을 높이는 기전은 잘 알려지지 않았다. 저자들은 Trichoderma harzianum의 swollenin ThSWO가 뿌리 정착과 생장 촉진에 기여함을 보였다. ThSWO는 식물 세포벽을 통과해 원형질막에 국재하고 ABC 수송체 AtABCB5와 상호작용하며, 저자들은 AtABCB5가 진정한 옥신 유출 운반체임을 확립했다. ThSWO가 AtABCB5의 NBD2와 R 도메인 면에 결합하면 Ser640과 Ser644 인산화가 촉진돼 IAA 유출이 늘고, 세포벽 산성화와 막전위 전이, 세포질 흐름 가속이 일어났다. 접촉면의 구조 기반 치환은 수송체 결합과 측근 촉진에 서로 다르게 영향을 주었다. ThSWO는 여러 작물에서 생장과 수량을 높였다. 저자들은 진균 효과인자가 숙주의 옥신 수송 기구를 이용해 식물 발달을 촉진하는 분자 기전을 밝혔다고 보고하며, 미생물을 이용한 작물 개량에 함의가 있다고 제안한다.","tags":["식물 미생물 상호작용","옥신 수송","진균 효과인자"],"doi":"10.1016/j.cell.2026.07.001","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00761-0","au":"Lu J et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":11,"ko":"세균과 Arabidopsis의 상호 이익 관계가 인 영양과 생장을 돕는다","en":"Mutually beneficial interactions between bacteria and Arabidopsis promote phosphorus nutrition and growth","one":"","ab":"식물이 인(P) 제한에 대응하기 위해 어떤 세균과 상호 이익 관계를 맺는지는 알려지지 않았다. 우리는 뿌리 세균 미생물군 구성원을 특성화해 그중 다수가 Arabidopsis와 협력해 유식물의 인 영양과 생장을 촉진할 수 있음을 보였다. 심층 분석은 인 결핍 동안 Arabidopsis와 Acinetobacter 세균 사이의 정교한 상호작용을 밝혔다. 인이 결핍된 뿌리가 분비하는 malate는 인을 직접 캐내는 역할을 하는 것이 아니라 도움을 요청하는 신호로 작용해 세균을 근면(rhizoplane)으로 불러들인다. 거기서 Acinetobacter는 상호 이익적 생활 방식을 택하고 숙주에서 온 영양분을 이용해, 식물이 보통 접근할 수 없는 인을 강하게 가용화한다. 주변 공간이 아니라 근면이 식물과 세균 모두의 인 획득 거점이었다. 이 상호작용은 세균 군집 맥락에서도, 인이 척박한 토양에서도 일어났다. 우리 연구는 균근을 만들지 않는 식물과 세균 사이에 인 영양을 촉진하는 상호 이익 전략이 있음을 밝힌다.","tags":["식물 미생물군","인 영양","근권 상호작용"],"doi":"10.1016/j.cell.2026.07.048","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00917-7","au":"Wang Y et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Wang Y et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.048. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T2","i":12,"ko":"배측 선조체의 내인성 오피오이드 동역학이 신경 활동을 조형해 목표 지향 행동을 촉진한다","en":"Endogenous opioid dynamics in the dorsal striatum sculpt neural activity to promote goal-directed action","one":"","ab":"내인성 오피오이드 dynorphin은 목표 지향 행동에 중요한 배측 선조체에 많지만, dynorphin과 kappa opioid receptor(KOR) 신호의 기능적 역할은 알려지지 않았다. 기존 연구는 시공간 정밀도가 떨어졌다. 저자들은 조건부 결손, 신경펩타이드 바이오센서, 이광자 영상, 시간 정렬 광유전학적 분비 조작을 함께 써서, 배측내측 선조체(DMS) medium spiny neuron에서 시간에 맞춰 일어나는 국소 dynorphin 분비가 목표 지향 행동에 필요하고 충분하다고 보고한다. 기저측 편도(BLA)에서 오는 글루탐산성 축삭 종말이 선조체 dynorphin 분비를 유발하고, 그 결과 역행성 시냅스 전 Gi 결합 수용체 억제가 일어나 행동을 촉진했다. 저자들은 이 결과가 빠른 시간 척도의 내인성 신경펩타이드 분비와 그에 따른 시냅스 전 Gi 신호의 인과적 역할을 분리해 냈다고 제안한다.","tags":["신경펩타이드","선조체","행동 신경과학"],"doi":"10.1016/j.cell.2026.07.058","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00927-X","au":"Gowrishankar R et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T1","i":1,"ko":"계통 고유의 단백질이 kinetoplastid의 미토콘드리아 단백체를 넓혔다","en":"Lineage-specific innovations expand mitochondrial proteomes in kinetoplastids","one":"질량분석 기반 단백질 상관 프로파일링으로 Trypanosoma brucei 1,666개와 Leishmania tarentolae 1,594개의 미토콘드리아 단백질 목록을 만들고, 그중 약 700개가 다른 진핵생물에 상동체가 없음을 보였다.","ab":"Trypanosoma brucei와 Leishmania tarentolae는 kinetoplast DNA(kDNA)라는 독특한 DNA 그물을 미토콘드리아 안에 가지며 발달 단계에 따른 재편성과 RNA 편집 같은 특수한 성질을 보이는 모델 kinetoplastid다. 저자들은 질량분석 기반 단백질 상관 프로파일링을 이미 공개된 데이터와 통합해 T. brucei에서 1,666개, L. tarentolae에서 1,594개의 미토콘드리아 단백질 목록을 만들었다. 여기에는 지금까지 미토콘드리아 단백질로 인정되지 않았던 폴리펩타이드 124개가 들어 있다. 계통상 거리가 멀지만 trypanosome과 leishmania는 서로 매우 보존된 미토콘드리아 단백체를 유지하며, 그 가운데 약 700개 구성 요소는 다른 진핵생물에서 상동체가 검출되지 않는다. T. brucei의 곤충 단계와 포유류 단계를 비교하면 미토콘드리아 단백체의 구성은 비슷했으나 후자에서 미토콘드리아 단백질의 양이 전반적으로 줄어 있었고, 칼슘 항상성 구성 요소와 alternative oxidase 경로만 예외였다. 저자들은 또한 pan-edited 전사체의 산물을 포함해 kDNA가 암호화하는 단백질 10개를 검출했다. 이 목록은 아직 기능이 밝혀지지 않은 미토콘드리아 인자를 분석하는 틀을 제공하고 kinetoplastid 진화를 형성한 변화를 보여 준다.","tags":["미토콘드리아","단백체 자원","기생충 생물학","비교진화"],"doi":"10.1016/j.molcel.2026.08.032","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00616-7","au":"Vacas AF, Solayman M, …, Mootha VK, Aphasizhev R, Aphasizheva I","aff":"Department of Molecular and Cell Biology, Boston University Medical Campus, Boston, MA, USA; Department of Molecular Biology, Massachusetts General Hospital, Boston, MA, USA; Department of Systems Biology, Harvard Medical School and Broad Institute of MIT and Harvard, Boston and Cambridge, MA, USA","type":"Resource","bg":"kinetoplastid의 미토콘드리아는 maxicircle과 minicircle이 얽힌 kDNA 그물, U 삽입과 결실 방식의 RNA 편집, 단백질이 많은 미토리보솜 같은 독특한 장치를 갖추고 있다. 그런데 이 장치를 구성하는 단백질 목록은 연구마다 어긋났다. 기존 데이터를 모두 합치면 T. brucei에서 1,794개가 나오지만 그중 약 13%가 위양성으로 추정됐다. 저자들은 믿을 수 있는 기준 미토콘드리아 단백체가 없다는 문제를 풀기 위해 두 종의 목록을 새로 만들고 다른 진핵생물의 미토콘드리아 단백체와 비교하려 했다.","ap":"T. brucei 곤충형(TbPCF)과 혈류형(TbBSF), L. tarentolae 전편모형(LtPMF)에서 미토콘드리아를 단계적으로 농축했다. 외막 단백질 POMP10에 EGFP와 Twin-Strep 태그를 붙여 면역침강으로 소포를 회수하고 Proteinase K 처리와 OptiPrep 밀도구배를 이어 붙였다. 각 분획을 DIA 질량분석으로 정량하고 TOM40, Hspd1, IscU를 기준 단백질로 삼아 단백질 상관 프로파일링(PCP) 점수를 계산했다. 전세포 용해물에서는 단백질 7,606개(단백질군 6,948개)를 검출해 T. brucei 단백체의 79%를 덮었다. PCP 점수 0.6 이상을 미토콘드리아로 분류한 뒤 TrypTag 형광 태깅 데이터와 문헌 기반 gold+ 집합을 합쳐 MitoCarta 목록을 완성했고, Mito-TOL 사업이 정의한 진핵생물 203종과 원핵 34개 분류군의 상동 유전자군(OG)과 비교했다.","kf":["TbMitoViaPCP 1,577개 단백질은 수작업으로 큐레이션한 기준 집합에 대해 민감도 90%, 보정 위발견율 7%를 보였고 기존 공개 데이터셋을 모두 앞섰다.","최종 목록은 T. brucei 1,666개, L. tarentolae 1,594개로, 사람 1,136개, 효모 901개, Arabidopsis 1,609개보다 크다. T. brucei에서는 124개가 새로 미토콘드리아 단백질로 추가됐다.","L. tarentolae 목록(LtMitoViaPCP)은 민감도 93%, 보정 위발견율 7%였고 기존 보고 388개에서 약 3배로 넓어졌다.","두 속은 약 1억 2천만 년 전에 갈라졌지만 미토콘드리아 단백질은 95%가 상동 관계였고 세포 전체 단백체의 약 80%보다 보존도가 높았다. MitoCarta에 들어간 OG 1,503개 가운데 46%는 Discoba 밖에서 상동체가 검출되지 않았다.","kDNA가 암호화하는 단백질 18개 중 10개를 질량분석으로 검출했다. 편집되지 않는 전사체(ND1, ND2, COX1, uS3m), 중간 정도로 편집되는 전사체(CYB, COX2), pan-edited 전사체(ND7, COX3, ATP6)의 산물과 기능이 지정되지 않은 cryptogene MURF2의 산물이 모두 들어 있다.","곤충형과 혈류형 T. brucei의 단백체 구성은 비슷했지만 미토콘드리아 단백질이 차지하는 질량분석 신호는 약 16%에서 약 8%로 줄었다. OXPHOS 복합체 III과 IV가 특히 많이 감소했고 TAO, mtG3PDH, ALAT, MCU, L2HGDH는 늘었다."],"sig":"두 기생충의 미토콘드리아 단백체가 같은 품질 지표 아래 정리되어 mitocarta.org에서 공개됐다. Kinetoplastea에만 있는 미토콘드리아 단백질이 1,000개를 넘는다는 결과는 기능이 알려지지 않은 세포기관 유전자 공간이 그만큼 넓다는 뜻이다. 저자들은 이 목록이 구조 연구와 약물 표적 탐색의 출발점이 될 수 있다고 제안한다.","lim":"저자들은 목록의 민감도를 90%에서 93%, 보정 위발견율을 약 7%로 보며 위양성 약 110개와 비슷한 수의 누락이 있을 것으로 본다. PCP 임계값을 0.6으로 낮춰 민감도를 택했는데 벤치마크 곡선으로는 0.86이 더 나은 균형이었다고 적었다. 참조 유전체(TriTrypDB release 68)의 Tb927_11_bin_v5.1 contig에 걸린 55개 항목은 주석 오류로 보이며, 기능 주석의 일부는 선행 문헌을 수작업으로 옮긴 것이라 기존 오류가 이어질 수 있다.","lab":"질량분석 기반 단백체를 분획 상관 프로파일링으로 쓰는 설계가 연구실 핵심 기법과 바로 겹친다. PCP 점수 임계값을 벤치마크 집합으로 정하고 보정 위발견율로 품질을 보고하는 방식은 우리 국재화 데이터에도 옮겨 쓸 수 있다. 미토콘드리아는 연구실 관심 분야이기도 하다.","lic":"초록 전문 번역. 출처 Vacas AF et al., Molecular Cell 86, 2026, DOI 10.1016/j.molcel.2026.08.032. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/MOC_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"T. brucei 곤충형의 미토콘드리아 정제 과정과 PCP 결과다. POMP10-EGFP 태깅, 단계별 전자현미경 사진, 분획별 단백질 분포, PCP 점수로 정한 TbMitoViaPCP의 민감도와 정밀도 곡선을 보여 준다."},{"src":"fig/MOC_2026-10-08_t1-1_fig7.jpg","label":"Figure 7","cap":"kinetoplastid 미토콘드리아 단백체의 진화적 분기다. Discoba 안의 계통 위치, 상동 유전자군의 원핵과 진핵 상동성 분포, 경로별 계통 특이성, 종에 따라 사라진 cobalamin 관련 효소와 GDP-fucose 합성 경로를 보여 준다."}]},{"j":"Molecular Cell","w":"2026-10-08","t":"T1","i":2,"ko":"유전체 규모 적응 지도로 BRCA1과 BRCA2 결손에서 반대로 작용하는 FANCM-RMI1/2 복합체를 찾았다","en":"A genome-scale adaptation map identifies the FANCM-RMI1/2 complex as an opposing modulator of cell fitness upon BRCA1 or BRCA2 loss","one":"BRCA1과 BRCA2를 급성으로 분해하는 등위유전자 degron 세포에서 유전체 규모 CRISPR 스크린을 돌려, FANCM-RMI1/2가 BRCA1 결손 세포에는 필수이고 BRCA2 결손 세포에는 독성이며 PARP 억제제 감수성을 결정한다는 것을 보였다.","ab":"BRCA1 또는 BRCA2가 없는 암세포는 광범위한 유전체 불안정에도 증식하려면 적응해야 한다. 저자들은 BRCA1과 BRCA2 각각에 특이한 적응 지형을 그리기 위해 두 단백질 중 하나를 급성으로 고갈시킬 수 있는 등위유전자 스크리닝 플랫폼을 만들었다. 유전적 상호작용 프로파일링은 두 BRCA 결손 상태에서 공통이거나 서로 다르거나 정반대로 작용하는 유전자 수백 개를 드러냈다. FANCM은 BRCA1 결손 세포에서 필수였다. 반대로 BRCA2 결손 세포에서는 FANCM이 독성을 보였고, RMI1/2를 불러들여 복제 분기점 분해를 촉진하며 세포를 PARP 억제에 민감하게 만들었다. FANCM을 없애면 분기점의 온전성이 회복되고 유전체 불안정과 증식 결함이 완화되었는데, 상동재조합이 회복되거나 단일가닥 DNA(ssDNA) 틈이 줄어든 것은 아니었다. 마지막으로 저자들은 PARP 억제제 저항성과 연관된 BRCA2 돌연변이 유방암 환자에서 RMI1/2 결합을 깨뜨리는 FANCM 변이를 보고한다. 이 결과는 BRCA1 상실과 BRCA2 상실이 근본적으로 다른 적응 경로를 거친다는 것을 보여 주며, FANCM-RMI1/2를 돌연변이 종류에 따른 취약점과 치료 반응의 결정 요인으로 제시한다.","tags":["암","DNA 수선","CRISPR 스크린","PARP 억제제"],"doi":"10.1016/j.molcel.2026.09.017","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00660-X","au":"Dossin F, Attia M, …, Tutt ANJ, Lord CJ, Deriano L","aff":"Institut Pasteur, Université Paris Cité, INSERM U1223, Équipe Labellisée Ligue Contre Le Cancer, Genome Integrity, Immunity and Cancer Unit, Paris, France","type":"Article","bg":"BRCA1과 BRCA2는 모두 상동재조합과 복제 분기점 보호에 필요하지만 작용 방식이 다르다. BRCA1은 이중나선 절단 말단의 절삭을 돕고 BRCA2는 RAD51을 단일가닥 DNA에 적재한다. 두 유전자가 망가진 종양은 조직학과 유전체 흉터, 치료 저항성 기전이 서로 다른데, 세포가 두 단백질의 상실에 어떻게 적응해 증식을 되찾는지는 충분히 밝혀지지 않았다. 저자들은 이미 적응이 끝난 종양 유래 세포가 아니라 적응이 시작되는 정상 세포에서 두 결손을 나란히 비교하려 했다.","ap":"mESC의 Tigre 좌위에 Cas9와 OsTIR1F74G를 넣고 내재 BRCA1 또는 BRCA2의 N 말단에 AID-GFP를 붙인 등위유전자 degron 세포를 만들었다. auxin을 주면 두 단백질이 빠르게 사라지고 olaparib에 민감해지며 12일 동안 증식이 줄지만 완전히 죽지는 않아, 합성 치사와 합성 생존을 동시에 볼 수 있는 조건이 된다. 이 세포에서 여러 시점에 걸쳐 유전체 규모 CRISPR 스크린을 수행하고 MAGeCK으로 분석했다. 이어 Fancm 녹아웃 클론, FANCM 도메인 돌연변이 복원, 경쟁 적합도 분석, DNA fiber 기반 분기점 분해와 재시작 측정, SIRF로 분기점 단백질 검출, DR-BFP 상동재조합 보고자, olaparib 처리 스크린을 붙였다. 마지막으로 전이성 BRCA 돌연변이 유방암 환자 47명의 ctDNA 프로파일에서 FANCM 변이를 찾고 PRISMA 펩타이드 질량분석으로 결합 손실을 확인했다.","kf":["두 스크린에서 합성 생존 상호작용 약 950건과 합성 치사 상호작용 약 660건이 나왔고 DNA 수선, 이중나선 절단 수선, 상동재조합 항목이 강하게 농축됐다. 결과는 DDRAGON 웹앱(ddragon.pasteur.cloud)에서 조회할 수 있다.","두 결손 사이에 공유되는 유전자는 일부에 그쳤다. 15일 시점에서 BRCA1 생존이면서 BRCA2 치사인 유전자가 42개, BRCA1 치사이면서 BRCA2 생존인 유전자가 20개였다.","FANCM과 그 직접 결합 상대 RMI1, RMI2, FAAP24, CENPS, CENPX가 모든 시점에서 BRCA1 치사이면서 BRCA2 생존으로 나왔다. 반대로 CST 복합체(Ctc1, Stn1, Ten1)와 USP1-WDR48은 BRCA1 생존이면서 BRCA2 치사였다.","Fancm 녹아웃은 BRCA2를 4주간 고갈시켜도 증식과 세포주기를 지켜 냈다. 염색체 이상을 가진 중기 세포가 약 50%에서 약 13%로 4배 줄었고 미소핵과 53BP1 foci도 함께 줄었다.","독성은 RMI1/2와 결합하는 MM2 도메인에 달려 있었다. MM2 돌연변이는 BRCA2 결손 세포에서 독성을 보이지 않았으나 MM1 결손이나 S1025A는 전장 FANCM과 같은 정도로 배제됐다. FANCM은 BRCA2 고갈 시 복제 분기점에 축적해 RMI1/2를 불러들이고 분기점 분해를 일으켰으며, BRCA1 고갈에서는 이런 현상이 없었다.","FANCM 상실은 상동재조합이나 ssDNA 틈을 회복시키지 않으면서 분기점의 온전성만 되살렸고 olaparib 감수성을 낮췄다. BRCA2 생식세포 변이를 가진 환자 KCL836은 olaparib 투여 2개월 안에 병이 진행했고 MM2 도메인의 FANCM c.3697G>C(D1233H) 대립유전자 빈도가 치료 중 늘었다. PRISMA 분석에서 D1233H 펩타이드는 RMI1/2와 TOP3A 결합이 결합 결손 대조 돌연변이 수준으로 떨어졌다."],"sig":"BRCA1 결손과 BRCA2 결손이 서로 다른 복제 스트레스 환경을 만들어 다른 유전적 제약을 받는다는 것을 한 세포 체계 안에서 보였다. FANCM-RMI1/2는 BRCA2 돌연변이 암에서 분기점 보호와 PARP 억제제 반응을 가르는 지점이 된다. 임상 개발 중인 USP1 억제제처럼 같은 약물이 BRCA1 돌연변이와 BRCA2 돌연변이에서 다르게 작용할 수 있다는 점도 함께 제시한다.","lim":"FANCM-RMI1/2가 어떻게 분기점 분해를 일으키는지는 아직 규명되지 않았고 BTRR 복합체가 어떤 복제 중간체를 처리하는지도 생화학적 확인이 필요하다. 임상 근거는 FANCM D1233H를 가진 BRCA2 돌연변이 환자 한 명에 그쳐 이 변이가 저항성의 원인임을 입증하지는 못한다. 더 큰 임상 데이터셋이 있어야 FANCM-RMI1/2 변화의 빈도와 의미를 판단할 수 있다.","lab":"암 적응과 치료 저항성을 유전체 규모 스크린으로 다룬 연구라 관심 분야와 직접 맞닿는다. 다만 핵심 데이터는 CRISPR 스크린이고 질량분석은 PRISMA 펩타이드 결합 확인에만 쓰였다. 변이가 단백질 상호작용을 깨뜨리는지 펩타이드 배열과 질량분석으로 확인한 방식은 우리 변이 해석 작업에 참고가 된다.","lic":"초록 전문 번역. 출처 Dossin F et al., Molecular Cell 86, 2026, DOI 10.1016/j.molcel.2026.09.017. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/MOC_2026-10-08_t1-2_fig1.jpg","label":"Figure 1","cap":"등위유전자 BRCA degron 스크린의 설계와 결과다. AID 태깅 세포에서 auxin으로 BRCA1 또는 BRCA2를 분해한 뒤 olaparib 감수성, 12일 증식 곡선, 스크린 흐름, BRCA1과 BRCA2 사이에 반대로 작용하는 유전자를 보여 준다."},{"src":"fig/MOC_2026-10-08_t1-2_fig5.jpg","label":"Figure 5","cap":"BRCA2 결손 세포에서 FANCM이 복제 분기점에 모여 RMI1/2를 불러들이고 분기점 분해를 일으킨다는 것을 SIRF 근접 결찰과 DNA fiber 분석으로 보여 준다."}]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":1,"ko":"고아 리모델러로 불린 ATRX가 염색질을 바꾸는 기전","en":"Mechanistic insights into chromatin modulation by the \"orphan\" remodeler ATRX","one":"","ab":"Alpha-thalassemia/mental retardation syndrome X-linked protein(ATRX)은 여러 기능을 수행하는 ATP 의존 염색질 리모델러다. ATRX가 염색질을 조절하는 기전은 알려지지 않았다. 저자들의 저온전자현미경 구조는 사람 ATRX가 ADP와 BeF3가 결합한 상태에서 C 말단 영역으로 뉴클레오솜을 감싸며 입구와 출구 부근의 뉴클레오솜 DNA 약 18 염기쌍을 풀어내 인식한다는 것을 보여 주었다. 특히 초나선 위치(SHL)6과 SHL7 사이의 DNA 작은 홈은 ATRX의 poking helix에 있는 핀 모양 구조에 의해 크게 변형되는데, 이 구조는 phenylalanine의 방향족 측쇄를 염기 쌓임 사이로 끼워 넣는다. ATRX는 뉴클레오솜 위에서 DNA를 이동시키기 위해 비정형 삽입 서열로 히스톤 표면과 접촉하고 양전하 고리로 gyre 사이 상호작용을 잇는다. 핀 모양 구조와 히스톤 접촉 영역은 모두 G-quadruplex DNA가 유발하는 스트레스로부터 세포를 지키는 데 필수였고, 이는 ATRX 매개 염색질 리모델링에서 이 요소들이 중요함을 보여 준다.","tags":["염색질 리모델링","구조생물학","저온전자현미경"],"doi":"10.1016/j.molcel.2026.09.013","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00656-8","au":"Duan S et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Duan S et al., Molecular Cell, 2026, DOI 10.1016/j.molcel.2026.09.013. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":2,"ko":"리보솜 재편이 바이러스 감염과 세포 스트레스에서 번역 적응을 이끈다","en":"Ribosome remodeling drives translation adaptation during viral infection and cellular stress","one":"","ab":"리보솜은 mRNA를 해독하는 보존된 분자 기계이며 늘 같은 단백질 집합으로 이루어진다고 여겨져 왔다. 이 연구는 그 전제를 다시 묻는다. 저자들은 비분절 음성가닥 RNA 바이러스가 사람 세포에 들어올 때 큰 소단위 단백질 rpL40이 80S 리보솜의 작은 소단위에서 mRNA 입구 부근의 비정상 위치로 끌려온다고 보고한다. 이렇게 재편된 특수 리보솜은 바이러스 mRNA를 선택적으로 결합해 바이러스 단백질 합성을 늘렸고, 이는 숙주의 압력 아래에서 바이러스 복제에 중요했다. 바이러스는 이 경로를 새로 만든 것이 아니라 대사 스트레스가 리보솜 구조를 바꿔 생존에 필요한 번역을 늘리는 내재 프로그램을 가져다 쓴 것이었다. 저자들은 리보솜 조성이 세포 내부와 외부의 자극에 따라 재편되며 이 재편이 병원체 적응과 세포 적응에 걸쳐 보존된 번역 조절 기전이라고 제안한다.","tags":["번역 조절","리보솜","바이러스 감염","세포 스트레스"],"doi":"10.1016/j.molcel.2026.09.008","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00629-5","au":"Tsai HY et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":3,"ko":"DNASE1L3이 포유류 세포 표면의 미토콘드리아 DNA 양을 일정하게 유지한다","en":"DNASE1L3 maintains homeostatic levels of mitochondrial DNA on the mammalian cell surface","one":"","ab":"세포 바깥 공간은 자기와 비자기 핵산을 가려내고 신호 전달을 통해 면역 반응을 시작하는 환경이다. 저자들은 미토콘드리아 DNA가 일부 포유류 세포의 표면에 세포 표면 단백질과 heparan sulfate proteoglycan을 통해 붙어 있다는 증거를 제시한다. 표면 DNA는 큰 덩어리로 모였고 RNA 결합 단백질이 많은 영역과 부분적으로 겹쳤다. 사람과 생쥐의 B 세포 표면에도 DNA가 있었고 분비 핵산분해효소 DNASE1L3이 이를 제거했다. 자가면역질환 위험을 높이는 DNASE1L3 미스센스 변이를 가진 환자에서는 B 세포와 T 세포 표면의 DNA가 늘어 있었다. 저자들은 이 결과가 세포 표면 핵산 생물학의 범위를 넓히고 세포 표면 분자와 DNA 표적화, 자가면역질환을 잇는 기전적 연결을 준다고 본다.","tags":["선천면역","미토콘드리아 DNA","자가면역","세포 표면"],"doi":"10.1016/j.molcel.2026.09.012","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00655-6","au":"Porat J et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":4,"ko":"DND1-NANOS3은 mRNA 3' UTR의 7염기 서열로 원시생식세포 전사체를 조형한다","en":"DND1-NANOS3 shapes the PGC transcriptome via a heptanucleotide sequence in mRNA 3' UTRs","one":"","ab":"원시생식세포의 생존에는 RNA 결합 단백질 DND1과 NANOS3이 함께 필요하지만 둘이 어떻게 협력하는지는 밝혀지지 않았다. 저자들은 서열 특이성이 낮은 DND1과 특이성이 없는 NANOS3이 정보량이 큰 하나의 모티프를 통해 RNA를 함께 억제하는 이중 인증 방식을 제시한다. 연속 PAR-CLIP 결과 DND1-NANOS3 복합체는 후성유전체와 세포주기 조절 인자 수십 개의 mRNA 3' UTR에 있는 7염기 서열 AUGAAUU를 인식해 억제했다. 이 요소를 유전체 편집으로 없애자 생체에서 CDK1 억제가 풀렸다. 고해상도 구조는 두 단백질이 이어진 RNA 결합 면을 만든다는 것을 보여 주었고, 생화학 분석에서는 NANOS3의 비정형 영역이 복합체의 친화도와 서열 특이성에 기여했다. 저자들은 RNA 결합 단백질을 하나씩만 연구하면 리보핵산단백질 복합체가 만드는 새 특이성을 놓친다고 지적한다.","tags":["RNA 결합 단백질","전사후 조절","생식세포","구조생물학"],"doi":"10.1016/j.molcel.2026.09.010","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00653-2","au":"Suzawa M et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":5,"ko":"후성유전 프로그램이 MYC 증폭의 양상을 정해 일시적, 염색체 밖, 유전되는 유전체 변화를 만든다","en":"An epigenetic program dictates MYC amplification dynamics that promote transient, extrachromosomal, and inherited genomic events","one":"","ab":"MYC 증폭은 암에서 흔하고 염색체 밖 DNA(ecDNA) 형태가 많다. 저자들은 이배체 유전체에서 MYC 복제수 증가가 어떻게 시작되는지 묻고 후성유전 효소가 국소 과복제와 증폭을 직접 조절하는지 확인했다. H3K4 메틸화는 MYC를 H3K9와 K36 삼중 탈메틸화효소 KDM4C에 의한 증폭에 대비시키고, H3K36 삼중 메틸화효소 SETD2는 복제수 증가를 억제했다. 같은 관계가 종양 데이터셋에서도 관찰됐다. SETD2를 잃거나 억제하면 촉매 활성을 가진 KDM4C가 모이면서 단계적 MYC 복제수 증가가 시작됐다. 세포자멸사를 막거나 TP53을 잃으면 염색체 밖 환형 DNA와 유전되는 복제수 증가를 포함한 고도 증폭이 빨라졌고, 이런 변화를 가진 비형질전환 세포는 종양을 만들었다. KDM4C 억제는 MYC 증폭을 줄였다. 저자들은 염색질과 세포자멸사를 잇는 축이 증폭의 시작과 진행을 조절한다고 보며 바이오마커와 치료 표적 후보를 함께 제시한다.","tags":["암","후성유전","유전자 증폭","ecDNA"],"doi":"10.1016/j.molcel.2026.09.032","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00675-1","au":"Ferman BI et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":6,"ko":"kinetoplastid 기생충의 보존된 미토콘드리아 집합체와 분기한 집합체","en":"Conserved and divergent mitochondrial assemblies in kinetoplastid parasites","one":"","ab":"Leishmania tarentolae와 Trypanosoma brucei의 미토콘드리아 단백체는 약 1,700개 단백질을 담고 있고 그 대부분은 고등 진핵생물에 상동체가 없다. 저자들은 complexome profiling과 저온전자현미경을 결합해 이들 kinetoplastid 원생동물의 미토콘드리아 기능을 지탱하는 보존된 거대분자 집합체와 계통 특이 집합체를 정의한다. 비교 분석은 호흡, 대사, RNA 처리와 그 밖의 복합체의 양과 구성이 종과 생활 단계에 따라 다르다는 것을 보여 주며 현재의 주석을 다듬고 넓힌다. L. tarentolae의 호흡 복합체 III2(CIII2), 복합체 IV2(CIV2), 복합체 V(CV) 구조는 지금까지 알려지지 않은 핵 암호화 소단위 9개를 찾아냈고 pan-edited mRNA의 산물을 포함한 미토콘드리아 암호화 단백질 5개를 해석했다. 이 재구성은 구조적 변화를 드러낸다. CIII2에서는 ubiquinol cytochrome-c reductase의 subunit 8(QCR8) N 말단 연장이 퇴화한 미토콘드리아 처리 펩티다아제(MPP) 알파와 베타 공간을 메우고, CIV2 이중체는 분류군에 국한된 넓은 접촉면으로 안정화되며, CV 이중체는 미토콘드리아가 암호화하는 ATP6 소단위를 품는다. 이 결과는 kinetoplastid가 진핵생물이 공유하는 핵심 모듈에 분기한 구성 요소를 넣으면서 특수한 미토콘드리아 장치를 조립하는 방식을 보여 준다.","tags":["미토콘드리아","구조생물학","complexome","기생충 생물학"],"doi":"10.1016/j.molcel.2026.08.031","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00620-9","au":"Solayman M et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Solayman M et al., Molecular Cell 86, 2026, DOI 10.1016/j.molcel.2026.08.031. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":7,"ko":"면역 조절 RNA helicase이면서 E3 유비퀴틴 리가아제인 ZNFX1은 다형 중합체로 조립된다","en":"ZNFX1, an immunoregulatory RNA helicase and E3 ubiquitin ligase, assembles into pleiomorphic polymers","one":"","ab":"NFX1형 zinc finger 함유 단백질 1(ZNFX1)은 선천면역에 필수인 SF1 계열 RNA helicase다. ZNFX1 돌연변이를 가진 환자는 감염이 반복되지만 그 기전은 분명하지 않았다. 저자들은 RNA가 결합한 상태와 결합하지 않은 상태의 ZNFX1 저온전자현미경 구조를 구해, 조절성 삽입 서열이 RNA 결합 골을 막아 helicase 연결 ATPase가 자가 억제된다는 것을 밝혔다. ZNFX1은 또한 두 가지 촉매 활성을 가진 E3 유비퀴틴 리가아제로 작동하며, RNF213과 상동인 RZ finger와 지금까지 알려지지 않은 Miz 유사 도메인을 지니고 이들이 협력해 유비퀴틴화를 촉매한다. 유비퀴틴 사슬은 E3 활성을 더 높였다. 환자 돌연변이는 helicase와 ATPase, E3 리가아제, 그리고 둘을 잇는 단단한 zinc finger 줄기가 모두 기능에 필요함을 보여 준다. ZNFX1은 구조를 갖춘 다형 중합체로 조립될 수 있어 분자 사이의 자가 유비퀴틴화를 촉진하는데, 이는 ZNFX1의 안정성을 조절하는 기전이며 스트레스 과립에서의 RNA 격리와 항바이러스 활성을 돕는 것일 수 있다. 이 결과는 ZNFX1을 RNA 감지와 유비퀴틴 신호를 잇고 신호 증폭을 위해 고차 구조를 만드는 다기능 효소로 자리매김한다.","tags":["선천면역","RNA helicase","유비퀴틴","구조생물학"],"doi":"10.1016/j.molcel.2026.09.002","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00623-4","au":"Naydenova K et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Naydenova K et al., Molecular Cell 86, 2026, DOI 10.1016/j.molcel.2026.09.002. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Molecular Cell","w":"2026-10-08","t":"T2","i":8,"ko":"유비퀴틴 사슬 편집이 p97/VCP 의존적으로 RPA를 DNA에서 떼어 낸다","en":"Ubiquitin chain editing promotes p97/VCP-dependent removal of RPA from DNA","one":"","ab":"DNA 수선에는 단일가닥 DNA(ssDNA)에 붙은 단백질을 동적으로 조절하는 일이 필요한데, 유비퀴틴 신호가 ssDNA 결합 인자를 어떻게 조절하는지는 잘 알려지지 않았다. 저자들은 사람 세포에서 replication protein A(RPA)를 ssDNA에서 끌어내는 유비퀴틴 사슬 편집 기전을 찾아냈다. RPA는 탈유비퀴틴화효소 ZUP1을 자극하고 유비퀴틴 사슬 안의 K63 연결에 대한 활성을 높였다. DNA 손상에 반응해 RPA는 분지된 K48-K63 유비퀴틴 사슬로 변형됐다. ZUP1은 이 사슬에서 K63 연결만 선택적으로 떼어 내 RPA의 유비퀴틴 신호를 재편했다. 분지 유비퀴틴 사슬에 대한 ZUP1의 편집은 유비퀴틴화된 RPA를 p97/VCP 의존적으로 ssDNA에서 제거하도록 했다. ZUP1이 없으면 RPA에 분지 유비퀴틴 사슬이 쌓이고 RPA가 ssDNA에 병적으로 붙잡혀 ssDNA 신호가 커지고 유전체가 불안정해졌다. 저자들은 유비퀴틴 사슬 편집이 ssDNA 위 RPA의 동태를 조절하고 DNA 수선 중 p97/VCP 매개 단백질 추출을 가능하게 하는 기전이라고 본다.","tags":["DNA 수선","유비퀴틴","유전체 안정성"],"doi":"10.1016/j.molcel.2026.09.004","url":"https://www.cell.com/molecular-cell/fulltext/S1097-2765(26)00621-0","au":"Drake M et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Drake M et al., Molecular Cell 86, 2026, DOI 10.1016/j.molcel.2026.09.004. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T1","i":1,"ko":"Virtual Tissues 기반 모델이 여러 규모에서 공간 단백체를 해석한다","en":"The Virtual Tissues foundation model resolves spatial proteomics across scales","one":"마커 패널이 제각각인 공간 단백체 자료를 하나의 기반 모델로 묶어, 삼중음성 유방암에서 면역치료 반응을 예측하는 공간 바이오마커를 뽑아냈다.","ab":"공간 단백체 기술은 암의 복잡한 조직 구조에 대한 이해를 바꾸어 놓았지만 계산 분석에는 고유한 어려움이 있다. 연구마다 서로 다른 마커 패널과 프로토콜을 쓰고 대부분의 방법이 단일 코호트에 맞춰져 있어, 지식의 이전과 견고한 바이오마커 발굴이 제한된다. 여기서 우리는 다중 이미징 자료로부터 단백질과 세포, 니치, 조직의 마커 인식 다중 규모 표현을 직접 학습하는 범용 공간 단백체 기반 모델 Virtual Tissues(VirTues)를 제시한다. 하나의 사전학습 백본으로 VirTues는 마커 재구성, 세포 분할과 유형 분류, 니치 주석, 공간 바이오마커 발굴, 환자 층화를 지원하며, 이질적인 패널과 데이터셋에 걸친 제로샷 주석도 포함한다. 삼중음성 유방암에서 VirTues가 도출한 바이오마커는 항 PD-L1 화학면역요법 반응을 예측하고 독립 코호트에서 무병 생존을 층화했으며, 같은 데이터셋에서 도출된 최신 바이오마커와 현행 임상 층화 체계보다 뛰어난 성능을 보였다.","tags":["공간 단백체","기반 모델","암 생물학","바이오마커"],"doi":"10.1038/s41586-026-10884-y","url":"https://www.nature.com/articles/s41586-026-10884-y","au":"Wenckstern J, Jain E, …, Bunne C","aff":"School of Computer and Communication Sciences, EPFL, Lausanne, Switzerland (제1저자, 교신저자)","type":"Article","bg":"다중 마커 조직 이미징은 개별 종양 세포와 면역 세포의 분자 상태와 공간 배치를 함께 보여준다. 그러나 연구마다 마커 패널과 프로토콜이 달라 지식이 이어지지 않는다. 대부분의 분석 방법은 단일 코호트에 맞춰져 있어 견고한 바이오마커 발굴을 어렵게 한다. 저자들은 하나의 표현으로 여러 패널과 플랫폼, 코호트를 가로지를 수 있는지 물었다.","ap":"다중 이미징 데이터에서 단백질, 세포, 니치, 조직의 마커 인식 다중 규모 표현을 학습하는 기반 모델 VirTues를 만들었다. 종양을 중심으로 한 IMC 데이터 15종, 환자 3,102명, 마커 146종으로 학습했다. 이후 이미징 플랫폼 4종, 환자 5,100명 이상, 마커 239종으로 확장했다. 단백질 언어 모델 임베딩으로 마커 정체성을 부호화해 학습하지 않은 패널도 연결했고, 공간 주의와 마커 주의를 분리해 고다중 데이터로 확장했으며, 계층적 요약 토큰으로 세포부터 조직까지의 구조를 드러냈다. 과제별 미세조정 없이 마커 재구성, 세포 분할과 유형 분류, 니치 주석, 진단과 예후 예측을 수행했다.","kf":["하나의 사전학습 백본으로 마커 재구성, 세포 분할, 세포 유형 분류, 니치 주석, 공간 바이오마커 발굴을 모두 수행했다.","세포 토큰에 선형 프로브를 붙인 세포 유형 분류가 최근 인코더들을 앞섰고, 드문 세포 유형과 제로샷 설정에서도 그랬다.","분할 헤드는 패널이 일부만 겹치는 코호트로도 전이돼 전용 분할 도구와 세기 기반 방법보다 좋았다.","IMC 데이터만으로 학습했을 때도 여러 기술을 함께 쓴 비교 모델과 대등해, 마커 패널과 기술이 바뀌어도 제로샷 전이가 작동했다.","측정하지 않은 마커를 가상으로 염색하는 방식으로 패널을 확장할 수 있었다.","삼중음성 유방암에서 학습된 공간 신호가 항 PD-L1 화학면역요법 반응을 예측했고 독립 코호트에서 무병 생존을 층화했으며, 기존 공간 바이오마커와 현행 임상 층화 체계를 앞섰다."],"sig":"공간 단백체 분석의 전 과정을 하나의 백본으로 덮었다. 단일 마커나 세포 유형 빈도가 아니라 복합적인 다세포 신호를 포착하는 새로운 세대의 공간 바이오마커를 제시한다.","lim":"성능 평가는 대부분 공개 코호트에서 이루어졌고 예후 예측은 후향적 검증이다. 삼중음성 유방암 바이오마커의 임상 유용성은 전향적 연구가 필요하다. 가상 염색으로 생성한 마커는 실제 측정을 대체하지 않는다.","lab":"마커 패널이 서로 다른 공간 단백체 데이터를 하나의 표현으로 묶는 전략은 연구실의 다중 오믹스 통합 과제에 바로 적용할 수 있다. 단백질 서열 임베딩으로 마커를 부호화하는 방식은 질량분석 기반 단백체 데이터와 이미징 데이터를 잇는 설계에 참고가 된다.","lic":"초록 전문 번역. 출처 Wenckstern J et al., Nature 657, 2026, DOI 10.1038/s41586-026-10884-y. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NAT_2026-09-17_t1-1_fig1.jpg","label":"Figure 1","cap":"VirTues가 다중 조직 이미지를 가상 조직 표현으로 바꾸어 세포, 니치, 시료 수준의 분석을 지원하는 흐름을 보여준다. 학습과 평가에 쓰인 IMC 데이터 15종의 구성을 함께 제시한다."}]},{"j":"Nature","w":"2026-09-17","t":"T1","i":2,"ko":"다양한 암을 위한 차세대 환자 유래 모델 집성","en":"A compendium of next-generation patient-derived models for diverse cancers","one":"환자 2,780명에게서 세운 차세대 암 모델 665개를 전장 유전체부터 전사체까지 한꺼번에 특성화해, 1년 넘게 배양해도 원발 종양의 DNA 변이가 97.8% 일치함을 보였다.","ab":"새로운 치료제의 개발과 발암 기전의 검증에는 대표성 있는 실험 모델이 필요하다. 그러나 기존의 모델 집합은 사람 암에서 관찰되는 다양성의 일부만을 대표한다. 최근 기술은 종양 오가노이드처럼 효율적인 시험관 모델 유도를 가능하게 했다. 그렇지만 이들이 장기 증식 과정에서 환자 종양의 본질적 특성을 유지하는지는 체계적으로 조사되지 않았다. 여기서 우리는 대규모 국제 프로그램인 Human Cancer Models Initiative의 결과를 제시한다. 이 프로그램은 25개 암종의 공여자 2,780명에서 차세대 모델 665개로 이루어진 자원을 만들고, 종양과 모델의 전장 유전체, 엑솜, 메틸롬, 전사체 분석을 통합했다. 이 자원은 포괄적 임상 정보를 갖춘 모델 522개, 희귀암 모델 153개, 비유럽계 참여자 유래 모델 71개를 제공한다. 짝지은 종양과 모델 421쌍을 분석한 결과 유전적 일치도 97.8%, 후성유전적 일치도 95%로 높았으며 불일치의 상관 요인을 정의했다. 종양과 모델 쌍의 단일핵 RNA 시퀀싱은 배양 조건이 세포 상태에 크게 영향을 주는 모델 하위집합을 드러낸다. 끝으로 우리는 모델이 염색체외 DNA와 치료 후 돌연변이 서명을 보존하는지 특성화해 치료 저항성을 연구할 기회를 제공한다. 이 모델 저장소는 다중 분자 프로파일링과 임상 정보, 통합 소프트웨어 도구와 함께 공동체에 공개되고 있으며, 암 발생과 치료 반응의 전임상 연구에 유용한 자원이 된다.","tags":["암 모델","다중 오믹스","오가노이드","대규모 자원"],"doi":"10.1038/s41586-026-10806-y","url":"https://www.nature.com/articles/s41586-026-10806-y","au":"ElHarouni D, Al-Jazrawe M, Choi S, …, Gerhard DS, Staudt LM, Boehm JS","aff":"Broad Institute of MIT and Harvard, Cambridge, MA, USA (제1저자). Dana-Farber Cancer Institute, Harvard Medical School, Boston, MA, USA (교신저자 Ligon KL). National Cancer Institute, Bethesda, MD, USA (교신저자 Staudt LM)","type":"Article","bg":"새 치료제를 만들고 발암 기전을 검증하려면 환자 종양을 대표하는 실험 모델이 필요하다. 그런데 지금까지 쓰이던 모델 집합은 사람 암에서 관찰되는 다양성의 일부만 담고 있었다. 종양 오가노이드처럼 모델을 효율적으로 유도하는 기술이 나왔지만, 이렇게 만든 모델이 오래 배양하는 동안 환자 종양의 본질적 성질을 지키는지는 체계적으로 확인된 적이 없었다. 모델을 믿고 쓸 수 있는지를 자료로 답해야 하는 문제였다.","ap":"국제 공동 사업인 Human Cancer Models Initiative의 결과다. 공여자 2,780명에게서 25개 암종에 걸쳐 차세대 모델 665개를 만들었다. 종양 581개와 모델을 짝지어 전장 유전체, 엑솜, 메틸롬, 전사체를 모두 분석했다. 581개 가운데 413개는 모델 유도에 성공한 종양이고 168개는 실패한 종양이어서, 어떤 종양이 모델이 되는지도 함께 따져 볼 수 있다. 환자 임상 정보를 상세히 붙이고, 자료를 열어 보는 HCMI Explorer Suite도 함께 내놓았다.","kf":["25개 암종 665개 모델을 공여자 2,780명에게서 확보했고, 이 가운데 522개에는 포괄적 임상 정보가 붙어 있다.","1년 넘게 체외에서 배양한 뒤에도 모델은 원발 종양과 DNA 변이에서 97.8%, RNA 발현에서 92% 일치를 유지했다.","배양액 성분이 모델의 세포 상태를 크게 흔든다. 교모세포종에서는 NSA 배양액만이 종양의 전사 상태를 지켰고 다른 배양액은 그러지 못했다.","세포 상태가 밀린 모델도 실험 전에 배양 조건을 바꾸면 종양에 더 가까운 상태로 되돌릴 수 있었다.","내성 핫스팟 돌연변이 빈도, 교모세포종의 MMR-테모졸로마이드 서명, 반복적으로 증폭되는 ecDNA 종양유전자, 린치 증후군 의심 사례의 생식선 변이까지 전이 연구에 바로 쓸 수 있는 지표를 정리했다.","동반 논문 두 편이 이 모델들로 유전체 규모 CRISPR-Cas9 스크린과 약물 감수성 평가가 가능함을 보였다."],"sig":"모델을 쓰기 전에 그 모델이 종양을 얼마나 닮았는지 따져 볼 근거가 생겼다. 암종 25개를 아우르는 규모라 유전적 변이와 전사 상태의 폭을 가로질러 치료 반응을 묻는 연구가 가능해진다. 배양액이 세포 상태를 바꾸고 그 변화가 되돌릴 수 있다는 결과는 모델 실험을 설계하는 방식 자체에 영향을 준다.","lim":"세포주와 오가노이드 배양이 가진 한계는 이 논문 안에서도 여러 건 기록됐다. 배양액 성분이 세포 상태 가소성을 끌어내는 주요 원인이라는 점은 모델 간 비교를 어렵게 한다. 희귀 암종은 암종별 표본 수가 적어 일반화하기 어렵다. 모델 유도에 실패한 종양 168개의 특성도 아직 충분히 설명되지 않았다.","lab":"종양과 모델을 짝지은 다중 오믹스 자료가 공개되어 있어 단백체 자료를 겹쳐 보는 프로테오게노믹스 대조군으로 바로 쓸 수 있다. 암 대사 연구에 쓸 모델을 고를 때 어떤 배양 조건이 전사 상태를 지키는지 먼저 확인할 근거가 된다. 동반 논문의 CRISPR 의존성 자료와 묶으면 후보 표적을 좁히는 데도 쓸 수 있다.","lic":"초록 전문 번역. 출처 ElHarouni D et al., Nature 657, 2026, DOI 10.1038/s41586-026-10806-y. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NAT_2026-09-17_t1-2_fig1.jpg","label":"Figure 1","cap":"HCMI 자원의 전체 구성과 환자 임상 분포를 보여준다. 공여자 2,780명과 모델 665개가 25개 암종에 어떻게 퍼져 있는지, 그리고 각 모델에 어떤 분자 자료와 임상 정보가 붙어 있는지를 한 장에 정리했다."},{"src":"fig/NAT_2026-09-17_t1-2_fig2.jpg","label":"Figure 2","cap":"종양에서 관찰된 유전체 변이가 모델에서도 재현되는지를 짝지어 비교한 결과다. 체세포 변이와 복제수 변화를 종양과 모델 사이에서 맞춰 보아 DNA 수준 일치도가 97.8%에 이르는 근거를 제시한다."}]},{"j":"Nature","w":"2026-09-17","t":"T1","i":3,"ko":"CD40과 MHC-II를 발현하는 성상교세포의 항원 제시가 중추신경계 자가면역을 촉진한다","en":"Antigen presentation by CD40+MHC-II+ astrocytes promotes CNS autoimmunity","one":"CD40과 MHC-II를 함께 내는 성상교세포가 지방 방울에서 아세틸-CoA를 끌어와 NF-κB를 아세틸화하고, 그 결과 항원 제시가 늘어 중추신경계 자가면역이 증폭된다.","ab":"성상교세포는 다발성경화증과 그 마우스 모델인 실험적 자가면역뇌척수염을 비롯한 여러 신경질환의 병태에 관여한다. 그러나 성상교세포와 CD4 양성 T 세포 사이의 기능적 상호작용은 거의 알려지지 않았다. 저자들은 광견병 바이러스 바코드 상호작용 검출과 시퀀싱을 단일세포 RNA 시퀀싱, 체외 공배양, 세포 특이적 생체 내 CRISPR-Cas9 교란과 결합했다. 그 결과 CD40과 MHC-II를 함께 발현하는 성상교세포가 중추신경계의 T 세포 자가면역을 촉진한다는 것을 확립했다. 면역 세포 짝짓기를 표지해 추적하는 접근으로, 교세포가 항원 제시를 통해 자가면역에 직접 기여하는 경로를 제시한다.","tags":["신경면역","단일세포 오믹스","생체 내 아세포 단백체","지방 방울","다발성경화증"],"doi":"10.1038/s41586-026-10860-6","url":"https://www.nature.com/articles/s41586-026-10860-6","au":"Lee J-H, Li Z, Soto JS, …, Zandee SEJ, Prat A, Quintana FJ","aff":"Ann Romney Center for Neurologic Diseases, Brigham and Womens Hospital, Harvard Medical School, Boston, MA, USA (제1저자, 교신저자). The Gene Lay Institute of Immunology and Inflammation, Brigham and Womens Hospital, Massachusetts General Hospital, Harvard Medical School","type":"Article","bg":"성상교세포는 다발성경화증과 그 마우스 모델인 실험적 자가면역뇌척수염을 비롯해 여러 신경질환의 병태에 관여한다. 그런데 성상교세포가 CD4 양성 T 세포와 어떤 기능적 관계를 맺는지는 거의 밝혀져 있지 않았다. 성상교세포가 MHC-II를 낸다는 보고와 수초 조각을 포식한다는 보고가 있었지만 실제로 항원 제시 세포로 작동하는지는 논쟁거리였다. CD40 발현도 체외 자극 조건에서만 확인되어 생체 내 발현 여부가 다투어졌다.","ap":"광견병 바이러스 바코드로 세포 간 상호작용을 검출한 뒤 시퀀싱하는 기법에 단일세포 RNA 시퀀싱, 체외 공배양, 세포 특이적 생체 내 CRISPR-Cas9 교란을 겹쳐 썼다. 세포 간 접촉을 SorTag으로 표지해 성상교세포와 맞닿은 CD4 양성 T 세포만 골라 분석했다. 성상교세포 쪽 변화는 생체 내 아세포 단백체 기법과 AlphaFold-Multimer 예측으로 따라갔다. 마지막으로 사람 다발성경화증 시료를 단일핵 RNA 시퀀싱과 면역조직화학으로 확인했다.","kf":["CD40과 MHC-II를 함께 발현하는 성상교세포가 중추신경계 T 세포 자가면역을 촉진한다는 것을 유전적 교란으로 확립했다. 두 분자를 만드는 유전자는 다발성경화증 감수성과 연관된 유전자다.","성상교세포와 CD4 양성 T 세포가 직접 맞닿으면 병을 일으키는 Th17 반응이 강해졌다.","T 세포가 내는 CD40L이 성상교세포의 CD40을 자극하면 PLIN4 양성 지방 방울이 쌓였다.","지방 방울은 아세틸-CoA를 공급해 p65 아세틸화를 거쳐 NF-κB를 활성화하고, 그 결과 항원 제시 능력이 커졌다.","CD40에서 지방 방울을 거쳐 NF-κB로 이어지는 축은 T 세포 매개 염증을 스스로 키우는 전방 회로를 이룬다.","사람 다발성경화증 시료에서 CD40과 MHC-II와 지방 방울을 모두 가진 성상교세포를 실제로 검출했다."],"sig":"중추신경계에 상주하는 비면역 세포가 항원 제시에 직접 기여한다는 것을 유전적 근거로 보였다. 지방 방울을 대사 저장고가 아니라 전사 조절에 쓰이는 아세틸기 공급원으로 읽어 낸 점이 특히 새롭다. 대사와 번역 후 변형과 염증을 하나의 회로로 잇는 설명이라, 자가면역을 겨냥한 개입 지점을 성상교세포 대사 쪽에서 찾을 길을 연다.","lim":"성상교세포가 항원 제시 세포로 작동하는지에 대한 논쟁이 이 논문으로 완전히 정리되지는 않는다. 이전 연구들이 보고한 성상교세포의 면역 억제 기능을 보면 MHC-II 양성 성상교세포 가운데 염증을 누르는 다른 부분집합이 있을 가능성이 남는다. 중추신경계에는 여러 항원 제시 세포가 함께 작동하므로 교세포 집단들이 각각 얼마나 기여하는지는 아직 정해지지 않았다. 기전의 대부분은 마우스 모델에서 확인됐고 사람 시료 결과는 관찰 수준이다.","lab":"생체 내 아세포 단백체로 신호 축을 좁히고 아세틸화라는 번역 후 변형으로 기전을 닫은 설계가 연구실 방법론과 그대로 겹친다. 지방 방울에서 아세틸-CoA를 거쳐 전사 조절로 가는 경로는 세포 대사와 PTM을 잇는 작업에 바로 가져올 수 있는 틀이다. 종양 미세환경에서도 같은 축이 도는지 물어볼 만하다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/NAT_2026-09-17_t1-3_fig1.jpg","label":"Figure 1","cap":"실험적 자가면역뇌척수염에서 T 세포와 맞닿은 성상교세포를 커넥톰 방식으로 찾아낸 과정이다. 광견병 바이러스 바코드로 접촉을 기록하고 시퀀싱해, 상호작용한 성상교세포 집단을 가려낸 결과를 보여준다."},{"src":"fig/NAT_2026-09-17_t1-3_fig2.jpg","label":"Figure 2","cap":"성상교세포에서 CD40과 MHC-II가 발현되면 중추신경계 자가면역이 강해진다는 것을 보여준다. 세포 특이적 유전 교란으로 두 분자를 없앴을 때 질병 경과와 병원성 T 세포 반응이 어떻게 달라지는지 함께 제시한다."}]},{"j":"Nature","w":"2026-09-17","t":"T1","i":4,"ko":"이수성이 유방암에서 드라이버 유전자 획득을 선택한다","en":"Aneuploidy selects for the acquisition of driver genes in breast cancer","one":"녹아웃과 과발현을 한 스크린에서 같이 다루는 CRISPR-KOALA로 기저양 유방암의 염색체 팔 변화 열 가지에 실린 유전자 3,752개를 훑어, 대부분 기능이 알려지지 않았던 암 유발 유전자 90개를 건져 올렸다.","ab":"염색체 불안정성은 암에서 흔하며 이수성이라 불리는 대규모 염색체 불균형을 만든다. 영향을 받는 유전자가 너무 많아 이수성이 종양 형성에 어떻게 기여하는지는 연구하기 어려웠다. 저자들은 면역이 온전한 마우스 암 모델에서 고처리량 양방향 유전 스크린을 가능하게 하는 CRISPR-KOALA 분석법을 개발했다. 이 방법은 유전자 녹아웃과 활성화를 한 스크린 안에서 함께 다룬다. 대규모 복제수 변화가 주도하는 기저양 유방암에서 가장 흔한 염색체 팔 수준 변화 열 가지를 정리하고, 해당 영역에 있는 마우스 상동유전자 3,752개를 스크리닝했다. 이수성이 만든 유전자 용량 변화 가운데 어떤 것이 실제로 종양 형성을 밀어 올리는지를 유전자 단위로 분해한 작업이다.","tags":["암 유전체","이수성","CRISPR 스크린","유방암"],"doi":"10.1038/s41586-026-10752-9","url":"https://www.nature.com/articles/s41586-026-10752-9","au":"Al-Zahrani KN, Langille ER, Nurtanto J, …, Reimand J, Wrana JL, Schramek D","aff":"Centre for Molecular and Systems Biology, Lunenfeld-Tanenbaum Research Institute, Mount Sinai Hospital, Toronto, Ontario, Canada (제1저자, 교신저자). Department of Molecular Genetics, University of Toronto, Toronto, Ontario, Canada","type":"Article","bg":"염색체 불안정성은 암에서 매우 흔하고 이수성이라 불리는 대규모 염색체 불균형을 만든다. 문제는 염색체 팔 하나가 늘거나 줄면 영향을 받는 유전자가 수백 개에 이르러, 그 가운데 무엇이 종양 형성을 밀어 올리는지 가려내기 어렵다는 점이다. 기존의 전이인자 기반 스크린은 포화에 이르려면 동물을 아주 많이 써야 했고, 생물정보 예측은 범암 자료에 기대어 조직 특이적 유전자를 놓치며 검증 부담이 컸다.","ap":"CRISPR 녹아웃과 활성화를 한 스크린 안에서 동시에 다루는 CRISPR-KOALA를 만들어, 면역이 온전한 마우스 암 모델에서 고처리량 양방향 유전 스크린을 돌렸다. 대규모 복제수 변화가 질병을 주도하는 기저양 유방암에서 가장 흔한 염색체 팔 수준 변화 열 가지를 정리하고, 그 영역에 있는 마우스 상동유전자 3,752개를 스크리닝했다.","kf":["암 유발 유전자 90개를 찾았고, 그 가운데 대부분은 암에서의 기능이 알려져 있지 않았던 유전자다.","이 유전자들은 MAPK, HIPPO, WNT 등 서로 다른 신호 경로를 건드렸다. 기저양 유방암의 높은 이질성과 맞는 결과다.","찾아낸 유전자를 조작하면 Trp53 변이 기저양 유방암 모델에서 복제수 변화 자체가 필요 없어졌다. 이수성이 하던 일을 개별 유전자가 대신한다는 뜻이다.","9p에 있는 PLGRKT가 강력한 종양유전자였고, 그 종양 촉진 활성은 스트레스에 잘 견디는 미토콘드리아와 연관되어 있었다.","체외에서 핵심 필수 유전자로 분류되던 CSNK1A1, INO80, METTL14, UBE2N이 생체 내에서는 강한 종양 억제 유전자로 나타났다. 생체 내 스크린이 따로 필요한 이유를 보여 준다.","PLGRKT와 MRPS18B는 환자 시료에서 보이는 용량과 비슷한 수준으로 발현을 올려도 종양 형성을 끌어냈다."],"sig":"이수성이 종양 형성에 기여하는 방식을 유전자 단위로 분해할 도구가 생겼다. 현재의 암 유전자 목록이 아직 불완전하다는 것을 양방향 스크린으로 직접 보였고, 특히 복제수 변화가 주도하지만 알려진 유발 유전자가 적은 기저양 유방암에서 새 표적 후보를 제시한다. 체외와 생체 내 결과가 어긋난다는 관찰은 스크린 설계 전반에 영향을 준다.","lim":"고처리량 유전체 실험에 공통된 한계로, 인위적으로 올린 발현량이 사람 종양의 낮은 복제수 변화를 정확히 흉내 내는지 단정하기 어렵다. 저자들은 PLGRKT와 MRPS18B에서 생리적 용량을 재현했다고 제시했지만 모든 후보에 같은 검증이 된 것은 아니다. 표적 외 효과도 남는 문제다. 마우스 상동유전자를 대상으로 했으므로 사람 유전자에서의 작용은 따로 확인해야 하고, 새로 찾은 유전자의 임상적 가치와 약물 적용 가능성 평가는 다음 과제로 남았다.","lab":"PLGRKT가 스트레스 저항성 미토콘드리아와 묶인다는 결과는 암 대사와 미토콘드리아를 다루는 작업에 바로 이어진다. 면역이 온전한 생체 내 양방향 스크린이라는 설계는 체외에서 놓치는 표현형을 잡는 대안으로 참고할 만하다. 90개 후보 가운데 대사 관련 유전자를 골라 단백체로 따라가 볼 수 있다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/NAT_2026-09-17_t1-4_fig1.jpg","label":"Figure 1","cap":"기저양 유방암이 특정한 염색체 팔 수준 복제수 변화로 규정되며 그 변화가 종양 개시를 끌어낸다는 것을 보여준다. 사람 종양에서 가장 흔한 변화 열 가지를 추린 과정과 마우스 모델에서의 종양 개시 결과를 담았다."},{"src":"fig/NAT_2026-09-17_t1-4_fig2.jpg","label":"Figure 2","cap":"복제수 변화 영역 안에 분명한 암 유발 유전자가 들어 있음을 CRISPR-KOALA 스크린 결과로 보여준다. 유전자 3,752개를 양방향으로 훑어 건져 올린 90개 후보의 분포와 효과 크기를 함께 제시한다."}]},{"j":"Nature","w":"2026-09-17","t":"T1","i":5,"ko":"이전 치료가 재발한 소아암의 돌연변이 프로파일을 결정한다","en":"Prior therapy defines mutation profiles in childhood cancer at relapse","one":"소아암 재발 종양 611개의 전장 유전체를 치료 용량 기록과 맞춰 보니, 항암화학요법과 방사선이 유일한 외인성 돌연변이원이었고 백금계 약물 하나가 치료 연관 돌연변이의 약 60%를 만들어 냈다.","ab":"소아암 환자는 치료의 단기 및 장기 부작용을 겪지만, 항암화학요법 노출이 남기는 DNA 손상의 규모는 분명하지 않았다. 저자들은 치료 용량과 총 노출량이 일관되게 수집된 다기관 코호트의 전장 유전체 종양 자료에 돌연변이 서명 분석을 적용했다. 재발한 소아 종양에서 항암화학요법과 방사선요법은 유일하게 확인된 외인성 돌연변이원이었고, 많은 경우 DNA 변화의 가장 큰 원천이었다. 치료 전 종양과 비교하면 치료 후 암은 고유 서명의 수가 약 세 배, 전체 체세포 돌연변이 부하가 약 두 배였다. 이전 치료 이력이 재발 종양의 돌연변이 지형을 상당 부분 규정한다는 결론이다.","tags":["소아암","돌연변이 서명","전장 유전체","임상 코호트"],"doi":"10.1038/s41586-026-10803-1","url":"https://www.nature.com/articles/s41586-026-10803-1","au":"Layeghifard M, Díaz-Gay M, Bergstrom EN, …, Villani A, Alexandrov LB, Shlien A","aff":"Program in Genetics and Genome Biology, The Hospital for Sick Children, Toronto, Ontario, Canada (제1저자, 교신저자). Department of Cellular and Molecular Medicine, University of California, San Diego, CA, USA","type":"Article","bg":"소아암 환자는 치료의 단기 및 장기 부작용을 겪는다. 그런데 항암화학요법 노출이 종양 유전체에 남기는 DNA 손상이 실제로 얼마나 되는지는 분명하지 않았다. 용량과 노출 기간을 일관되게 모은 코호트가 드물어 약물별 돌연변이 효과를 정량하고, 그것이 재발 종양의 유전 지형을 어떻게 바꾸는지 따지기 어려웠다.","ap":"치료 용량과 총 노출량이 균일하게 수집된 다기관 코호트를 썼다. 공격적 질환에 초점을 둔 정밀의료 사업 세 곳에서 전장 유전체로 읽은 종양 611개에 돌연변이 서명 분석을 적용했다. 약물 노출 기록을 상세히 붙여 용량과 기간과 시점을 함께 분석했고, 노출 날짜를 이용해 치료 연관 돌연변이가 언제부터 검출되는지 추적했다.","kf":["재발한 소아 종양에서 항암화학요법과 방사선요법은 검출 가능한 효과를 가진 유일한 외인성 돌연변이원이었고, 많은 경우 DNA 변화의 가장 큰 단일 원천이었다.","치료 전 종양과 비교하면 치료 후 암은 고유 서명의 수가 약 세 배, 전체 체세포 돌연변이 부하가 약 두 배였다.","백금계 약물이 치료 연관 돌연변이의 약 60%를 만들었고, 노출된 종양에서 서명이 나타나는 비율도 51%로 다른 약물의 26%보다 높았다.","노출 18개월이 지나면 변이 수가 충분한 백금 치료 종양의 48%에서 서명이 검출됐다. 서명이 드러나는 최소 기간을 정량한 결과다.","소아암에서 작동하는 SBS, DBS, ID 서명 69개를 확인했다. 기존 보고보다 30개 많고, 백금 연관 서명의 수는 두 배 넘게 늘렸다.","일부 서명은 조직 특이적이었다. 항대사물질 서명 SBS87은 백혈병과 림프종에서만 나타났고, 같은 노출량이면 골육종이 신경모세포종보다 백금 연관 돌연변이를 가질 확률이 약 1.5배였다.","약물 연관 서명을 가진 진행 종양은 유발 유전자 변이를 평균적으로 더 많이 품었지만, 영향받은 유전자의 분포는 서명 유무에 따라 다르지 않았다."],"sig":"치료가 남긴 돌연변이를 약물별로, 용량별로, 시점별로 정량한 대규모 작업이다. 치료에서 살아남은 암세포가 치료의 흔적을 그대로 지닌다는 것을 유전체 수준에서 보였다. 재발 시점의 유전 지형을 이전 치료 이력으로 상당 부분 설명할 수 있다는 결론은 재발 소아암의 치료 선택과 장기 추적에 직접 쓰일 근거다.","lim":"코호트가 희귀 암 위주로 구성되어 암종별 표본 수가 적다. 소아암은 성인암보다 돌연변이 수가 훨씬 적어 서명 검출에 필요한 변이 수를 못 채우는 종양이 있다. 새로 제시한 서명 상당수는 아직 충분히 특성화되지 않아 후속 연구가 필요하다. 치료로 늘어난 돌연변이가 특정 유발 유전자를 더 자주 건드린다는 증거는 나오지 않았으므로, 돌연변이 부하 증가가 임상 경과로 이어지는 경로는 따로 규명해야 한다.","lab":"돌연변이 서명으로 노출 이력을 거꾸로 읽는 설계는 대사 교란이나 산화 스트레스가 남기는 흔적을 찾는 작업에 그대로 옮길 수 있다. 치료 저항성 종양의 단백체를 볼 때 치료 이력에 따른 유전체 배경을 먼저 통제해야 한다는 실무적 교훈도 분명하다. 공개된 서명 카탈로그는 자체 코호트 분석에 참조로 쓸 수 있다.","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/NAT_2026-09-17_t1-5_fig1.jpg","label":"Figure 1","cap":"분석에 쓴 소아암 코호트의 전체 구성이다. 전장 유전체로 읽은 종양 611개가 암종별로 어떻게 나뉘고, 치료 전과 치료 후 시료가 각각 얼마나 되며, 어떤 약물 노출 기록이 붙어 있는지를 정리했다."},{"src":"fig/NAT_2026-09-17_t1-5_fig2.jpg","label":"Figure 2","cap":"치료 상태와 암종에 따른 돌연변이 부하를 비교한다. 치료 후 종양이 치료 전보다 전체 체세포 돌연변이를 약 두 배 지니고 고유 서명 수는 약 세 배라는 결과가 이 그림에서 나온다."}]},{"j":"Nature","w":"2026-09-17","t":"T2","i":1,"ko":"바이러스 유사 입자 자가조립의 분자 수준 관찰","en":"Molecular-level observation of the self-assembly of a virus-like particle","one":"","ab":"생체분자 조립은 세포 조직화의 초석이다. 그 바탕 원리를 밝히는 일은 생물학적 기능과 질환에서의 기능 이상을 이해하는 데 필수적이다. 바이러스 캡시드 조립은 전형적인 자가조립 계로, 생체분자 조립의 기본 원리를 세우고 새로운 생체재료와 치료제를 개발하는 데 중심 역할을 해 왔다. 그러나 수십 년의 실험적 노력에도 바이러스 자가조립의 경로와 동역학을 관찰하고 정량하는 일은 어려운 과제로 남아 있었다. 여기서 우리는 질량 광학과 단일분자 포획 기법을 결합해 개별 바이러스 유사 입자의 실시간 조립을 분자 수준 해상도로 추적했다. 우리는 약하고 가역적인 다가 상호작용이, 경로상에 있으면서 위상적으로 닫힌 제한된 수의 중간체 구조를 확률적으로 선택하게 함으로써 조립 과정을 통제한다는 것을 보인다. 조립은 이들 중간체 사이의 전이 속도로 미세하게 조절되며, 사실상 비가역적인 최초 도달 사건의 연속으로 진행된다. 이 최초 도달 시간은 바이러스 유사 입자의 대칭성에서 비롯되며, 위상적으로 닫힌 첫 중간체의 형성과 그 뒤의 신장 사이에 시간적 분리를 만든다. 그 결과 핵생성과 성장 기전이 나타나, 조립 전체가 비가역적인데도 질량 작용 법칙과 일치하는 평형 분포를 낳는다. 이 과정의 열역학과 반응속도론을 특성화한 결과, 수천 개의 조립 중간체가 가능한데도 계가 어떻게 하나의 최종 구조로 높은 충실도로 조립되는지가 드러난다. 더 넓게 보면 우리 접근법은 다량체 생물학적 기계의 동역학을 분자 수준에서 시각화하고 정량하는 일반적 틀을 제공한다.","tags":["생물물리","자가조립"],"doi":"10.1038/s41586-026-10948-z","url":"https://www.nature.com/articles/s41586-026-10948-z","au":"Asor R et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Asor R et al., Nature 657, 2026, DOI 10.1038/s41586-026-10948-z. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":2,"ko":"남반구의 소나무가 더 빨리 자라고 가뭄에 더 잘 견딘다","en":"Pines grow faster and are more drought resilient in the Southern Hemisphere","one":"","ab":"가뭄에 따른 침엽수 고사는 전 세계적 문제지만, 북반구 원산 침엽수를 남반구에 대규모로 심은 경우에는 원산지만큼의 생장 감소나 고사가 나타나지 않는다. 저자들은 네 대륙 192개 지점에서 표준화된 연륜연대학 조사를 수행해 자생지와 비자생지의 같은 종을 비교했다. 남반구에 이식된 개체는 원산지 개체보다 최대 네 배 빠르게 자랐고 가뭄에 대한 저항성과 회복력도 높았다. 이들은 비구조 탄수화물 농도도 더 높아, 저장 자원이 스트레스 대응에 기여했을 가능성을 시사한다. 저자들은 비자생 집단이 비생물 스트레스에 근본적으로 다르게 반응한다고 해석하며, 자생지의 생장 감소를 그대로 미래 예측에 옮기기 어렵다고 본다. 같은 호 News & Views가 이 논문을 다뤘다.","tags":["산림생태","기후적응"],"doi":"10.1038/s41586-026-10969-8","url":"https://www.nature.com/articles/s41586-026-10969-8","au":"Fajardo A et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":3,"ko":"사람 뇌 오가노이드가 여러 해에 걸친 시간 경과를 기록한다","en":"Human brain organoids record the passage of time over multiple years","one":"","ab":"사람 뇌는 거의 20년에 걸쳐 발달하고 성숙하며, 이 과정의 종 특이적 측면은 동물 모델로 연구하기 어렵다. 뇌 오가노이드는 유망한 시험관 모델이지만 지금까지는 주로 초기 발생 단계만 재현한다고 알려져 왔다. 저자들은 흥분성 신경세포의 생존 기간을 기존 한계 너머로 늘리는 배양 조건을 최적화해 사람 뇌 오가노이드를 5년 동안 유지했다. 실제 사람 뇌에서 도출한 성숙 연관 유전자 모듈을 기준으로 삼아, 오가노이드가 세포 유형별로 전사체 수준에서 나이를 먹어 간다는 것을 보였다. 출생 후 뇌 성숙 과정을 시험관에서 다룰 수 있는 모델을 제시한 결과다.","tags":["뇌 오가노이드","발생"],"doi":"10.1038/s41586-026-10877-x","url":"https://www.nature.com/articles/s41586-026-10877-x","au":"Faravelli I et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":4,"ko":"자극이 사람 뇌에서 유전자와 연결된 세포 집합을 조절한다","en":"Stimulation modulates gene-linked cell assemblies in the human brain","one":"","ab":"자극으로 피질 회로를 재편하는 것은 인지 기능 회복을 겨냥한 새 치료 전략이지만, 사람에서 그 생물학적 기전은 거의 밝혀지지 않았다. 저자들은 신경외과 수술에서 절제한 측두피질을 대상으로 미세전극 배열 자극과 동시 전기 기록, 단일핵 유전체 분석을 하나로 묶은 생체 외 플랫폼을 만들었다. 이 플랫폼에서 자극은 함께 발화하는 신경세포 집합을 강화했고, 저자들은 이 효과를 세포 유형별 유전자 조절 네트워크와 연결했다. 사람 조직에서 자극의 효과를 전기 생리와 유전체 수준에서 동시에 관찰한 설계로, 신경조절 치료가 어떤 세포에서 어떤 유전자 프로그램을 통해 작동하는지 따져 볼 근거를 제공한다.","tags":["단일세포 오믹스","신경조절"],"doi":"10.1038/s41586-026-10879-9","url":"https://www.nature.com/articles/s41586-026-10879-9","au":"Moore H et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":5,"ko":"다양한 세균 패턴 인식 수용체가 파지의 핵심 단백질체를 감지한다","en":"Diverse bacterial pattern recognition receptors sense the core phage proteome","one":"","ab":"세포 안에서 외래 분자를 인식하는 일은 생물의 모든 영역에서 면역에 결정적이다. 진핵생물의 NOD 유사 수용체를 포함하는 STAND NTPase 초과 단백질이 이 과정에서 중심 역할을 한다. 세균과 고세균에서도 여러 STAND 계통이 파지 단백질을 감지하지만 그 기능적 다양성은 거의 탐색되지 않았다. 여기서 우리는 원핵생물 STAND NTPase의 체계적 계통 분석을 수행해 항바이러스 방어와 연관된 구조적으로 구별되는 계통을 최소 90개 식별했다. 먼저 특성이 규명되지 않았던 Avs7 계통이 꼬리 파지의 주요 캡시드 단백질(MCP)을 인식함을 보인다. Salmonella enterica Avs7의 극저온 전자현미경 구조 세 건은 비대칭 나비 모양 사합체를 드러내는데, 이 구조는 MCP가 유발하는 큰 입체구조 변화를 통해 단계적으로 조립되며 세균 신장인자 Tu(EF-Tu)를 구조 성분으로 편입해 방어를 강화한다. 파지 유전자 687개 라이브러리를 이용한 유전 스크린으로, 추가로 13개 STAND 계통이 보존된 파지 단백질 13종을 감지하며 이들이 꼬리 파지의 핵심 구조 및 복제 구성 요소 대부분을 아우른다는 것을 보인다. 여기에는 MCP를 감지하는 서로 다른 두 계통(Avs8과 Avs10)과, 포털, 포털 어댑터, 꼬리 노즐, 머리-꼬리 연결자, 꼬리 종결자, 꼬리관 단백질, 꼬리 조립 샤페론, 테이프 측정 단백질, DNA 중합효소, 헬리케이스 및 RecA형 ATPase, 단일가닥 DNA 어닐링 단백질을 각각 인식하는 11개 계통(Avs11에서 Avs21)이 포함된다. 종합하면 우리 결과는 숙주 인자를 전용하는 기전을 밝히고, 구조 기반 패턴 인식을 세균 면역의 근본 전략으로 확립한다.","tags":["미생물 면역","구조생물학"],"doi":"10.1038/s41586-026-10852-6","url":"https://www.nature.com/articles/s41586-026-10852-6","au":"Lee H et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Lee H et al., Nature 657, 2026, DOI 10.1038/s41586-026-10852-6. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":6,"ko":"차세대 3차원 암 모델로 보강한 의존성 지도","en":"A dependency map enhanced with next-generation 3D cancer models","one":"","ab":"정밀 종양학이 발전했지만 대부분의 암 환자에게 효과적인 개인 맞춤 치료는 아직 없다. Cancer Dependency Map은 1,300개가 넘는 세포주를 체계적으로 스크리닝해 여러 암종의 취약점과 치료 전략을 찾아 왔다. 그러나 전통적 2차원 세포주로 취약점을 지도화하는 방식은 암 아형 대표성이 부족하고 배양 조건이 교란 반응에 영향을 준다는 한계가 있다. 저자들은 차세대 3차원 암 모델을 대상으로 유전체 규모 CRISPR 스크린 147건과 다중 오믹스 특성화를 수행했다. 기존 의존성 지도에 3차원 모델을 더해 아형 대표성과 배양 조건의 영향을 함께 줄인 확장판을 만든 작업이다.","tags":["암 의존성","CRISPR 스크린"],"doi":"10.1038/s41586-026-10843-7","url":"https://www.nature.com/articles/s41586-026-10843-7","au":"Neiswender JV et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":7,"ko":"트리파노소마 미토콘드리아 RNA 편집 연쇄의 구조적 기반","en":"Structural basis of the RNA-editing cascade in trypanosome mitochondria","one":"","ab":"트리파노소마 미토콘드리아에서 일어나는 우리딘 삽입 및 결실 mRNA 편집의 분자 기전은, 관여하는 다중 효소 기구가 매우 역동적이어서 오랫동안 불분명했다. 저자들은 RNA 편집 기질 결합 복합체와 RNA 편집 촉매 복합체 1 또는 2가 이루는 초분자 집합체로 에디토솜을 정의했다. 이어 약 1 MDa 규모인 RECC1과 RECC2의 극저온 전자현미경 구조를 결정했다. 두 리보핵단백질은 머리와 가슴 모양 코어, 꼬리, 날개를 갖춘 잠자리 형태를 띠며 각각 우리딘 결실 연쇄와 삽입 연쇄를 매개한다. 각 RECC 안에서는 사합체 코어가 중심 골격을 이룬다. 역동적이라 접근이 어려웠던 편집 기구의 구조적 논리를 제시한 연구다.","tags":["구조생물학","RNA 편집"],"doi":"10.1038/s41586-026-10831-x","url":"https://www.nature.com/articles/s41586-026-10831-x","au":"Liu YT et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":8,"ko":"TM184C는 세포 간 교환과 자가포식을 조절하는 GPCR 유사 단백질이다","en":"TM184C is a GPCR-like regulator of intercellular exchange and autophagy","one":"","ab":"단백질 기능 주석은 대부분 서열 유사성에 기대기 때문에, 검출 가능한 상동성 너머에 있는 기능은 가려진다. 저자들은 AlphaFold2 구조 모델 수백만 개를 탐색해 G 단백질 연결 수용체와 구조가 닮은 사람의 초암흑 7회 막관통 단백질 계통 TM184와 PRRT를 찾아냈다. 이 단백질들은 베타 아레스틴 모집과 GRK 의존 인산화 같은 GPCR의 전형적 활성을 보였다. 그중 가장 널리 발현되고 진화적으로 보존된 TM184C에 초점을 맞추었는데, 이 단백질은 원형질막이 아니라 미세소관을 따라 움직이는 역동적 세포 내 소포에 자리했다. 구조 예측으로 서열 상동성 바깥의 기능을 발굴한 사례다. 같은 호 News & Views가 이 논문을 다뤘다.","tags":["세포생물학","구조예측"],"doi":"10.1038/s41586-026-10993-8","url":"https://www.nature.com/articles/s41586-026-10993-8","au":"Lee KD et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":9,"ko":"종양 유래 오가노이드 바이오뱅크로 그린 암 유전자 의존성 지도","en":"A tumour-derived organoid biobank maps cancer gene dependencies","one":"","ab":"암세포주는 여전히 연구와 신약 발굴의 기반이지만 종양의 다양성을 온전히 담지 못하고 연결된 환자 정보가 없으며 배양에 적응한 상태다. 종양 오가노이드는 환자 조직에서 유래한 3차원 배양으로 세포주를 강력하게 보완한다. 여기서 우리는 대장암, 식도암, 난소암, 췌장암, 위암에서 임상 정보가 주석된 종양 오가노이드 256개를 직접 유도해 재생 가능하고 유전적으로 안정한 모델로 특성화했다. 각 모델과 짝지은 환자 종양 시료를 전장 유전체 및 전사체 시퀀싱으로 광범위하게 분석했고, 오가노이드 162개에 걸친 유전체 전반 CRISPR-Cas9 스크린으로 유전자 의존성을 지도화했다. 통합 분석으로 흔한 아형과 드문 아형 전반에서 의존성의 유전체적 및 임상적 지표를 밝히고, 오가노이드 특이적 필수 유전자를 찾았으며, 치료 전후로 짝지은 시료에서 종양 진화 후 표적 가능한 취약성을 드러냈다. 대장암에서는 EGFR과 RAS, MAPK 축을 기능적, 약리학적으로 탐색해 KRAS 변이 대립유전자에 따른 차등 효과를 밝혔다. 공개된 이 자원은 환자 유래 오가노이드의 유전자 의존성을 체계적으로 지도화해, 정밀 종양학에 필요한 모델 다양성과 기전적 통찰을 넓힌다.","tags":["암 생물학","오가노이드","CRISPR 스크린","대규모 자원"],"doi":"10.1038/s41586-026-10830-y","url":"https://www.nature.com/articles/s41586-026-10830-y","au":"Herranz-Ors C et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Herranz-Ors C et al., Nature 657, 2026, DOI 10.1038/s41586-026-10830-y. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"T2","i":10,"ko":"100만 명 분석에서 FNIP1 변이가 유리한 대사와 연관됐다","en":"FNIP1 variants are associated with favourable metabolism in 1 million humans","one":"","ab":"에너지 대사의 개인차는 심장대사 질환 전반을 관통하는 요인이고 일부는 유전된다. 저자들은 아메리카와 유럽, 아시아의 1,032,116명을 엑솜 시퀀싱해 희귀 단백질 코딩 변이와 중성지방 대 고밀도지단백 콜레스테롤 비율의 연관을 분석했다. 이 비율은 이중에너지 X선 흡수계측과 생체전기저항, 자기공명영상으로 측정한 체지방 분포, 간 이소성 지방, 간 손상 지표, 근육 내 지방과 연관됐고 여러 심장대사 위험요인 및 질환으로 이어졌다. 엑솜 전반 분석에서 P < 1.04 × 10의 마이너스 7승 기준으로 독립 연관 유전자 59개를 찾았으며 이들은 간과 지방 조직 발현 유전자에 농축됐다. 유전학과 오믹스, 시험관 및 생체 내 실험을 결합해 FNIP1과 FLCN 경로가 사람의 에너지 대사와 심장대사 질환 발생에 관여함을 보였고, 간 hepsin이 혈중 지질 대사에 관여한다는 결과도 함께 얻었다.","tags":["세포 대사","대사 질환","지방 조직","대규모 코호트"],"doi":"10.1038/s41586-026-10864-2","url":"https://www.nature.com/articles/s41586-026-10864-2","au":"Hindy G et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":1,"ko":"","en":"Overmassive black holes and little red dots naturally form in simulations","one":"","ab":"","tags":["천문"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":2,"ko":"","en":"Continuous-wave laser absorption spectroscopy of the thorium-229 nucleus","one":"","ab":"","tags":["물리"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":3,"ko":"","en":"Electrically controllable superconducting memory effect in UTe2","one":"","ab":"","tags":["물리"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":4,"ko":"","en":"Heterogeneous photonic integration of single-crystalline nanomembranes","one":"","ab":"","tags":["재료와 광공학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":5,"ko":"","en":"A thermodynamically favoured molecular computer","one":"","ab":"","tags":["분자컴퓨팅"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":6,"ko":"","en":"Probing far-from-equilibrium dynamics of electrical double layers","one":"","ab":"","tags":["전기화학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":7,"ko":"","en":"Anodic Pd membrane H2 extraction enhances thermochemical dehydrogenation","one":"","ab":"","tags":["화학공학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":8,"ko":"","en":"Atmospheric CH4 plateau sustained by NOx emission rise and southward shift","one":"","ab":"","tags":["대기과학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":9,"ko":"","en":"Operational tropical cyclone forecasting with AI","one":"","ab":"","tags":["기상예측"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-09-17","t":"EX","i":10,"ko":"","en":"Mobile education builds resilience during shocks in five countries","one":"","ab":"","tags":["사회과학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T1","i":1,"ko":"TA 반복서열 절단을 MMEJ로 수선해 ecDNA와 암세포 적응도를 유지한다","en":"MMEJ repair of breaks at TA repeats maintains ecDNA and cancer fitness","one":"ecDNA는 TA 반복서열에서 반복적으로 끊어지고 그 절단을 Polθ 기반 MMEJ가 수선해 유지되므로, MMEJ 억제가 ecDNA 의존 암세포의 취약점이 된다.","ab":"ecDNA는 메가베이스 크기의 환형 DNA로 종양유전자 증폭을 싣고 치료 저항성과 나쁜 예후에 연결된다. 저자들은 ecDNA가 어떤 수선 경로로 유지되는지 물었다. MMEJ를 억제하면 NHEJ나 HR 억제와 달리 ecDNA가 선택적으로 줄고 ecDNA에 국한된 손상이 생기며 미소핵으로 격리되어 ecDNA 의존 암세포의 적응도가 떨어졌다. 기전으로는 ecDNA의 TA 풍부 부위가 손상과 절단의 핫스팟이었다. FANCM이 이 부위의 절단 생성을 억제하고, 감시를 벗어난 구조는 ERCC1-ERCC4가 자른 뒤 MMEJ로 수선된다. COLO320DM에서 FANCM이나 polymerase θ(Polθ)를 교란하면 단일세포 전장유전체 시퀀싱에서 결손과 작은 중복이 늘고 절단점이 TA 풍부 영역에 몰렸다. 사람 종양에서도 ecDNA 재배열이 TA 반복에 몰려 있었다. 저자들은 Polθ 억제를 ecDNA 의존 종양을 불안정화하는 전략으로 제안한다.","tags":["암생물학","DNA 수선","유전체 불안정성","단일세포 유전체"],"doi":"10.1038/s41586-026-11048-8","url":"https://www.nature.com/articles/s41586-026-11048-8","au":"Billing D, Selvaraj M, …, Sfeir A","aff":"Molecular Biology Program, Sloan Kettering Institute, Memorial Sloan Kettering Cancer Center, New York, USA (제1저자, 교신저자)","type":"Article","bg":"ecDNA는 사람 암의 약 17%에서 발견되고 세포분열 때 무작위로 분배되어 종양 내 이질성을 키운다. 형성 단계에서는 chromothripsis 뒤 NHEJ가, 일부는 HR 인자가 관여한다는 것이 밝혀져 있었다. 그러나 ecDNA는 복제 스트레스와 전사-복제 충돌로 S기에 손상이 쌓이는데도 종양에서 안정적으로 유지되고 증폭된다. 저자들은 이미 만들어진 ecDNA 풀을 지키는 DSB 수선 경로가 무엇인지 물었다.","ap":"MYC-ecDNA를 가진 COLO320DM과 같은 환자에서 유래해 MYC가 염색체 내 HSR로 증폭된 COLO320HSR을 짝지어 비교했다. Polθ 폴리머라아제 도메인 억제제 RP-6685(Polθi-Pol)와 헬리카아제 도메인 억제제 RP-2119(Polθi-Hel)를 1주 처리하고 metaphase FISH로 ecDNA 수를 셌다. PC3-DM, SNU-16, NCI-H716 등 다른 ecDNA 양성 세포주와, Cre 발현으로 ecDNA를 만든 뒤 염색체 MYC 좌위를 영구 제거한 신경줄기세포주를 써서 형성과 유지를 분리했다. 수선 경로 사용 비율은 AAVS1-Repair-seq와 MYC-Repair-seq로, 내재적 DSB 위치는 END-seq로 전장 규모로 지도화했다. 구조 변이는 DLP+ 기반 단일세포 전장유전체 시퀀싱과 Amplicon Repository의 사람 종양 ecDNA 재구성 자료로 분석했다.","kf":["Polθ 억제제를 1주 처리하면 COLO320DM의 MYC-ecDNA가 유의하게 줄었고 COLO320HSR의 염색체 내 MYC 증폭은 영향을 받지 않았다. PC3-DM, SNU-16, NCI-H716에서도 같은 감소가 재현되었다.","DNA-PKcs 억제제 NU7441 1 μM로 NHEJ를 막거나 shRNA로 BRCA2를 줄여 HR을 억제해도 ecDNA는 줄지 않았다. 반면 Polθ를 손상 부위로 모으는 RHNO1을 결손시키면 ecDNA가 줄었다.","Polθ 억제는 COLO320DM에서 MYC 양성 미소핵을 크게 늘렸고 이 미소핵에는 중심체나 텔로미어 신호가 풍부하지 않았다. 염색체 오분리에 얹혀 간 것이 아니라 ecDNA가 선택적으로 격리된 결과다.","Polθ 억제만으로는 증식, 세포주기, 경쟁 성장이 나빠지지 않았다. Chk1 억제제와 병용하거나, DHFR ecDNA에 의존하는 HeLa-DM을 methotrexate로 선택하거나, SNU-16을 6.25 nM FGFR 억제제와 병용할 때만 ecDNA 의존 세포의 성장이 억제되었다.","Repair-seq에서 HR, NHEJ, MMEJ의 상대 기여는 두 세포주 사이에 차이가 없었다. END-seq에서는 ecDNA 안에 반복적 DSB가 TA 2염기 반복에 몰렸고, 8번 염색체 amplicon의 END-seq 피크 20개 중 11개가 6단위 이상 TA 반복과 겹쳤다. TA 반복 길이와 DSB 양은 양의 상관을 보였다.","FANCM이나 SMARCAL1 결손은 손상을 늘리고 ERCC1 또는 ERCC4 결손은 Polθ 억제로 생긴 손상을 되돌렸다. triptolide나 CDK9 억제제로 전사를 막으면 FANCM 결손의 손상이 사라졌다. DLP+ 단일세포 전장유전체 시퀀싱에서 sgFANCM과 Polθi-Hel은 큰 결손을, sgFANCM은 추가로 5 kb 미만 중복을 END-seq 취약 영역에 몰아 만들었고, 사람 종양에서도 ecDNA 증폭 절단점이 선형 증폭 절단점보다 TA 반복에 유의하게 몰려 있었다."],"sig":"ecDNA 유지가 MMEJ에 특이적으로 의존한다는 결과는 환형 DNA를 선형 염색체와 다른 수선 요구를 가진 유전체 실체로 보게 한다. TA 반복의 2차 구조가 서열에 새겨진 내재적 취약점임을 보여, 염기서열에서 ecDNA 취약 부위를 예측할 길을 연다. 저자들은 종양유전자 표적 치료로 ecDNA 의존도를 높인 뒤 MMEJ를 억제하는 병용 전략을 제안한다.","lim":"MMEJ와 NHEJ, HR 사이의 합성 치사 관계 때문에 Polθ 억제 후 남은 ecDNA가 NHEJ나 HR의 보상 수선으로 유지되는지는 가릴 수 없었다. TA 부위 절단이 M기까지 남아 있다가 MMEJ로 수선된다는 설명은 저자들의 추정이며 S-G2기 MMEJ의 기여를 배제하지 못했다. 단일세포 전장유전체 분석은 COLO320DM 한 세포주에서만 수행되었다.","lab":"암세포 유전체 불안정성을 단일세포 전장유전체 시퀀싱으로 추적한 설계는 연구실의 단일세포 오믹스 분석 전략과 바로 맞물린다. ecDNA 의존 종양의 치료 저항성 기전을 다루므로 암 오믹스 과제와 연결된다. FANCM과 Polθ 축의 활성 상태를 단백체나 인산화체 수준에서 읽는 후속 설계도 생각할 수 있다.","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/NAT_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"Polθ 억제제 처리 뒤 COLO320DM의 MYC-ecDNA 수가 줄고 53BP1과 γH2AX 손상 초점, MYC 양성 미소핵이 늘어나는 것을 보여준다. DNA-PKcs 억제나 BRCA2 결핍에서는 같은 변화가 나타나지 않는다."},{"src":"fig/NAT_2026-10-08_t1-1_fig4.jpg","label":"Figure 4","cap":"FANCM이 전사로 생긴 TA 반복의 2차 구조를 풀고, 남은 구조는 ERCC1-ERCC4가 절단하며, 그 DSB를 Polθ 기반 MMEJ가 수선하는 2단 방어 모형을 제시한다. 손상 초점, 미소핵, TA 부위 END-seq 신호가 이 모형을 뒷받침한다."}]},{"j":"Nature","w":"2026-10-08","t":"T1","i":2,"ko":"생쥐에 사람 유래 오르가노이드를 이식해 발생기 이종피질을 만든다","en":"Developmental xenocortication using human-derived organoids in mice","one":"대뇌피질과 해마를 유전적으로 제거한 생쥐에 사람 피질 오르가노이드를 이식해, 피질 부피 대부분을 사람 신경세포가 채우고 숙주 회로와 연결되며 행동 지표까지 읽을 수 있는 모델을 만들었다.","ab":"사람 뇌 조직은 접근이 어려워 발생과 기능 연구가 제한되어 왔다. 신경 오르가노이드를 설치류에 이식하면 사람 신경발생과 회로 기능을 생체에서 볼 수 있으나, 공간 제약과 숙주 회로와의 경쟁이 통합을 막는다. 저자들은 생쥐 신피질과 해마의 글루탐산성 신경세포를 유전적으로 제거한 apallial 생쥐를 만들고, 신생기에 그 피질 공간에 사람 줄기세포 유래 피질 오르가노이드를 이식해 xenocortical 생쥐를 얻었다. 이식편은 피질 부피 대부분을 차지하며 layer 5 extratelencephalic 투사 신경세포를 포함한 다양한 사람 피질 세포형을 만들었다. 사람 신경세포는 숙주 신경계와 통합되었고 생체 칼슘 영상과 전기생리에서 발생기 회로를 닮은 조직화된 활동이 나타났다. 행동에서는 보행이 대체로 보존되고 사지 협조와 자발 행동 조직화에서 선택적 차이가 보였다. 저자들은 저산소 손상 모델의 행동 지표를 들어 이 플랫폼이 질환 모델링과 치료 개발에 쓰일 수 있다고 제안한다.","tags":["신경발생","뇌 오르가노이드","단일세포 전사체","공간 전사체"],"doi":"10.1038/s41586-026-11032-2","url":"https://www.nature.com/articles/s41586-026-11032-2","au":"Kaganovsky K, Kelley KW, …, Pașca SP","aff":"Department of Psychiatry and Behavioral Sciences, Stanford University, Stanford, USA (제1저자, 교신저자)","type":"Article","bg":"사람 피질 오르가노이드를 신생 쥐 피질에 이식하면 사람 신경세포가 더 성숙하고 숙주와 통합되지만, 두개강의 공간 제약과 숙주 피질과의 연결 경쟁 때문에 이식편은 쥐 피질 반구의 3분의 1 정도까지만 차지한다. 설치류 신경세포가 사람 신경세포보다 빠르게 성숙하므로 숙주 환경이 이식편의 증식과 투사를 제한한다. 이 제약은 광범위한 회로 이상과 행동 변화를 동반하는 신경발달장애를 모델링하거나 생체에서 사람 신경세포에 약물을 시험할 때 특히 문제가 된다. 저자들은 숙주 피질을 미리 비워 두면 사람 이식편이 피질 규모로 자라 회로와 행동 수준의 판독을 줄 수 있는지 물었다.","ap":"면역결핍 SCID 배경에서 dorsal 및 medial pallium 표지자 Emx1을 발현하는 세포에 한정해 자매염색분체 응집 인자 Esco2를 결손시켜 apallial 생쥐(Emx1-cre Esco2 Prkdc)를 만들었다. 번식과 양육 조건을 조정해 91 litter, 46 번식 케이지에서 apallial 자손 23.4%를 얻었다. 전뇌 MRI와 전뇌 단일핵 RNA 시퀀싱(snRNA-seq)으로 세포형 조성을 확인했고, 엄격한 품질 필터 뒤 880,149개 단일핵 프로파일을 Allen Brain Cell Atlas에 매핑했다. 신생기 apallial 생쥐 한 마리에 hCO 4개를 이식해 xenocortical(XCX) 생쥐를 만들고, MRI로 이식편 부피를, 순행 및 rabies 역행 추적과 확산강조영상으로 연결성을, snRNA-seq과 MERFISH 공간 전사체로 세포 조성과 배열을 분석했다. 기능은 광학두개 칼슘 영상(OEG)과 32채널 국소장전위 기록으로, 행동은 MoSeq 기반 자발 행동 분해와 CatWalk, Y 미로, 공포 조건화 등 표적 과제로 평가했다.","kf":["전뇌 MRI에서 apallial 생쥐의 총 뇌 조직은 대조군보다 약 50% 적었다. snRNA-seq에서 dorsal pallium 유래 글루탐산성 신경세포 class가 7배 감소했고 후구와 비pallium 유래 class는 보존되었다. 편도와 piriform cortex 등 ventral 및 lateral pallium 신경세포는 남았다.","hCO 이식 성공률은 hiPS 세포주 3종, 생쥐 29마리에서 86.2%였다. 이식 2개월에서 3개월 사이 이식편 부피가 약 4.7배 늘었고, 이식 3개월에 XCX 이식편은 전체 피질 조직 부피의 91.9%를 차지했다.","이식편은 깊은 층과 표층 글루탐산성 신경세포, 순환 전구세포, oligodendrocyte 전구세포, astrocyte 계열을 포함했다. layer 5 extratelencephalic(L5-ET) 신경세포 cluster가 FEZF2, POU3F1과 함께 GABRQ, BMP3를 발현했고, Human Neural Organoid Cell Atlas의 213,753개 신경세포 가운데 L5-ET UCell 점수 0.1을 넘은 세포는 3개뿐인 데 비해 XCX L5-ET 신경세포의 85%가 이 기준을 넘었다.","순행 추적에서 사람 유래 투사가 상구까지, 그리고 생쥐 3마리 모두에서 경추 척수까지 희박하게 뻗었고 STEM121 공동 염색으로 확인되었다. rabies 역행 추적에서는 palaeocortex, 시상, pallidum이 주요 입력원이었다.","OEG 칼슘 영상에서 수십 초 지속되고 수 분 간격으로 반복되는 대규모 동기 칼슘 폭발이 보였고 약 100 ms 단위로 이식편 등쪽 표면 전체로 전파되었다. 동일 위치의 국소장전위 기록에서 같은 시간 양상의 LFP 폭발이 샤프트 전체에서 동시에 검출되었다. 칼슘 활동은 입과 얼굴 움직임과 밀접히 상관했다.","MoSeq 분석에서 60개 행동 syllable이 분산의 99%를 설명했고, 선형판별분석에서 세 군의 중심이 거의 등거리였으며 XCX는 apallial 쪽에 가까웠다. Y 미로 작업기억에서 대조군과 XCX는 우연 수준을 넘었으나 apallial은 넘지 못했다. 5% O2 5시간 저산소 노출 뒤 XCX 생쥐 3마리 모두에서 이식편에 HIF1α가 검출되고 SWI 저신호가 늘었으며, CatWalk에서 3-4발 지지 비율이 기준선보다 가장 크게 늘었다."],"sig":"숙주 피질을 미리 비우면 사람 유래 피질 조직이 피질 규모로 자라 전기적으로 활동하고 척수까지 투사하는 이식편이 된다는 것을 보였다. 시험관 오르가노이드에서 거의 만들어지지 않던 L5-ET 신경세포가 이 조건에서 생기므로, 사람과 대형 뇌 포유류에 한정된 세포형을 다룰 길이 열린다. 저산소 손상 뒤 보행 변화를 읽어낸 결과는 사람 신경세포를 대상으로 손상과 치료를 행동 수준에서 평가할 수 있음을 보여준다.","lim":"저자들은 이식편 유래 신경세포가 특정 행동에 필요하거나 충분한지는 아직 불확실하다고 적었다. 관찰된 행동은 사람 이식편과 보존된 생쥐 피질하 회로의 상호작용을 반영할 가능성이 크다. 분화 후 177일까지의 이식편은 영역 구획화, 층 구조, GABA성 중간신경세포의 온전한 구성, 성숙한 전사 프로파일을 아직 갖추지 못했고, 설치류와 사람의 발생 속도 차이가 통합을 제한할 수 있다. 저자들은 더 성숙한 모델을 만들려면 윤리 지침을 먼저 마련해야 한다고 강조한다.","lab":"전뇌 단일핵 RNA 시퀀싱 88만 세포 규모 분석과 MERFISH 공간 전사체를 핵심 수단으로 쓴 설계여서 연구실의 단일세포 및 공간 오믹스 분석과 직접 맞닿는다. 조직 수준 세포형 지도와 공간 배열을 함께 읽어 이식편의 자기조직화를 판정한 방식은 다른 조직 재구성 연구에도 옮겨 쓸 수 있다. 암 연구와의 직접 연결은 약하다.","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/NAT_2026-10-08_t1-2_fig1.jpg","label":"Figure 1","cap":"Emx1-cre Esco2 결손으로 만든 apallial 생쥐의 뇌 형태, MRI 부피 감소, 전뇌 단일핵 RNA 시퀀싱 기반 세포형 조성을 보여준다. dorsal pallium 유래 글루탐산성 신경세포가 선택적으로 사라진 것이 핵심이다."},{"src":"fig/NAT_2026-10-08_t1-2_fig2.jpg","label":"Figure 2","cap":"apallial 생쥐에 사람 피질 오르가노이드를 이식한 절차와 이식편의 성장, 숙주 뇌 및 척수와의 연결, 단일핵 전사체로 본 세포형 구성을 보여준다. layer 5 extratelencephalic 신경세포와 큰 세포체를 가진 von Economo 유사 세포가 포함된다."}]},{"j":"Nature","w":"2026-10-08","t":"T1","i":3,"ko":"종양배출림프절의 PLA2G2D가 항종양 면역을 조절한다","en":"PLA2G2D in tumour-draining lymph nodes regulates anti-tumour immunity","one":"흑색종 환자의 종양배출림프절 공간 프로파일링으로 PLA2G2D를 분비하는 림프절 대식세포를 찾아, PLA2G2D가 PD-1과 겹치지 않는 림프절 중심 면역관문임을 보였다.","ab":"전신 항종양 면역은 종양배출림프절(TDLN)에서 T 세포가 프라이밍되면서 생긴다. 종양 안에서 T 세포가 억제되는 과정은 잘 알려져 있지만, TDLN에서도 그런 억제가 일어나는지, 그렇다면 어떤 기전인지는 잘 알려져 있지 않다. 여기서 저자들은 흑색종 환자의 TDLN을 imaging mass cytometry로 분석해, 원격 전이 발생과 연결되는 TDLN 부피질(paracortex)의 공간 이웃을 찾아냈다. 이 이웃 안의 세포를 표적 공간 전사체로 분석한 결과, 활성화된 CD8 T 세포가 면역억제성 분비 phospholipase인 PLA2G2D를 높게 발현하는 골수계 세포와 맞물려 있었다. PLA2G2D 양성 골수계 세포는 원발 종양이나 전이보다 TDLN에 훨씬 많았다. PLA2G2D의 유전적 기능 상실이나 항체 매개 억제는 종양 성장을 뚜렷하게 줄였고, 흑색종을 가진 생쥐의 단일세포 전사체 분석에서 Pla2g2d 발현은 림프절 대식세포에 국한되었다. 기전으로 PLA2G2D는 시험관에서 T 세포의 초기 증식을 직접 억제했고, PLA2G2D를 억제하면 TDLN에서 종양 특이 T 세포가 늘어나 이어서 혈중과 종양 내 T 세포가 늘었다. 특히 PLA2G2D와 PD-1은 서로 겹치지 않는 면역관문으로 작용해, 사람 특이 항체로 치료한 인간화 생쥐에서 병용 치료가 가산 또는 상승 효과를 보였다. 이렇게 저자들의 심층 공간 프로파일링은 PLA2G2D를 암 면역치료의 TDLN 중심 표적 면역관문으로 제시한다.","tags":["종양면역","공간 오믹스","면역관문","흑색종"],"doi":"10.1038/s41586-026-10954-1","url":"https://www.nature.com/articles/s41586-026-10954-1","au":"van Krimpen A, Huang J, …, Dammeijer F","aff":"Department of Pulmonary Medicine, Erasmus MC University Medical Centre, Rotterdam, The Netherlands (제1저자, 교신저자); Apeximmune Therapeutics, Burlingame, USA (공동 교신저자)","type":"Article","bg":"면역관문 억제제는 TDLN에서 T 세포 프라이밍을 강화해 전신 항종양 면역을 만들지만 많은 환자가 반응하지 않거나 저항성을 얻는다. 종양 미세환경의 T 세포 기능이상 기전은 널리 연구되었으나 TDLN 안의 면역억제 기전은 거의 알려지지 않았다. 흑색종 절제 뒤 TDLN의 특성이 원격 재발과 연관된다는 관찰은 TDLN이 전신 면역의 형성에 관여함을 시사한다. 저자들은 환자 TDLN을 공간 프로테오지노믹스로 훑어 전신 항종양 면역을 조절하는 표적을 찾을 수 있는지 물었다.","ap":"보조요법이나 선행요법을 받지 않고 임상 결과가 확인된 2기 또는 3기 흑색종 절제 환자의 TDLN을 모았다. 재발군과 무병군을 종양 부담과 Breslow 두께로 짝지었고 군별 5-6명을 썼으며, 암이 없는 사망자의 겨드랑이 대조 림프절도 포함했다. 40-plex imaging mass cytometry 패널로 cortex, paracortex, 종양 주변, 종양 내 관심영역을 환자별 위치별 5개 이상, 총 372개 측정해 870,277개 세포를 분할하고 표지자 발현으로 주석했다. 최근접 이웃 분석으로 부피질의 세포 이웃 10개를 정의했고, 3기 환자 각 군 5명의 부피질에서 CD11c DC, CD68 대식세포, CD8 T 세포를 표적 공간 전사체로 분석했다. 기능은 Pla2g2d 결손 생쥐, 골수 키메라, 단일세포 전사체, PLA2G2D-Fc 단백질, 사람 및 생쥐 반응성 중화 항체, PLA2G2D 인간화 생쥐와 anti-PD-1 병용으로 검증했다.","kf":["3기 TDLN 부피질에서 재발군은 HLA-DR 양성 DC가 늘고 무병군은 CD163, CD169 양성 대식세포가 늘었다. DC 대 대식세포 비율 증가는 전이성 TDLN에서만 재발과 강하게 연결되었다.","세포 이웃 10개 가운데 NB2가 재발군에서 크게 늘었다. NB2에서는 CD4, CD8, Treg와 HLA-DR 양성 DC가 늘고, T 세포는 CTLA4와 TOX가, 골수계 세포는 PD-L1과 IDO가 높았다. 부피질에서 DC와 CD8 T 세포 쌍이 늘고 대식세포가 가까이 있는 경우가 많았다.","표적 공간 전사체에서 재발군 골수계 세포에서 가장 강하게 올라간 유전자 중 하나가 PLA2G2D였다. TCGA에서 흑색종의 PLA2G2D 발현은 전이 림프절에서 가장 높았고, 전이 흑색종과 비소세포폐암의 독립 코호트에서도 원격 재발 환자의 TDLN 부피질에서 높았다.","MC38 대장암과 B16F10 흑색종의 성장이 Pla2g2d 결손 생쥐에서 줄었고 PLA2G2D-Fc 투여로 회복되었다. PLA2G2D-Fc는 사람 CD4와 CD8 T 세포의 증식, 효과 사이토카인, granzyme B 생성을 억제했고, 촉매 비활성 H47Q 변이체도 억제력을 유지해 효소 활성과 대체로 무관했다.","골수 키메라에서 조혈계가 PLA2G2D 결손인 야생형 생쥐에서만 MC38 성장이 줄었다. 단일세포 전사체에서 Pla2g2d 발현은 TDLN에 많고 원발 종양에는 없는 림프절 대식세포(LNM) 한 집단에 국한되었으며, 이 세포는 Timd4, Il22ra2, Rxrg를 함께 올려 T 세포 구역 대식세포 표현형을 보였다.","항PLA2G2D 항체는 TDLN과 혈중에서 Ki-67 양성 CD8 T 세포와 TRP2 tetramer 양성 종양 특이 T 세포를 일시적으로 늘렸고 13일째 원발 종양에서 종양 특이 CD8 T 세포를 크게 늘렸다. CD8 T 세포를 제거하면 효과가 사라졌다. PLA2G2D 인간화 생쥐에서 사람 특이 항체는 anti-PD-1 비감수성 B16F10을 감수성으로 바꾸고 전이 모델 LN6-987AL에서 효과를 더 높였다."],"sig":"종양 바깥인 TDLN에서만 주로 작동하는 면역관문이 전신 항종양 면역을 조절할 수 있음을 보였다. PLA2G2D는 분비 단백질이고 효소 활성과 대체로 무관하게 T 세포 초기 활성화를 억제하므로, 기존 수용체 기반 관문과 다른 표적 유형을 제시한다. PD-1과 겹치지 않는 관문이라는 점은 면역관문 억제제 비반응과 획득 저항성에 대한 병용 전략의 근거가 된다.","lim":"PLA2G2D가 T 세포 표면에서 결합하는 표적은 확인되지 않았다. T 세포 구역 대식세포에서만 PLA2G2D를 선택적으로 제거하거나 고갈시키는 도구가 없어 세포 특이적 기여를 가릴 수 없었다. 시험관에서 IFNγ가 PLA2G2D 전사를 강하게 유도했지만 생체에서 IFNγ를 차단해도 LNM의 Pla2g2d 발현은 줄지 않아 유도 신호가 미해결로 남았다. 병용 치료의 가산 또는 상승 효과의 기전은 아직 분명하지 않고 획득 저항성 모델과 임상시험 검증이 필요하다.","lab":"40-plex imaging mass cytometry와 표적 공간 전사체, 단일세포 전사체를 묶어 임상 결과와 연결한 설계는 연구실의 공간 오믹스와 다중 오믹스 통합 전략에 바로 대응한다. 암 면역 미세환경을 세포 이웃 단위로 정량해 표적을 찾은 방식은 연구실 암 코호트 분석에 옮겨 쓸 수 있다. 분비 phospholipase를 다루므로 지질체 분석과도 접점이 있다.","lic":"초록 전문 번역. 출처 van Krimpen A et al., Nature 658, 2026, DOI 10.1038/s41586-026-10954-1. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NAT_2026-10-08_t1-3_fig1.jpg","label":"Figure 1","cap":"흑색종 TDLN의 imaging mass cytometry 분석으로 위치별 면역 구성을 비교하고, 재발 환자에서 늘어난 부피질 세포 이웃 NB2와 DC-CD8 T 세포 쌍 형성을 보여준다."},{"src":"fig/NAT_2026-10-08_t1-3_fig2.jpg","label":"Figure 2","cap":"부피질 골수계 세포와 CD8 T 세포의 표적 공간 전사체 결과와, PLA2G2D가 재발 환자 TDLN 부피질에서 높게 발현되는 것을 TCGA, 면역조직화학, 면역형광으로 보여준다."}]},{"j":"Nature","w":"2026-10-08","t":"T1","i":4,"ko":"Lsp2가 Drosophila의 초기 식이를 성체 번역과 수명에 잇는다","en":"Lsp2 links early-life diet to adult translation and lifespan in Drosophila","one":"유충기 단백질 제한이 저장단백질 Lsp2를 줄이고, 줄어든 Lsp2가 성체 초기 리보솜 단백질과 번역을 낮춰 수명을 늘린다.","ab":"거의 100년 전에 초기 생애의 식이 제한이 쥐와 Daphnia의 수명을 늘린다는 제안이 나왔다. 어린 시기 식이가 성체 생리와 수명에 미치는 영향은 그 뒤 초파리와 생쥐를 포함한 다른 모델 생물에서도 보고되었으나 기전은 잘 알려지지 않았다.
