여기서 저자들은 Drosophila를 모델로, 유충 단계에서 단백질 섭취를 제한하면(초기 생애 단백질 제한, ePR) 저장단백질 수준이 줄어들어 성체 수명이 늘어남을 보인다. 안정동위원소 추적으로, 유충 단계에서 얻은 식이 아미노산이 성체 초기까지 남아 있고 특히 리보솜 단백질에 들어간다는 것을 보인다. 이 과정은 주요 저장단백질인 larval serum protein 2(Lsp2)가 매개하며, Lsp2의 발현은 ePR에 의해 성체 초기 단계에서 지속적으로 낮아진다. Lsp2를 유전적으로 침묵시키면 ePR과 같은 표현형이 나타나, 성체 초기의 리보솜 단백질 양과 번역 활성이 줄고 수명이 늘어난다. 이 저장단백질에 특히 많은 phenylalanine과 tyrosine 같은 특정 아미노산을 제한하는 것만으로도 초기 생애 Lsp2가 줄고 수명이 늘어난다. 이 결과는 Lsp2를 발생 전환을 가로질러 영양 이력을 운반하는 분자 운반자로 지목하며, 어린 시기의 영양 상태를 성체의 번역 능력과 수명에 연결한다. 저자들의 연구는 초기 생애 식이를 평생의 건강에 잇는, 이전에 인식되지 않았던 영양 기억 기전을 밝힌다.","tags":["노화","영양 대사","정량 단백체","번역 조절"],"doi":"10.1038/s41586-026-11031-3","url":"https://www.nature.com/articles/s41586-026-11031-3","au":"Kosakamoto H, Okada R, …, Obata F","aff":"Laboratory for Nutritional Biology, RIKEN Center for Biosystems and Dynamics Research, Kobe, Japan (제1저자, 교신저자); Laboratory for Integrative Genomics, RIKEN Center for Integrative Medical Sciences, Yokohama, Japan (공동 교신저자)","type":"Article","bg":"초기 생애의 일시적 영양 조작이 성체 생리와 수명에 오래 남는 영향을 준다는 영양 프로그래밍은 여러 분류군에서 관찰되었다. 설명으로는 장기 구조의 비가역적 변화, 후성유전 변형, 성장과 번식과 체유지 사이의 교환, 대사와 내분비 항상성, 장내 미생물이 제시되었다. Drosophila에서는 유충기 효모 제한이 성체 수명을 늘린다는 보고와 수명이 정상이라는 보고가 함께 있었고, 장수 성체에서 리보솜과 번역 기구의 전사체 변화가 관찰되었다. 그러나 초기 영양 정보를 기록하고 보존해 발생 전환을 넘어 전달하는 분자 실체는 확인되지 않았다.","ap":"산란 후 약 68시간의 2령 말기 유충을 저효모 식이로 옮겨 유충기에만 단백질을 제한했고 우화 후에는 표준 식이로 되돌렸다. 효모 함량을 8%에서 2% 또는 1%로 낮추며 발생 기간, 우화율, 체중, 날개 크기, 산란수, ovariole 수, 수명을 측정했다. 아미노산 칵테일 보충과 화학 조성이 정해진 HolFast 식이로 아미노산 가용성의 기여를 가렸다. 생체 pulse SILAC을 설계해 유충에는 heavy lysine(+8)과 arginine(+10)을, 성체에는 medium lysine(+4)과 arginine(+6)을 공급하고 성체 머리 시료를 nanoLC-MS/MS로 측정해 단백체 전환을 정량했다. 전사체(RNA-seq), 단백체, 총 아미노산 정량을 함께 수행했고, CRISPR-Cas9로 Lsp2-muGFP knock-in 계통을 만들고 Cg-Gal4, Gal80ts, pGnmt-GeneSwitch, WBFB-GeneSwitch로 시기와 조직을 나눈 Lsp2 녹다운을 수행했다.","kf":["유충 효모를 1%로 낮추면 발생이 늦어지고 암컷 성체 체중이 최대 28% 줄었으나 날개 크기는 7.2%만 줄었다. ePR 성체는 산란수와 ovariole 수가 줄었고 두 성별 모두 수명이 늘었다. 아미노산 칵테일 보충은 수명 연장을 없애 효과가 아미노산 가용성에 의존함을 보였다.","생체 pSILAC에서 유충 말기 표지 효율은 99.4%였다. 성체 3일째 유충 유래 heavy 단백질이 전체 단백체의 63.7%, 6일째 45.8%였다. heavy가 풍부한 단백질의 GO 분석에서 세포질 번역이 1위, 미토콘드리아 전자전달이 2위였고 리보솜 단백질 77개가 상위 25%에 들었다.","RpS25와 RpLP0의 불완전 분해 chimeric 펩타이드에 heavy와 medium lysine이 함께 들어 있어, 유충 유래 단백질이 그대로 옮겨지기만 하는 것이 아니라 재활용 아미노산으로 새로 합성되기도 함을 보였다.","ePR은 성체 2일째 머리에서 번역, 리보솜 생합성, 미토콘드리아 번역 연장 관련 과정을 낮추고 세포질 리보솜 단백질 양을 줄였다. tyrosine과 색소 대사도 낮아져 ePR 성체의 옅은 체색과 일치했다.","Lsp2는 성체 머리에서 가장 많은 단백질 중 하나였고 ePR로 전사체와 단백질이 모두 줄었다. Lsp2-muGFP 신호는 유충기부터 성체 초기까지 ePR에서 낮았다. Lsp2 mRNA는 유충 방황기와 초기 용화기에는 변하지 않고 용화 4일째부터 줄어, 유충기 Lsp2 양이 성체 발현을 앞먹임으로 정하는 조절을 보였다.","지방체 특이 Lsp2 녹다운은 ePR과 달리 산란수, ovariole 수, 인슐린 신호에는 영향을 주지 않으면서 성체 초기 세포질 리보솜 단백질과 번역을 낮추고 수명을 늘렸다. Lsp2는 평균 단백질보다 phenylalanine이 1.97배, tyrosine이 2.66배 많았고, 유충기에 tyrosine을 제거하거나 phenylalanine과 histidine을 25%로 낮추면 수명이 늘었으나 Lsp2에 적은 isoleucine 제한은 수명을 늘리지 않았다."],"sig":"초기 생애 영양 정보가 저장단백질이라는 물리적 실체로 성체까지 운반된다는 기전을 제시한다. 생체 pSILAC으로 식이 아미노산의 행로를 추적해, 성체 초기 단백체의 절반 이상이 유충 유래임을 수치로 보였다. Lsp2 감소가 번식 손실이나 인슐린 신호 변화 없이 수명을 늘리므로, 영양 프로그래밍을 번식과 수명의 교환으로만 설명할 수 없음을 시사한다. 저자들은 포유류의 albumin이나 globulin 같은 다량 순환 단백질이 기능적으로 비슷한 역할을 할 가능성을 제안한다.","lim":"세포질 리보솜 단백질만 선택적으로 늘리는 실험 도구가 없어, 성체 초기의 리보솜 단백질 감소와 번역 감소가 수명 연장의 직접 원인인지는 입증하지 못했다. Lsp2 유래 아미노산이 어떻게 동원되는지는 밝혀지지 않았고, 재활용 아미노산이 특정 단백질에 우선 쓰인다는 recyclome 개념은 저자들의 추정이다. 포유류에는 Lsp2의 직접 상동체가 없다.","lab":"생체 pSILAC과 nanoLC-MS/MS 기반 정량 단백체로 단백질 전환을 추적한 설계는 연구실의 질량분석 기반 단백체 기법과 바로 겹친다. 지방체를 중심으로 영양 신호와 대사를 다루므로 지방 조직과 대사 질환 관심 분야와 연결된다. 아미노산 조성 분석과 전사체, 단백체, 번역체를 함께 읽는 다중 오믹스 접근도 참고할 수 있다.","lic":"초록 전문 번역. 출처 Kosakamoto H et al., Nature 658, 2026, DOI 10.1038/s41586-026-11031-3. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NAT_2026-10-08_t1-4_fig1.jpg","label":"Figure 1","cap":"유충기에만 효모를 줄이는 ePR 설계와 그에 따른 발생 지연, 체중과 산란수 감소, 두 성별의 수명 연장을 보여준다. 아미노산 보충이 수명 연장을 없애는 결과도 함께 제시한다."},{"src":"fig/NAT_2026-10-08_t1-4_fig2.jpg","label":"Figure 2","cap":"생체 pSILAC으로 유충 유래 단백질이 성체 초기 단백체에서 차지하는 비율과 리보솜 단백질의 높은 유충 유래 비중을 보여준다. ePR이 성체 초기 단백체에서 번역과 리보솜 관련 과정을 낮추는 결과도 포함한다."}]},{"j":"Nature","w":"2026-10-08","t":"T1","i":5,"ko":"단일세포 데이터에서 참조 서열 없이 빠르게 서열을 찾아낸다","en":"Ultrafast and reference-free sequence discovery in single-cell data","one":"공개 단일세포 및 공간 전사체 원시 서열을 k-mer로 색인한 Malva로, 약 6,100만 세포 규모 데이터에서 임의의 서열, 돌연변이, 스플라이스 접합, 병원체를 초 단위로 검색한다.","ab":"RNA의 서열, 발현, 스플라이싱, 아이소폼, 구조, 변형에 관한 지식은 세포 과정을 이해하고 표적으로 삼는 데 중심이 된다. Human Cell Atlas 같은 컨소시엄이 적용해 온 단일세포와 공간 전사체 기술은 이 다양성을 일부 포착하며, 해마다 페타바이트 규모로 늘어나는 세포 프로파일을 만들어 낸다. 그런데도 연구자들은 이런 데이터셋 전체에서 서열을 검색할 수 없다. 표준 파이프라인은 규모를 감당하지 못하거나 참조 서열에 의존하며 유전자 또는 아이소폼 카운트만 남기고, 원시 서열에 접근하려면 수백만 개의 큰 파일을 모으고 내려받아 처리해야 한다. 여기서 저자들은 원시 서열 공간을 초고속으로, 종에 구애받지 않고, 참조 서열 없이 조회할 수 있게 하는 계산 플랫폼 Malva를 제시한다. Malva로 임의의 서열, 돌연변이, 스플라이스 접합, 병원체를 검색하거나 임의 전사체의 공간 위치를 찾을 수 있다. 계속 확장되는 Malva Index는 현재 건강과 질병의 수천 개 실험에서 얻은 약 7,400만 개 세포로 구성된다. Malva는 참조 서열 없는 발견을 가능하게 해, 예를 들어 서열 조성만으로 세포형을 식별하고 세포 간 유사성을 예측할 수 있다. 저자들은 Malva의 속도와 정확도를 바탕으로 Malva를 최신 신경망과 유연하게 연결하는 방법과, 복잡한 검색을 실행해 자동 분석을 가능하게 하는 방법을 보여준다. Malva는 단일세포 아틀라스를 정적인 유전자 카운트 표에서 서열 수준으로 해상된 동적 자원으로 바꾸며, 생물학에 관한 사람과 기계의 추론을 잇는 데 도움이 될 수 있다.","tags":["단일세포 전사체","공간 전사체","생물정보","데이터 자원"],"doi":"10.1038/s41586-026-10975-w","url":"https://www.nature.com/articles/s41586-026-10975-w","au":"León-Periñán D, Karaiskos N, Rajewsky N","aff":"Laboratory for Systems Biology of Regulatory Elements, Berlin Institute for Medical Systems Biology (MDC-BIMSB), Max-Delbrück-Centrum for Molecular Medicine in the Helmholtz Association (MDC), Berlin, Germany (제1저자, 교신저자)","type":"Article","bg":"단일세포와 공간 전사체는 해마다 페타바이트 규모의 서열을 만들지만 CELLxGENE 같은 아틀라스는 참조 서열에 매핑된 유전자 카운트만 제공한다. 그래서 참조에 없는 전사체, RNA 편집, 돌연변이, 병원체 서열 같은 정보가 사라진다. 벌크 데이터용 k-mer 색인 도구들은 유용했지만 compacted de Bruijn graph를 만들고 라벨 수에 비례하는 주석을 메모리에 올려야 해서, 수천만에서 수억 세포 규모에서는 테라바이트 단위 RAM을 요구한다. 저자들은 단일세포 규모에서 원시 서열을 그대로 검색 가능하게 만드는 색인 구조를 만들 수 있는지 물었다.","ap":"Malva는 검색 알고리즘, 계속 확장되는 색인(Malva Index), 공개 API로 구성된다. 각 read를 k-mer로 쪼개어 유래 세포 바코드와 함께 저장해 정렬 없이 상수 시간 조회를 하고, 비중첩 k-mer 표본화로 de Bruijn graph 구축을 없애며, k-mer별 희소 역색인으로 질의 비용을 전체 색인 크기와 분리하고, 시료별 독립 색인과 증분 병합으로 디스크 기반 질의를 가능하게 했다. 성능은 20개 절편에 약 610억 read를 담은 Stereo-seq 생쥐 간 아틀라스와 약 1.5 TB 단일세포 데이터 모음에서 k-mer 색인 및 참조 매핑 도구와 비교했다. 정량 정확도는 여러 기술, 조직, 질병 상태 데이터셋에서 참조 카운트와의 상관으로 검증했다. 응용으로는 바이러스 유전체와 오염 서열 패널, 1000 Genomes Project의 흔한 germline SNP 296,985개, Tabula Muris의 아이소폼 사용, CDR1as 환형 RNA, 16개 암종 280개 종양 시료의 scTML 변이, 약 3,000만 세포의 cell-by-bucket 임베딩, 사람 종양 공간 전사체의 참조 없는 클러스터링과 de novo 조립을 시험했다.","kf":["Stereo-seq 생쥐 간 아틀라스 색인을 CPU 24시간에 끝냈고 다른 전처리 알고리즘보다 4배에서 25배 빨랐으며 최대 메모리는 8 GB였다. 메모리는 고유 세포 바코드 수에, 색인 크기는 세포당 시퀀싱 깊이에 비례했다.","질의 지연은 디스크 접근에만 의존했다. 단일 k-mer 70 ms, 1 kb 전사체 0.9초, 전사체 1,000개는 CPU 코어 1개로 약 1분이었다. pseudocount는 세포 수준과 유전자 수준 모두에서 참조 카운트와 강한 상관을 보였다.","Malva Index는 140 TB가 넘는 공개 데이터를 약 70시간의 실제 시간(약 9,700 CPU 시간)에 색인해 만들었다. 2025.04a 사람 색인은 592개 연구, 7,966개 시료의 약 5,100만 세포에서 고유 24-mer 1,000억 개 이상을 담고 생쥐 약 1,000만 세포를 더했다. 저장 공간은 원본의 10% 미만이었고 2025년 5월 기준 Human Cell Atlas의 약 80%를 덮었다.","서열 검색으로 PhiX 스파이크인은 대부분 데이터셋에서, Mycoplasma는 시료의 0.5-2%에서 주로 23S rRNA 좌위에서 검출되었다. 색인에 없는 SARS-CoV-2, C형 간염, 홍역, 서나일, 지카 바이러스는 검출되지 않았고, 건강으로 표기된 폐 시료의 SARS-CoV-2 양성 세포는 시험관 감염 실험 유래였다.","흔한 germline SNP 검색에서 집단 대립형질 빈도와 Malva 관찰 빈도가 강하게 상관했고 단일세포 수준 대립형질 빈도는 집단 빈도와 무관하게 약 50%였다. scTML의 16개 암종 280개 종양에서 재정렬이나 전용 변이 호출 없이 돌연변이 양성 세포를 높은 특이도와 민감도로 회수했다.","약 3,000만 세포에서 cell-by-bucket 주성분이 cell-by-gene 주성분과 비교 가능했으나 조직마다 일치도가 달라 서열 기반 임베딩이 직교 정보층임을 보였다. 사람 종양 공간 전사체에서 k-mer 특이 클러스터 KS1과 KS2가 각각 구강 점막 세균 23S rRNA와 사람 rRNA 서열로 설명되었고, de novo 조립 contig의 약 70%가 알려진 유전자에 매핑되었다."],"sig":"참조 서열에 매핑되지 않는 정보를 아틀라스 규모에서 되살려, 돌연변이, 스플라이스 접합, 바이러스 RNA, 합성 구조물 같은 서열 정의 질문을 공개 데이터에 바로 물을 수 있게 한다. 디스크 기반 희소 역색인으로 질의 비용을 색인 크기와 분리해, 수천만 세포 규모에서도 밀리초에서 분 단위 응답을 유지했다. 저자들은 신경망과 에이전트가 추론 중에 관측 서열을 조회해 예측을 다듬는 검색 계층으로도 쓸 수 있다고 제안한다.","lim":"저자들은 질의 길이가 최소 24 염기이고 정확 k-mer 일치를 쓰므로 오류율이 매우 높은 데이터에서는 민감도가 떨어진다고 적었다. Malva는 절대 분자 수가 아니라 k-mer 유래 pseudocount를 보고하므로 과제별 품질관리와 정량 검증이 뒤따라야 한다. 색인은 현재 공개된 데이터를 반영해 대부분 short-read이고 3′ 편향이며 공간 메타데이터가 불완전하다. 처리량을 유지하려고 바코드 오류 교정과 doublet 제거를 생략했고, 사람 전사체 서열 검색이 공여자 유전형 정보를 드러낼 수 있다.","lab":"단일세포와 공간 전사체 원시 데이터를 재분석 없이 서열 수준으로 조회할 수 있어, 연구실의 단일세포 및 공간 오믹스 과제에서 특정 변이나 융합 전사체, 아이소폼 존재 여부를 공개 데이터에서 즉시 확인하는 데 쓸 수 있다. 16개 암종 종양 단일세포 데이터에서 돌연변이 양성 세포를 회수한 결과는 암 코호트 분석에 직접 적용 가능하다. 저자들은 향후 색인에 단백체와 RNA 변형을 포함할 수 있다고 적었다.","lic":"초록 전문 번역. 출처 León-Periñán D et al., Nature 658, 2026, DOI 10.1038/s41586-026-10975-w. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NAT_2026-10-08_t1-5_fig1.jpg","label":"Figure 1","cap":"Malva 플랫폼의 구조와 사용 방식을 보여준다. 원시 read를 k-mer로 색인해 서열, 유전자, 자연어 질의로 단일세포 아틀라스를 즉시 검색하는 흐름을 나타낸다."},{"src":"fig/NAT_2026-10-08_t1-5_fig2.jpg","label":"Figure 2","cap":"Malva Index의 구축 과정과 규모를 보여준다. 공개 저장소에서 수집한 데이터의 저장 공간 절감, 포함된 조직과 연령, 질병 상태, 기술의 분포를 함께 제시한다."}]},{"j":"Nature","w":"2026-10-08","t":"T2","i":1,"ko":"고형암 안의 사람 T 세포를 대상으로 한 생체 전장유전체 CRISPR 스크린","en":"In vivo genome-wide CRISPR screens of human T cells in solid tumours","one":"","ab":"사람 T 세포의 대규모 CRISPR 스크린은 세포 치료를 개선할 유전 변형을 찾는 데 쓸 수 있으나, 고형암에서 T 세포 성능을 좌우하는 조절자는 시험관에서 드러나지 않는 경우가 많다. 생체 스크린은 더 생리적이지만 종양 내 T 세포 회수율이 낮아 제한되어 왔다. 저자들은 고형암에서 사람 T 세포를 효율적으로 회수하는 생체 모델을 만들어 적은 수의 생쥐로 전장유전체 CRISPR 녹아웃 스크린 두 건을 수행했다. 종양 침윤 T 세포는 비장 T 세포보다 기능이상 특징을 보였다. 양을 보는 스크린에서 P2RY8-Gα13 GPCR 축이 T 세포의 종양 침윤을 억제했고, 효과 기능 스크린에서 GNAS가 기능이상의 주요 요인이며 그 산물 Gαs가 여러 GPCR의 하류 수렴점이었다. GNAS 녹아웃은 T 세포를 여러 억제 신호에 저항하게 만들어 CAR와 TCR 체계 모두에서 고형암 모델의 효능을 높였고, P2RY8과 함께 녹아웃하면 종양 억제가 더 좋아졌다.","tags":["종양면역","CRISPR 스크린","세포치료"],"doi":"10.1038/s41586-026-10906-9","url":"https://www.nature.com/articles/s41586-026-10906-9","au":"Liu Q et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"Tier 1 점수(8점)였으나 전문을 구하지 못해 Tier 2로 내렸다. 사유: 구독 전용이라 초록 다음이 Access options뿐이고 본문 섹션이 없다. 출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":true,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":2,"ko":"Lsp2가 mTORC1을 TOP mRNA 번역과 Drosophila 수명에 잇는다","en":"Lsp2 links mTORC1 to TOP mRNA translation and lifespan in Drosophila","one":"","ab":"mTORC1은 영양 가용성을 감지해 생리 항상성과 노화에 중요한 대사 과정을 조율한다. mTORC1은 4E-BP를 통해 리보솜 단백질을 주로 암호화하는 5′ TOP 모티프 mRNA의 번역을 우선 조절하는데, 이 기능은 rapamycin에 저항한다. TOP mRNA는 매우 풍부해 큰 번역 부담을 주지만 그 번역이 어떻게 조절되고 수명과 연결되는지는 분명하지 않았다. 저자들은 저장단백질로 알려져 있던 Lsp2가 Drosophila에서 mTORC1의 지방 조직 효과자이자 되먹임 활성자로 작용해 수명을 조절함을 보인다. Lsp2 발현은 필수 아미노산이 mTORC1을 거쳐 유도하고 영양 충분 신호가 추가로 조절한다. Lsp2를 없애면 번식 같은 생활사 형질을 해치지 않으면서 수명이 늘어난다. 번역체 프로파일링에서 Lsp2 상실은 4E-BP 의존적으로 전역 TOP mRNA 번역을 선택적으로 줄여, rapamycin과 다른 기전으로 수명을 늘렸다.","tags":["노화","mTORC1","번역 조절","번역체"],"doi":"10.1038/s41586-026-11029-x","url":"https://www.nature.com/articles/s41586-026-11029-x","au":"Wang J et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":3,"ko":"아이슬란드 범유전체 참조 서열","en":"An Icelandic pangenome reference","one":"","ab":"참조 편향은 참조 유전체에 정렬한 short read를 분석하는 대부분의 유전체 연구에 영향을 주는 문제다. 범유전체에 담긴 여러 haplotype에 매핑하면 이를 완화할 수 있다. 저자들은 참조 편향을 다루는 두 가지 새 방법을 제시한다. 범유전체 구축을 위한 Emblask와 대규모 범유전체 매핑을 위한 Weaver다. Emblask는 부모-자식 trio 데이터를 쓰는 long read와 short read 혼합 haplotype 분리 dual assembly 파이프라인이다. Emblask로 아이슬란드 haplotype 698개를 조립해 Human Pangenome Reference Consortium(HPRC) 범유전체에 더해, 작은 변이 5,141만 개를 포함하는 아이슬란드 범유전체 참조 서열 HPRC-ICE를 만들었다. 아이슬란드인 57,630명의 short read를 Weaver로 HPRC-ICE에 매핑해 변이 9,896만 개를 호출했고, 이는 선형 참조 서열에 매핑했을 때보다 6.17% 늘어난 수치다. 매핑이 어려운 영역에서 새 변이를 찾았으며, 조기 발병 파킨슨병과 연관되는 GBA1의 병원성 단일염기다형성과 homocystinuria의 병원성 CBS missense 단일염기다형성이 여기에 포함된다. 저자들은 영국과 아일랜드 참가자 429,193명을 표적 재매핑해 UK Biobank에서 GBA1 연관을 재현했다.","tags":["유전체학","범유전체","변이 발굴","코호트"],"doi":"10.1038/s41586-026-10924-7","url":"https://www.nature.com/articles/s41586-026-10924-7","au":"Holley G et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Holley G et al., Nature 658, 2026, DOI 10.1038/s41586-026-10924-7. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":4,"ko":"파지 T7 kinase의 광범위 인산화가 세균 방어를 무력화한다","en":"Pervasive phosphorylation by phage T7 kinase disarms bacterial defences","one":"","ab":"세균과 박테리오파지는 각각 방어 체계와 반방어 체계를 만들며 끊임없이 경쟁한다. 지금까지 알려진 파지 암호화 반방어 체계는 표적이 되는 세균 방어 체계의 활성에 특이적이다. 여기서 저자들은 T7 박테리오파지가 단백질 인산화를 써서 세균 방어를 광범위하게 무력화하는 기전을 찾아낸다. 숙주 단백질 몇 개의 기능을 바꾼다고 보고되었던 T7의 kinase(T7K)는 사실 감염 동안 거의 모든 숙주와 파지 단백질을 인산화하는 초난잡 이중특이성 kinase다. 인산화 규모는 Escherichia coli에서 알려진 인산화 부위를 크게 넘고, 서열 모티프 특이성이 없으며, kinase 약 500개를 가진 포유류 세포보다 높은 단백체 전역 인산화 밀도를 만든다. 인산화 부위의 화학량론 분석은 T7K 활성이 C 말단 DNA 결합 도메인을 매개로 핵산 결합 기질로 강하게 치우쳐 있음을 보였다. 이 높은 화학량론 인산화는 DNA를 표적으로 하거나 DNA를 포함하는 세균 방어 체계를 비활성화한다. 저자들은 T7K가 특정 인산화 사건을 통해 DNA를 포함하는 Retron-Eco9를 약화시키는 기전을 제시하며, 독소의 핵심 부위에 단일 phosphomimetic 돌연변이를 넣으면 방어가 사라졌다. 또한 많은 E. coli 균주 집합을 선별해, 대응된 균주들이 다양한 세균 방어 체계를 가진다는 점에서 T7K의 광범위한 반방어 능력을 자연에서 확인했다. T7K 상동체는 거의 파지에만 있고, 초난잡 kinase 활성은 촉매 중심의 변형된 DFG 유사 모티프에서 비롯되는 것으로 보인다.","tags":["미생물학","인산화체","파지","세균 방어"],"doi":"10.1038/s41586-026-10934-5","url":"https://www.nature.com/articles/s41586-026-10934-5","au":"Bartolec T et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Bartolec T et al., Nature 658, 2026, DOI 10.1038/s41586-026-10934-5. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":5,"ko":"Gasdermin D를 통로로 caspase 억제제를 들여보내 pyroptosis를 억제한다","en":"Gasdermin D-mediated delivery of caspase inhibitors to suppress pyroptosis","one":"","ab":"caspase-1, -4, -5, -11은 gasdermin D(GSDMD) 공극을 활성화해 pyroptosis성 세포사와 IL-1β, IL-18 방출을 일으킨다. 이 경로를 막는 것은 염증성 질환 치료에 가능성이 있으나 세포 투과성 caspase 억제제는 임상시험에서 성공하지 못했다. 저자들은 건강한 세포에는 들어가지 못하면서도 pyroptosis와 IL-1β 분비를 선택적으로 막는 공유결합 caspase 억제제를 보고한다. 이 억제제는 caspase 의존 apoptosis는 막지 못해, GSDMD 공극이 유입을 매개했음을 보였다. 구출된 세포에 막 비투과성 염료가 들어간 결과는 공극에 의한 일시적 막 투과화와 일치한다. caspase 억제는 세포사를 늦추는 것이 아니라 막았고, 이는 막 수선이 초기 공극을 중화한다는 설명과 맞는다. caspase-1과 caspase-11 억제는 내독소 쇼크 생쥐 모델에서 IL-1β와 IL-18 생성을 억제했다.","tags":["면역학","세포사멸","염증","약물 전달"],"doi":"10.1038/s41586-026-10957-y","url":"https://www.nature.com/articles/s41586-026-10957-y","au":"Groborz KM et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":6,"ko":"유전암호의 자동 시제작","en":"Automated prototyping of genetic codes","one":"","ab":"표준 유전암호는 코돈 64개로 표준 아미노산 20종을 암호화한다. 자연에 없던 유전암호는 새 화학과 치료제를 가능하게 하지만 유전체 재부호화는 매우 어렵다. 저자들은 무세포 번역계에서 유전암호를 다중 로봇 시제작하는 automated genetic tRNA expansion(AGENTEX)을 제시한다. 리보솜 대형 소단위(LSU)의 Watson-Crick 상호작용 두 개가 tRNA의 3′ CCA 말단 인식을 매개해, 3′ 서열이 다른 tRNA는 번역 중 수용되지 못한다. 저자들은 합성 tRNA 라이브러리에서 비CCA-3′ tRNA(otRNA)의 아미노아실화를 다중 자동 측정으로 읽었고, tRNA 3′ 말단이 돌연변이에 유연해 대부분의 otRNA가 모든 E. coli aminoacyl tRNA synthetase(aaRS)에 의해 아미노아실화됨을 발견했다. 이를 바탕으로 코돈 34개에 aaRS 34종을 쓰는 압축 유전암호를 구현했고, 비표준 아미노산 도입과 최대 코돈 3개의 재지정을 보였다.","tags":["합성생물학","번역","tRNA 공학"],"doi":"10.1038/s41586-026-10949-y","url":"https://www.nature.com/articles/s41586-026-10949-y","au":"Radford F et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":7,"ko":"원숭이수두 바이러스 replisome의 구조와 작동 원리","en":"Structure and operating principles of a monkeypox virus replisome","one":"","ab":"poxvirus는 큰 유전체를 가진 이중가닥 DNA 바이러스다. 그중 원숭이수두 바이러스(MPXV)는 세계보건기구가 선포한 최근 두 차례 공중보건 비상사태의 원인이었다. MPXV 폴리머라아제는 촉매 소단위(F8)와 이형이중체 처리능 인자(A22, E4)로 이루어진 세 소단위 복합체다. 바이러스 폴리머라아제는 유전체 복제를 시작하려면 육합체 helicase-primase(E5)와 활동을 맞춰야 한다. MPXV E5와 폴리머라아제 단독 구조는 보고되어 있으나 이들이 어떻게 기능하는 replisome으로 조립되는지는 분명하지 않았다. 단독 상태의 E5는 자가억제 구조를 취하고 helicase 활성이 매우 약하며 활성화 기전도 분명하지 않았다. 저자들은 저온전자현미경으로 폴리머라아제 holoenzyme(F8, A22, E4)과 E5 helicase 육합체로 이루어진 DNA 결합 MPXV replisome의 구조를 결정했다. replisome 조립 과정에서 E5가 큰 구조 변화를 거쳐 primase 도메인 두 개가 폴리머라아제 F8의 thumb과 A22 소단위와 상호작용하게 된다. 생화학 측정과 단분자 실험에서 이 E5 구조 변화가 helicase 활성화와 결합되어 있고 primase 활성을 높였다. 저자들은 이 결과가 중요한 바이러스 병원체 집단의 DNA 복제에서 helicase와 폴리머라아제 활동이 어떻게 조율되는지를 보여주는 기본 기전이라고 본다.","tags":["구조생물학","바이러스학","DNA 복제"],"doi":"10.1038/s41586-026-10937-2","url":"https://www.nature.com/articles/s41586-026-10937-2","au":"Yu Z et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Yu Z et al., Nature 658, 2026, DOI 10.1038/s41586-026-10937-2. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":8,"ko":"편향 알로스테릭 조절제가 β2AR 이중체화의 분자 접착제로 작용한다","en":"A biased allosteric modulator is a molecular glue for β2AR dimerization","one":"","ab":"A족 G 단백질 결합 수용체(GPCR)는 보통 단량체로 설명되지만 신호 특성이 다른 이중체를 만들 수 있다는 증거가 늘고 있다. 그 이중체화의 기전과 치료 가능성은 잘 알려져 있지 않다. 저자들은 β2 아드레날린 수용체(β2AR)의 β-arrestin 편향 음성 알로스테릭 조절제를 최적화한 유도체 AP-7-168이 β2AR 동종이중체화를 안정화하는 분자 접착제로 작용함을 보인다. 이 화합물은 세포와 조직 모델에서 기관지 이완을 지속시킨다. 저온전자현미경 구조에서 AP-7-168 두 분자가 두 protomer의 막관통 helix 3, 4, 5가 만드는 주머니에 들어가 β-arrestin 결합을 선택적으로 막는 이중체 구조를 안정화했다. 세포에서 AP-7-168은 이중체화를 안정화하고 더 큰 nanocluster 형성을 유도했다. 저자들은 리간드로 안정화한 이중체화를 GPCR 조절 전략으로 제안한다.","tags":["구조생물학","GPCR","약리학"],"doi":"10.1038/s41586-026-10892-y","url":"https://www.nature.com/articles/s41586-026-10892-y","au":"Shen J et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":9,"ko":"CO2 농도 증가가 C4 초본의 생산을 늘린다","en":"Increasing CO2 levels fertilize C4 grass production","one":"","ab":"대기 CO2 농도 상승은 간접적 기후 효과와 식물 성능에 대한 직접 효과를 통해 전 지구 육상 생물권에 영향을 준다. 열대 산림에서는 장기 모니터링이 CO2가 이끄는 상당한 탄소 흡수원을 보여준다. C4 초본이 우세한 열대와 아열대 사바나는 육상 순일차생산의 약 30%를 담당하는데도 CO2 반응에 대한 동등한 장기 분석이 없었다. 여기서 저자들은 CO2 추가 실험 70건의 메타분석과 남부 아프리카에서 32년간 수행한 현장 관측에서 일관된 결과를 보인다. 야생 C4 초본의 CO2 비옥화는 건조 조건에서 널리 나타난다. 실험에서 초본은 CO2가 높을 때 기공 전도도를 줄여 수분 손실을 제한하면서 탄소 획득을 늘렸다. 현장에서는 개선된 수분 이용 효율이 30년 관측에 걸친 C4 초본 생물량 생산 증가로 이어졌다. 끝으로 Community Land Model 시뮬레이션은 C4 초본 지상부 생산성의 CO2 비옥화가 미래 조건에서 계속 커질 수 있음을 시사한다. 이 결과들은 C4 초본이 CO2 증가에 반응하지 않는다는 견해에 반하며, 남부 아프리카 현장 초본의 연간 지상부 생산이 30년 동안 28% 늘었음을 보인다. 이는 CO2가 이끈 75.1 g m 증가(95% 신뢰구간 74.5-75.8 g m) 또는 연간 생산 0.37 tons C ha에 해당한다. 이 탄소의 행방은 불과 초식, 목본 식생과의 되먹임에 따라 불확실하지만 전 지구 탄소순환에 미치는 영향은 클 수 있다.","tags":["식물생물학","생태학","탄소순환"],"doi":"10.1038/s41586-026-10935-4","url":"https://www.nature.com/articles/s41586-026-10935-4","au":"Simpson KJ et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Simpson KJ et al., Nature 658, 2026, DOI 10.1038/s41586-026-10935-4. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"T2","i":10,"ko":"신피질의 장거리 억제가 피질 동기화와 수면을 촉진한다","en":"Neocortical long-range inhibition promotes cortical synchrony and sleep","one":"","ab":"수면과 각성은 서로 다른 피질 리듬 활동 양상과 연결된다. 서파수면 같은 저각성 상태에서는 동기화된 저주파 리듬이 넓은 피질 영역의 활동을 지배한다. 억제성 신경세포가 피질 상태의 주요 조절자로 인식되고 있지만, 생체에서 국소와 원거리 신피질 네트워크에 걸쳐 동기화된 활동을 조율하는 회로 기전은 잘 알려져 있지 않았다. 여기서 저자들은 생쥐에서 somatostatin(Sst)과 chondrolectin(Chodl)을 함께 발현하는 세포가 저각성 상태에서 선택적으로 활동하고 높은 각성 시기에는 대부분 침묵한다는 것을 보인다. 이 세포는 드물고 유전적으로 구분되는 신피질 GABA성 억제 신경세포 집단이다. 대부분의 신피질 억제 신경세포와 달리 Sst-Chodl 세포는 매우 드문데도 여러 영역을 동시에 표적하는 장거리 축삭을 통해 신피질 전반에 폭넓은 영향을 준다. Sst-Chodl 세포를 선택적으로 활성화하면 저각성 상태의 특징인 다영역 피질 동기화가 일어나고 수면이 유도된다. 저자들은 이 결과가 장거리 Sst-Chodl 억제 신경세포가 행동 상태를 따라가기만 하는 것이 아니라 동기화된 피질 활동과 수면 행동을 능동적으로 촉진함을 보여주며, 확립된 피질하 기전과 함께 피질 회로가 수면 조절에서 핵심 역할을 한다는 점을 드러낸다고 적었다.","tags":["신경과학","수면","억제성 회로"],"doi":"10.1038/s41586-026-10876-y","url":"https://www.nature.com/articles/s41586-026-10876-y","au":"Ratliff JM et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Ratliff JM et al., Nature 658, 2026, DOI 10.1038/s41586-026-10876-y. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":1,"ko":"","en":"Observation of relativistic bond weakening in seaborgium hexacarbonyl","one":"","ab":"","tags":["초중원소 화학, 물리화학"],"doi":"10.1038/s41586-026-11105-2","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":2,"ko":"","en":"A chiral superlattice route to spin-split topological antiferromagnetism","one":"","ab":"","tags":["응집물질물리, 자성 재료"],"doi":"10.1038/s41586-026-11073-7","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":3,"ko":"","en":"Self-aligned optical microcomb emerging between octave-separated lasers","one":"","ab":"","tags":["광학, 광자공학"],"doi":"10.1038/s41586-026-11086-2","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":4,"ko":"","en":"Observation of critical topological phase transition","one":"","ab":"","tags":["응집물질물리, 위상물성"],"doi":"10.1038/s41586-026-11067-5","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":5,"ko":"","en":"Experimental observation of critical topology","one":"","ab":"","tags":["응집물질물리, 위상물성"],"doi":"10.1038/s41586-026-11099-x","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":6,"ko":"","en":"A quadruped robot designed to complete a marathon on a single battery charge","one":"","ab":"","tags":["로봇공학, 기계공학"],"doi":"10.1038/s41586-026-11102-5","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":7,"ko":"","en":"Wafer-scale epitaxy growth of high-mobility p-type boron carbon nitride","one":"","ab":"","tags":["재료과학, 반도체 소자"],"doi":"10.1038/s41586-026-11047-9","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":8,"ko":"","en":"Organic two-dimensional van der Waals heterostructures","one":"","ab":"","tags":["재료과학, 2차원 물질"],"doi":"10.1038/s41586-026-11074-6","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":9,"ko":"","en":"Spatially deterministic nucleation of 2D semiconductors by etching flux","one":"","ab":"","tags":["재료과학, 반도체 소자"],"doi":"10.1038/s41586-026-11095-1","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature","w":"2026-10-08","t":"EX","i":10,"ko":"","en":"Carbene transfer from thianthrenium ylides for cyclopropanation","one":"","ab":"","tags":["합성 유기화학"],"doi":"10.1038/s41586-026-11108-z","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Nature Cancer","w":"2026-10-08","t":"T2","i":1,"ko":"장 상피의 GSK3β가 fumarate에 의존하는 호중구 재편을 조절해 대장암을 촉진한다","en":"Intestinal epithelial GSK3β governs fumarate-dependent neutrophil reprogramming to promote colorectal cancer","one":"","ab":"종양 침윤 호중구(TIN)가 대장암 진행과 치료 저항을 돕는다는 것은 알려졌지만 재편 기전은 분명하지 않았다. 저자들은 생쥐 모델과 다중 오믹스 프로파일링으로 장 상피의 glycogen synthase kinase-3-β(GSK3β)가 fumarate를 매개로 TIN 극성화를 조절하는 대사-후성유전 축을 제시한다. 핵 안의 GSK3β가 링커 히스톤 H1FX를 인산화하면 USP43이 떨어져 H1FX가 프로테아좀으로 분해되고, 염색질이 열려 당분해 유전자 전사가 늘어난다. 이어 lactate가 lactylation으로 fumarate hydratase를 불활성화해 종양 안에 fumarate가 쌓이고, fumarate는 호중구의 KDM2B를 억제해 히스톤 H3 lysine 36 이중메틸화를 올린다. 그 결과 FTH1과 PD-L1을 발현하며 ferroptosis에 저항하고 면역을 회피하는 T3 호중구가 만들어진다. GSK3β 억제제 tideglusib은 T3 극성화를 줄이고 전임상 대장암 모델에서 면역관문차단 효과를 높였다. 저자들은 이를 근거로 병용 면역치료를 제안한다.","tags":["대장암","종양 면역","암 대사","후성유전 재편"],"doi":"10.1038/s43018-026-01253-9","url":"https://www.nature.com/articles/s43018-026-01253-9","au":"He XS et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"Tier 1 점수(10점)였으나 전문을 구하지 못해 Tier 2로 내렸다. 사유: nature.com PDF가 랜딩 페이지로만 가고 기관 구독에 포함되지 않으며 PMC에도 없다. 출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":true,"figs":[]},{"j":"Nature Genetics","w":"2026-10-08","t":"T1","i":1,"ko":"단일 대립유전자 나노 규모 지도로 조절 변이의 기능을 읽는다","en":"Single-allele nanoscale mapping of regulatory variants","one":"Micro Capture-C를 염기 하나 해상도로 끌어올린 MCCv 플랫폼으로 CD4+ T 세포의 면역매개 염증질환 연관 조절요소 405곳을 조사해, 신규 CTCF 모티프가 super-enhancer와 SESN3 프로모터의 접촉을 막아 자가면역 위험을 높이는 기전을 찾았다.","ab":"수백만 개 유전 변이가 사람 질병과 연관돼 있지만 대부분은 인과적이지 않고 비코딩 유전체 안에 있어 기전을 찾기 어렵다. 저자들은 단일 대립유전자 염색질 구조 분석에 기반한 Micro Capture-C 변이-기능 플랫폼(MCCv)을 개발했다. 이 방법은 나노 규모 염색질 구조의 변화를 찾아내고 cis 조절요소의 변이를 표적 유전자와 연결할 수 있다. 또한 MCCv는 좌위 안의 다른 이형접합 변이를 위상 결정해 조절 변이를 대립유전자 불균형 발현과 연결하고, 유전체 편집 이후 변이가 염색질 상호작용에 미치는 영향을 직접 읽어 낼 수 있다. 이 접근으로 저자들은 CD4+ T 세포에서 면역매개 염증질환과 연관된 cis 조절요소 405곳을 조사했다. 그 결과 신규 CTCF 모티프를 만들어 super-enhancer와 SESN3 프로모터의 접촉을 막아 자가면역 위험을 높이는, 지금까지 기술되지 않은 기능획득 기전을 밝혔다. 저자들은 SESN3가 tryptophan을 감지해 mammalian target of rapamycin을 조절한다는 것을 보이고 생쥐 모델로 자가면역에서의 역할을 입증했다.","tags":["조절 변이","염색질 구조","자가면역","기능유전체"],"doi":"10.1038/s41588-026-02776-8","url":"https://www.nature.com/articles/s41588-026-02776-8","au":"Hamley JC, Zhang W, …, Milne TA, Hughes JR, Davies JOJ","aff":"MRC Molecular Haematology Unit, MRC Weatherall Institute of Molecular Medicine, Radcliffe Department of Medicine, University of Oxford, Oxford, UK; NIHR Blood and Transplant Research Unit in Precision Cellular Therapeutics, Oxford, UK","type":"Article","bg":"GWAS로 찾은 질병 연관 변이의 90% 이상이 비코딩 영역에 있고 전체 염기의 95% 이상이 비코딩인데 이를 해석할 방법이 부족하다. cis 조절요소는 100만 염기 넘게 떨어져 있거나 다른 유전자의 인트론 안에 있을 수 있어 선형 서열만으로는 표적 유전자를 알 수 없다. 기존 3C 계열 방법은 제한효소 절단 부위에서만 데이터가 나와 해상도가 500 염기쌍 아래로 내려가지 못하고, 변이 대립유전자의 기능을 직접 보기에는 민감도가 모자랐다. 저자들은 변이 자체를 시점으로 삼아 단일 대립유전자 수준에서 국소 염색질 구조와 장거리 접촉을 함께 읽는 방법을 만들려 했다.","ap":"MNase를 쓰는 Micro Capture-C에서 보통 버리는 800 염기쌍 이하 초단거리 연결을 모아 염기 하나 단위의 접촉 행렬을 만들었다. 먼저 Jurkat 세포에서 ATAC-seq와 H3K27ac ChIP-seq로 고른 기능획득 후보 이형접합 변이 42개로 성능을 확인했고 읽기의 86.7%가 대립유전자 분석에 쓰였다. 다음으로 400건의 연구에서 독립 하플로타입 3,104개를 대체 추정하고 분자 기전을 배정해, 활성화된 1차 CD4+ T 세포에서 조절요소 405곳을 포획했다. 비교를 위해 전장 유전체 Micro-C를 함께 수행하고 MCC 전용 피크 호출 알고리즘 LotronMCC와 염기 단위 행렬 비교용 일반화 선형 모형 basepairC를 개발했다. 마지막으로 1차 CD4+ T 세포에서 cytosine base editor BE4max로 CTCF 모티프를 편집하고, Sesn3 녹아웃 조혈모세포를 이식한 EAE 생쥐 모델과 내재 태깅 SESN3 세포주의 공침강 실험으로 기능을 검증했다.","kf":["가장 강한 enhancer와 promoter 접촉 하나를 지지하는 연결 수가 MCC에서 평균 839개였고 같은 세포의 Micro-C에서는 평균 2.5개였다. 신호 대 잡음비는 MCCv가 5배 높았다.","조절요소 405곳에서 공여자 3명의 이형접합 241곳을 위상 결정했고, 질병 연관 이형접합 변이의 54.6%가 적어도 하나의 접촉에서 유의한 변화를 보였다. 염기 단위 나노 구조에서는 47.6%가 유의했다(효과크기 절댓값 0.2 이상, 보정 p 0.01 이하).","접촉 빈도로 순위를 매겨 인과 후보 유전자 251개를 지명했고 그중 60.5%가 가장 가까운 유전자였다. 지명 유전자는 면역 경로에 모였고 희귀 원발성 면역결핍 유전자와 약물 표적에 농축됐으며 56%는 OpenTargets L2G에서도 우선순위에 올랐다.","MCCv 접촉이 달라진 변이에 연결된 유전자는 대립유전자 발현 불균형을 보일 확률이 유전체 전체 배경보다 약 3배 높았다(45쌍 중 16쌍, 35.5%). 장거리 접촉 변화의 방향까지 고려하면 1차 지명 유전자의 88.2%에서 방향이 일치했다.","다발성 경화증과 류마티스 관절염을 포함한 여러 자가면역질환과 연관된 rs4409785는 신규 CTCF 모티프를 만들었다. 위험 대립유전자에서만 CTCF 모티프 위에 20 염기쌍 발자국이 생겼고 CTCF 결합과 열린 염색질이 늘었다. BE4max로 모티프의 염기 3개를 바꾸자 하류 수렴 CTCF 부위와의 강한 접촉과 나노 구조가 참조 대립유전자 수준으로 되돌아갔다.","이 신규 CTCF 부위는 T 세포 특이 super-enhancer와 SESN3 프로모터의 접촉을 줄였고 위험 대립유전자에서 SESN3 전사체가 36.6% 감소했다. Sesn3 녹아웃 조혈모세포를 이식한 생쥐는 EAE 발병이 빨라졌다(12일 q=0.0024, 13일 q=0.0089, 14일 q=0.0024, 조건당 6마리). 기아 조건에서 SESN3는 GATOR2와 더 강하게 결합했고 이 결합은 tryptophan을 넣으면 줄었다."],"sig":"비코딩 변이를 표적 유전자와 연결하는 작업을 염기 하나 해상도에서 대립유전자별로 할 수 있게 됐다. 접촉이 없다는 사실이 직접 조절을 강하게 배제하므로 후보 인과 유전자 목록을 크게 줄일 수 있다. SESN3는 자가면역에 기여하는 인자로 새로 지목됐고 tryptophan 농도에 따라 mTOR 신호를 조절하는 경로가 제시됐다.","lim":"enhancer와 promoter의 접촉이 늘 전사 변화로 이어지지는 않으므로 지명된 유전자는 변이 수준이나 유전자 수준에서 따로 검증해야 한다. 대립유전자 발현 불균형 검출은 인트론이 풍부한 RNA 데이터의 민감도에 제한되며 공여자 수가 3명에 그친다. 분석은 활성화된 CD4+ T 세포와 조절요소 405곳으로 한정되어 다른 세포 종류와 다른 좌위로 넓히려면 추가 실험이 필요하다.","lab":"단일 대립유전자 염색질 구조는 연구실 핵심 오믹스는 아니지만 다중 오믹스 통합과 변이 해석 전략에 바로 쓸 수 있는 설계다. SESN3가 tryptophan을 감지해 mTORC1 신호를 조절한다는 결과는 세포 대사와 면역을 잇는 지점이라 관심 분야와 맞닿는다. 유전체 편집 뒤의 접촉 변화를 같은 플랫폼으로 읽는 방식은 변이 기능 확인 실험을 설계할 때 참고가 된다.","lic":"초록 전문 번역. 출처 Hamley JC et al., Nature Genetics 58, 2026, DOI 10.1038/s41588-026-02776-8. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NGE_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"MCCv 플랫폼의 구성이다. 변이 위에 포획 탐침을 설계해 800 염기쌍 이하 초단거리 연결로 나노 구조를, 1 kb에서 1 Mb 연결로 좌위 구조를 읽는 방식과 기능획득 변이 41개의 대립유전자별 접촉 열지도를 보여 준다."},{"src":"fig/NGE_2026-10-08_t1-1_fig6.jpg","label":"Figure 6","cap":"신규 CTCF 부위가 super-enhancer와 프로모터의 접촉을 막아 SESN3 발현을 줄이는 과정이다. 11q21 좌위의 Micro-C와 ATAC-seq, CTCF ChIP-seq, 위상 결정된 접촉과 발현 비교, 작동 모형을 함께 보여 준다."}]},{"j":"Nature Genetics","w":"2026-10-08","t":"T1","i":2,"ko":"유동성 지능 점수를 대체 추정하면 선택 편향이 줄고 흔한 변이와 희귀 변이 분석의 검정력이 커진다","en":"Imputation of fluid intelligence scores reduces ascertainment bias and increases power for analyses of common and rare variants","one":"UK Biobank의 여러 유동성 지능 검사를 통합하고 미측정자의 점수를 대체 추정해 표본을 약 27만 명에서 45만 명 이상으로 늘렸고, 독립 연관 SNP를 390개에서 550개로, 희귀 변이 유의 유전자를 5개에서 26개로 늘렸다.","ab":"지능의 유전학을 연구하면 인지 기능의 신경생물학과 희귀 신경발달질환을 이해하는 데 도움이 된다. 저자들은 UK Biobank의 서로 다른 측정값에 걸친 유동성 지능(FI) 검사를 통합하고 측정되지 않은 사람의 FI를 대체 추정해 표본 크기를 약 270,000명에서 455,000명 이상으로 늘렸다. 광범위한 검증을 통해 대체 추정된 표현형이 측정된 FI와 유전적으로 닮았음을 보였으나 비인지 신호가 일부 남아 있을 가능성도 함께 밝힌다. 측정값과 대체 추정값을 합치면 독립적으로 유의한 흔한 SNP 연관의 수가 390개에서 550개로 늘고, FI 검사 참여자가 평균적으로 교육 수준이 높아 생기는 선택 편향이 줄어든다. 희귀 변이 분석에서는 유의하게 연관된 유전자 26개를 찾았고(위발견율 1% 미만), 그중 8개는 지능이나 신경발달질환과의 관련성에 대한 강한 선행 근거가 없었으며 외부 코호트에서 합산 수준으로 재현됐다. 이 결과는 대체 추정된 지능이 유전적 발견의 검정력을 높일 수 있고 신경발달질환 연관 유전자를 새로 찾는 데 쓸 수 있음을 보여 준다.","tags":["인간유전학","GWAS","희귀 변이","신경발달"],"doi":"10.1038/s41588-026-02787-5","url":"https://www.nature.com/articles/s41588-026-02787-5","au":"van den Berg DM, Malawsky DS, …, Hurles ME, Abdellaoui A, Martin HC","aff":"Department of Psychiatry, Amsterdam UMC, University of Amsterdam, Amsterdam, the Netherlands; Wellcome Sanger Institute, Wellcome Genome Campus, Hinxton, UK","type":"Article","bg":"지능 측정값은 교육 성취, 직업적 성취, 소득, 정신 및 신체 건강과 연관되고 희귀 신경발달질환과는 음의 유전 상관을 보인다. UK Biobank의 유동성 지능 검사는 참가자의 약 62%가 한 번 이상 받았지만 기존 연구는 그중 일부만 분석했다. 검사를 받은 사람은 교육 수준이 높고 사회경제적 박탈이 적은 쪽으로 쏠려 있어 유전 연관 추정이 왜곡될 수 있다. 저자들은 여러 시점의 검사를 통합하고 미측정자의 점수를 대체 추정하면 이 편향을 줄이면서 검정력을 올릴 수 있는지 물었다.","ap":"다섯 시점의 FI 점수를 나이와 성별로 보정한 뒤 평균을 쓰는 방식과 가장 이른 값을 쓰는 방식으로 통합했다. 지능과 표현형 상관이 있는 변수 154개에서 출발해 유전 상관 프로파일이 지능에 더 가까운 82개로 줄여 대체 추정 모형을 만들었다. REGENIE로 집단 기반 GWAS를, SNIPAR로 가족 내 GWAS를 수행해 SNP 유전율, 외부 형질과의 유전 상관, 직접 효과와 비전달 계수의 상관을 기준으로 전략을 평가했다. 선택한 전략으로 측정값과 대체 추정값을 한 분석에 합쳐(combined FIS, n=455,402) GWAS를 돌리고 COGENT와 메타분석했다(n=490,700). 희귀 변이 분석은 REGENIE의 burden 검정과 SKAT-O로 소수 대립유전자 빈도 0.001% 미만의 단백질 절단 변이와 유해 미스센스 변이를 대상으로 했다(n=438,285). 검증은 ALSPAC, Millennium Cohort Study, INTERVAL 코호트에서 했다.","kf":["검사 통합만으로 표본이 146,467명에서 283,418명으로 늘고 독립 선도 SNP가 92개에서 390개로 늘었다. 가족 내 GWAS의 삼인조는 4,749쌍에서 9,939쌍이 됐다.","직접 효과와 비전달 계수의 상관은 첫 방문 검사만 쓸 때 -0.54였고 통합 후 -0.28에서 -0.32로, 대체 추정을 합친 뒤에는 0과 유의하게 다르지 않은 값으로 줄었다. 선택 편향이 완화됐다는 뜻이다.","대체 추정값은 측정값과 유전 상관 0.74, COGENT와 0.85를 보였고 표현형 정확도는 r=0.46으로 검사 재검사 상관 0.6보다 낮았다. combined FIS의 LDSC SNP 유전율은 0.16으로 측정값의 0.20보다 조금 낮았다.","combined FIS에서 선도 SNP는 550개였고 COGENT를 더한 메타분석에서는 620개였다. 표본이 커질수록 유전자 우선순위 지정, 뇌 조직 농축, 외부 코호트에서의 다유전자 지표 예측력이 함께 올라갔다.","유전자 단위 희귀 변이 검정에서 위발견율 1% 미만 유전자가 측정값만 쓸 때 5개에서 combined FIS에서 26개로 늘었고 모두 FI에 음의 효과를 보였다. 26개 중 14개(54%)는 DDG2P에 등록된 발달장애 유전자로 4.18배 농축됐다(Fisher 정확검정 p=8×10^-8).","DDG2P에 없는 12개 유전자에서는 신경발달질환 환자 코호트의 유해 de novo 절단 변이가 기대보다 2.59배 많았다(단측 Poisson 검정 p=6.8×10^-4). 새로 찾은 유전자의 절단 변이는 ALSPAC(n=5,283)과 Millennium Cohort Study(n=5,621)에서 측정된 인지 능력과 합산 수준에서 음의 연관을 보였다."],"sig":"바이오뱅크에서 측정되지 않은 표현형을 대체 추정해 검정력을 올리는 전략이 흔한 변이와 희귀 변이 분석에 모두 작동함을 보였다. 지능에 중간 정도 효과를 주는 희귀 변이가 생각보다 널리 퍼져 있고 진단 기준을 넘지 않는 사람에서도 영향이 나타난다. 저자들은 대체 추정 표현형이 쓸 만한지 판단하는 형식적 기준도 함께 제시한다.","lim":"대체 추정은 인지와 사회환경 요인에 모두 연관된 변수를 쓰기 때문에 결과 표현형에 비인지 신호가 섞인다. 알려진 발달장애 유전자와 FI의 연관이 신경발달질환 진단자에 의해 끌려간 것인지 배제할 수 없고 건강 기록의 진단 확인도 불완전하다. 개별 유전자 수준의 재현은 검정력이 충분한 코호트가 없어 시도하지 못했고 분석은 유럽계 조상 집단에 한정된다. 저자들은 대체 추정값을 직접 측정의 대체물로 취급해서는 안 된다고 적었다.","lab":"직접 연결은 약하다.","lic":"초록 전문 번역. 출처 van den Berg DM et al., Nature Genetics, 2026, DOI 10.1038/s41588-026-02787-5. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/NGE_2026-10-08_t1-2_fig1.jpg","label":"Figure 1","cap":"자료 통합과 대체 추정 방식을 비교한 결과다. 방식별 표본 크기, 집단 및 가족 내 유전율, 외부 형질과의 유전 상관, 선도 SNP 수, 직접 효과와 비전달 계수의 상관을 나란히 보여 준다."},{"src":"fig/NGE_2026-10-08_t1-2_fig3.jpg","label":"Figure 3","cap":"유전자 단위 희귀 변이 검정 결과다. 측정값과 combined FIS의 유의도 비교, 효과 크기의 일치, 교육 성취 분석과의 중복, 출생 코호트에서 절단 변이 부담과 인지 능력의 연관을 보여 준다."}]},{"j":"Nature Genetics","w":"2026-10-08","t":"T2","i":1,"ko":"복합 형질에서 희귀 코딩 변이의 기능을 유전율 기준으로 우선순위화하는 방법","en":"A heritability-optimized method for functional prioritization of rare coding variants in complex traits","one":"","ab":"희귀 미스센스 변이 가운데 어떤 것이 형질 분산에 기여하는지 가리는 문제를 다룬다. 저자들은 유전율을 기준으로 최적화한 예측 도구 RovHer를 만들었다. 희귀 변이 4,927,334개의 엑솜 전체 연관 통계에 변이와 유전자 수준 특성 75개를 다변량 적응 회귀 스플라인으로 사전 제약 없이 통합하는 방식이다. UK Biobank 유럽계 최대 357,086명의 21개 형질에서 상위 1%로 지목된 미스센스 희귀 변이 13,410개가 전체 희귀 변이 유전율의 평균 16.1%를 설명했다. 기존 7개 방법의 평균은 1.5%(범위 1.2~2.3%)여서 약 10배 차이다. 점수는 대립유전자 빈도와 무관하게 작동했고 다인종 복제 집단에서도 유지됐으며, 단일유전자 형질 쌍 17개에서 중증 임상 결과의 고위험 보유자를 가려냈다. 저자들은 미스센스 희귀 변이가 집단 위험 층화에 쓸 만하다고 본다.","tags":["희귀 변이","유전율","집단유전학","예측 모형"],"doi":"10.1038/s41588-026-02766-w","url":"https://www.nature.com/articles/s41588-026-02766-w","au":"Pang K et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"Tier 1 점수(5점)였으나 전문을 구하지 못해 Tier 2로 내렸다. 사유: nature.com이 Access options만 주고 PDF 주소도 유료 안내 HTML을 돌려주며 PMC에도 없다. 출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":true,"figs":[]},{"j":"Nature Genetics","w":"2026-10-08","t":"T2","i":2,"ko":"배아기 ζ-globin 유전자를 되살리면 중증 알파 탈라세미아가 완화된다","en":"Reactivation of the embryonic ζ-globin gene ameliorates severe forms of α-thalassemia","one":"","ab":"혈색소병증은 세계에서 가장 흔한 유전성 빈혈이다. 보유자 대부분은 증상이 없거나 경미하지만, 중증 hemoglobin H(HbH) 병과 Hb Bart's 태아수종 증후군(BHFS) 생존자를 포함한 중증 알파 탈라세미아는 평생 수혈이나 줄기세포 이식이 필요하다. 침묵한 배아기 알파 유사 globin 유전자(ζ-globin)를 다시 활성화하는 것은 이들 질환 치료의 유망한 접근이다. 저자들은 확정적 적혈구에서 ζ-globin 유전자를 침묵시키는 핵심 cis 조절요소를 찾아내고, 이어 ζ-globin 발현을 치료에 쓸 만한 수준으로 되살리는 유전자 교정 전략을 개발했다. BHFS 전임상 생쥐 모델에서 이 전략은 본래 태아기에 치명적인 상태를 발달 후기(E17.5)까지 구제했다. HbH 병과 BHFS 환자에서 유래한 1차 적혈구를 쓴 실험에서는 생쥐 모델에서 달성한 수준을 넘는 ζ-globin 발현이 회복되어 치료 수준의 알파 유사 globin이 만들어졌다.","tags":["혈색소병증","유전자 교정","적혈구","유전자 조절"],"doi":"10.1038/s41588-026-02770-0","url":"https://www.nature.com/articles/s41588-026-02770-0","au":"Liu S et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Liu S et al., Nature Genetics 58, 2026, DOI 10.1038/s41588-026-02770-0. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"T1","i":1,"ko":"생식선 EGFR T790M 변이와 폐암 위험","en":"Germline EGFR T790M mutation and lung cancer risk","one":"330만 명 코호트에서 생식선 EGFR T790M이 흡연보다 큰 폐암 위험을 주며, 그 분포가 200여 년 전 남부 애팔래치아 창시자 효과에서 비롯됐음을 보였다.","ab":"대부분의 폐암은 흡연과 관련되지만 가족성 폐암과 비흡연 폐암의 유전적 위험, 특히 EGFR T790M 생식선 변이 보유자의 위험은 충분히 이해되지 않았다. 저자들은 330만 명이 넘는 환자 대조군 코호트에서 이 변이가 폐암 위험과 유의하게 연관됨을 확인했다. 다른 17개 암종에서는 위험 증가가 없었고 다유전자 위험점수와의 상호작용도 없었다. 이 변이가 주는 위험은 흡연이 주는 위험을 넘어섰으며 비흡연자에서 수 배 더 높았다. 지리와 조상 분석에서 T790M 유병률은 영국계 및 아일랜드계 집단보다 미국에서 높았는데, 약 200년에서 225년 전 남부 애팔래치아의 창시자 효과를 반영한 결과다. 그 여파로 영국계, 아일랜드계, 아프리카계 후손에서 지역 유병률이 올라갔다. 고위험 보유자를 인지하면 표적 유전자 검사와 선별 전략을 설계할 수 있다.","tags":["암 유전역학","폐암","생식선 변이","대규모 코호트"],"doi":"10.1126/science.aec0473","url":"https://www.science.org/doi/10.1126/science.aec0473","au":"LoPiccolo J, Micheletti S, …, Jänne PA","aff":"Department of Medical Oncology, Dana-Farber Cancer Institute, Boston, MA, USA (제1저자); The Lowe Center for Thoracic Oncology, Dana-Farber Cancer Institute, Boston, MA, USA (제1저자)","type":"Research Article","bg":"대부분의 폐암은 흡연과 관련되고 흡연 행동에 영향을 주는 유전 요인은 전장 유전체 연관 연구로 밝혀져 왔다. 그러나 가족성 폐암과 비흡연 폐암의 유전적 위험은 충분히 이해되지 않았다. EGFR T790M 생식선 변이 보유자의 위험도 마찬가지다. 기존 공개 자원은 이 정도로 드문 변이의 연관 연구에 필요한 검정력을 갖추지 못했다. 가장 최근 공개 기준으로 All of Us에는 보유자가 19명, UK Biobank에는 2명뿐이다.","ap":"직접 소비자 대상 유전자 검사 플랫폼의 자료로 330만 명이 넘는 환자 대조군 코호트를 구성했다. 10년이 넘는 유전형 자료를 활용했고 전자의무기록으로 표현형을 검증했다. REGENIE로 희귀 변이 연관 분석을 수행하고 가족 내 검정과 연관 불평형 변이 분석, 반수체형 보정 모델로 민감도를 확인했다. All of Us 코호트에서도 연관 분석을 수행했다. 다유전자 위험점수와의 상호작용을 평가했으며, 유전적 조상 추정과 조부모 및 본인 출생지 기반 지리 분석, 동일혈통분절 공유 분석으로 창시자 효과를 추적했다. 비보유자 3,454,333명과의 동일혈통분절 공유를 비교했다.","kf":["EGFR T790M 생식선 변이는 폐암 위험과 유의하게 연관됐고 효과 크기가 컸다.","다른 17개 암종에서는 위험 증가가 없었다.","다유전자 위험점수와의 상호작용은 없었고 효과는 가산적이었다.","이 변이가 주는 위험은 흡연이 주는 위험을 넘어섰고, 비흡연자에서 수 배 더 높았다.","T790M 유병률은 영국계와 아일랜드계 집단보다 미국에서 높았으며, 약 200년에서 225년 전 미국 남동부 애팔래치아 지역의 창시자 효과를 반영한다.","그 결과 영국계, 아일랜드계, 아프리카계 후손에서 지역적으로 유병률이 높아졌다."],"sig":"생식선 EGFR T790M을 폐암 위험이 큰 희귀 변이로 규정했다. 고위험 보유자를 인지하면 표적 유전자 검사와 선별 전략을 설계할 수 있다. 대규모 소비자 유전체 플랫폼이 지역 창시자 효과와 미세한 집중 양상을 포착할 수 있음을 보였다.","lim":"직접 소비자 대상 플랫폼의 참여자로 구성돼 임상 기반 코호트와 선택 편향이 다를 수 있다. 위험 추정치를 BRCA1이나 BRCA2 같은 기존 유전성 위험 유전자와 직접 비교하기에는 연구 설계와 질환 맥락이 달라 제한이 있다고 저자들은 밝힌다. 전자의무기록 기반 표현형 정의에 따른 분류 오류 가능성이 남는다.","lab":"직접 연결은 약하다. 다만 EGFR 변이 보유자 코호트를 식별하는 설계는 연구실이 폐암 단백체 코호트를 구성할 때 환자군 선정의 참고가 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-09-17_t1-1_fig1.jpg","label":"Figure 1","cap":"EGFR T790M 보유자의 유전체 전반 조상 추정 결과다. 익명성을 위해 조상 비율이 비슷한 다섯 명 이상을 한 막대로 묶었고, 남부 식민지, 브리튼 제도, 아프리카계 미국인, 아메리카 원주민, 아카디아와 프랑스계 캐나다, 스칸디나비아 조상군으로 나누어 제시한다."},{"src":"fig/SCI_2026-09-17_t1-1_fig2.jpg","label":"Figure 2","cap":"EGFR T790M 보유자의 지리적 분포와 유전적 근연도를 보여준다. 조부모 출생지와 본인 출생지의 분포, 그리고 보유자와 비보유자 3,454,333명 사이의 동일혈통분절 공유량을 지도로 제시한다."}]},{"j":"Science","w":"2026-09-17","t":"T1","i":2,"ko":"다중 소기관 신호로 조직의 세포 상태 다양성과 대사 적응을 지도화한다","en":"Multi-organelle signatures map cell-state diversity and metabolic adaptation in tissues","one":"전사체 대신 소기관 구조만으로 세포 상태를 분류해, 간세포가 기존 구역 모형보다 잘게 나뉜 하위 구역 공동체를 이룬다는 것을 보였다.","ab":"세포 상태의 다양성은 조직의 적응력과 수복, 질환 저항성을 이끌지만 이 복잡성을 포착하기는 어렵다. 현재 접근법은 대부분 전사체 프로파일링에 의존해, 대사와 스트레스의 핵심 지표인 소기관 구조를 분석에서 빠뜨린다. 저자들은 자동 분할과 기계학습을 통합해 다중 소기관 신호에서 세포 상태를 분류하고 공간에 지도화하는 이미징 작업 흐름 spatial Organellomics를 개발했다. 간과 췌장에서 이 신호만으로 넓은 범주의 세포 종류를 구분할 수 있었다. 간에서는 소엽 내 위치만으로 소기관 기반 간세포 범주가 전부 설명되지 않았고, 간세포가 기존 구역 안에서도 서로 섞인 공동체를 이루어 더 세분화된 하위 구역 다양성 모형을 지지했다. 영양 스트레스는 이 조직화를 재편했으며, 생체 내 이미징에서 금식으로 유도된 소기관 재편이 미토콘드리아 막전위 변화와 연결됐다.","tags":["세포 대사","미토콘드리아","이미징 오믹스","간"],"doi":"10.1126/science.ady6372","url":"https://www.science.org/doi/10.1126/science.ady6372","au":"Adhikari R, Hillsley A, …, Feliciano D","aff":"Janelia Research Campus, Howard Hughes Medical Institute, Ashburn, VA, USA (제1저자, 말저자 공통)","type":"Research Article","bg":"세포 상태의 다양성은 조직의 적응력과 수복, 질환 저항성을 만든다. 그러나 이 복잡성을 포착하기는 어렵다. 현재 접근법은 대부분 전사체 프로파일링에 의존한다. 그 결과 대사와 스트레스의 핵심 지표인 소기관 구조는 분석에서 빠진다. 저자들은 소기관 구조만으로 세포 상태를 분류하고 공간적으로 지도화할 수 있는지 물었다.","ap":"세포 경계와 미토콘드리아, 퍼옥시좀, 지방방울을 표지한 조직 절편의 공초점 이미지를 얻었다. 맞춤 인스턴스 분할 모델로 세포와 소기관을 식별하고 단일 소기관 수준의 정량 특징을 추출했다. 자동 분할과 기계학습을 결합해 다중 소기관 신호로부터 세포 상태를 분류하고 공간에 지도화하는 작업 흐름을 spatial Organellomics로 구성했다. 간과 췌장 조직에 적용했고, 간에서는 문맥 주위와 중심정맥 주위를 나누는 소엽 구조를 기준으로 삼았다. 생체 내 이미징으로 금식에 따른 소기관 재편과 미토콘드리아 막전위 변화를 연결했다. (초록 기준)","kf":["다중 소기관 신호만으로 간과 췌장에서 넓은 범주의 세포 종류를 구분할 수 있었다.","간에서는 소엽 내 위치만으로 소기관 기반 간세포 범주가 전부 설명되지 않았다.","간세포는 기존 구역 안에서도 서로 섞인 공동체를 이루어, 기존 구역 모형보다 세분화된 하위 구역 다양성 모형을 지지했다.","영양 스트레스는 이 조직화를 재편했다.","생체 내 이미징에서 금식으로 유도된 소기관 재편이 미토콘드리아 막전위 변화와 연결됐다.","이 결과는 다중 소기관 구조가 조직 적응의 구조적 지표로 쓰일 수 있음을 뒷받침한다."],"sig":"전사체에 의존하지 않고 소기관 구조만으로 세포 상태를 분류하는 길을 열었다. 조직 적응을 구조 수준에서 읽는 지표를 제공해, 대사 상태를 공간적으로 추적할 수 있게 한다.","lim":"간과 췌장 두 장기에 적용한 결과이며 다른 조직으로의 일반화는 확인되지 않았다. 소기관 네 종류를 표지한 이미징에 기반해 다른 소기관의 기여는 다루지 않았다. 세포 상태 분류와 기능적 대사 상태의 인과 관계는 금식 모델 외에서는 검증되지 않았다. (초록 기준)","lab":"미토콘드리아와 지방방울 구조를 단일 세포 수준에서 정량하는 분석은 연구실의 미토콘드리아 및 지질 대사 과제에 바로 적용할 수 있다. 소기관 기반 세포 상태 지도는 연구실의 공간 오믹스 데이터와 겹쳐 해석할 수 있는 층이 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-09-17_t1-2_fig1.jpg","label":"Figure 1","cap":"세포 조절 층위가 소기관 구조를 만드는 개념과 spatial Organellomics 작업 흐름을 보여준다. 세포 경계, 미토콘드리아, 퍼옥시좀, 지방방울을 표지한 조직 이미지를 맞춤 분할 모델로 처리한 결과를 조직 규모와 세포 내 규모로 함께 제시한다."}]},{"j":"Science","w":"2026-09-17","t":"T1","i":3,"ko":"CRISPR-Cas의 기원에 있는 비연속 RNA 유도 DNA 인식 코드","en":"A noncontiguous code for RNA-guided DNA recognition at the origin of CRISPR-Cas","one":"떨어져 있는 두 염기들이 모여 표적을 지정하는 비연속 코드로 이중나선 DNA를 알아보는 VIPR 계통을 찾아, CRISPR-Cas가 바이러스끼리의 싸움에서 비롯했을 가능성을 제시했다.","ab":"CRISPR-Cas는 RNA 매개 적응 면역을 제공하지만, 최초의 RNA 유도 효과기가 어떻게 생겨났는지는 불분명했다. 저자들은 초기 CRISPR-Cas 효과기의 조상에 해당하는 Vipr 단백질과, GGY 및 NN 모티프가 번갈아 배열된 vrRNA로 이루어진 Viral Interference Programmable Repeat 시스템을 발견했다. 표적 핵산과 연속으로 상보 결합하는 기존 가이드 RNA와 달리, vrRNA는 가변 NN 이중염기가 모여 띄엄띄엄한 표적 서열을 지정하는 비연속 코드로 이중가닥 DNA를 인식한다. 자연 상태의 vrRNA 표적은 이 시스템이 경쟁 파지를 겨냥함을 시사한다. 저자들은 복합체를 전사 억제 용도로 재설계해 프로그래밍 가능한 파지 방어를 시연했고, 적응 면역이 바이러스 사이의 오래된 다툼에서 비롯됐을 가능성을 제시한다. 같은 호 Perspective가 이 논문을 다뤘다.","tags":["CRISPR 진화","비교유전체","RNA 유도 DNA 인식","파지 방어"],"doi":"10.1126/science.aei0498","url":"https://www.science.org/doi/10.1126/science.aei0498","au":"Yoon PHY, Loi KJ, Zhang ZT, …, Brohawn SG, Doudna JA","aff":"Department of Molecular and Cell Biology, University of California, Berkeley, CA, USA (제1저자). Innovative Genomics Institute, University of California, Berkeley, CA, USA (교신저자 Doudna JA). Howard Hughes Medical Institute","type":"Research Article","bg":"CRISPR-Cas는 RNA가 이끄는 적응 면역을 제공하지만, 그 첫 RNA 유도 효과기가 어떻게 생겨났는지는 분명하지 않았다. 지금까지 알려진 모든 RNA 유도 단백질에서 표적 특이성은 가이드와 표적 사이의 연속된 상보성으로 정해진다. 이 연속성이라는 전제 자체가 깨질 수 있는지, 그리고 그런 계통이 CRISPR의 조상에 해당하는지는 묻지 않은 질문이었다.","ap":"Viral Interference Programmable Repeat, 줄여서 VIPR라 이름 붙인 계통을 발굴했다. 이 계통은 가장 이른 CRISPR-Cas 효과기의 조상에 해당하는 Vipr 단백질과, GGY와 NN이 번갈아 나오는 모티프로 이루어진 VIPR RNA로 구성된다. 대표 계통 667개를 비교유전체로 분류하고 계통수를 그렸다. 이어 복합체를 전사 억제용으로 돌려 프로그래밍 가능한 파지 방어를 실제로 보였다.","kf":["Vipr 단백질과 vrRNA로 이루어진 VIPR 계통을 새로 규정했다. Vipr는 가장 이른 CRISPR-Cas 효과기의 조상에 해당한다.","vrRNA는 연속 상보성이 아니라 비연속 코드로 이중나선 DNA를 알아본다. 변이 가능한 NN 두 염기들이 모여 띄엄띄엄한 표적 서열을 함께 지정한다.","코드는 9개에서 16개까지 반복되는 YNNGG 연쇄 안에 저장된다. Vipr 단백질이 보존된 GGY 모티프에 붙어 vrRNA를 따라 중합하면서, 그 사이의 NN을 짝짓기용으로 내민다.","Vipr가 GGY 염기를 비틀어 표적 가닥의 한 뉴클레오타이드가 GGY 세 염기를 가로지르게 만든다. 한 염기를 건너뛰는 규칙이 비연속 인식의 바탕이다.","대표 계통 667개를 일곱 가지 유형으로 나누었다. I, II, VI, VII형은 바이러스나 프로파지에, III형과 V형은 원핵생물의 항바이러스 계통에 있었다.","자연 표적을 보면 VIPR는 경쟁하는 파지를 겨냥한다. 즉 적응 면역이 바이러스끼리의 다툼에서 비롯했다는 모형으로 이어진다.","복합체를 전사 억제로 돌려 프로그래밍 가능한 파지 방어를 시연했다."],"sig":"가이드 RNA가 연속된 상보성으로만 표적을 지정한다는 전제를 깨뜨렸다. 서열에 정보를 담는 새로운 논리를 보여 준 것이고, 띄엄띄엄한 인식은 기존 도구가 다루지 못하던 표적 설계 공간을 연다. 바이러스에서 원핵 숙주로의 수평 전달을 거쳐 CRISPR-Cas로 이어졌다는 진화 모형도 함께 제시한다.","lim":"진화 모형은 계통 분석과 분포에 근거한 추론이며 조상 유전자좌 자체는 가설로 남아 있다. 분자 수준의 기전은 같은 호에 실린 동반 구조 논문이 맡고 있어, 이 논문만으로는 인식 과정의 구조적 근거가 완결되지 않는다. 한 염기를 건너뛰는 규칙이 일곱 유형 전반에서 똑같이 성립하는지도 더 넓게 확인해야 한다. 전사 억제 시연은 개념 증명 수준이다.","lab":"유전자 편집 도구의 표적 범위를 넓힐 가능성이 있어, 스크린이나 교란 실험 설계에 중기적으로 영향을 준다. 비연속 코드라는 발상 자체는 서열 모티프를 다루는 분석에서 참고할 만하다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-09-17_t1-3_fig1.jpg","label":"Figure 1","cap":"Vipr가 주로 파지에 암호화되어 있으며 CRISPR RAMP 단백질의 조상에 해당한다는 근거다. 구조에 기반한 발굴 과정과, 대표 Vipr 단백질을 기존 CRISPR 효과기와 견준 비교를 함께 보여준다."},{"src":"fig/SCI_2026-09-17_t1-3_fig3.jpg","label":"Figure 3","cap":"vrRNA가 비연속 염기 짝짓기 코드로 DNA를 알아보는 방식을 설명한다. 표적 규칙을 찾아낸 계산 과정과 가능한 비연속 인식 양상 네 가지를 제시해, 띄엄띄엄한 NN 두 염기들이 표적을 함께 지정함을 보인다."}]},{"j":"Science","w":"2026-09-17","t":"T1","i":4,"ko":"자폐 위험 변이를 가진 마우스의 전사체 기반 분류","en":"Transcriptome-based classification in mice with ASD-risk mutations","one":"자폐 위험 변이 마우스 17계통의 전사체 1,008건이 서로 반대 방향의 두 상태로 갈리고, 두 군이 약물 반응까지 다르다는 것을 보였다.","ab":"자폐 스펙트럼 장애는 유전 요인이 강한 신경발달 질환으로 대규모 인간 유전 연구에서 위험 유전자가 1,200개 넘게 밝혀졌다. 저자들은 자폐 위험 변이를 가진 마우스 17계통에서 성별 균형을 맞춘 전전두피질 RNA 시퀀싱 프로파일 1,008건의 아틀라스를 만들었다. 분석 결과 서로 반대 방향을 가리키는 두 개의 전사체 상태가 나타났다. 두 군은 성별 편향과 영역 특이성, 발달 안정성, 세포 유형 재편, 그리고 플루옥세틴과 리튬에 대한 반응에서 서로 달랐다. 단일핵 RNA 시퀀싱에서는 1군이 2군보다 더 넓은 세포 유형 재편을 보였고, 세포 유형 특이적 모듈은 벌크 전사체 신호를 반영하는 상호 역방향 연관을 나타냈다. 이 분류 틀은 독립적인 마우스 계통도 분류했으며 시냅스 방향성이 보존된 하위 집단을 식별해, 유전적으로 이질적인 자폐를 분자 수준에서 층화할 수 있음을 시사한다.","tags":["신경발달장애","전사체","자폐","약물 반응"],"doi":"10.1126/science.adz6688","url":"https://www.science.org/doi/10.1126/science.adz6688","au":"Roh JD, Jun Y, …, Kim E","aff":"Center for Synaptic Brain Dysfunctions, Institute for Basic Science (IBS), Daejeon, Korea (제1저자, 말저자 공통); Department of Biological Sciences, Korea Advanced Institute of Science and Technology, Daejeon, Korea (말저자)","type":"Research Article","bg":"자폐 스펙트럼 장애는 유전적 요인이 강한 신경발달 질환이다. 대규모 인간 유전 연구로 위험 유전자가 1,200개 넘게 밝혀졌다. 그러나 서로 다른 유전 원인이 같은 임상 표현형으로 모이는지, 아니면 구별되는 병태생리 경로로 나뉘는지는 불분명했다. 저자들은 여러 위험 변이 모델을 한 설계 안에서 비교해 분자 층화가 가능한지 물었다.","ap":"자폐 위험 변이를 가진 마우스 17계통을 시냅스, 유전자 조절, 신호전달의 세 가지 표준 기능군으로 나누어 구성했다. 각 계통에서 야생형과 변이형, 수컷과 암컷을 두고 생후 3일부터 25일까지 모유를 통해 플루옥세틴 또는 리튬을 투여하거나 용매만 투여했다. 계통과 유전형, 성별, 처치를 교차한 204개 군에 군당 약 5마리씩, 모두 1,008마리의 전전두피질 RNA 시퀀싱 프로파일을 생성했다. 생후 25일 전전두피질에서 약 100만 개의 단일핵 RNA 시퀀싱을 수행해 주요 세포 유형 10종을 식별했다. 독립 계통으로 분류 틀을 검증했다. (초록 기준)","kf":["성별 균형을 맞춘 전전두피질 RNA 시퀀싱 프로파일 1,008건의 아틀라스를 구축했다.","분석 결과 서로 반대 방향을 가리키는 두 개의 전사체 상태가 나타났다.","두 군은 성별 편향, 영역 특이성, 발달 안정성, 세포 유형 재편, 플루옥세틴과 리튬에 대한 반응에서 서로 달랐다.","단일핵 RNA 시퀀싱에서 1군이 2군보다 더 넓은 세포 유형 재편을 보였다.","세포 유형 특이적 모듈은 벌크 전사체 신호를 반영하는 상호 역방향 연관을 보였다.","이 분류 틀은 독립적인 마우스 계통도 분류했고, 시냅스 방향성이 보존된 하위 집단을 식별했다."],"sig":"자폐 위험 유전자의 이질성을 분자 층화로 다룰 수 있음을 보였다. 서로 다른 유전 원인이 두 개의 구별되는 병태생리 경로로 수렴한다는 가설을 뒷받침하고, 약물 반응 예측의 분자 기준을 제시한다.","lim":"마우스 모델 연구로 사람의 자폐 스펙트럼 장애에 그대로 적용되는지는 확인되지 않았다. 전사체 기반 분류이며 행동 표현형과의 대응은 제한적으로 다뤄졌다. 약물 반응은 생후 3일부터 25일까지의 노출 조건에서만 평가됐다. (초록 기준)","lab":"직접 연결은 약하다. 다만 계통, 성별, 처치를 교차한 1,008건 전사체를 두 상태로 층화하는 분석 전략은 연구실의 다중 조건 오믹스 설계에 참고가 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-09-17_t1-3_fig1.jpg","label":"Figure 1","cap":"자폐 위험 변이를 가진 마우스 17계통의 전사체 아틀라스가 두 분자 아형으로 나뉘는 결과를 보여준다. 시냅스, 유전자 조절, 신호전달로 색을 구분한 계통 구성과 실험 흐름을 함께 제시한다."}]},{"j":"Science","w":"2026-09-17","t":"T2","i":1,"ko":"고대 DNA로 밝힌 동톈산 청동기와 철기 시대의 독특한 조상 구성","en":"Ancient DNA unveils distinctive ancestries in the Bronze and Iron Ages of East Tianshan","one":"","ab":"동톈산 산맥은 중앙아시아와 동아시아를 잇는 핵심 통로지만 그 집단사는 잘 알려지지 않았다. 저자들은 유적 11곳에서 나온 고대인 135명의 유전체 전반 자료를 보고했다. 청동기 시대에 황허 기장 농경민 관련 집단과 체무르체크 문화 연관 초원 목축민 사이에서 지금까지 확인되지 않았던 혼합이 일어났음을 확인했다. 반면 같은 시기 중후기 청동기 초원 목축민이 유라시아 초원을 동쪽으로 확장했는데도 이들의 유전적 기여는 거의 없었다. 철기 시대에 이르면 지역 집단이 더 이질적으로 바뀌어 동방 계통과 초원 계통이 추가로 들어왔고, 그러면서도 초기 청동기 집단의 기여는 정도를 달리하며 남아 있었다. 역사 시대 실크로드가 성립되기 1,800년가량 앞서 이 지역에서 지속적인 인구 교류가 있었다는 결론이다.","tags":["고유전체","인류사"],"doi":"10.1126/science.adv1295","url":"https://www.science.org/doi/10.1126/science.adv1295","au":"Ning C et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"T2","i":2,"ko":"복부 CT 진단을 위한 전문가 수준의 범용 인공지능","en":"An expert-level generalist AI for abdominal CT diagnosis","one":"","ab":"영상의학 분야의 인공지능은 다양한 임상 과제에서 전문가 수준의 진단을 지향하지만, 기존 지도학습 전략은 적용 범위가 좁았다. 저자들은 조영 증강 복부 CT 검사 40만 건 이상과 해부 구조별 영상 및 문자 쌍 1,500만 개로 학습한 범용 시각언어 모델 RADAR를 개발했다. 이 모델은 수작업 주석 없이 임상 판독문에서 직접 학습한다. 여러 기관에 걸친 내부 및 외부 평가와 다양한 임상 상황에서 RADAR는 해부 구조 18개와 영상 소견 146개에 대해 높은 진단 성능과 견고한 일반화를 보였다. 판독자 연구에서는 RADAR의 보조가 영상의학과 의사 26명의 진단 민감도를 약 10% 높였다. 저자들은 범용 인공지능이 일반적인 과제뿐 아니라 복잡한 영상의학 과제에서도 사람 전문가와 대등할 수 있음을 보인다고 정리한다.","tags":["의료 인공지능","영상의학"],"doi":"10.1126/science.aec6129","url":"https://www.science.org/doi/10.1126/science.aec6129","au":"Zhang Q et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"T2","i":3,"ko":"비장이 전신 혈소판 활성 상태를 조절한다","en":"Splenic regulation of systemic platelet activation state","one":"","ab":"혈소판은 출혈을 막고 염증을 조율하는 데 필수적이다. 혈관 질환의 혈전 합병증과 과반응성 혈소판은 나쁜 경과와 연관되지만, 전신 혈소판 활성화를 억제하는 생리적 기전은 분명하지 않았다. 저자들은 마우스에서 비장이 혈전성 및 염증성 상황에서 활성화된 혈소판을 걸러내 혈소판의 정지 상태를 유지하고 병태를 제한한다는 것을 발견했다. 비장 적수질의 세포외기질 성분이 유발하는 당단백질 VI 의존 활성화는, 정지 상태 혈소판에서 perlecan이 촉발하는 G6b-B 면역수용체 억제 모티프 신호로 상쇄돼 혈소판이 다시 순환할 수 있게 한다. 반면 이미 활성화된 혈소판에서는 역치를 넘는 활성화 신호가 이 억제를 압도해, 내외 신호와 베타1 인테그린 결합을 통해 비장에 포획된다. 비장이 혈소판 반응성과 혈전 염증 위험을 조절하는 기관이라는 결론이다.","tags":["혈액학","염증"],"doi":"10.1126/science.aec7230","url":"https://www.science.org/doi/10.1126/science.aec7230","au":"Laun L et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"T2","i":4,"ko":"열대림 보호가 복원보다 생물다양성과 기후에 비용 효과적이다","en":"Protecting tropical forests is more cost-effective for biodiversity and climate than restoration","one":"","ab":"열대림의 생물다양성과 기후 위기 대응은 벌채 중단과 복원에 집중돼 왔다. 삼림 교란을 피하는 일도 매우 중요하지만 상대적으로 주목을 덜 받았고, 세 가지 개입의 상대적 비용 효과도 분명하지 않았다. 저자들은 브라질 아마존 벌채 전선에서 심층 현장 조사와 고해상도 원격탐사를 결합해, 관측 결과와 반사실 시나리오를 비교하는 방식으로 각 개입의 생물다양성 및 탄소 편익과 비용을 평가했다. 교란을 피하는 개입이 가장 큰 편익을 냈고 복원보다 비용 효과적이었으며, 이 결과는 편익과 비용 가정을 폭넓게 바꾸어도 유지됐다. 다만 생물다양성과 탄소의 손실을 실제로 되돌리려면 세 개입을 함께 쓰는 것이 필수적이었다.","tags":["보전생태","탄소"],"doi":"10.1126/science.adx9928","url":"https://www.science.org/doi/10.1126/science.adx9928","au":"Miranda LS et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"T2","i":5,"ko":"비연속 기하학적 삼중나선 형성을 통한 VIPR의 RNA 유도 DNA 인식","en":"VIPR RNA-guided DNA recognition by noncontiguous geometric triplex formation","one":"","ab":"VIPR 시스템은 비연속 코드로 RNA 유도 전사 억제를 수행하지만, Vipr 단백질과 GGY 및 NN 분절이 번갈아 놓인 vrRNA가 어떻게 정확한 DNA 표적화를 이루는지는 알려지지 않았다. 저자들은 극저온 전자현미경 구조 21개로 표적 결합 기전을 설명했다. Vipr 단량체는 vrRNA를 따라 올리고머를 이루며 오른손 나선 필라멘트를 만들고, 각 GGY 모티프를 격리하는 한편 인접한 NN 염기는 표적 염기쌍 형성에 맞춰 배치한다. 세 번째 뉴클레오타이드마다 건너뛰는 방식의 DNA 결합이 일어나 틈이 있는 vrRNA와 DNA 혼성 나선이 만들어지고, 이것이 비표적 가닥을 감싸 기하학적 삼중나선을 이룬다. 저자들은 삼중나선을 매개로 한 표적 가닥 전달이 비연속적이고 프로그래밍 가능한 RNA 유도 DNA 인식을 가능하게 한다고 제안한다. 같은 호 Perspective가 이 논문을 다뤘다.","tags":["구조생물학","CRISPR 진화"],"doi":"10.1126/science.aei3472","url":"https://www.science.org/doi/10.1126/science.aei3472","au":"Yoon PH et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":1,"ko":"","en":"Atmospheric methane lifetime during the Last Glacial Maximum was reduced owing to dust-mediated chlorine chemistry","one":"","ab":"","tags":["대기화학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":2,"ko":"","en":"Nuclear tests at Mt. Mantap have reactivated intraplate faults","one":"","ab":"","tags":["지진학"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":3,"ko":"","en":"Fast, continuous, and coherent atom reloading in a neutral-atom qubit array","one":"","ab":"","tags":["물리"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":4,"ko":"","en":"Quantum jumps of sound","one":"","ab":"","tags":["물리"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":5,"ko":"","en":"Extreme loss suppression in an ultracold molecular gas with widely tunable dipolar interactions","one":"","ab":"","tags":["물리"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-09-17","t":"EX","i":6,"ko":"","en":"Disorder-promoted stability","one":"","ab":"","tags":["네트워크 이론"],"doi":"","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"T1","i":1,"ko":"사람 장내 미생물군이 백신 접종 후 발열을 준비시킨다","en":"The human gut microbiome primes fever after vaccination","one":"접종 전 장내 미생물군의 flagellin 발현량이 mRNA 백신 접종 후 발열 위험을 가른다.","ab":"백신 접종 후 발열은 흔한 이상반응이지만 사람마다 위험이 다른 이유가 밝혀지지 않았다. 저자들은 SARS-CoV-2 mRNA 백신을 접종받는 건강한 성인 171명에서 구강 체온, 분변 미생물군, 혈청 지표를 2주간 종단으로 추적했다. 발열 위험이 높은 군은 접종 전부터 경미한 장 염증이 있었고 flagellin을 많이 발현하는 Lachnospiraceae 세균, 특히 Waltera 속이 많았다. 발열 고위험군의 분변 상층액은 사람 대장 오가노이드에서 IL-8 생산을 늘렸고 무균 마우스에 이식하면 접종 후 체온 변화와 혈청 IL-6가 더 커졌다. 이 차이는 TLR5와 NLRC4를 함께 결손시킨 마우스에서 약해졌다. 식품첨가물과 서양식 식단은 미생물 flagellin 생산과 마우스의 접종 반응을 키웠고 사람에서도 발열 위험은 자가보고 식단과 대사 지표와 연관됐다. 저자들은 미생물군을 겨냥한 전략으로 백신 이상반응을 줄일 수 있다고 제안한다.","tags":["장내 미생물군","백신 면역","선천면역","다중 오믹스"],"doi":"10.1126/science.aea7733","url":"https://www.science.org/doi/10.1126/science.aea7733","au":"Huus KE, µHEAT Study Group, …, Ley RE","aff":"Department of Microbiome Science, Max Planck Institute for Biology, Tübingen, Germany (제1저자 Kelsey E. Huus); Department of Microbiome Science, Max Planck Institute for Biology 및 Controlling Microbes to Fight Infections Cluster of Excellence, Tübingen, Germany (교신저자 Ruth E. Ley)","type":"Research Article","bg":"백신 접종 후 발열과 몸살 증상은 접종 기피의 주요 원인이지만 누가 발열할지 예측하기 어렵다. 같은 사람은 접종 차수가 달라도 발열 양상이 비슷하다는 보고가 있어 개인 고유의 위험 요인이 있다고 추정돼 왔다. 장내 미생물군은 숙주 면역을 지속적으로 자극하고 식이로 바뀌므로 그 요인의 후보다. 그러나 미생물군이 백신의 선천면역성 이상반응에 영향을 주는지, 반대로 발열이 미생물군을 바꾸는지는 알려지지 않았다. 저자들은 이 두 방향을 함께 묻기 위해 µHEAT 연구를 설계했다.","ap":"SARS-CoV-2 mRNA 백신을 접종받는 건강한 성인 171명을 접종 전후 2주간 추적했다. 대부분 BNT162b2 3차 접종자였고 하루 세 번 구강 체온을 재 7079건을 모았다. 개인 기준 체온 대비 상승폭 ΔT로 발열 고위험군 72명과 저위험군 99명을 나눴다. 분변 시료 1022건의 shotgun 메타지놈, 38명 230건의 미생물 메타전사체, 혈청 비표적 대사체 LC-MS, SomaLogic 압타머 기반 1500종 단백체를 함께 생산했다. 인과 검증은 사람 대장 오가노이드 자극, 무균 마우스 분변 이식, TLR5와 NLRC4 이중 결손 마우스, 캐나다 성인 1014명의 분변 메타지놈 1549건 재현으로 했다.","kf":["발열 고위험군은 접종 전부터 혈청 ApoE, IFNAR1, RANKL이 높고 LDL 대 HDL 비가 나빴으며 접종 2주 후 분변 calprotectin이 유의하게 높았다. 만성 저등급 장 염증이 발열 위험과 함께 간다.","백신 접종과 발열은 미생물군을 거의 바꾸지 않았다. 알파 다양성, 베타 다양성, 균주 지속성에 변화가 없었고 체외에서 장내 세균 24종의 성장은 37도에서 42도 사이에서 줄지 않았다.","발열 고위험군의 미생물군은 flagellin과 운동성 유전자를 DNA 대비 RNA 수준에서 더 많이 발현했고 그 상태가 접종 전부터 유지됐다. 상향 발현된 flagellin의 67.2%는 Waltera 속, 76.3%는 Lachnospiraceae 과에서 나왔다.","Waltera intestinalis 배양에서 떼어낸 flagellin은 TLR5 리포터를 강하게 활성화하고 사람 오가노이드에서 IL-8을 유도했다. 발열 고위험군 분변으로 자극한 오가노이드는 IL-8을 더 많이 만들고 TLR 신호 경로 유전자가 올라갔다.","발열 고위험군 분변을 이식한 무균 마우스는 접종 후 체온 강하가 더 크고 혈청 IL-6가 높았으며 공여자의 발열 정도와 수용 마우스의 체온 변화가 상관했다. TLR5와 NLRC4 이중 결손 마우스에서는 이 차이가 약해졌다.","carboxymethylcellulose는 W. intestinalis의 성장과 TLR5 자극성 flagellin 생산을 늘렸고 첨가물 14종 칵테일은 사람 분변 바이오리액터에서 Waltera와 총 flagellin을 올렸다. 서양식 식단을 먹인 마우스는 접종 후 체온 반응이 크고 IL-6가 높았으며 캐나다 성인 1014명에서도 이상반응을 보고한 사람의 분변에 Waltera가 유의하게 많았다."],"sig":"백신 이상반응의 개인차를 장내 미생물군의 flagellin 생산량이라는 측정 가능한 형질로 설명한다. 접종 전 분변 flagellin이나 Waltera 양을 재서 발열 위험을 미리 가늠할 수 있다는 가능성을 제시한다. 다만 사람에서 식이 개입이 실제로 이상반응을 줄이는지는 아직 확인되지 않았다.","lim":"식이 자료가 자가보고 범주에 그쳐 실제 섭취량 차이를 놓칠 수 있고 저자들은 사람 식이 관찰을 가설 생성 수준으로만 제시한다. 무균 마우스에서 Waltera 자체는 잘 정착하지 않아 다른 Lachnospiraceae가 flagellin을 공급했다. TLR5와 NLRC4 이중 결손 마우스에서도 차이가 남아 flagellin과 무관한 경로가 함께 작동한다.","lab":"혈청 비표적 대사체와 1500종 단백체, 메타지놈, 메타전사체를 한 코호트에서 통합한 다중 오믹스 설계가 연구실 접근과 겹친다. 선천면역 자극의 강도를 미생물 유래 분자로 정량한 틀은 암이 아닌 포유류 면역학 주제와도 닿는다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"µHEAT 코호트의 발열 분포를 보여준다. 171명에서 모은 구강 체온 7079건으로 개인 기준 체온 대비 상승폭 ΔT를 정의해 발열 고위험군과 저위험군을 나눈 과정, ΔT와 몸살 증상 수, 해열제 복용, 과거 발열력, 항체 역가의 관계를 담았다."},{"src":"fig/SCI_2026-10-08_t1-1_fig5.jpg","label":"Figure 5","cap":"발열 고위험군의 사람 미생물군이 flagellin 의존 염증을 일으킨다는 것을 보여준다. 사람 대장 오가노이드의 IL-8 반응, 무균 마우스 분변 이식 후 체온 변화와 혈청 IL-6, TLR5와 NLRC4 이중 결손 마우스에서의 감쇠를 담았다."}]},{"j":"Science","w":"2026-10-08","t":"T1","i":2,"ko":"병목에 담긴 메시지: 프랑스령 폴리네시아에서 라파누이와 하와이로 이어진 중첩 창시자 효과","en":"Message in a bottleneck: Nested founder effects from French Polynesia to Rapa Nui and Hawaiʻi","one":"폴리네시아 전장 유전체 자료로 하와이와 라파누이가 같은 원거리 항해 집단에서 갈라졌음을 보이고 그 과정에서 굳어진 임상 변이 빈도를 제시한다.","ab":"창시자 효과는 특정 집단에서 희귀 변이의 빈도를 끌어올려 열성 질환 위험을 바꾼다. 저자들은 프랑스령 폴리네시아 1050명의 전장 유전체에 라파누이 12명의 미발표 유전체, All of Us의 원주민 하와이인, 서부 폴리네시아 기준인 사모아인과 통가인을 더해 폴리네시아 조상 분절만 골라 분석했다. 타히티의 세대당 유효 집단 크기는 34세대 전 837명까지 떨어졌고 이는 서기 1069년 무렵의 정착에 해당한다. 집단 내 IBD 공유량은 원거리 동부 폴리네시아에서 가장 높아 핀란드인보다 한 자릿수 이상 컸다. 외군 F3와 집단 간 IBD에서 하와이는 라파누이와 가장 가깝고 그다음이 망가레바였으며 2500개 근린결합 나무 중 61.00%에서 하와이와 라파누이가 한 분지를 이뤘다. FAN1 p.Trp707*는 프랑스령 폴리네시아에서 대립유전자 빈도 1.11%인데 gnomAD에는 한 명도 없다.","tags":["인류 집단유전체","창시자 효과","임상 유전학"],"doi":"10.1126/science.aec7662","url":"https://www.science.org/doi/10.1126/science.aec7662","au":"Shanks C, Huang EC, …, Ioannidis AG","aff":"Genomics Institute, University of California, Santa Cruz, CA, USA (제1저자 Cole Shanks); Department of Anthropology, University of California, San Diego, CA, USA (교신저자 Keolu Fox); Department of Biomedical Data Science, Stanford University, CA, USA (교신저자 Alexander G. Ioannidis)","type":"Research Article","bg":"창시자 효과가 임상에서 중요하다는 점은 핀란드인과 아슈케나지 유대인에서 잘 정리돼 보인자 선별 검사로 이어졌다. 폴리네시아는 섬에서 섬으로 이어지는 연속 정착 과정에서 병목이 겹쳐 쌓였을 것으로 추정돼 왔다. 그러나 원주민 하와이인과 태평양 도서민에서 임상적으로 조치 가능한 변이는 거의 정리돼 있지 않고 gnomAD 같은 데이터베이스에도 들어 있지 않다. 저자들은 폴리네시아 정착 순서를 유전체로 복원하고 그 결과로 굳어진 병원성 변이의 집단 빈도를 묻는다.","ap":"오스트랄, 소시에테, 마르키즈, 투아모투, 망가레바 제도를 아우르는 프랑스령 폴리네시아 1050명의 전장 유전체를 썼고 대부분은 선행 연구에서 공개된 자료다. 여기에 라파누이 12명의 미발표 유전체와 All of Us 생물자원은행의 원주민 하와이인, 사모아인과 통가인을 더했다. Gnomix로 국소 조상을 추정해 폴리네시아 조상 분절만 남긴 뒤 조상 특이 PCA, IBDNe, 집단 내 IBD와 집단 간 IBD, 외군 F3, 조상 재조합 그래프 기반 F3를 돌렸다. 병원성 변이 빈도는 조상 분절로 조건화하지 않고 코호트 전체에서 계산했다.","kf":["소시에테 제도 타히티 581명에 조상 특이 IBDNe를 적용해 34세대 전 유효 집단 크기 최소값 837명을 얻었다(95% CI 639에서 1004). 세대당 28년을 적용하면 서기 1069년으로 기존 방사성 탄소 및 유전 추정치와 맞는다.","병목 이후 지수적으로 늘던 집단이 9세대에서 10세대 전에 크게 줄어 섬 주민 두 명 중 한 명이 사망한 수준의 감소가 나타났다. 1700년대 유럽인 접촉 이후 질병 확산과 시기가 맞는다.","집단 내 IBD 공유량은 원거리 동부 폴리네시아에서 가장 컸고 폴리네시아 집단은 널리 연구된 창시자 집단인 핀란드인보다 최소 한 자릿수 높았다.","사모아를 외군으로 둔 조상 특이 외군 F3와 집단 간 IBD에서 하와이는 라파누이와 가장 가깝고 그다음이 망가레바였다. 평균 IBD 길이로 만든 2500개 근린결합 나무 중 61.00%에서 하와이와 라파누이가 한 분지를 이뤘고 망가레바와는 10.45%, 마르키즈와는 2.75%였다.","ADAMTSL4 p.Arg746His 1.23%, PDE6B p.Ala733Pro 1.84%, FAN1 p.Trp707* 1.11%의 대립유전자 빈도를 보고했고 보인자 빈도는 각각 2.46%, 3.68%, 2.22%다. 세 변이 모두 ACMG가 보인자 선별을 권고하는 200분의 1 기준을 넘는다.","FAN1 p.Trp707*는 80만 건이 넘는 gnomAD v4.1 유전체와 엑솜에 한 명도 없다. 이 변이는 신부전으로 이어지는 karyomegalic interstitial nephritis를 일으킨다."],"sig":"대규모 유전체 데이터베이스에 전혀 없는 변이가 특정 창시자 집단에서는 1%를 넘을 수 있다는 것을 구체적인 수치로 보인다. 원주민 하와이인과 태평양 도서민을 다른 아시아계와 함께 묶어 분류하면 이런 위험이 가려진다는 점을 유전학으로 뒷받침한다. 하와이와 라파누이의 정착 경로에 대한 고고학, 언어학 가설도 유전체로 검증한다.","lim":"IBDNe는 표본이 가장 많은 타히티 한 섬에만 적용했고 다른 제도는 표본이 부족해 돌리지 않았다. 라파누이는 새로 더한 유전체가 12명뿐이고 표본이 모자란 다른 섬의 대립유전자 빈도는 보고하지 않았다. 의미 불명 변이는 강한 유전적 유동과 연속 창시자 효과 때문에 평가가 어려워 다루지 않았다.","lab":"전장 유전체 시퀀싱 코호트를 집단 수준에서 다루는 분석이라 연구실 핵심 오믹스와는 결이 다르다. 다만 특정 집단에 몰린 기능상실 변이를 임상 조치로 연결하는 틀은 코호트 기반 변이 해석에 참고가 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-10-08_t1-2_fig1.jpg","label":"Figure 1","cap":"폴리네시아의 집단 구조를 보여준다. 조상 특이 PCA로 섬별 분포를 나타내고 프랑스령 폴리네시아에서 발견되나 기존 데이터베이스에는 없는 SNP 수를 소수 대립유전자 빈도별로 제시하며 원주민 하와이인의 조상 구성 비율을 담았다."},{"src":"fig/SCI_2026-10-08_t1-2_fig3.jpg","label":"Figure 3","cap":"하와이와 다른 섬들의 유전적 근연도를 보여준다. 사모아를 외군으로 한 조상 특이 F3 통계, 섬 간 평균 IBD 길이로 만든 밀도 나무, 하와이와 각 섬 사이의 집단 간 총 IBD 지도를 담았다."}]},{"j":"Science","w":"2026-10-08","t":"T1","i":3,"ko":"개에서 후성유전 노화와 전이인자 조절 이상이 체격에 따른 수명 단축을 반영한다","en":"Epigenetic aging and transposon dysregulation reflect size-related lifespan compression in dogs","one":"개 894마리의 메틸롬 1640건으로 만든 후성유전 시계가 사망 위험을 예측하고 몸집이 큰 개일수록 전이인자 탈메틸화가 빠름을 보인다.","ab":"같은 종 안에서도 개체마다 수명이 크게 다른 이유가 생물학적 노화 속도의 차이인지는 분명하지 않았다. 저자들은 Dog Aging Project 정밀 코호트에 참여한 개 894마리의 말초혈액 단핵세포에서 RRBS로 메틸롬 1640건을 생산했다. 탄성망 회귀로 만든 후성유전 시계는 실제 나이를 결정계수 0.86, 중위 절대오차 0.82년으로 예측했다. 체격과 성별을 보정한 뒤에도 잔차 후성유전 나이가 1년 늘 때 사망 위험이 15% 높아졌다. 몸집이 크고 수컷인 개에서 분자 노화가 빨랐고 어린 개의 후성유전 노화 속도가 더 빨랐다. 분석한 194,517개 좌위 중 42%가 나이와 연관됐고 프로모터는 메틸화가 늘고 인트론과 전이인자는 줄었다. 성별 효과는 X 염색체에, 체격 효과는 전이인자에 몰렸으며 큰 개의 전이인자 나이 효과가 31.3% 강했다. 저자들은 전이인자를 체격과 수명을 잇는 매개 후보로 제시한다.","tags":["후성유전체","노화","전이인자","비교의학"],"doi":"10.1126/science.aeb2986","url":"https://www.science.org/doi/10.1126/science.aeb2986","au":"Mariner BL, McCoy BM, …, Snyder-Mackler N","aff":"School of Life Sciences 및 Center for Evolution and Medicine, Arizona State University, Tempe, AZ, USA (공동 제1저자 Blaise L. Mariner, Brianah M. McCoy); School of Life Sciences 및 Center for Evolution and Medicine, Arizona State University, Tempe, AZ, USA (교신저자 Noah Snyder-Mackler)","type":"Research Article","bg":"노화 속도가 개체마다 다른 이유를 종간 비교로는 가려내기 어렵다. 집개는 몸집이 수명을 강하게 예측해 작은 품종이 큰 품종보다 최대 두 배 오래 살면서도 진화적 배경과 생활 환경을 공유한다. 그러나 수명이 짧은 개가 그저 일찍 죽는 것인지 생애 전체에 걸쳐 분자 노화가 빠른 것인지는 확인되지 않았다. 저자들은 DNA 메틸화를 생물학적 나이의 지표로 삼아 체격과 성별이 노화 메틸롬을 어떻게 바꾸는지 묻는다.","ap":"미국 전역에서 Dog Aging Project 정밀 코호트에 등록된 개의 전혈을 2021년부터 2024년 2월까지 해마다 받아 PBMC를 분리했다. 개 894마리에서 RRBS로 메틸롬 1640건을 생산했고 단일 품종이 53%, 믹스가 47%였으며 개체당 최대 4년까지 추적했다. CpG 2662만 곳을 걸러 194,517개 좌위로 묶고 탄성망 회귀로 후성유전 시계를 만들었다. 생년이 확인된 809마리의 첫 시료로 leave-one-out 교차검증을 하고 Cox 비례위험 모형으로 사망 121건에 대한 생존을 분석했다. 유전체 맥락별 분석은 프로모터, 엑손, 인트론, CpG 섬, 전이인자로 나눠 했다.","kf":["후성유전 시계는 개의 나이를 결정계수 0.86, 중위 절대오차 0.82년으로 맞혔다. 보호자가 생년을 추정 보고한 개에서 오차가 더 커 저자들은 생년을 모르는 개의 나이 추정에 쓸 수 있다고 본다.","체격과 성별을 보정해도 잔차 후성유전 나이가 1년 커질 때 사망 위험이 15% 올랐다(HR 1.15, 95% CI 1.01에서 1.31, P=0.037). 사람의 1세대 시계에서 보고된 연 1.5%에서 3%보다 5배에서 10배 큰 효과다.","547마리의 추적 시료 764건에서 실제 1년이 지날 때 후성유전 나이는 평균 0.88년 늘었고 어린 개일수록 연간 변화가 컸다.","나이와 연관된 좌위는 194,517개 중 42%인 82,447개였고 그중 78%가 나이와 함께 탈메틸화됐다. 프로모터(OR 2.30)와 CpG 섬(OR 3.55)은 메틸화가 늘고 인트론(OR 1.13)과 전이인자(OR 1.40)는 줄었다.","나이와 함께 메틸화가 늘어난 개 프로모터는 사람에서 나이와 함께 발현이 줄어드는 유전자에 유의하게 몰렸다(OR 1.68). 적응면역 경로는 메틸화가 늘고 염증과 선천면역 경로는 줄어 사람의 inflammaging과 같은 방향이었다.","나이 효과는 큰 개에서 평균 27% 강했고 전이인자에서 31.3%로 가장 컸다. LINE1 중에서는 진화적으로 젊은 Canid LINE1 과에서 차이가 43.5%로 가장 컸다."],"sig":"종 안의 수명 차이가 노화 속도만의 문제가 아니라 노화가 진행되는 유전체 위치의 문제이기도 하다는 것을 보인다. 체격은 노화와 같은 방향의 메틸화 변화로, 성별은 X 염색체로 서로 다른 경로를 쓴다. 반려견이 사람 노화 연구의 중간 모델로 쓰일 수 있다는 근거를 자료 규모로 뒷받침한다.","lim":"메틸화만 측정했고 전이인자의 전사나 삽입은 보지 않아 전이인자가 노화의 원인인지 결과인지 가리지 못한다. 저자들도 이 모형이 아직 추정에 머문다고 적는다. 시료는 혈액 PBMC 한 종류이고 추적 기간이 기대 성체 수명의 약 25%에 그친다.","lab":"메틸롬을 전장 규모로 직접 생산해 분석한 후성유전체 연구로 연구실의 오믹스 기반 분석과 맞닿는다. 다만 질량분석 기반 단백체나 대사체는 쓰이지 않았고 암과의 연결도 직접적이지 않다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-10-08_t1-3_fig1.jpg","label":"Figure 1","cap":"Dog Aging Project 정밀 코호트의 시료 수집과 구성을 보여준다. 보호자와 수의사가 채혈한 전혈에서 PBMC를 분리해 RRBS로 메틸화를 정량하는 흐름, 코호트의 체격과 성별과 품종 분포, 종단 시료 수를 담았다."},{"src":"fig/SCI_2026-10-08_t1-3_fig4.jpg","label":"Figure 4","cap":"큰 개가 전이인자에서 나이에 따른 탈메틸화를 더 강하게 보인다는 것을 보여준다. 큰 개와 작은 개의 나이 효과 크기 비교, 프로모터와 전이인자의 효과 차이 분포, 체격별 전이인자 평균 메틸화의 나이 추세를 담았다."}]},{"j":"Science","w":"2026-10-08","t":"T1","i":4,"ko":"PI(3,4)P2를 담은 골지 유래 소포가 미토콘드리아 융합을 이끈다","en":"Golgi-derived vesicles containing PI(3,4)P2 drive mitochondrial fusion","one":"class II PI3K가 PI(4)P를 PI(3,4)P2로 바꿔 만든 골지 유래 소포가 mitofusin이 표시한 융합 지점에 모여 외막 융합을 완성시킨다.","ab":"미토콘드리아 분열에는 소포체, 리소좀, 트랜스골지 유래 소포가 관여한다고 알려졌지만 소기관 접촉이 융합을 어떻게 조절하는지는 거의 밝혀지지 않았다. 저자들은 일곱 가지 포스포이노시타이드의 위치를 확인한 뒤 PI(3,4)P2를 만드는 class II PI3K인 PI3K-C2α와 PI3K-C2β에 주목했다. 두 효소를 siRNA로 줄이거나 CRISPR-Cas9으로 결손시키면 HeLa, COS-7, A549, 섬유아세포, HUVEC에서 미토콘드리아가 조각났고 야생형은 이를 회복시켰으나 인산화효소 활성이 없는 돌연변이는 회복시키지 못했다. 분할 루시페라아제 기반 NanoBiT 융합 측정에서 일곱 가지 중 PI(3,4)P2만 융합을 늘렸다. 초해상 라이브 이미징에서 PI(3,4)P2 양성 트랜스골지 소포는 소포체보다 늦게 융합 약 18초 전에 도착했고 융합 사건의 약 70%에 관여했다. 심근세포 특이 이중 결손 마우스는 미토콘드리아가 조각나고 60% 이상이 생후 1일에서 2일에 죽었다.","tags":["세포생물학","미토콘드리아","포스포이노시타이드","심장"],"doi":"10.1126/science.adx9628","url":"https://www.science.org/doi/10.1126/science.adx9628","au":"Aki S, Segawa M, …, Prudent J","aff":"Division of Nutriomics and Oncology, RCAST, The University of Tokyo, Tokyo, Japan (공동 제1저자 Sho Aki, 교신저자 Tsuyoshi Osawa); MRC Mitochondrial Biology Unit, University of Cambridge, Cambridge, UK (공동 제1저자 Mayuko Segawa, 교신저자 Julien Prudent)","type":"Research Article","bg":"미토콘드리아는 융합과 분열을 되풀이해 모양을 바꾸고 이 균형이 대사 적응과 세포 운명을 좌우한다. 분열은 소포체 접촉에서 DRP1이 모이는 과정으로 비교적 잘 정리됐고 PI(4)P를 담은 트랜스골지 유래 소포가 막 절단의 후기 단계를 돕는다는 것도 알려졌다. 반면 융합은 광학 분해 한계와 미토콘드리아 사이 접촉을 융합으로 오인하기 쉬운 문제 때문에 연구가 덜 됐다. 저자들은 PI(4)P 외의 포스포이노시타이드를 담은 소포가 융합을 조절하는지, 특히 class II PI3K가 만드는 PI(3,4)P2가 그 역할을 하는지 묻는다.","ap":"GFP 융합 탐침으로 일곱 가지 포스포이노시타이드의 미토콘드리아 근접 여부를 공초점 현미경으로 확인했다. PI3K와 PIKfyve를 siRNA로 각각 줄이고 HeLa에서 CRISPR-Cas9 단일 및 이중 결손주를 만들어 미토콘드리아 형태를 쟀다. 융합 여부는 PEG 세포 융합 측정, 기질 표적 광활성 GFP 확산, cycloheximide 유도 과융합, 분리 미토콘드리아에 LgBiT와 HiBiT를 나눠 넣은 NanoBiT 측정으로 나눠 봤다. 융합 지점의 소기관 도착 순서는 lattice SIM2 초해상 라이브 이미징과 3D-CLEM으로 추적했고 소포 위 PI(3,4)P2만 없애는 FRB-FKBP 기반 INPP4B 표적화를 썼다. 생체 검증은 Nkx2.5-Cre로 심근세포에서만 PI3K-C2α와 PI3K-C2β를 지운 마우스로 했다.","kf":["class II PI3K의 단일 또는 이중 침묵과 결손은 미토콘드리아 수를 늘리고 길이, 면적, 연결 수를 줄였다. 야생형 발현은 이를 되돌렸으나 인산화효소 활성이 없는 PI3K-C2α-D1268A와 PI3K-C2β-D1213A는 되돌리지 못했다.","조각난 형태는 분열이 늘어서가 아니라 융합이 줄어서 생겼다. 융합과 분열 조절 단백질의 양, DRP1의 Ser616과 Ser637 인산화, DRP1의 미토콘드리아 집결이 모두 변하지 않았다.","NanoBiT 측정에서 일곱 가지 포스포이노시타이드 중 PI(3,4)P2만 분리 미토콘드리아의 융합을 늘렸고 class II PI3K 결손으로 떨어진 융합은 외부에서 넣은 PI(3,4)P2로 회복됐다. 다만 MFN1과 MFN2 또는 OPA1이 없으면 회복되지 않았다.","MFN1 양성 융합 사건의 약 80%에서 PI(3,4)P2 탐침 신호가 MFN1 집결 이후에 나타났다. class II PI3K를 지우면 MFN1과 MFN2 올리고머가 더 큰 분자량 분획으로 이동해 융합이 MFN 조립 다음 단계에서 막힌 것으로 보인다.","트랜스골지 유래 소포는 PI(4)P만 가진 것이 약 60%, PI(4)P와 PI(3,4)P2를 함께 가진 것이 약 20%였다. PI(4)P 단독 소포는 분열 지점에, 두 가지를 함께 가진 소포는 융합 지점에 주로 모였다.","융합 지점에는 소포체가 평균 30초 전에, 트랜스골지 소포가 약 18초 전에 도착했고 소포가 있는 융합이 더 빨랐다. 심근세포 특이 이중 결손 마우스는 60% 이상이 생후 1일에서 2일에 죽고 박출률과 단축률이 떨어지며 Nppa와 Nppb가 올라갔다."],"sig":"세포가 포스포이노시타이드 조합으로 소포를 구분해 미토콘드리아 분열과 융합 중 어느 쪽으로 보낼지 정한다는 모형을 제시한다. 융합 조절에서 지금까지 소포체에 머물던 설명을 골지 유래 소포까지 넓힌다. class II PI3K가 심장 기능에 필요하다는 생체 근거도 함께 제시한다.","lim":"PH TAPP1 탐침과 class II PI3K의 발현이 까다로워 PI(3,4)P2 소포가 MFN 올리고머화의 어느 단계에서 작용하는지는 특정하지 못했다. MFN2는 시험한 조건에서 PI(3,4)P2와 결합하지 않아 PI(3,4)P2가 어떤 효과기를 거치는지는 미정이다. 심근세포 이중 결손 마우스에서 미토콘드리아 조각화가 심장 기능 이상의 원인인지 결과인지도 가리지 못했다.","lab":"미토콘드리아 역학과 세포 대사를 다루고 막 지질 신호가 그 조절의 중심에 있어 연구실 관심 분야와 직접 닿는다. 다만 질량분석 기반 지질체나 단백체는 쓰이지 않고 이미징과 유전학 중심이라 오믹스 기법의 접점은 없다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/SCI_2026-10-08_t1-4_fig1.jpg","label":"Figure 1","cap":"class II PI3K를 잃으면 미토콘드리아가 조각난다는 것을 보여준다. 일곱 가지 포스포이노시타이드 탐침의 미토콘드리아 근접도, siRNA별 형태 변화, CRISPR 결손주의 형태, 야생형과 인산화효소 활성 결손 돌연변이의 회복 여부를 담았다."},{"src":"fig/SCI_2026-10-08_t1-4_fig3.jpg","label":"Figure 3","cap":"PI(3,4)P2를 담은 트랜스골지 소포가 mitofusin 양성 융합 지점에서 융합을 돕는다는 것을 보여준다. MFN1 양성 융합 사건의 초해상 시계열, 3D-CLEM으로 본 MFN1 집결, MFN 올리고머의 수크로스 밀도 분획, 소포 위 PI(3,4)P2만 제거했을 때의 조각화를 담았다."}]},{"j":"Science","w":"2026-10-08","t":"T2","i":1,"ko":"루핀의 독성 quinolizidine 알칼로이드 생산을 이루는 유전적 기반","en":"The genetic basis for the production of toxic quinolizidine alkaloids in lupins","one":"","ab":"루핀은 단백질 작물로 쓸 수 있으나 쓴맛과 독성을 내는 quinolizidine 알칼로이드가 쌓여 활용이 제한된다. 생합성 경로를 몰라 새 육종 기술로 이 알칼로이드를 없애기 어려웠다. 저자들은 좁은잎루핀 Lupinus angustifolius에서 공개된 전사체로 LDC를 미끼로 삼은 공발현 분석을 해 후보 유전자를 고른 뒤 경로 재구성과 돌연변이체 분석으로 효소 15단계를 모두 규명했다. major latex protein 유사 단백질들이 자발적 화학 평형을 가속해 경로에서 큰 몫을 하고 산화환원효소 유사 단백질이 입체선택성을 맡는다. 저자들은 저알칼로이드 좁은잎루핀 계통을 새로 만들고 기존 Lupinus albus 저알칼로이드 계통의 원인 돌연변이도 찾아냈다. 같은 호 Perspective가 이 논문을 다룬다.","tags":["식물 생화학","대사 경로","작물 육종"],"doi":"10.1126/science.aei5520","url":"https://www.science.org/doi/10.1126/science.aei5520","au":"Mancinotti D et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"T2","i":2,"ko":"바다눈의 점도가 미생물 분해와 해양 탄소 흡수를 조절한다","en":"Marine snow viscosity regulates microbial degradation and the ocean carbon sink","one":"","ab":"바다눈은 가라앉는 유기 입자 덩어리로 해양 탄소 수출의 70%를 차지한다. 응집체의 세균 분해는 전 지구 탄소 순환의 큰 축이지만 개별 응집체에서 세균이 어떻게 자리를 잡고 분해하는지는 거의 알려지지 않았다. 응집체의 탄소가 상층에서 다시 풀리는지 깊은 곳에 격리되는지는 가라앉는 속도와 분해 속도에 달려 있다. 저자들은 분자 회전자를 써서 자연에서 모은 응집체의 나노스케일 점도 분포를 측정했다. 응집체는 균일한 덩어리가 아니라 점도가 낮아 세균이 들어갈 수 있는 영역과 점도가 높아 침투를 막는 영역이 섞인 미소 서식지였다. 점도 감소 속도를 정량한 결과 점도가 높은 응집체는 분해에 더 오래 걸리고 더 깊이 가라앉아 탄소 격리에 더 많이 기여했다. 저자들은 응집체의 미세 물리 구조가 해양 탄소 펌프의 효율을 제한하는 변수라고 제안한다.","tags":["해양 미생물 생태","생물물리","탄소 순환"],"doi":"10.1126/science.adx4170","url":"https://www.science.org/doi/10.1126/science.adx4170","au":"Inman BG et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"T2","i":3,"ko":"산소 활성화를 거친 비대칭 효소 수소인산화 반응","en":"Asymmetric enzymatic hydrophosphorylation through O2 activation","one":"","ab":"인 함유 화합물은 의약과 농약에 널리 쓰이지만 자연에서 효소가 탄소와 인 사이 결합을 만드는 예는 매우 드물어 생체촉매로 얻기가 어려웠다. 저자들은 기존 flavin 의존 효소의 기능을 바꿔 산소 활성화를 거치는 비대칭 수소인산화 반응을 구현했다. 즉 효소가 원래 하던 일 대신 인 수소 결합을 탄소에 붙이는 일을 하도록 바꿨다. 기전 분석에서 반응성 산소종이 반응에 쓰이는 인 중심 라디칼로 전환되고 이어서 라디칼 부가와 효소 매개 수소 원자 전달이 일어나 높은 광학선택성이 나왔다. 이 효소는 화학 촉매로는 다루기 까다로운 여러 인 수소 공여체를 기질로 받아들여 값이 높은 인 함유 골격을 합성했다. 저자들은 이 결과가 생체촉매의 범위를 프로그램 가능한 탄소 인 결합 형성으로 넓히고 효소 안에서 산소의 반응성을 원하는 경로로 흘려보내는 설계 원리를 세운다고 적는다.","tags":["효소 공학","생체촉매","반응 기전"],"doi":"10.1126/science.aef3001","url":"https://www.science.org/doi/10.1126/science.aef3001","au":"Zhou Y et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"EX","i":1,"ko":"","en":"Insights from more than a year of ongoing episodic lava fountaining at Kīlauea","one":"","ab":"","tags":["화산학, 지구과학"],"doi":"10.1126/science.aef2931","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"EX","i":2,"ko":"","en":"Recent strengthening of eastern Pacific ENSO in the last millennium paleorecord","one":"","ab":"","tags":["고기후, 기후"],"doi":"10.1126/science.ady2660","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"","dem":false,"figs":[]},{"j":"Science","w":"2026-10-08","t":"EX","i":3,"ko":"","en":"High-fidelity entangling gates and nonlocal circuits with neutral atoms","one":"","ab":"","tags":["양자정보, 물리"],"doi":"10.1126/science.aei1312","url":"","au":"","aff":"","type":"","bg":"","ap":"","kf":[],"sig" "","overview":"2026-10-01부터 2026-10-08까지 PubMed에 새로 등록된 Cancer Cell 논문은 4편이다. 그중 1편은 같은 호 연구 논문을 다룬 Preview여서 연구 논문이 아니므로 제외했고, 남은 3편 모두 생명과학 연구 논문이어서 비생명과학으로 뺀 논문은 없다. 3편 모두 암 연구이며, 두 편은 대규모 오믹스 자원을 새로 만들어 종양 세포 상태를 다시 정의했고(위암 염색질 접근성 아틀라스, 신경모세포종 공간 오믹스 아틀라스) 한 편은 암 백신과 항암화학요법의 병용 기전을 다뤘다. 세 편 중 두 편이 CD8+ T 세포를 축으로 면역치료 반응을 설명하는 점이 이번 주의 흐름이다. 월간지 선공개 분이라 권과 호가 아직 배정되지 않았고 표지 논문도 정해지지 않았다.","cover":{"title_ko":"","title_en":"","note":""},"report":"Cancer-Cell/2026-10-08/journal-digest-2026-10-08.pdf","n1":3,"n2":0,"nex":0},{"journal":"Cancer Communications","week":"2026-10-08","folder":"Cancer-Communications","volume":"46","issue":"","overview":"PubMed 등록일 기준으로 2026-10-01부터 2026-10-08까지 Cancer Communications에 올라온 논문은 5편이었고, 소세포폐암 50년을 정리한 리뷰 1편을 빼고 연구 논문 4편을 담았다. 3-1절 분야 필터로 제외한 비생명과학 논문은 없다. 네 편 모두 암 연구로 위암 면역치료 저항성, 상피성 난소암 항체약물접합체 재배치, 자연살해/T세포 림프종의 바이러스 유전체, 간세포암 대식세포 면역 회피를 다루며, 지질과 지방산 대사가 세 편에 공통으로 등장한다. 네 편 모두 CC BY 4.0이고 PubMed Central 에서 전문을 구했으나, 연구 논문 1편을 뺀 세 편은 Letter라 초록이 따로 없어 본문을 요약해 실었다. 이번 주 확인 결과 저널 플랫폼이 Wiley에서 Science Partner Journals로 옮겨 DOI 체계가 10.34133/cancomm.* 로 바뀌었고, spj.science.org는 Cloudflare 확인에 막혀 열지 못했다.","cover":{"title_ko":"","title_en":"","note":""},"report":"Cancer-Communications/2026-10-08/journal-digest-2026-10-08.pdf","n1":1,"n2":3,"nex":0},{"journal":"Cancer Discovery","week":"2026-10-08","folder":"Cancer-Discovery","volume":"","issue":"","overview":"PubMed 등록일 기준으로 2026-10-01부터 2026-10-08까지 Cancer Discovery에 올라온 항목은 7건이었다. 그중 연구 논문은 2편이고, 나머지 5건은 뉴스 1건, 동반 논문을 해설하는 In the Spotlight 2건, 리뷰 1편, 커멘터리 1건이어서 연구 논문이 아니라는 이유로 뺐다. 3-1절 분야 필터로 제외한 비생명과학 논문은 없다. 남은 2편은 모두 암 연구로, 고형암 환자 39,184명의 생식세포 시퀀싱 코호트와 교모세포종 수술 경계부의 단일세포 공간전사체다. aacrjournals.org가 Cloudflare 확인에 막히고 두 편 모두 PubMed Central에 수록되어 있지 않아 전문을 읽을 수 없었으므로, 지침서 4-2절에 따라 Tier 1 없이 두 편 모두 Tier 2로 넣었다.","cover":{"title_ko":"","title_en":"","note":""},"report":"Cancer-Discovery/2026-10-08/journal-digest-2026-10-08.pdf","n1":0,"n2":2,"nex":0},{"journal":"Cell","week":"2026-09-17","folder":"Cell","volume":"189","issue":"19","overview":"이번 주 Cell은 연구 논문 17편을 실었고 모두 생명과학이라 전부 담았다. 생물학 분야 인공지능 특집이 중심을 이룬다. 인공지능과 단일세포 자원 6편, 공간 오믹스 자원 4편, 대사와 면역 1편, 암 세포치료 1편, 신경퇴행 1편, 심장 1편, 장 생리 1편, 구조생물학 1편, 식물 1편이다. 특집에는 교란 반응 예측 모델, 자동 수집 단일세포 저장소, 1억 건 규모 약물 반응 아틀라스, 미토콘드리아 표현학습, 노화 벤치마크, 임상 자료 기반 암 예측 모델이 함께 실렸다.","cover":{"title_ko":"노화 생물학 인공지능을 위한 공개 벤치마크와 언어 모델","title_en":"An open benchmark and language models for AI in aging biology","note":"표지는 LongevityBench를 기하학적 부조로 표현했다. 구멍을 통과하지 못하는 큰 구체는 모델 크기만으로는 특화된 노화 과제를 풀 수 없다는 핵심 결과를 나타낸다."},"report":"Cell/2026-09-17/journal-digest-2026-09-17.pdf","n1":5,"n2":12,"nex":0},{"journal":"Cell","week":"2026-10-01","folder":"Cell","volume":"189","issue":"20","overview":"이번 호 Cell은 연구 논문 17편을 실었고 모두 생명과학이라 전부 담았다. 제외한 논문은 없다. 비연구 기사는 Preview 3편, Review 1편, Commentary 1편으로 다섯 건이었다. 중심은 MitoCarta Tree of Life 컨소시엄 특집이고, 질량분석 기반 미토콘드리아 단백체 목록 2건과 진핵생물 전체를 가로지르는 비교 단백체 분석 1건, Acanthamoeba ATP synthase 저온전자현미경 구조 1건이 함께 묶여 있다. 분야 분포는 미토콘드리아와 단백체 4편, 기생충과 미생물 생리 3편, 식물과 식물 미생물 상호작용 2편, 염색질과 전사 조절 2편, 신경과학 2편, 구조생물학 1편, DNA 손상 반응 1편, 바이러스 감염과 지질 대사 1편, 종양 영상 기술 1편이다. 질량분석 단백체, 단일세포 오믹스, 영상 기반 3차원 조직학처럼 대규모 측정 기술을 직접 생산한 논문이 여러 편 몰린 호다.","cover":{"title_ko":"MitoCarta Tree of Life 컨소시엄 특집","title_en":"MitoCarta Tree of Life (MitoTOL) Consortium","note":"표지는 Acanthamoeba castellanii에서 정제한 미토콘드리아의 투과전자현미경 사진을 수채화풍으로 렌더링한 것이다. 표지 설명은 개별 논문이 아니라 MitoTOL 컨소시엄 묶음을 가리키며, 감염성 원생동물 5종과 육상식물 Arabidopsis thaliana를 포함한 단백체 목록 6건과 약 200종 진핵생물의 계산 진화 분석, 분기한 병원체의 미토콘드리아 복합체 구조 연구가 함께 실렸다고 적는다. 이미지 제공은 Tiana Issa, Jon Stefely, Vamsi Mootha다."},"report":"Cell/2026-10-01/journal-digest-2026-10-01.pdf","n1":5,"n2":12,"nex":0},{"journal":"Molecular Cell","week":"2026-10-08","folder":"Molecular-Cell","volume":"86","issue":"19","overview":"2026-10-01부터 2026-10-08까지 PubMed에 등록된 Molecular Cell 항목은 13건이었고 그중 연구 논문은 10편이다. 나머지 3건은 해설 성격의 Review 1편과 Preview 2편이라 보고서에서 제외했다. 생명과학이 아닌 논문은 없어 분야 필터로 뺀 논문은 없다. 10편은 염색질과 후성유전 조절 2편, DNA 복제와 수선 2편, 미토콘드리아 단백체 2편, RNA 결합과 번역 조절 2편, 핵산 감지와 선천면역 2편으로 고르게 나뉘었다. 기전 연구가 많아 전장 규모 오믹스를 연구의 중심에 둔 논문은 4편뿐이었고, 그중 질량분석 단백체를 직접 생산한 kinetoplastid 미토콘드리아 논문 2편이 동반 논문으로 함께 실렸다. 4편은 10월 1일 발행된 86권 19호 수록 논문이고 6편은 선공개 논문이다.","cover":{"title_ko":"","title_en":"","note":""},"report":"Molecular-Cell/2026-10-08/journal-digest-2026-10-08.pdf","n1":2,"n2":8,"nex":0},{"journal":"Nature","week":"2026-09-17","folder":"Nature","volume":"657","issue":"8132","overview":"이번 주 Nature는 연구 논문 25편을 실었고, 그중 생명과학 15편을 이 보고서에 담았다. 천문과 물리, 재료, 화학, 대기과학, 기상, 사회과학 10편은 분야가 맞지 않아 제외했다. 담은 15편의 분포는 암 모델과 유전자 의존성 5편, 신경과학 3편, 대사 유전체 1편, 공간 단백체 1편, 미생물 1편, 생물물리 1편, 산림생태 1편, 구조생물학 1편, 세포생물학 1편이다. 암 모델 쪽이 가장 두텁다. 환자 유래 오가노이드 바이오뱅크, 차세대 환자 유래 모델 집성, 3차원 암 모델을 더한 의존성 지도가 한 호에 함께 실렸다.","cover":{"title_ko":"인공지능을 이용한 실무 열대저기압 예보","title_en":"Operational tropical cyclone forecasting with AI","note":"표지는 열대저기압 예보를 주제로 한다. 인공지능 모형 WeatherNext Cyclones가 경로와 강도, 크기를 15일 앞까지 예측한다."},"report":"Nature/2026-09-17/journal-digest-2026-09-17.pdf","n1":5,"n2":10,"nex":10},{"journal":"Nature","week":"2026-10-08","folder":"Nature","volume":"658","issue":"8135","overview":"2026-10-08 Nature 658권 8135호의 연구 논문은 Article 25편이다. 이 가운데 생명과학 논문 15편을 보고서에 담고 물리, 재료, 광학, 로봇, 순수 화학에 해당하는 10편은 제외했다. 담은 15편은 신경과학 3편, 암 관련 3편, 유전체와 단일세포 정보학 3편, 노화와 대사 2편, 미생물과 바이러스 2편, 구조생물과 약리 1편, 식물 생태 1편으로 나뉜다. Lsp2가 Drosophila의 번역과 수명을 잇는다는 동반 논문 2편이 같은 호에 나란히 실렸고, 환형 DNA(ecDNA)와 종양배출림프절을 다룬 암 논문 두 편이 공간 오믹스와 단일세포 오믹스를 핵심 수단으로 썼다. News & Views 4편은 이종피질화, 2D 반도체, 파리 식이제한 수명, 환형 DNA를 각각 다룬다.","cover":{"title_ko":"생쥐에 사람 유래 오르가노이드를 이식해 발생기 이종피질을 만든다","title_en":"Developmental xenocortication using human-derived organoids in mice","note":"표지는 대뇌피질과 해마가 유전적으로 제거된 생쥐 머리 안에 사람 피질 오르가노이드가 자리잡은 모습을 그림으로 보여준다. 이식편이 피질 공간 대부분을 채우고 숙주 뇌와 연결되는 이 논문의 설계를 나타낸다.","credit":"Cover image: Mesa Schumacher"},"report":"Nature/2026-10-08/journal-digest-2026-10-08.pdf","n1":5,"n2":10,"nex":10},{"journal":"Nature Cancer","week":"2026-10-08","folder":"Nature-Cancer","volume":"","issue":"","overview":"2026-10-01부터 2026-10-08까지 PubMed에 새로 등록된 Nature Cancer 연구 논문은 1편이다. 초록이 없는 Brief Communication 논평은 수집 단계에서 걸러냈고, 비생명과학으로 제외한 논문은 없다. 남은 1편은 대장암에서 장 상피의 GSK3β가 lactate와 fumarate를 거쳐 종양 침윤 호중구를 면역억제성 상태로 재편한다는 대사-후성유전 축 연구다. 점수로는 Tier 1 후보였지만 nature.com이 구독 전용이고 PMC 등록도 없어 본문 전문을 구하지 못했다. 지침서 4-2절에 따라 Tier 2로 내렸고 이번 주 Nature Cancer의 Tier 1은 없다.","cover":{"title_ko":"","title_en":"","note":""},"report":"Nature-Cancer/2026-10-08/journal-digest-2026-10-08.pdf","n1":0,"n2":1,"nex":0},{"journal":"Nature Genetics","week":"2026-10-08","folder":"Nature-Genetics","volume":"58","issue":"10","overview":"2026-10-01부터 2026-10-08까지 PubMed에 등록된 Nature Genetics 항목은 9건이었고 그중 연구 논문은 4편이다. 나머지 5건은 같은 쪽에 묶인 Research Highlight 4건과 2쪽짜리 Research Briefing 1건이어서 제외했다. 4편은 모두 사람 유전학이라 분야 필터로 뺀 논문은 없다. 식물과 농업 유전체 논문은 같은 호에 실려 있으나 이번 주 등록 범위에는 들어오지 않았다. 주제는 희귀 코딩 변이의 기능 예측, 표현형 대체 추정으로 지능 유전 분석의 검정력을 높인 연구, 단일 대립유전자 염색질 구조로 조절 변이의 기전을 규명한 연구, 유전자 교정으로 배아기 globin을 재활성화한 전임상 연구로 나뉘며 네 편 모두 전장 규모 유전체 또는 후성유전체 분석을 쓴다. 3편은 58권 10호 수록 논문이고 1편은 선공개 논문이다.","cover":{"title_ko":"밀의 진딧물 저항성","title_en":"Gb3 encodes a unique kinase fusion protein conferring greenbug resistance in wheat","note":"표지는 밀의 greenbug 저항성을 다룬다. Gb3가 MAP3K 유사 도메인을 가진 세포 내 kinase와 pseudokinase 융합 단백질을 암호화해 여러 greenbug biotype에 저항성을 준다는 Lhamo et al.의 논문이다. 이 논문은 이번 주 PubMed 등록 범위에 들어오지 않아 본문에서는 다루지 않는다."},"report":"Nature-Genetics/2026-10-08/journal-digest-2026-10-08.pdf","n1":2,"n2":2,"nex":0},{"journal":"Science","week":"2026-09-17","folder":"Science","volume":"393","issue":"6817","overview":"이번 주 Science는 연구 논문 15편을 실었고, 그중 생명과학 9편을 이 보고서에 담았다. 물리 3편과 대기화학, 지진학, 네트워크 이론 각 1편은 분야가 맞지 않아 제외했다. 담은 9편의 분포는 CRISPR 기원 2편, 암 유전역학 1편, 세포 이미징과 대사 1편, 신경발달 1편, 의료 인공지능 1편, 혈액과 면역 1편, 고유전체 1편, 보전생태 1편이다. CRISPR-Cas의 기원을 다룬 두 편이 같은 연구진에서 나란히 실려 같은 호 Perspective의 대상이 됐다.","cover":{"title_ko":"생식선 EGFR T790M 변이와 폐암 위험","title_en":"Germline EGFR T790M mutation and lung cancer risk","note":"표지 그림은 폐와 미국 지도를 겹쳐 EGFR T790
