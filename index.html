<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFBF9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="서가">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>저널 서가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* 레이아웃: 왼쪽 고정 레일(마스트헤드+필터) | 목록(읽기 폭) | 넓은 화면에서 읽기 패널. 카드 없이 hairline과 타이포로만 위계를 만든다. */
:root{
  --paper:#FBFBF9; --paper2:#F3F3EF; --ink:#15191F; --body:#3A3F47; --dim:#6F757E; --faint:#A1A6AD;
  --line:#E4E4DF; --line2:#C9C9C2; --mark:#8C6A2A; --onink:#FBFBF9; --danger:#8A2B16;
  --fd:"Noto Serif KR",ui-serif,"Apple SD Gothic Neo","Malgun Gothic",serif;
  --fb:"IBM Plex Sans KR",-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --fe:"Newsreader",ui-serif,Georgia,"Times New Roman",serif;
  --rail:236px; --read:560px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111417; --paper2:#191D22; --ink:#ECEAE4; --body:#C4C2BB; --dim:#8E9199; --faint:#5F636B;
  --line:#262A30; --line2:#363B43; --mark:#C7A45A; --onink:#111417; --danger:#E8846A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111417; --paper2:#191D22; --ink:#ECEAE4; --body:#C4C2BB; --dim:#8E9199; --faint:#5F636B;
  --line:#262A30; --line2:#363B43; --mark:#C7A45A; --onink:#111417; --danger:#E8846A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--body);font-family:var(--fb);font-size:15px;line-height:1.7;
  -webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
[hidden]{display:none!important}

/* 골격 */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
@media (min-width:1180px){ .app{grid-template-columns:var(--rail) minmax(0,1fr) minmax(0,var(--read))} }
@media (max-width:860px){ .app{grid-template-columns:minmax(0,1fr)} }

/* 레일 */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;padding:28px 22px 24px 24px;
  border-right:1px solid var(--line);display:flex;flex-direction:column;gap:26px;scrollbar-width:thin}
.mast .kicker{font-family:var(--fe);font-style:italic;font-size:14px;color:var(--dim);letter-spacing:.01em}
.mast h1{font-family:var(--fd);font-weight:600;font-size:26px;line-height:1.2;color:var(--ink);margin:2px 0 0;letter-spacing:-.01em}
.mast .rule{height:2px;background:var(--ink);margin:14px 0 0}
.mast .sum{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.6}
.mast .sum b{color:var(--ink);font-weight:600}

.grp h3{font-family:var(--fb);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);margin:0 0 6px}
.opt{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:4px 0;font-size:13.5px;
  color:var(--body);line-height:1.45;border-bottom:1px solid transparent}
.opt:hover{color:var(--ink)}
.opt .n{margin-left:auto;font-family:var(--fe);font-size:13px;color:var(--faint);padding-left:10px}
.opt[aria-pressed="true"]{color:var(--ink);font-weight:600}
.opt[aria-pressed="true"] .n{color:var(--ink)}
.opt .sw{width:7px;height:7px;border-radius:50%;background:var(--jc,var(--line2));flex:0 0 auto;position:relative;top:-1px}
.opt .tick{width:12px;flex:0 0 auto;font-family:var(--fe);color:var(--mark);visibility:hidden}
.opt[aria-pressed="true"] .tick{visibility:visible}
.more{font-size:12px;color:var(--dim);padding:6px 0 0;text-decoration:underline;text-underline-offset:3px}
.railfoot{margin-top:auto;font-size:12px;color:var(--faint);line-height:1.6;display:flex;flex-direction:column;gap:6px}
.railfoot button{text-align:left;color:var(--dim);text-decoration:underline;text-underline-offset:3px}

/* 목록 */
.main{min-width:0;padding:28px 40px 72px;max-width:760px;width:100%}
.search{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line2);padding:2px 0 8px}
.search svg{width:16px;height:16px;color:var(--faint);flex:0 0 auto}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink);padding:4px 0;outline:none}
.search input::placeholder{color:var(--faint)}
.search .cnt{font-family:var(--fe);font-size:14px;color:var(--dim);white-space:nowrap}
.active{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;min-height:0}
.active:empty{display:none}
.active button{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:2px 8px}
.active button:hover{color:var(--ink);border-color:var(--line2)}

.week{margin-top:30px}
.week:first-child{margin-top:22px}
.week h2{font-family:var(--fd);font-weight:600;font-size:19px;word-break:keep-all;color:var(--ink);margin:0;display:flex;align-items:baseline;gap:12px}
.week h2 small{font-family:var(--fe);font-weight:400;font-size:14px;color:var(--dim);margin-left:auto}
.week .r{height:1px;background:var(--ink);margin:8px 0 4px}

.item{padding:16px 0 18px;border-bottom:1px solid var(--line);cursor:pointer}
@media (hover:hover){ .item:hover .ttl{color:var(--mark)} }
.item.sel .ttl{color:var(--mark)}
.item.done{opacity:.45}
.item.ex{padding:9px 0 10px}
.eye{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.eye .j{color:var(--jc)}
.eye .t1{color:var(--mark)}
.eye .t2{color:var(--dim);font-weight:500}
.eye .dm{color:var(--danger);font-weight:500;letter-spacing:.04em;text-transform:none}
.eye .ty{font-weight:500;letter-spacing:.04em;text-transform:none;color:var(--faint)}
.eye .rd{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:inline-flex;
  align-items:center;justify-content:center;color:transparent;flex:0 0 auto}
.eye .rd:hover{border-color:var(--ink);color:var(--ink)}
.eye .rd.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
.eye .rd svg{width:11px;height:11px}
.ttl{font-family:var(--fd);font-weight:600;color:var(--ink);line-height:1.45;margin:7px 0 0;text-wrap:balance;letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere}
.item.t1 .ttl{font-size:20px}
.item.t2 .ttl{font-size:16.5px;font-weight:500}
.item.ex .ttl{font-family:var(--fe);font-weight:400;font-size:15px;color:var(--dim);margin-top:3px;letter-spacing:0}
.en{font-family:var(--fe);font-style:italic;font-size:15px;color:var(--dim);line-height:1.4;margin-top:4px}
.lead{margin:9px 0 0;color:var(--body);font-size:14.5px}
.meta{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;margin-top:9px;font-size:12.5px;color:var(--faint)}
.meta .tg{min-width:0}
.meta a{color:var(--dim);text-decoration:none;white-space:nowrap;margin-left:auto}
.meta a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.none{color:var(--dim);padding:56px 0;text-align:center}

/* 상세 (인라인 + 패널 공용) */
.det{margin-top:16px;padding-top:4px;cursor:auto}
.det h3{font-family:var(--fb);font-size:10.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  margin:20px 0 6px;display:flex;align-items:center;gap:10px}
.det h3::after{content:"";flex:1;height:1px;background:var(--line)}
.det h3:first-child{margin-top:0}
.det p{margin:0 0 8px;font-size:14.5px}
.det .au{font-size:13px;color:var(--dim);line-height:1.6}
.det .abs p{font-family:var(--fd);font-size:14.5px;line-height:1.85;color:var(--body)}
.kf{list-style:none;margin:0;padding:0;counter-reset:k}
.kf li{position:relative;padding-left:30px;margin-bottom:9px;counter-increment:k;font-size:14.5px}
.kf li::before{content:counter(k);position:absolute;left:0;top:2px;font-family:var(--fe);font-size:15px;color:var(--mark)}
.lic{font-size:12px;color:var(--faint);margin-top:14px;line-height:1.55}
figure{margin:14px 0 0}
figure img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
figcaption{font-size:12.5px;color:var(--dim);margin-top:7px;line-height:1.55}
figcaption i{font-family:var(--fe);color:var(--ink);font-size:13.5px;margin-right:6px}
.det .links{display:flex;gap:16px;margin-top:18px;font-size:13px}
.det .links a{color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* 읽기 패널 */
.pane{display:none}
@media (min-width:1180px){
  .pane{display:block;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;border-left:1px solid var(--line);
    padding:28px 36px 60px;min-width:0;scrollbar-width:thin}
  .main .det{display:none}
}
.pane .empty{color:var(--faint);font-family:var(--fe);font-style:italic;font-size:16px;padding-top:40vh;text-align:center}
.pane .head .eye{font-size:11px}
.pane .head .ttl{font-size:22px;cursor:auto}
.pane .head .ttl:hover{color:var(--ink)}
.pane .head .en{font-size:15.5px}
.pane .head .one{font-size:14.5px;color:var(--body);margin:12px 0 0;padding:10px 0 14px;border-bottom:1px solid var(--line)}
.pane .close{display:block;margin:-8px 0 10px auto;color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.pane .close:hover{color:var(--ink)}

/* 모바일 상단 */
.top{display:none}
@media (max-width:860px){
  .rail{display:none}
  .main{padding:18px 16px 60px;max-width:none}
  .top{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
  .top h1{font-family:var(--fd);font-weight:600;font-size:22px;color:var(--ink);margin:0;line-height:1.2}
  .top .k{font-family:var(--fe);font-style:italic;font-size:13px;color:var(--dim)}
  .top .fb{margin-left:auto;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .sheet{position:fixed;inset:0;z-index:50;background:var(--paper);overflow:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
  .sheet .rail{display:flex;position:static;height:auto;border:0;padding:0;overflow:visible}
  .sheet .mast{display:none}
  .sheet .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .sheet .sh h2{font-family:var(--fd);font-size:18px;color:var(--ink);margin:0}
  .sheet .sh button{font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
  .item.t1 .ttl{font-size:18.5px}
}
@media (min-width:861px){ .sheet{display:contents} .sheet .sh{display:none} }
@media (prefers-reduced-motion:no-preference){ .item{transition:opacity .15s} }
</style>

</head>
<body>
<div class="app">
  <div class="sheet" id="sheet">
    <div class="sh"><h2>필터</h2><button id="shClose">닫기</button></div>
    <aside class="rail">
      <div class="mast">
        <div class="kicker">Weekly Journal Digest</div>
        <h1>저널 서가</h1>
        <div class="rule"></div>
        <div class="sum" id="sum"></div>
      </div>
      <div class="grp"><h3>주차</h3><div id="fWk"></div></div>
      <div class="grp"><h3>저널</h3><div id="fJn"></div></div>
      <div class="grp"><h3>등급</h3><div id="fTr"></div></div>
      <div class="grp"><h3>주제</h3><div id="fTg"></div><button class="more" id="more">더 보기</button></div>
      <div class="railfoot">
        <button id="pTh">야간</button>
        <span>갱신 <span id="gen"></span><br>원고 PDF와 리포트는 데스크톱 서가에서 본다</span>
      </div>
    </aside>
  </div>

  <main class="main">
    <div class="top"><h1>저널 서가</h1><span class="k">Weekly Digest</span><button class="fb" id="shOpen">필터</button></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="제목, 초록, 핵심 결과에서 찾기" autocomplete="off" aria-label="검색">
      <span class="cnt" id="cnt"></span>
    </label>
    <div class="active" id="active"></div>
    <div id="list"></div>
  </main>

  <aside class="pane" id="pane"><div class="empty">제목을 고르면 여기에 펼쳐진다</div></aside>
</div>

<script id="d" type="application/json">{"papers":[{"j":"Cancer Cell","w":"2026-10-08","t":"T1","i":1,"ko":"염색질 접근성 궤적으로 드러난 전암 단계의 후성유전 예비화와 산성화로 면역치료에 저항하는 위암 아형","en":"Chromatin accessibility trajectories reveal pre-cancerous epigenetic priming and an acid-driven immunotherapy-resistant gastric cancer subtype","one":"환자 439명의 위 조직 650개로 염색질 접근성 아틀라스를 만들어, 장상피 이형성 단계의 후성유전 예비화와 위 양성자 펌프로 산성 미세환경을 만들어 면역치료에 저항하는 pseudo-gastric 아형을 규정했다.","ab":"염색질 역동성이 다단계 발암을 어떻게 이끌고 치료 선택에 쓰일 수 있는지는 분명하지 않았다. 저자들은 환자 439명의 다단계 위 조직 650개로 염색질 접근성 아틀라스를 만들어 ATAC-seq 피크 227,562개를 정의하고, scATAC-seq 세포 47,735개와 RNA-seq를 함께 써서 상피 유래 피크만 분석했다. 장형 위암 경로에서 동적 피크 24,841개가 10개 군집으로 갈렸고, 장상피 이형성 단계에 이미 암과 닮은 permissive 염색질 상태가 생겨 ATF3를 비롯한 전사인자가 이를 발암으로 이어받았다. 진행 위암은 proliferative, pseudo-gastric, mesenchymal-inflammatory 세 후성유전체 아형으로 나뉘었다. pseudo-gastric 아형은 FOSL2가 ATP4A와 ATP4B를 올려 H+를 내보내 CD8+ T 세포를 억제하고 선행 면역화학치료에 거의 반응하지 않았으며, FOSL2 제거나 산 분비 억제제 vonoprazan은 이 저항을 완화했다.","tags":["위암","후성유전체","암 면역치료","약물 저항성"],"doi":"10.1016/j.ccell.2026.09.004","url":"https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00401-0","au":"Wang T, Xiang J, …, Bian XW, Wang Z, Bai F, Wang B","aff":"Department of Gastroenterology, Chongqing Key Laboratory of Digestive Malignancies, Daping Hospital, Army Medical University, Chongqing, China; Institute of Pathology and Southwest Cancer Center, Southwest Hospital, Army Medical University, Chongqing, China; Department of Surgical Oncology and General Surgery, The First Hospital of China Medical University, Shenyang, China; Biomedical Pioneering Innovation Center (BIOPIC), School of Life Sciences, Peking University, Beijing, China; Jinfeng Laboratory, Chongqing, China","type":"Article","bg":"염색질 접근성 변화는 진행된 암에서 많이 연구됐지만 전암 병변의 지형은 대장 선종을 빼면 거의 알려지지 않았다. 암 전구 병변은 전사체가 크게 바뀌어도 발암 유전자 돌연변이는 적어, 염색질이 돌연변이보다 먼저 악성 잠재력을 담고 있을 가능성이 제기됐다. 또 위암에서 면역관문억제제 반응을 가르는 기존 TCGA 분류는 MSI-H와 EBV 양성 약 20%만 집어내는데 실제 선행 면역화학치료 반응자는 40%를 넘는다. 저자들은 위 발암의 다단계 염색질 궤적을 그려낼 수 있는지, 그리고 종양 간 후성유전체 다양성이 면역치료 반응을 가를 수 있는지 물었다.","ap":"중국 남서부 Daping 병원과 북동부 China Medical University First Affiliated Hospital에서 모은 정상 위점막, 비위축성 위염, 위축성 위염, 장상피 이형성, 위암 다섯 단계 650개 시료(환자 439명)로 벌크 ATAC-seq를 수행했다. 환자 3명의 연속 9개 시료로 scATAC-seq를 수행해 세포 47,735개를 얻고, 면역 및 기질 세포 특이 피크를 뺀 상피 유래 피크를 분리하는 파이프라인을 만들어 EpCAM+ 분리 세포 데이터로 검증했다. 짝지은 RNA-seq와 snRNA-seq를 통합해 피크-유전자 조절망과 전사인자 순위를 구성했다. 진행 위암 439개 종양의 접근 가능 영역 222,534개를 consensus k-means와 상관 계층 군집으로 아형화하고 NTP로 TCGA-STAD와 ACRG 코호트에 투사했다. 아형별 면역치료 반응은 위 및 위식도 접합부 선암 선행 면역화학치료 2상 시험(NCT05515796) 참여자 86명의 사후 분석과 외부 코호트 두 개로 평가했고, 기전은 환자 및 생쥐 암 오가노이드, 자가 CD8+ T 세포 공배양, 동소 이식 모델로 확인했다.","kf":["정상 조직 피크는 ENCODE와 Roadmap 데이터와 64.19% 겹쳤고, 위암 피크는 TCGA-STAD와 42.14%만 겹쳐 57.86%가 새로 찾은 조절 영역이었다. 위염, 위축, 장상피 이형성 단계의 접근성 데이터는 그동안 사실상 없었다.","장상피 이형성에서 위암까지 동적 피크 24,841개가 10개 군집(C1~C10)으로 갈렸고, 그중 C9는 장상피 이형성 특이 피크의 약 절반을 차지하며 scATAC-seq에서 찾은 metaplastic-tumor shared 염색질 상태와 겹쳤다.","C9의 permissive 상태는 유전자 1,427개가 염색질은 장상피 이형성에서 이미 열리지만 발현은 암에서야 올라가는 지연 양상을 보였고, 위암 위험이 더 높은 불완전형 장상피 이형성에서 활성이 더 높았다.","ATF3는 permissive 상태와 C10 발암 군집 유지에 필요했다. IM 유사 Kras^LSL-G12D 위 상피 오가노이드에 ATF3를 넣으면 종양 형성이 늘었고, Anxa10-CreER^T2;Trp53^fl/fl;Kras^LSL-G12D 생쥐에서 위점막 특이 Atf3 제거는 종양 형성을 억제했다.","진행 위암은 proliferative(P), pseudo-gastric(PG), mesenchymal-inflammatory(MI) 세 아형으로 각각 약 1/3씩 나뉘었고, PG 아형은 전사체 분류나 ACRG, TCGA 분류로는 잡히지 않았다. 선행 면역화학치료 2상 시험 86명 중 P 아형은 70%가 넘게 주요 병리학적 반응을 보였으나 PG 아형은 약 1/4만 반응했고, 전이 또는 재발 위암 코호트에서 PG 유사 아형의 반응률은 6.25%로 가장 낮았다.","PG 아형은 FOSL2가 ATP4A와 ATP4B를 올려 H+를 내보내 미세환경을 산성화하고 자가 CD8+ T 세포의 생존과 세포독성을 떨어뜨렸다. Atp4a와 Atp4b 또는 Fosl2 제거, 또는 vonoprazan 투여는 종양 내 CD8+ T 세포를 늘려 항PD-1과 oxaliplatin 병용 효과를 높였고, PG 아형 환자 30명 사후 분석에서 vonoprazan을 쓴 환자의 55.6%가 반응자였던 반면 쓰지 않은 환자는 14.3%였다."],"sig":"염색질 접근성 기반 아형 분류가 기존 전사체 및 TCGA 분류로는 잡히지 않는 면역치료 저항군을 가려낼 수 있음을 보였다. 또 종양이 기원 조직의 생리 기능인 위산 분비를 되살려 T 세포를 억제하는 경로를 제시하고, 이미 임상에서 쓰는 산 분비 억제제 vonoprazan을 병용 후보로 내놓는다. 저자들은 vonoprazan 관련 임상 근거가 사후 분석에서 나온 가설 수준이라고 밝힌다.","lim":"후성유전체 아형 분류의 면역치료 유도 효용과 vonoprazan 효과는 모두 2상 시험의 사후 분석 결과여서 충분한 검정력을 갖춘 전향 시험으로 확인해야 한다. 저자들은 FOSL2와 ATP4A/ATP4B를 대리 표지자로 쓸 수 있을 것으로 보지만 임상에 쓸 분류기를 세우는 일은 남아 있다고 적는다. PG 유사 생쥐 모델이 Trp53 결손, Kras^G12D 배경에 Myc 과발현을 더한 것이어서 PG 계통 상태와 MYC 효과를 설계상 가르기 어렵다.","lab":"벌크 ATAC-seq와 scATAC-seq, RNA-seq, snRNA-seq를 묶어 상피 유래 신호만 분리한 파이프라인은 다중 오믹스 통합 분석의 참고가 된다. 종양 세포가 H+ 수송체로 미세환경 pH를 바꿔 CD8+ T 세포를 억제한다는 결과는 암 대사와 종양 면역이 맞물리는 지점이라 세포 대사 축 연구와 연결된다. FOSL2-ATP4A/ATP4B 축은 단백 수준 검증이 남은 표적이라 질량분석 기반 단백체를 덧붙일 여지가 있다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CCL_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"위 발암의 다섯 병리 단계 650개 시료로 만든 염색질 접근성 아틀라스의 연구 설계와, 단계에 따라 순차로 갈리는 상피 염색질 접근성 궤적을 보여준다. 동적 피크 10개 군집(C1~C10)과 각 군집의 기능 전환, 전사인자 전환도 함께 제시한다."},{"src":"fig/CCL_2026-10-08_t1-1_fig5.jpg","label":"Figure 5","cap":"pseudo-gastric 아형이 ATP4A와 ATP4B를 통해 H+를 내보내 종양 미세환경을 산성화하는 과정을 환자 조직 pH와 면역조직화학으로 보이고, 산성 환경이 자가 CD8+ T 세포의 생존과 세포독성을 떨어뜨리는 것을 오가노이드 공배양과 동소 이식 생쥐에서 확인한다."}]},{"j":"Cancer Cell","w":"2026-10-08","t":"T1","i":2,"ko":"공간 오믹스로 가려낸 신경모세포종의 ADRN과 MES 세포 상태","en":"Spatial omics resolves adrenergic and mesenchymal cell states in neuroblastoma","one":"신경모세포종 54개 종양을 sc/snRNA-seq와 여섯 가지 공간 오믹스로 함께 분석해, 세포주에서 만든 기존 MES 서명이 환자 종양의 MES 암세포를 찾지 못한다는 것을 보이고 O-PDX 기반 새 서명으로 그 존재와 예후 가치를 확인했다.","ab":"신경모세포종 세포주는 ADRN 또는 MES 특징을 보이지만 환자 종양에 MES 암세포가 있는지는 논쟁이 이어졌다. 저자들은 임상, 유전, 조직학 범위를 넓게 잡은 종양 54개(환자 50명)를 sc/snRNA-seq 프로파일 543,948개, 벌크 RNA-seq, 공간 전사체, 공간 단백체로 분석했다. 종양 세포는 면역 및 기질 세포와 분리된 고유 이웃을 이뤘으나 세포주에서 만든 기존 ADRN/MES 서명은 MES 암세포를 찾아내지 못했고, MES 서명은 오히려 기질과 혈관 군집에서 높았다. 그래서 초기 계대 동소 이식 환자 유래 종양(O-PDX)에서 각각 28개 유전자로 된 새 ADRN/MES 서명을 만들어 시료 449개에 적용하고, 전사체와 후성유전체, 단백체, 전자현미경, 기능 분석으로 검증했다. SEQC 코호트 498명에서는 MES-ADRN 복합 점수가 높을수록 무사건 생존(HR 1.87)과 전체 생존(HR 2.44)이 나빴다.","tags":["신경모세포종","공간 오믹스","단일세포 전사체","종양 이질성"],"doi":"10.1016/j.ccell.2026.09.008","url":"https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00427-7","au":"Patel AG, Ashenberg O, …, Stewart E, Dyer MA","aff":"Department of Oncology, St. Jude Children's Research Hospital, Memphis, TN, USA; Department of Developmental Neurobiology, St. Jude Children's Research Hospital, Memphis, TN, USA","type":"Article","bg":"소아 고형암은 발생 계통의 여러 단계를 닮은 세포들이 섞여 있다. 신경모세포종 세포주는 ADRN 또는 MES 특징을 보이고, 1967년부터 1986년 사이에 수립된 세포주의 마이크로어레이 데이터로 만든 ADRN/MES 서명이 환자 종양에 널리 쓰여 왔다. 그러나 최근 sc/snRNA-seq 연구들은 같은 세포주 유래 서명을 써서 환자 종양에 악성 MES 집단이 없다고 보고해 논쟁이 생겼다. 저자들은 환자 종양에 MES 암세포가 실제로 있는지, 있다면 미세환경의 정상 중간엽 세포와 어떻게 분명히 가를 수 있는지 물었다.","ap":"St. Jude Children's Research Hospital과 Dana-Farber Cancer Institute에서 모은 종양 54개(환자 50명, MYCN 증폭 12개, ALK 기능획득 돌연변이 9개, 미치료 21개)를 Human Tumor Atlas Network의 선행 과제 HTAPP로 분석했다. 신선 시료 12개는 scRNA-seq, 냉동 시료 41개는 snRNA-seq로 처리해 프로파일 543,948개를 얻고 WES 42개, 벌크 RNA-seq 43개, DNA 메틸화 34개를 함께 생산했다. 공간 분석은 MIBI 단백체(항체 41종), 전 슬라이드 CODEX(항체 52종), Slide-SeqV2 공간 전사체(10 μm 해상도)로 수행했고 종양 10개는 세 플랫폼 모두로 교차 검증했다. Childhood Solid Tumor Network의 O-PDX 23개로 벌크 RNA-seq를 수행해 각 28개 유전자의 새 ADRN/MES 서명을 만들고 Visium HD와 Xenium으로 공간 분포를 확인했다. 직교 검증에는 O-PDX 9개와 세포주 8개의 ChIP-seq(히스톤 표지 8종, CTCF, RNA-PolII, BRD4), O-PDX 6개의 TMT 단백체, 전자현미경, 렌티바이러스 바코딩, SEQC 498명 코호트를 썼다.","kf":["sc/snRNA-seq 프로파일 543,948개를 20개 군집으로 나누고 haplotype 인식 CNV 호출로 악성 군집 10개를 가렸다. 세포주 유래 van Groningen MES 서명은 악성 군집이 아니라 기질과 혈관 군집에서 높았고, Slide-SeqV2 악성 세포 8개 군집 어디에서도 MES 서명이 농축되지 않았다.","MIBI, CODEX, Slide-SeqV2 세 플랫폼 모두에서 CD56+ 종양 세포는 면역 세포가 거의 없는 단일 이웃(CN0)으로 모여 면역 및 기질 구획과 분리됐다. 종양 46개에서 뽑은 코어 103개 TMA에서도 같은 분리가 확인됐다.","O-PDX 23개의 벌크 RNA-seq에서 상위 1,000개 차등 발현 유전자는 ADRN 군, MES 군, 혼합 군 세 덩어리로 갈렸고, 여기서 만든 28개씩의 새 ADRN/MES 서명을 O-PDX, 환자 종양, 오가노이드, 세포주를 합친 시료 449개에 적용했다.","새 서명으로 가른 두 상태는 TH 면역조직화학, 오가노이드 형태(MES는 섬유세포 모양, ADRN은 신경돌기 신장), 전자현미경의 신경 다발과 밀집체 소포, ChIP-seq에서 ADRN 종양의 PDGFRA 등 MES 유전자 polycomb 억제, TMT 단백체로 모두 일관되게 확인됐다.","O-PDX 2개와 환자 종양 5개의 Xenium 데이터에서 분할한 세포 3,132,295개 가운데 MES와 ADRN 악성 세포가 분명히 갈렸다. 렌티바이러스 바코딩에서는 가장 ADRN에 치우친 O-PDX 하나를 빼면 같은 바코드가 두 집단에 모두 나타나 공통 기원을 시사했다.","SEQC의 진단 시 미치료 498명 코호트에서 나이와 임상 위험군을 보정한 다변량 Cox 모형 결과 MES-ADRN 복합 점수가 높을수록 무사건 생존(HR 1.87, 95% CI 1.15-3.06, p = 0.012)과 전체 생존(HR 2.44, 95% CI 1.35-4.41, p = 0.003)이 나빴고, 세포주 유래 기존 서명은 같은 모형에서 추가 예후 정보를 주지 못했다."],"sig":"오래 논쟁이던 환자 종양 내 MES 신경모세포종 세포의 존재를 서로 독립된 여러 기법으로 확인했다. 세포주에서 만든 서명을 환자 조직에 그대로 쓰면 안 된다는 점을 수치로 보였고, 초기 계대 O-PDX가 대안 자원이 될 수 있음을 제시한다. 신경모세포종을 면역학적으로 차가운 종양으로 보던 해석도 면역세포가 없는 것이 아니라 종양과 면역 구획이 분리된 결과일 수 있다고 다시 짚는다.","lim":"신선 시료는 scRNA-seq, 보관 냉동 시료는 snRNA-seq로 처리해 세포당 검출 유전자 수가 달라(핵 1,549개 대 세포 2,308개) 시료 간 비교에 변이가 들어간다. 공간 플랫폼마다 조직 요건과 해상도, 항체 수가 달라(발견 코호트 41종과 52종, TMA 검증 30종) 코호트 사이 세포형 비교를 직접 하기 어렵다. 시료 54개 중 미치료는 21개뿐이고 O-PDX 23개 중 17개가 항암치료 중 시료에서 유래해, ADRN과 MES 비율이 진단 시료를 대표하지 않을 수 있다.","lab":"MIBI와 CODEX 공간 단백체, Slide-SeqV2와 Visium HD, Xenium 공간 전사체를 같은 종양에서 나란히 돌려 각 기법의 장단점을 정리한 부분은 공간 오믹스 플랫폼 선택에 바로 쓸 수 있다. O-PDX 6개의 TMT 단백체로 전사체 서명을 단백 수준에서 확인한 설계도 질량분석 기반 검증 절차의 참고가 된다. 종양 세포와 면역 세포가 구획으로 갈린다는 결과는 공간 데이터에서 세포 이웃을 정의하는 분석 전략과 직접 맞물린다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CCL_2026-10-08_t1-2_fig1.jpg","label":"Figure 1","cap":"HTAPP 신경모세포종 코호트 54개 시료의 임상, 조직학, 분자 특징과 시료별로 적용한 시퀀싱 및 공간 기법을 정리한다. 신선, 냉동, 고정 조직을 sc/snRNA-seq와 공간 단백체(MIBI, CODEX), 공간 전사체(Slide-SeqV2, Visium HD, Xenium)로 나눠 처리한 흐름도 함께 보여준다."},{"src":"fig/CCL_2026-10-08_t1-2_fig8.jpg","label":"Figure 8","cap":"Xenium으로 분석한 O-PDX 2개와 환자 종양 5개의 세포 3,132,295개에서 MES 악성 세포와 ADRN 악성 세포가 갈리는 것을 보인다. 렌티바이러스 바코딩 결과와 SEQC 코호트의 MES-ADRN 복합 점수 삼분위별 무사건 생존 및 전체 생존 곡선도 함께 제시한다."}]},{"j":"Cancer Cell","w":"2026-10-08","t":"T1","i":3,"ko":"항암화학요법이 암 백신 효과를 높이고 줄기세포 유사 TCF1+CD8+ T 세포를 늘린다","en":"Chemotherapy enhances cancer vaccine efficacy and expands stem-like TCF1+CD8+ T cells","one":"carboplatin과 paclitaxel 병용 항암화학요법이 종양이 없어도 줄기세포 유사 TCF1+CD8+ T 세포를 늘려 바이러스 벡터 암 백신 효과를 높이고, 여기에 항PD-1을 더하면 종양 억제와 생존이 더 좋아진다.","ab":"치료용 암 백신은 임상에서 항암화학요법을 포함하는 표준치료와 함께 시험되는 일이 늘고 있지만, 항암화학요법이 암 백신과 상승 작용을 하는지는 분명하지 않다. 여기서 우리는 이종 prime-boost 바이러스 벡터 백신을 여러 항암화학요법 요법과 함께 시험했다. carboplatin과 paclitaxel 병용(CarboTaxol)과 cyclophosphamide는 모두 백신 효과를 높이고 항원 특이 CD8+ T 세포 반응을 강화한다. 이 항암제들은 종양이 없어도 면역 보조제로 작용한다. 기전으로 CarboTaxol은 줄기세포 유사 T cell factor 1(TCF1)+CD8+ T 세포를 항원과 무관하게 이른 시기에 늘리며, 같은 효과가 여러 암종 환자에서도 관찰된다. TCF1을 유전적으로 또는 약물로 교란하면 CarboTaxol의 면역 보조제 효과가 사라진다. 바이러스 벡터 백신과 CarboTaxol에 programmed cell death 1(PD-1) 차단을 더하면 종양 억제와 생존이 더 좋아진다. 이 결과들은 항암화학요법의 면역 보조제 효과를 뒷받침하는 TCF1 의존 기전을 밝히고, 이 삼제 병용 치료를 임상에서 평가할 근거를 제공한다.","tags":["암 백신","종양 면역","CD8+ T 세포","면역관문억제"],"doi":"10.1016/j.ccell.2026.09.006","url":"https://www.cell.com/cancer-cell/fulltext/S1535-6108(26)00425-3","au":"Noblecourt L, Wicki A, …, Van den Eynde BJ, Leung CSK","aff":"Ludwig Institute for Cancer Research, Nuffield Department of Medicine, University of Oxford, Oxford, UK; Ludwig Institute for Cancer Research, de Duve Institute, UCLouvain, Brussels, Belgium; Centre for Immuno-Oncology, Nuffield Department of Medicine, University of Oxford, Oxford, UK","type":"Article","bg":"치료용 암 백신은 대부분의 암에서 표준치료인 항암화학요법과 함께 쓰일 가능성이 높다. 그러나 항암제는 면역세포에도 독성이 있어 두 치료를 합치는 것이 도움이 되는지 분명하지 않았다. 일부 항암제가 면역 활성 효과를 보인다는 보고가 있고 CarboTaxol은 골수유래 억제세포를 줄여 긴 펩타이드 백신의 효과를 높인다고 알려졌지만, 치료 백신 상황에서 면역 보조제 효과의 기전은 밝혀지지 않았다. 저자들은 임상 안전성이 확인된 ChAdOx1과 MVA 이종 prime-boost 백신에 CarboTaxol을 더했을 때 무엇이 달라지고 그 기전이 무엇인지 물었다.","ap":"P1A 항원을 자연 발현하는 15V4T3 종양을 DBA/2 생쥐에, HPV16 E6/E7을 발현하는 TC-1 종양과 B16F10-OVA 종양을 각각 맞는 배경 생쥐에 이식해 세 모델에서 시험했다. ChAdOx1과 MVA 이종 prime-boost 백신을 CarboTaxol, cyclophosphamide, gemcitabine과 조합하고 투여 시점을 prime 전, prime 동시, prime 후, boost 동시로 바꿔 비교했다. 항원 특이 반응은 P1A 또는 OVA 펩타이드 자극 후 IFNγ와 TNFα 생산 CD8+ T 세포 비율로 유세포분석으로 측정했다. 기전 검증에는 anti-Gr1과 anti-Ly6G 고갈, β-catenin/TCF1 억제제 iCRT3, 긴 TCF1 이형체가 없는 TCF1ko 생쥐, 비장 CD3+ T 세포의 scRNA-seq와 TCR 분석, 사량체 양성 CD8+ T 세포의 고차원 분석을 썼다. 사람 자료로는 진행 상피성 난소암 환자의 공개 PBMC scRNA-seq를 재분석하고, 자궁경부암 환자의 PBMC를 CarboTaxol 6주기 동안 주기마다 받아 스펙트럼 유세포분석으로 분석했다.","kf":["15V4T3 모델에서 백신 단독보다 백신과 CarboTaxol 병용이 종양 성장을 더 늦추고 14마리 중 3마리가 완전 관해에 들었다. 치료 40일에 병용군 생존은 50%를 넘었고 백신 단독군은 20% 미만이었다. TC-1 모델에서도 같은 방향이었다.","CarboTaxol은 CD11b+Gr1^hiLy6G+ 세포를 일시적으로 줄였으나, anti-Gr1이나 anti-Ly6G로 같은 정도로 고갈해도 항원 특이 CD8+ T 세포 반응과 종양 억제, 생존은 좋아지지 않았다. 골수세포 고갈만으로는 상승 효과를 설명하지 못했다.","종양이 없는 생쥐에서도 CarboTaxol을 prime 백신과 같은 시점에 주면 P1A 특이 CD8+ T 세포 반응이 늘었고 prime 전이나 후에 주면 효과가 사라졌다. 수지상세포 아집단 확장, CD80 발현, 비장의 IFNα와 IL-1β 수치는 달라지지 않았다.","CarboTaxol은 백신과 무관하게 비장과 혈액에서 TCF1 발현과 TCF1+CD8+ T 세포 수를 늘렸고 종양 내 TCF1+PD-1+CD8+ T 세포도 늘렸다. 투여 4일 뒤 scRNA-seq에서 Cd8+Tcf7+ 세포는 Wnt/β-catenin 경로가 유의하게 농축됐고 확장된 클론형은 줄었다.","iCRT3로 TCF1 전사 활성을 낮추면 TCF1 발현은 그대로인데 TCF1 표적 Ly108과 BCL6가 줄고 CarboTaxol의 보조제 효과도 줄었다. TCF1ko 생쥐에서는 보조제 효과와 B16F10-OVA 종양 억제 개선이 모두 사라졌고, cyclophosphamide는 같은 보조제 효과를 보였으나 gemcitabine과 저용량 metronomic 요법은 그렇지 않았다.","백신, CarboTaxol, 항PD-1 삼제 병용은 항PD-1 투여 시점과 무관하게 종양 억제와 생존을 개선해 50일에 60%가 생존했고 백신 단독군은 20%였다. 난소암 환자는 3주기 뒤 TCF7+CD8+ T 세포 비율이 늘었고, 자궁경부암 환자는 주기가 쌓이며 naive 및 memory 표현형의 TCF1+ 군집 1과 4가 늘었다."],"sig":"항암화학요법의 면역 보조제 효과를 골수세포 고갈이나 면역원성 세포사가 아니라 줄기세포 유사 TCF1+CD8+ T 세포 풀의 확장으로 설명했다. 투여 시점이 효과를 가르고 약물 종류와 용량에 따라 효과가 달라진다는 점은 병용 설계에 바로 쓰인다. 항PD-1을 백신 전에 주어도 CarboTaxol이 있으면 불리하지 않아, 표준치료를 늦추지 않고 백신을 더하는 임상 설계를 쉽게 만든다.","lim":"저자들은 환자가 보통 최대 내성 용량으로 여러 주기를 받는 상황에서 어떤 용량과 시점이 면역 보조제 효과를 낼지 예측하기 어렵다고 적는다. 생쥐에서는 단일 투여 며칠 안에 TCF1+CD8+ T 세포가 늘었지만 환자에서는 3주기 뒤에 또는 주기가 쌓이며 서서히 늘어 동태가 다르다. scRNA-seq는 생물학적 반복이 적고 인과를 보이려고 설계된 것이 아니므로 해당 모형은 가설 수준이라고 저자들이 밝힌다.","lab":"종양 면역과 CD8+ T 세포 줄기성을 다루므로 연구실의 암 연구 관심과 주제가 겹친다. 다만 오믹스 규모 데이터는 보조 역할이고 핵심 근거는 생쥐 모델 유세포분석이어서 연구실 핵심 오믹스 기법과의 연결은 약하다.","lic":"초록 전문 번역. 출처 Noblecourt L et al., Cancer Cell, 2026, DOI 10.1016/j.ccell.2026.09.006. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CCL_2026-10-08_t1-3_fig1.jpg","label":"Figure 1","cap":"P1A를 발현하는 15V4T3 종양과 HPV16 E6/E7을 발현하는 TC-1 종양에서 ChAdOx1/MVA 백신에 CarboTaxol을 더했을 때 종양 성장과 생존이 어떻게 달라지는지 보여준다. 혈액과 종양 안 P1A 특이 IFNγ+CD8+ T 세포 비율, 그리고 혈중 반응과 종양 크기의 상관도 함께 제시한다."},{"src":"fig/CCL_2026-10-08_t1-3_fig4.jpg","label":"Figure 4","cap":"CarboTaxol이 백신과 무관하게 비장과 혈액에서 TCF1 발현과 TCF1+CD8+ T 세포 및 CD44+TCF1+CD8+ T 세포 수를 늘리는 것을 보인다. 종양 보유 생쥐에서 종양 미세환경 안으로 줄기세포 유사 TCF1+PD-1+CD8+ T 세포가 늘어나는 것도 함께 보여준다."}]},{"j":"Cancer Communications","w":"2026-10-08","t":"T1","i":1,"ko":"GULP1은 위암에서 지질을 매개로 종양연관 대식세포의 대사를 재편해 PD-1 차단 저항성을 키운다","en":"GULP1 Fuels Resistance to PD-1 Blockade through Lipid-Mediated Metabolic Reprogramming of Tumor-Associated Macrophages in Gastric Cancer","one":"위암 세포의 GULP1이 INSIG2 팔미토일화를 거쳐 지방산 합성을 늘리고, 그 지질이 CD36+ 대식세포를 억제성으로 바꿔 PD-1 차단 저항성을 만든다.","ab":"배경: PD-1을 표적하는 면역관문 억제제는 여러 암의 치료를 크게 개선했지만, 위암 환자 가운데 지속적인 임상 이득을 얻는 비율은 일부에 그친다. anti-PD-1 치료 저항성을 끌고 가는 종양 내재적 기전은 아직 잘 알려져 있지 않다. 이 연구는 위암 면역치료 저항성의 핵심 조절자를 찾고 그 기능과 기전을 밝히는 것을 목표로 했다. 방법: anti-PD-1에 반응한 위암 환자와 저항한 환자의 전사체 자료를 분석하고, 마우스 모델 자료와 공개된 단일세포 RNA 시퀀싱 자료를 함께 통합했다. 후보 유전자를 검증하고 종양 진행과 면역치료 저항성에서의 역할을 살피기 위해 시험관 실험과 생체 내 종양 모델을 포함한 기능 실험을 수행했다. 결과: GULP PTB 도메인 함유 포식 어댑터 1(GULP1)이 위암에서 anti-PD-1 치료 저항성을 끌고 가는 핵심 인자로 확인됐다. GULP1 발현이 높은 것은 나쁜 예후와 PD-1 차단에 대한 불리한 임상 반응과 연결됐다. GULP1은 위암 진행을 촉진하고 anti-PD-1 치료의 효과를 떨어뜨렸다. 기능적으로 GULP1은 지질이 풍부한 종양 미세환경을 만들어 CD36+ PD-L1+ 종양연관 대식세포(TAM)의 축적과 대사 재편을 도왔고, 그 결과 CD8+ T 세포의 기능이 손상됐다. 기전 면에서 GULP1은 zinc finger DHHC형 팔미토일전이효소 8(zDHHC8)을 끌어들여 insulin-induced gene 2(INSIG2)의 팔미토일화를 촉진했고, 이로써 sterol regulatory element-binding protein 1(SREBP1)이 핵으로 이동하고 새로운 지방산 생합성이 늘어났다. 중요하게도 glycyrrhizic acid로 Gulp1을 약리적으로 억제하면 생체 내에서 anti-PD-1 치료 감수성이 유의하게 회복됐다. 결론: 종합하면 이 결과들은 위암에서 PD-1 차단 저항성을 끌고 가는, 그동안 알려지지 않았던 GULP1-지방산-CD36+PD-L1+ TAM-CD8+ T 세포 축을 드러내며, GULP1을 유망한 치료 표적이자 면역치료 반응성의 예측 생체표지자로 제시한다.","tags":["암 면역","종양 미세환경","지질 대사","위암"],"doi":"10.34133/cancomm.0054","url":"https://spj.science.org/doi/10.34133/cancomm.0054","au":"Zhang Z, Xu W, …, Xie P, Shen Z, Qin J","aff":"Department of General Surgery, Zhongshan Hospital, Fudan University, Shanghai; Gastric Cancer Center, Zhongshan Hospital, Fudan University, Shanghai; Department of Hepatobiliary Surgery and Transplantation, Liver Cancer Institute, Zhongshan Hospital, Fudan University, Shanghai","type":"Research Article","bg":"PD-1 차단 치료는 여러 암에 쓰이지만 위암에서 지속적인 이득을 얻는 환자는 일부에 그친다. 미세부수체 불안정성이나 Epstein-Barr 바이러스 양성 같은 기존 표지자로는 반응군을 충분히 가려내지 못하고, 대부분의 위암은 여전히 불응 상태로 남는다. 종양연관 대식세포가 치료 반응을 좌우한다는 점과 억제성 대식세포가 지질 대사에 기운다는 점은 각각 알려져 있었지만, 위암에서 대식세포 대사가 어떻게 재편되고 그것이 면역관문 억제제 저항성과 어떻게 이어지는지는 밝혀지지 않았다. 연구진은 종양 세포 자체의 어떤 인자가 이 재편을 지시하는지, 그리고 GULP1이 거기에 관여하는지를 물었다.","ap":"anti-PD-1 반응군 3명과 비반응군 3명의 위암 조직 RNA-seq, 동소 이식 마우스에 anti-PD-1을 길게 투여해 얻은 저항성 종양과 감수성 종양의 RNA-seq, 공개 단일세포 RNA-seq 자료 GSE206785와 GSE183904를 겹쳐 후보 유전자를 추렸다. 임상 검증에는 수술 불가 위암 환자 82명의 전향 코호트 ZSGCI, 근치적 D2 위절제술을 받은 135명의 ZSGC 코호트, 신선 조직 56쌍, 외부 anti-PD-1 단독요법 코호트 PRJEB25780을 썼다. 면역 환경은 42개 표지자 CyTOF와 다중 면역형광, 유세포 분석으로 봤고, 지질 표현형은 BODIPY 염색, 중성지방 정량, Seahorse 산소소비율, GC-MS 지방산 정량으로 측정했다. 기전은 LC-MS/MS 상호작용체 분석, acyl-biotin exchange 팔미토일화 분석, 공면역침강, INSIG2 시스테인 치환 돌연변이로 추적했다. 치료 실험은 Gulp1 과발현 및 결손 YTN-16 세포, 대식세포 특이 Cd36 결손 마우스 Cd36fl/flLyz2Cre, 환자 유래 오가노이드 삼중 배양으로 했다.","kf":["환자와 마우스 RNA-seq, 공개 단일세포 자료를 겹쳐 추린 후보 가운데 GULP1이 anti-PD-1 비반응군에서 가장 크게 올라갔고, TCGA-STAD에서 고발현은 전체 생존과 무진행 기간이 짧은 쪽과 연결됐다. ZSGCI 코호트에서는 치료 전부터 비반응군의 GULP1이 높았고, 외부 코호트 PRJEB25780의 ROC 분석에서 GULP1은 미세부수체 불안정성과 Epstein-Barr 바이러스 상태보다 반응 예측력이 좋았으며 PD-L1 발현과 합치면 더 올라갔다.","Gulp1을 과발현한 YTN-16 종양은 피하와 동소 모델 모두에서 anti-PD-1에 거의 반응하지 않고 생존을 단축했으며, CD8+ T 세포 침윤과 Gzmb, Ifn-γ 발현이 줄었다. Gulp1을 결손시키면 anti-PD-1 감수성이 올라갔고 이 효과는 항-CD8 항체를 주면 사라졌다.","42개 표지자 CyTOF로 29개 군집을 나눈 결과 Gulp1 과발현 종양에서 Cd36+ Pd-l1+ 대식세포가 늘고 Cd8+ T 세포는 줄었다. 이 대식세포는 지질 축적과 중성지방 증가, 지방산 산화에 의존하는 산소소비 증가를 보였고, carnitine palmitoyltransferase 1 억제제 etomoxir를 쓰면 억제성 표현형이 되돌아갔다.","종양 세포에서 FASN을 녹다운하면 Gulp1이 만든 지방산 합성과 대식세포로의 지질 전달이 모두 끊겼고, 대식세포 특이 Cd36 결손 마우스에서는 Gulp1이 유도하는 지질 대사 활성화와 면역 억제가 나타나지 않으면서 Gulp1 과발현 종양이 다시 anti-PD-1에 반응했다.","GULP1은 INSIG2와 결합해 zDHHC8을 끌어들여 INSIG2의 Cys14를 팔미토일화했다. 이로써 INSIG2-SCAP 복합체가 풀리고 SREBP1이 핵으로 들어가 ACC1, FASN, SCD1이 올라갔으며, C14S 돌연변이를 넣으면 이 연쇄가 끊겼다.","구조 기반 가상 스크리닝과 표면 플라즈몬 공명으로 고른 glycyrrhizic acid(GA)는 GULP1과 INSIG2의 결합을 끊었다. GA와 anti-PD-1 병용은 피하와 동소 모델에서 단독 투여보다 종양을 더 줄이고 생존을 늘렸으며 간과 신장 독성은 나타나지 않았고, 환자 유래 오가노이드 삼중 배양에서도 같은 방향의 결과가 나왔다."],"sig":"GULP1은 위암에서 PD-1 차단 저항성을 예측하는 표지자이자 표적 후보로 제시된다. 종양 세포의 지방산 합성이 CD36을 통해 대식세포로 전달되어 CD8+ T 세포 기능을 떨어뜨린다는 경로가 유전적 조작과 약리적 억제 양쪽에서 확인됐다. 이미 사람에게 쓰인 이력이 있는 glycyrrhizic acid를 병용 후보로 삼을 수 있다는 점에서 임상으로 옮길 여지가 있다.","lim":"저자들은 GULP1의 예측 가치를 전향 코호트 한 곳에서 확인했을 뿐이고, 임상 기준값을 정하고 환자 층화에 쓰려면 더 큰 다기관 연구가 필요하다고 적었다. FABP4, FABP5 같은 다른 지질 운반 경로가 남아 있어 CD36 결손 상황에서도 지질 섭취와 대사 활성이 일부 유지될 수 있다고 인정한다. glycyrrhizic acid의 약동학과 독성 평가는 아직 이뤄지지 않았다.","lab":"LC-MS/MS 상호작용체 분석과 GC-MS 지방산 정량, 42개 표지자 CyTOF를 한 연구에 묶었으므로 연구실의 단백체, 대사체, 단일세포 프로파일링 설계에 바로 참고가 된다. 팔미토일화라는 번역 후 변형이 지질 합성 스위치로 작동한다는 점은 PTM 분석 주제와 겹친다. 종양 세포에서 대식세포로 지방산이 넘어가는 세포 간 대사 이동은 세포 대사 관심 분야와 직접 연결된다.","lic":"초록 전문 번역. 출처 Zhang Z et al., Cancer Communications 46, 2026, DOI 10.34133/cancomm.0054. CC BY 4.0에 따라 번역해 실었다. Crossref에 라이선스 항목이 없어 PMC 전문(PMC13639144)의 라이선스 문구로 확인했다.","dem":false,"figs":[{"src":"fig/CCO_2026-10-08_t1-1_fig1.jpg","label":"Figure 1","cap":"anti-PD-1 기반 치료를 받은 위암 환자에서 GULP1 발현과 치료 효과의 관계를 보여준다. CT 영상과 종양 퇴행 등급, TCGA-STAD 생존 곡선, 조직 염색을 함께 놓아 GULP1이 높을수록 CD8+ T 세포가 적고 예후가 나쁘다는 것을 제시한다."},{"src":"fig/CCO_2026-10-08_t1-1_fig3.jpg","label":"Figure 3","cap":"Gulp1 과발현 종양에서 CD36+ 지질 적재 대식세포가 늘어나 억제성 표현형을 얻는 과정을 보여준다. CyTOF t-SNE와 대식세포 아군집의 대사 활성, BODIPY 지질 염색, 산소소비율 측정이 들어 있다."}]},{"j":"Cancer Communications","w":"2026-10-08","t":"T2","i":1,"ko":"Nectin-4를 표적으로 한 치료 재배치가 상피성 난소암에서 항종양 효과를 높인다","en":"Nectin-4-Directed Therapeutic Repositioning Augments Antitumor Efficacy in Epithelial Ovarian Carcinoma","one":"","ab":"Letter라 초록이 따로 없어 PMC 전문의 본문을 요약했다. 엽산수용체 알파를 표적하는 항체약물접합체 mirvetuximab soravtansine은 상피성 난소암 환자의 36%만 대상이 된다. 연구진은 기관 RNA-seq 코호트 420건과 조직 마이크로어레이 2종(난소암 155건, 정상 15건)에서 NECTIN4가 모든 난소암 아형에서 정상 난소 조직보다 높게 발현되는 것을 확인했다. Nectin-4 표적 항체약물접합체 enfortumab vedotin(EV)은 Nectin-4 고발현 세포주에서 GI50 3.033~7.856 nmol/L로 작용했고 저발현 세포주는 70.000 nmol/L를 넘었다. EV 처리는 p53 신호를 켜고 지방산 대사 경로를 내렸다. 약물 감수성 데이터베이스 분석에서 NECTIN4 발현은 완하제로 개발된 acetalax 감수성과 상관됐고, Nectin-4 고발현 세포주의 GI50은 0.216~1.377 μmol/L였다. OVISE 이식 모델에서 EV와 acetalax 병용은 생존을 늘렸다(대조군 대비 HR 0.057, 95% CI 0.003~0.347, P = 0.003). NECTIN4 녹다운은 acetalax 감수성을 바꾸지 않아, 저자들은 Nectin-4가 기전 매개체가 아니라 예측 표지자라고 본다.","tags":["난소암","항체약물접합체","지방산 대사","약물 재배치"],"doi":"10.34133/cancomm.0057","url":"https://spj.science.org/doi/10.34133/cancomm.0057","au":"Zhong KX et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY 4.0. Letter 형식이라 초록이 따로 없어 PMC 전문(PMC13624863) 본문을 요약해 실었다. Crossref에 라이선스 항목이 없어 전문의 라이선스 문구로 확인했다.","dem":false,"figs":[]},{"j":"Cancer Communications","w":"2026-10-08","t":"T2","i":2,"ko":"자연살해/T세포 림프종에서 자주 나타나는 새로운 바이러스 국소 복제수 증가가 방사선 감수성을 높인다","en":"Frequent Novel Viral Focal Copy Number Gains Potentiate Radiosensitivity in Natural Killer/T-Cell Lymphoma","one":"","ab":"Letter라 초록이 따로 없어 PMC 전문의 본문을 요약했다. Epstein-Barr 바이러스(EBV) 연관 자연살해/T세포 림프종 종양과 정상 짝 77쌍의 전장유전체 시퀀싱(종양 평균 68.5배, 정상 39.9배)에서 EBV 유전체의 짧은 변이가 85~86 kbp와 168~169 kbp 구간에 몰렸다. 두 번째 몰림은 LMP-1의 CTAR3 영역 안 15 bp 결손(p.276_281del)이었다. LMP-1 좌위의 복제수 증가는 종양의 23.4%(18/77)와 세포주의 11.1%(1/9)에서 나타났고, 추가로 본 703개 EBV 양성 시퀀싱 자료에서는 EBV 연관 혈액림프계 악성종양에 몰려 있었다(P < 0.001). 복제수 증가 종양의 LMP-1 발현은 3.68배 높았고(P = 0.045), 무진행 생존은 오히려 길었다(HR 0.28, 95% CI 0.08~0.94, P = 0.028). 방사선 치료를 받은 초기 환자군에서는 복제수 증가군에 무진행 사건이 없었다. EL4 마우스 모델과 NK92, NKYS 세포에서 LMP-1 과발현은 방사선 유도 세포사와 γH2AX를 늘리고 pATR는 줄였으며, DNA fiber 분석에서 복제 분기점 분해를 촉진했다.","tags":["림프종","바이러스 유전체","방사선 치료","복제 스트레스"],"doi":"10.34133/cancomm.0055","url":"https://spj.science.org/doi/10.34133/cancomm.0055","au":"Lim JQ et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY 4.0. Letter 형식이라 초록이 따로 없어 PMC 전문(PMC13624365) 본문을 요약해 실었다. Crossref에 라이선스 항목이 없어 전문의 라이선스 문구로 확인했다.","dem":false,"figs":[]},{"j":"Cancer Communications","w":"2026-10-08","t":"T2","i":3,"ko":"IGF2BP2-MYBL2-HMGB2 신호 축이 간세포암에서 대식세포 면역 회피를 촉진한다","en":"An IGF2BP2-MYBL2-HMGB2 Signaling Axis Promotes Macrophage Immune Evasion in Hepatocellular Carcinoma","one":"","ab":"Letter라 초록이 따로 없어 PMC 전문의 본문을 요약했다. 연구진은 Catholic_mLIHC, TCGA_LIHC, ICGC_LIRI, GSE77314 네 전사체 자료에서 m6A 조절 유전자를 비교해 IGF2BP 계열이 간세포암에서 과발현되는 것을 확인했고, 그중 IGF2BP2만 생존 불량과 연결됐다. RIP-seq 자료에서 IGF2BP 계열이 공통으로 결합하는 4,137개 유전자를 추려 MYBL2를 가장 두드러진 하위 표적으로 골랐다. IGF2BP2는 m6A가 붙은 MYBL2 mRNA를 안정화해 단백질 발현을 올렸고, Northern blot과 반감기 측정이 이를 뒷받침했다. MYBL2는 ChIP-qPCR와 이중 루시페라아제 리포터에서 HMGB2 프로모터에 직접 붙어 전사를 켰고, 분비된 HMGB2는 대식세포의 RAGE에 결합해 M2 유사 표현형을 유도하며 식작용을 억제했다. HMGB2를 줄이면 식작용이 늘었고 재조합 HMGB2를 넣으면 다시 줄었으며, RAGE 길항 펩타이드를 쓰면 회복됐다. 간세포암 조직 20쌍 가운데 16쌍(80%)에서 세 유전자가 함께 올라가 있었고, H-ras 형질전환 마우스에서 Mettl3, Igf2bp2, Mybl2를 각각 억제하면 종양 부담이 줄고 F4/80 양성 대식세포가 늘었다.","tags":["간세포암","m6A","대식세포","면역 회피"],"doi":"10.34133/cancomm.0058","url":"https://spj.science.org/doi/10.34133/cancomm.0058","au":"Ha JW et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY 4.0. Letter 형식이라 초록이 따로 없어 PMC 전문(PMC13624569) 본문을 요약해 실었다. Crossref에 라이선스 항목이 없어 전문의 라이선스 문구로 확인했다.","dem":false,"figs":[]},{"j":"Cancer Discovery","w":"2026-10-08","t":"T2","i":1,"ko":"암 진단을 받은 모든 환자에게 생식세포 유전자 검사를 적용한다","en":"Universal Germline Genetic Testing after a Diagnosis of Cancer","one":"","ab":"진단 나이는 생식세포 병원성 변이 보유 가능성을 가늠하는 지표로 쓰이지만 나이 기준선이 실제 유전 위험을 제대로 가려내는지는 분명하지 않았다. 연구진은 임상적 의심 여부와 무관하게 고형암 환자 39,184명의 생식세포를 시퀀싱하고 32개 종양 유형에 걸쳐 90개가 넘는 암 소인 유전자를 조사했다. 종양별 평균 진단 연령에서 벗어난 정도를 표준편차로 계산해 환자를 조기, 평균, 만기 발병군으로 나눴다. 병원성 변이 빈도는 조기 18.4%, 평균 15.6%, 만기 12.3%로 진단 나이와 반대로 움직였다(P < 0.001). 조기 발병군의 증가분은 고침투도와 중간침투도 유전자에서 나왔다(조기 12.4%, 평균 8.9%, 만기 5.1%, P < 0.001). 통상 쓰는 50세 미만 기준으로 검사를 제한하면 병원성 변이 보유자 4,601명, 전체 변이의 72%를 놓친다. 저자들은 만기 발병 환자에게도 유전 위험이 남아 있으므로 나이 기준을 넘어선 보편적 생식세포 검사가 필요하다고 본다.","tags":["암 유전체","유전성 암","임상 코호트"],"doi":"10.1158/2159-8290.CD-26-0971","url":"https://aacrjournals.org/cancerdiscovery/article/doi/10.1158/2159-8290.CD-26-0971/788729/Universal-Germline-Genetic-Testing-after-a","au":"Stadler ZK et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"Tier 1 점수(8점)였으나 전문을 구하지 못해 Tier 2로 내렸다. 사유: AACR 사이트가 Cloudflare에 막혀 있고 PMC에도 없다. 출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":true,"figs":[]},{"j":"Cancer Discovery","w":"2026-10-08","t":"T2","i":2,"ko":"유전체 변이와 치료 이력이 교모세포종 재발의 시공간 양상을 결정한다","en":"Genomic alterations and treatment define spatiotemporal patterns of glioblastoma recurrence","one":"","ab":"교모세포종은 수술 경계부에서 주로 재발하지만 그 부위의 분자적 특징은 거의 밝혀지지 않았다. 연구진은 환자 40명에서 조직학 안내로 시료를 채취해 수술 경계부와 인접 재발 종양 부위를 단일세포 공간전사체로 분석하고 같은 환자의 원발 종양과 짝지어 비교했다. 치료 후 수술 경계부는 상처 치유에 가까운 별개의 미세환경을 이루고 있었다. 경계부에는 전사체와 조직학 모두에서 중간엽 특징이 두드러진 악성 세포 상태가 모여 있었고 저자들은 이를 stromal 아형으로 정의했다. 재발 시 이 아형으로 옮겨간 환자들은 초기 TP53 돌연변이를 지니고 temozolomide 보조치료 중에도 증식을 유지했으며 생존 기간이 짧았다. 반대로 TP53 야생형 종양이 temozolomide 치료 중 재발한 경우에는 mesenchymal 아형으로 옮겨가면서 p53 경로 활성이 올라가고 증식은 줄었다. 환자 유래 교모세포종 모델에서 TP53 기능 상실은 temozolomide 저항성을 높였다.","tags":["공간 전사체","교모세포종","치료 저항성"],"doi":"10.1158/2159-8290.CD-25-2302","url":"https://aacrjournals.org/cancerdiscovery/article/doi/10.1158/2159-8290.CD-25-2302/788658/Genomic-alterations-and-treatment-define","au":"Artzi SB et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"Tier 1 점수(8점)였으나 전문을 구하지 못해 Tier 2로 내렸다. 사유: AACR 사이트가 Cloudflare에 막혀 있고 PMC에도 없다. CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":true,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T1","i":1,"ko":"Tahoe-100M: 단일세포 해상도로 그린 약물 유발 분자 표현형 지도","en":"Tahoe-100M: Mapping drug-induced molecular phenotypes at single-cell resolution","one":"암 세포주 50종에 약물 1,100여 조건을 걸어 모은 단일세포 전사체 1억 건을 공개해, 약물 반응 예측 모델의 학습 기반을 마련했다.","ab":"우리는 다양한 암 세포주 50종을 약물과 용량 조합 1,100가지로 처리해 얻은 1억 개의 전사체로 이루어진 기가 규모 단일세포 교란 아틀라스 Tahoe-100M을 제시한다. 수천 가지 교란을 단일세포 해상도에서 배치 효과를 최소화하며 병렬로 프로파일링할 수 있었던 것은, 유전적으로 구별되는 세포 모델을 균형 잡힌 세포 마을로 다중화하는 Mosaic 플랫폼 덕분이다. Tahoe-100M은 전사체 변화를 목록화하는 데 그치지 않고 증식, 세포독성, 계통 특이적 취약성, 세포주기 변화를 포함한 세포 표현형을 체계적으로 정량한다. 또한 집단 수준의 전사체 이질성을 포착해, 약물 반응이 세포를 서로 다른 운명으로 이끄는지 수렴하는 상태로 이끄는지를 특성화한다. 경로 기반 서명은 약물이 유발하는 발현 프로그램을 정의하고 작용 기전을 분류하며 비표적 활성을 드러내고 내성과 연관된 적응적 스트레스 반응을 노출한다. 세포 수준과 분자 수준의 측정을 통합함으로써 널리 적용 가능한 이 교란 아틀라스는 유전자 조절과 약물 반응, 네트워크 동역학을 모델링하는 우리의 능력을 진전시킨다. 공개 배포를 통해 세포 거동의 예측 모델을 발전시킬 인공지능 틀의 학습이 가능해진다.","tags":["단일세포 오믹스","약물 반응","암 세포주","대규모 자원"],"doi":"10.1016/j.cell.2026.08.035","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01008-1","au":"Zhang J, Ubas AA, …, Yu J","aff":"Tahoe Therapeutics, South San Francisco, CA, USA (제1저자, 교신저자)","type":"Resource","bg":"현대 인공지능 모형의 성능은 데이터의 규모와 다양성, 구조에 비례해 좋아진다. 세포 생물학에서는 약물 교란 반응을 단일세포 수준에서 대규모로 모은 자료가 부족했다. 서로 다른 실험에서 모은 자료는 배치 효과가 커서 모형 학습에 쓰기 어려웠다. 저자들은 세포 맥락을 가로지르는 통합 설계로 이 공백을 메우고자 했다.","ap":"유전적으로 구별되는 암 세포주 50종을 하나의 균형 잡힌 세포 마을로 다중화하는 Mosaic 플랫폼을 썼다. 이 풀에 소분자 379종을 여러 농도로 적용해 1,100가지가 넘는 약물 및 용량 조건을 만들었다. 처리 후 단일세포 RNA 시퀀싱과 조합 바코딩을 수행해 처리별 및 세포주별로 결과를 분리했다. 세포주의 종양 돌연변이 부담과 반복 드라이버 변이, 기원 조직을 함께 정리했고 약물은 작용 기전과 임상 개발 단계로 분류했다. 증식, 세포독성, 계통 특이 취약성, 세포주기 변화를 정량하고 경로 기반 서명으로 약물 유발 발현 프로그램을 정의했다.","kf":["암 세포주 50종과 약물 1,100여 조건에서 단일세포 전사체 1억 건을 모아 공개했다.","세포 마을 방식의 풀링으로 수천 가지 교란을 병렬 프로파일링하면서 배치 효과를 최소화했다.","증식, 세포독성, 계통 특이 취약성, 세포주기 변화 같은 세포 표현형을 체계적으로 정량했다.","집단 수준의 전사체 이질성을 포착해 약물 반응이 세포를 서로 다른 운명으로 가르는지 하나의 상태로 모으는지 구분했다.","경로 기반 서명이 작용 기전을 분류하고 비표적 활성과 내성 연관 적응 스트레스 반응을 드러냈다.","이 아틀라스는 State 모형 학습의 기반이 됐고 Virtual Cell Challenge 학습 자료의 핵심 구성 요소로 쓰였다."],"sig":"맥락을 반영하는 세포 거동 인공지능 모형을 만들 수 있는 규모의 공개 학습 자원을 제공한다. 자기지도 및 전이 학습으로 유전자 사이와 유전자와 약물 사이의 견고한 표현을 배울 수 있는 토대가 된다.","lim":"불멸화 암세포주를 단일 풀 조건에서 배양한 자료이므로 여기서 얻은 모형과 결과가 1차 세포나 오가노이드, 생체 조직으로 그대로 전이되지는 않는다고 저자들은 밝힌다. 풀링된 세포 마을 설계는 규모와 낮은 배치 분산의 원천이지만, 모든 세포주가 공유된 조건 배지에 노출되고 세포주 사이 신호 전달이 가능해 풀에서 측정한 반응이 단독 배양과 다를 수 있다. 보고된 표현형 지표도 이 설계의 제약을 받는다.","lab":"암 세포주 패널에 약물 교란을 적용한 단일세포 자료는 연구실의 암 치료 저항성 과제에서 비교 데이터셋으로 바로 쓸 수 있다. 세포 마을 다중화로 배치 효과를 줄이는 설계는 연구실의 대규모 단일세포 실험 설계에 참고가 된다.","lic":"초록 전문 번역. 출처 Zhang J et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.035. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-09-17_t1-1_fig1.jpg","label":"Figure 1","cap":"암 세포주 50종을 풀링한 Mosaic 모델에 약물 1,100여 조건을 적용해 단일세포 전사체 1억 건을 모으고 표현형을 정량하는 전체 흐름을 요약한 그림이다."}]},{"j":"Cell","w":"2026-09-17","t":"T1","i":2,"ko":"공간 생물학으로 밝힌 면역억제 비흑색종 피부암의 대식세포 상태 변화","en":"Spatial biology reveals altered macrophage states in immunosuppressed non-melanoma skin cancer","one":"면역억제 피부암의 차이는 면역세포 수가 아니라 선천 면역의 공간 배치에 있으며, CD68과 PD-L1 양성 세포의 분포가 나쁜 경과와 연관됐다.","ab":"면역억제 상태의 비흑색종 피부암 환자는 임상 경과가 더 나쁘지만, 전신 면역억제와 연관된 종양 면역 미세환경은 충분히 정의되지 않았다. 저자들은 면역이 온전한 환자와 면역억제 환자의 종양을 대상으로 단일세포와 공간 전사체, 다중 면역형광, 공간 후성유전체 프로파일링을 통합했다. 그 결과 전체 면역세포 구성은 대체로 유지되는 반면 면역세포의 분포와 공간 조직화, T 세포 클론성에서 차이가 났다. 면역억제 종양은 종양 내 대식세포 밀도가 낮았고 T 세포 클론 다양성이 줄었으며, 항원제시세포와 T 세포의 공간적 상호작용이 달라지고 섬유아세포 및 대식세포와 연관된 공간 니치가 구별됐다. 서로 보완적인 공간 및 단일세포 플랫폼을 쓴 여러 코호트 검증에서도 선천 면역과 적응 면역의 조직화 변화가 일관되게 확인됐다. 전신 면역억제 아래 종양 면역 미세환경이 공간적, 기능적으로 재편된다는 결론이다.","tags":["공간 오믹스","종양 미세환경","암 면역","대식세포"],"doi":"10.1016/j.cell.2026.07.031","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00863-9","au":"Naara S, Kochat V, …, Amit M","aff":"Department of Head and Neck Surgery, The University of Texas MD Anderson Cancer Center, Houston, TX, USA (제1저자, 교신저자); Department of Cancer Sciences, Cleveland Clinic Research, Cleveland Clinic, Cleveland, OH, USA (교신저자)","type":"Resource","bg":"면역억제 상태의 비흑색종 피부암 환자는 임상 경과가 더 나쁘다. 그러나 전신 면역억제와 연관된 종양 면역 미세환경의 특징은 충분히 정의되지 않았다. 기존 통념은 면역억제가 주로 면역세포 수 감소나 림프구 기능 이상에서 온다고 보았다. 저자들은 이 통념이 맞는지, 그리고 이 환자군에 쓸 수 있는 예후 표지와 치료 표적이 있는지 물었다.","ap":"MD Anderson 암센터와 클리블랜드 클리닉에서 모은 비흑색종 피부암 검체 200건 이상을 분석했다. 환자군은 면역이 온전한 군과 혈액암 또는 장기이식으로 면역억제 상태인 군으로 나누었고 두경부 편평세포암과 기저세포암을 포함했다. CD45 양성 세포를 농축해 단일세포 RNA 및 T 세포 수용체 시퀀싱을 수행했다. 여기에 공간 전사체, 다중 면역형광, 공간 ATAC 시퀀싱을 통합했다. 5년 전체 생존과 무병 생존을 로그순위 검정과 Cox 비례위험 모형으로 비교하고, 여러 코호트에 걸쳐 결과를 검증했다.","kf":["전체 면역세포 구성은 면역 상태와 무관하게 대체로 유지됐으나 분포와 공간 조직화, T 세포 클론성에서 차이가 났다.","면역억제 종양은 종양 내 대식세포 밀도가 낮았고, 이 차이는 종양 구획과 기질 구획 모두에서 나타났다.","T 세포 클론 다양성이 줄었고 클론 공유가 늘었으며 T 세포 아집단 사이의 클론형 분포가 달라졌다.","항원제시세포와 T 세포의 공간적 상호작용이 바뀌었고 섬유아세포 및 대식세포와 연관된 공간 니치가 구별됐다.","공간 ATAC 시퀀싱에서 두 군 사이의 후성유전 조절과 염색질 접근성 차이가 드러났다.","CD68과 PD-L1을 함께 발현하는 세포의 공간 분포가 면역억제 환자의 나쁜 임상 경과와 연관됐다."],"sig":"면역억제 환자와 면역이 온전한 환자의 주된 차이가 선천 면역 구획에 있음을 보였다. 면역억제를 단순한 면역세포 감소로 보던 관점을 수정하고, 이 환자군을 위한 예후 표지와 임상적으로 더 안전한 표적을 제시한다. 완전히 주석된 다중 오믹스 데이터셋을 공동체 자원으로 제공한다.","lim":"후향적 관찰 코호트 분석으로 인과를 검증하지 않았다. T 세포 수용체 레퍼토리 차이는 적응 면역 지형의 서술적 특징이며, 저자들은 면역 반응의 질과 임상 경과의 연결에 추가 검증이 필요하다고 밝힌다. 면역억제의 원인이 혈액암과 장기이식으로 혼재돼 있어 원인별 효과를 분리하기 어렵다.","lab":"단일세포, 공간 전사체, 다중 면역형광, 공간 ATAC을 한 코호트에서 통합한 설계는 연구실의 다중 오믹스 통합 과제에 바로 적용할 수 있다. 대식세포 상태와 공간 니치를 예후와 연결한 분석은 종양 미세환경 과제의 분석 전략으로 참고가 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CEL_2026-09-17_t1-2_fig1.jpg","label":"Figure 1","cap":"면역억제 환자와 면역이 온전한 환자의 비흑색종 피부암 미세환경을 다중 오믹스로 비교해 대식세포 상태와 공간 배치의 차이를 요약한 그림이다."}]},{"j":"Cell","w":"2026-09-17","t":"T1","i":3,"ko":"공간 근접 시퀀싱으로 그린 배중심의 발생 동역학","en":"Spatial proximity sequencing maps developmental dynamics in the germinal center","one":"근접 결합 분석과 공간 전사체를 묶은 Sprox-seq로 온전한 조직에서 mRNA와 표면 단백질과 단백질 복합체를 한꺼번에 읽어, RNA로는 보이지 않던 B 세포 상태 전이를 생식 중심에서 잡아냈다.","ab":"단백질과 단백질 상호작용을 공간적으로 프로파일링하면 조직 안에서 세포 기능을 이해할 수 있고, 이는 신호전달과 면역, 암 연구에 필수적이다. 저자들은 표면 단백질과 단백질 복합체, mRNA를 동시에 프로파일링하면서 각 분자의 조직 내 위치를 기록하는 공간 근접 시퀀싱 Sprox-seq를 제시했다. 사람 편도와 배중심에서 단백질 32종과 쌍별 상호작용 528가지, mRNA 수천 종을 공간 해상도로 측정했다. 조직 전반의 단백질 상호작용 지도는 RNA로 정의한 조직 구조를 재현하면서도 명대에서 더 높은 상호작용 복잡도를 드러냈다. 단백질 상호작용 궤적은 RNA로 추론한 것과 구별되는 B 세포 상태 전환을 찾아냈고, 단백질 복합체와 mRNA의 통합 분석에서 공간적으로 농축된 복합체가 유사분열 경로와 연결됐다. VLA-4와 VCAM1 수용체 복합체가 매개하는 B 세포와 여포 수지상세포의 접촉 같은 세포 간 상호작용도 포착했다.","tags":["공간 오믹스","단백질 복합체","근접 결합","생식 중심","면역"],"doi":"10.1016/j.cell.2026.06.034","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00754-3","au":"Wang H, Xia J, Mujibur Rahman PMS, …, Khan AA, Clark MR, Tay S","aff":"Pritzker School of Molecular Engineering, University of Chicago, Chicago, IL, USA (제1저자, 교신저자). Institute for Genomics and Systems Biology, University of Chicago","type":"Resource","bg":"세포가 조직 안에서 어떻게 협응하는지 알려면 유전자와 단백질 발현만이 아니라 단백질끼리의 상호작용까지 공간적으로 읽어야 한다. 세포 안에서 일어나는 결합과 세포 사이에서 일어나는 결합이 모두 해당한다. 면역, 신호 전달, 발생, 암 연구에 꼭 필요한 측정이지만, 온전한 조직에서 이를 수행할 적당한 기법이 없어 거의 탐색되지 못한 영역으로 남아 있었다.","ap":"근접 결합 분석을 공간 전사체에 통합한 Sprox-seq를 만들었다. 항체에 올리고를 붙인 접합체를 써서 조직 절편 안에서 mRNA와 표면 단백질 양과 표면 단백질 복합체를 동시에 읽는다. 복합체를 가려내는 분석틀도 함께 세웠다. 보정된 p값 0.05를 기준으로 유의한 상호작용을 고르고, 양성 스팟 비율로 공간적 흔함을 재며, 단백질 분획 중첩 점수로 상호작용 강도를 정량한다. 사람 편도 조직, 특히 그 안의 생식 중심에 적용했다.","kf":["온전한 조직 절편에서 mRNA와 표면 단백질 양과 표면 단백질 복합체를 동시에 프로파일링했다.","단백질 상호작용 네트워크는 생식 중심의 명대에서 특히 복잡했다.","단백질 상호작용으로 그린 궤적은 RNA로 정의한 것과 다른 B 세포 상태 전이를 드러냈다. 발현만 봐서는 놓치는 전이가 있다는 뜻이다.","CD21과 CD35가 이루는 복합체를 증식 프로그램과 연결했다. 생식 중심 스팟을 상호작용 강도 상위 20%와 하위 20%로 갈라 차등 발현과 경로 농축을 비교한 결과다.","B 세포와 여포 수지상세포 사이의 소통을 직접 포착했다.","면역형광과 조직 염색과 구조 분석으로 판독을 교차 검증했고, 음성 대조군 대비 성능과 알려진 표준 복합체의 회수로 검출된 상호작용이 실제 복합체임을 뒷받침했다.","PLA에서 얻은 단백질 발현이나 상호작용 프로파일로 군집을 나누어도 전사체로 정의한 조직 구획이 재현됐다."],"sig":"공간 오믹스의 측정 대상을 발현에서 상호작용으로 넓혔다. 단백질 복합체가 어디서 얼마나 강하게 형성되는지를 조직 맥락 안에서 정량하는 길이 열렸고, 발현 수준이 같아도 복합체 형성이 다르면 세포 상태가 다르다는 것을 실제 조직에서 보였다. 면역 조직의 세포 간 소통을 직접 읽는 설계라 종양 미세환경 연구로 옮겨 가기도 쉽다.","lim":"항체 올리고 접합체의 품질과 특이성이 결과를 좌우한다. 비특이 결합은 특히 발현이 낮은 단백질에서 배경 잡음을 키운다. 같은 복합체 안에 두 항체가 동시에 붙어야 하므로, 빽빽한 복합체에서는 입체 장애나 에피토프 접근성 문제로 상호작용이 과소 검출될 수 있다. 공간 해상도는 Visium 캡처 스팟 크기에 묶여 단일세포에 이르지 못하므로, 네트워크 구성과 유사시간 분석과 발현 연관 분석이 모두 스팟 수준에서 이루어졌고 해석도 개별 세포가 아니라 국소 미세환경을 가리킨다. 세포 내 단백질과 복합체 측정은 접근성과 배경 잡음 때문에 아직 범위 밖이다. 근접 결합은 안정한 쌍과 일시적 쌍을 모두 잡아내므로 통계적 잡음 제거가 반드시 따라야 한다.","lab":"공간 단백체에 복합체 수준의 판독을 더한 설계라 연구실의 관심 기법과 바로 맞닿는다. 질량분석 기반 상호작용체 자료와 조직 공간 정보를 잇는 가교로 쓸 수 있고, 분석틀에서 제시한 양성 스팟 비율과 분획 중첩 점수는 자체 상호작용 자료를 정량할 때 참고가 된다.","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[{"src":"fig/CEL_2026-09-17_t1-3_fig1.jpg","label":"Figure 1","cap":"Sprox-seq의 실험 흐름과 군집 분석 결과다. 사람 편도 절편을 Visium 슬라이드에 고정하고 항체 올리고 접합체 쌍과 반응시켜, 두 항체가 같은 복합체에 붙었을 때만 신호가 생기는 원리를 도식으로 보여준다."},{"src":"fig/CEL_2026-09-17_t1-3_fig2.jpg","label":"Figure 2","cap":"사람 편도의 공간 군집별 단백질 발현을 검증하고 분석한 결과다. Sprox-seq로 읽은 단백질 분포가 면역형광 염색과 일치함을 확인해 판독의 신뢰성을 뒷받침한다."}]},{"j":"Cell","w":"2026-09-17","t":"T1","i":4,"ko":"State로 다양한 맥락에서 세포의 교란 반응을 예측하기","en":"Predicting cellular responses to perturbation across diverse contexts with State","one":"세포를 하나씩이 아니라 집합으로 묶어 학습하는 변환기 구조로 교란 효과를 예측하는 State와, 그 성능을 재는 Cell-Eval 평가틀을 함께 내놓았다.","ab":"기계학습 모델은 교란의 전사체 효과를 예측할 잠재력을 지니지만 현재는 세포 맥락을 가로질러 일반화하는 데 어려움을 겪는다. 여기서 우리는 실험 내부와 실험 사이의 세포 이질성을 고려하면서 교란 효과를 예측하는 기계학습 모델 State를 소개한다. State는 단일세포 유전자 발현 자료로 학습해 세포 집합 전반에 걸친 교란 효과를 예측한다. State는 대규모 데이터셋에서 효과의 판별력을 30% 넘게 개선했고, 유전적, 신호적, 화학적 교란에 걸쳐 차등 발현 유전자를 기준선 대비 유의하게 향상된 정확도로 식별했다. 1억 6,700만 개 세포의 관찰 자료로 학습한 세포 임베딩은, 학습 중에 교란이 관찰되지 않았던 세포 맥락에서도 강한 교란을 식별할 수 있게 한다. 우리는 또한 앞으로의 모델 평가에 쓸 수 있는 포괄적 평가 틀 Cell-Eval을 소개한다. 전체적으로 State의 성능과 유연성은 세포 상태의 인공지능 모델 개발을 확장할 발판을 마련한다.","tags":["단일세포 오믹스","교란 반응 예측","기계학습","벤치마크"],"doi":"10.1016/j.cell.2026.07.052","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00921-9","au":"Adduri AK, Gautam D, Bevilacqua B, …, Burke DP, Goodarzi H, Roohani YH","aff":"Arc Institute, Palo Alto, CA, USA (제1저자, 교신저자). University of California, Berkeley, CA, USA","type":"Article","bg":"큰 단일세포 집단에서 교란 효과를 모형화하려면 집단 안의 이질성을 담을 유연함이 필요하다. 기존 방법들은 세포를 집단으로 묶어 다루거나 최적수송 같은 고정된 분포 구조를 전제했는데, 그 전제가 실제 자료와 맞지 않으면 예측이 흔들린다. 한편 교란 예측 모형을 서로 비교할 공통 기준도 없어, 모형이 정말 새로운 세포 맥락으로 일반화하는지 판단하기 어려웠다.","ap":"State는 State Embedding 모형과 State Transition 모형으로 이루어진다. 공유 임베딩 공간에서 세포 집합을 통째로 학습하는 순열 불변 변환기 구조를 써서, 분포 구조에 대한 사전 가정 없이 세포 분포를 가로질러 교란 효과를 학습한다. 평가를 위해 Cell-Eval을 함께 만들었다. 차등 발현 중첩 정확도, 효과 크기 예측, 교란 판별, 피어슨 상관을 묶은 평가 모음이다. A549 sgRNA Perturb-seq 자료와 공개된 단일세포 자료들로 검증했다.","kf":["자료 안과 자료 사이의 이질성을 함께 모형화하면서도 예측에서 단일세포 해상도를 유지한다. 알려진 공변량으로 설명되지 않는 잔여 이질성을 담아낸다는 뜻이다.","새로운 세포 맥락으로 교란 효과를 일반화하는 과제에서 기존 기준 모형들을 앞섰다.","State 임베딩을 쓰면 여러 자료에 걸쳐 교란 효과를 검출하는 능력이 좋아졌다.","이론적으로, 점근 극한과 완만한 정칙 조건 아래에서 교란 전후 세포 집단을 잇는 유일한 연속 최적수송 사상이 이 모형의 해 공간 안에 들어 있음을 보였다.","야코비안 제약을 명시적으로 넣으면 그 연속 최적수송 사상을 유일하게 식별하고 학습할 수 있다. 전용 최적수송 해법 구조를 쓰지 않고도 이론적 근거를 갖춘 신경 최적수송 해법이 된다는 주장이다.","세포 집합 크기를 키우면 미보유 세포주에 대한 검증 손실이 뚜렷이 개선됐고 256에서 최적이었다.","교란 일반화와 맥락 일반화를 갈라 정의했다. 맥락 일반화는 이미 아는 교란의 효과가 세포 맥락에 따라 어떻게 달라지는지를 묻는 과제라 대규모 단일세포 자료로 학습하기가 더 수월하다."],"sig":"교란 반응 예측을 분포 가정 없이 다루는 구조를 제시하고, 그 성능을 재는 공통 기준까지 함께 공개했다. 맥락 일반화라는 과제를 생물학적으로 해석 가능하고 정량 가능한 형태로 형식화한 것이 특히 쓸모 있다. 세포 상태 모형을 평가하는 관행이 이 평가틀을 중심으로 정리될 여지가 있다.","lim":"State는 전체 유전자가 아니라 고변이 유전자 집합 위에서 교란 효과를 예측한다. 같은 자료나 더 넓은 실험 안의 새 세포주나 세포 유형에는 예측할 수 있지만, 완전히 처음 보는 자료에 대한 영샷 성능은 제한적이다. 단일세포 실험마다 달라지는 공변량이 많기 때문이고, 이는 단일세포 학습 자료 전반의 한계이기도 하다. 표적 세포 맥락이 학습에서 본 것과 어느 정도 비슷해야 하며, 교란 자체의 범용 표현을 쓰지 않으므로 학습 맥락에서 관찰된 교란에만 예측이 가능하다.","lab":"단일세포 교란 자료를 다룰 때 바로 쓸 수 있는 공개 모형과 평가틀이다. 약물이나 유전자 교란 실험을 설계하기 전에 맥락별 효과를 미리 추려 보는 용도로 쓸 수 있고, Cell-Eval 지표는 자체 예측 작업의 성능을 보고할 때 기준으로 삼을 만하다.","lic":"초록 전문 번역. 출처 Adduri AK et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.052. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-09-17_t1-4_fig1.jpg","label":"Figure 1","cap":"세포 집합을 가로질러 교란 효과를 예측하는 변환기 기반 모형 State의 구조다. State Embedding과 State Transition 두 부분이 어떻게 맞물리는지, 그리고 Cell-Eval 평가 지표들이 무엇을 재는지 보여준다."},{"src":"fig/CEL_2026-09-17_t1-4_fig2.jpg","label":"Figure 2","cap":"세포 맥락을 가로지르는 교란 효과 예측에서 State가 기존 기준 모형들을 앞선다는 것을 보여준다. 차등 발현 중첩과 효과 크기 예측, 교란 판별 지표에서의 비교 결과를 함께 담았다."}]},{"j":"Cell","w":"2026-09-17","t":"T1","i":5,"ko":"scBaseCount: 인공지능 에이전트가 정리하고 표준화하며 자동 갱신하는 단일세포 데이터 저장소","en":"scBaseCount: An AI agent-curated, standardized, auto-updated single-cell data repository","one":"AI 에이전트가 공개된 10x 자료를 스스로 찾아 주석하고 원시 읽기부터 균일하게 재처리해, 27개 생물종 75개 조직에 걸친 세포 5억 2백만 개를 한 규격으로 모았다.","ab":"단일세포 RNA 시퀀싱은 개별 세포의 정밀한 전사체 측정을 가능하게 해 세포생물학을 바꾸어 놓았다. 시퀀싱 리드의 최대 공개 저장소인 Sequence Read Archive(SRA)는 표준화되지 않은 메타데이터 때문에 상당 부분이 충분히 활용되지 못하고 있다. 여기서 우리는 인공지능 에이전트를 활용해 데이터 탐색과 메타데이터 추출을 자동화하고 데이터 처리를 표준화하는 데이터베이스 scBaseCount를 소개한다. 모든 10x Genomics 데이터셋을 수집해 구축한 scBaseCount는 생물종 27개와 조직 75개에 걸쳐 5억 200만 개가 넘는 세포를 포함하는 최대 규모의 공개 단일세포 유전자 발현 저장소다. 이 저장소는 SRA 안의 데이터 지형을 편향 없이 보여주며, 더 넓은 표현형 다양성에 접근하게 함으로써 성능이 더 좋은 계산 모델의 학습을 가능하게 한다. 균일한 처리는 인트론과 엑손 리드, 비코딩 유전자 발현을 함께 측정하게 하고 실험 사이의 정렬을 개선한다. 나아가 scBaseCount는 인공지능을 활용해 생물학 데이터 저장소를 자율적으로 정리하는 방법의 청사진을 제공한다.","tags":["단일세포 오믹스","데이터 자원","AI 에이전트","표준화"],"doi":"10.1016/j.cell.2026.08.025","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00998-0","au":"Youngblut ND, Carpenter C, Nayebnazar A, …, Burke DP, Goodarzi H, Roohani YH","aff":"Arc Institute, Palo Alto, CA, USA (제1저자, 교신저자). Department of Biochemistry, Stanford University School of Medicine, Stanford, CA, USA","type":"Resource","bg":"세포 상태와 행동을 다루는 계산 모형을 학습시키려면 크고 품질 좋은 자료가 필요하다. 그런데 기존 단일세포 데이터베이스는 사람이 손으로 선별한 자료에 기대고 있어 규모와 다양성이 제한되고, 공개된 전사체 자료의 방대한 저장고를 거의 활용하지 못한다. 게다가 자료마다 처리 방식이 달라 데이터베이스 안에서도 개별 자료를 통합하는 일이 큰 과제로 남아 있었다.","ap":"SRAgent라는 AI 에이전트가 공개 접근이 가능한 10x Genomics 자료를 SRA에서 직접 발굴하고 메타데이터를 뽑아 주석한다. scRecounter가 원시 단일세포 읽기부터 균일하게 재처리한다. 세포 유형 주석은 참조 아틀라스에 대조해 자동으로 붙인다. 대량 RNA-seq을 균일 처리해 가치를 보인 ReCount 사업에서 발상을 가져왔고, 자원은 계속 갱신된다.","kf":["세포 5억 2백만 개 이상, 생물종 27개, 조직 75개를 담은 현재 가장 큰 공개 단일세포 RNA-seq 저장고다.","원시 읽기부터 균일하게 처리하므로 연구 간 기술적 인공물이 줄어든다. 모형이 생물학적으로 의미 있는 변이를 학습하도록 돕는 설계다.","생물종 다양성에서 다른 단일세포 데이터베이스를 크게 앞선다.","모든 세포에 비암호화 전사 자료를 담고 있어, 단일세포 해상도에서는 이 종류 자료의 최대 저장고이기도 하다.","사람 자료만으로 제한해도, scBaseCount로 학습한 모형은 교란이나 감염처럼 미세하지만 중요한 전사 상태 차이를 구분하는 능력이 뚜렷이 좋아졌다.","기존 자료를 그대로 대체하는 용도를 넘어, 생물종 다양성에서 오는 추가 이득이 더 있을 것으로 본다."],"sig":"단일세포 모형 학습의 병목이던 자료 규모와 처리 일관성을 동시에 건드렸다. 사람 손에 기대던 큐레이션을 에이전트가 대신하면서 자원이 계속 갱신된다는 점이 특히 실용적이다. 균일 처리가 모형 성능으로 이어진다는 것을 실험으로 보여, 자료를 모으는 방식 자체가 모형 품질의 변수임을 분명히 했다.","lim":"에이전트가 메타데이터 추출을 상당 부분 자동화했지만 세포 유형 주석은 여전히 사람의 전문성이나 공동체 큐레이션이 필요할 수 있다. 자동 주석은 분류에 쓴 참조 아틀라스에 있는 세포 유형으로 제한되고, 비인간 생물종은 품질 좋은 전체 개체 참조가 일부에만 있다. 교란 조건이나 공여자 정보 같은 세포 수준 주석은 SRA 메타데이터에 없어 수작업으로 넣어야 한다. 질병 주석은 시료별 구조화 정보가 아니라 연구 수준 초록에서 뽑기 때문에, 한 연구 안의 모든 시료에 같은 질병 표지가 붙어 건강한 대조군까지 포함될 수 있다. 현재 판은 10x Genomics 라이브러리와 확립된 일루미나 시퀀서로 한정되는데, 이 방식에는 알려진 세포 유형 편향이 있다.","lab":"단일세포 모형을 학습시키거나 자체 자료를 공개 자료와 견줄 때 쓸 수 있는 균일 처리 기준 자료다. 생물종과 조직 범위가 넓어 특정 조직의 기준선을 잡는 데도 쓸 만하다. 다만 질병 표지가 연구 수준에서 전파된다는 한계가 있어, 질병 비교에 쓸 때는 시료별 확인이 필요하다.","lic":"초록 전문 번역. 출처 Youngblut ND et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.025. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-09-17_t1-5_fig1.jpg","label":"Figure 1","cap":"scBaseCount가 생물종과 조직을 가로질러 가장 큰 공개 단일세포 유전자 발현 저장고임을 보여준다. 생물종 27개와 조직 75개에 걸친 세포 5억 2백만 개의 구성을 한눈에 정리했다."},{"src":"fig/CEL_2026-09-17_t1-5_fig2.jpg","label":"Figure 2","cap":"AI 주도 큐레이션과 표준 처리 흐름이다. 에이전트가 SRA에서 자료를 자동으로 발굴하고 메타데이터를 뽑아 주석한 뒤, 원시 읽기부터 균일하게 재처리하는 과정을 보여준다."}]},{"j":"Cell","w":"2026-09-17","t":"T2","i":1,"ko":"표현학습으로 밝힌 세포 상태별 미토콘드리아 표현형의 4차원 시공간 지형","en":"4D spatiotemporal landscape of mitochondrial phenotypes across cellular states unlocked through representation learning","one":"","ab":"미토콘드리아는 공간 세 축과 시간을 포함하는 4차원 소기관으로 세포 기능에 필수적이다. 다양한 세포 상태에 걸친 4차원 표현형 지형을 특성화하려면 4차원 이미징과 분석 틀이 모두 필요하다. 우리는 기전적으로 구별되는 교란 아래에 있는 미토콘드리아의 단일세포 격자광시트 현미경 자료 수 테라바이트를 레이블 없이 학습한 자기지도 딥러닝 모델 MitoSpace를 제시한다. MitoSpace는 약물 분류에서 사전 정의된 특징을 능가하고 미토콘드리아 형태와 동역학의 해석 가능한 변이를 포착하는 잠재 표현을 학습한다. 회귀 프로브는 학습된 표현으로부터 미토콘드리아 막전위를 예측해(R = 0.91) 단일세포 수준에서 형태와 기능 사이의 정량적 대응을 확립한다. MitoSpace는 또한 학습하지 않은 교란과 사람 폐 오가노이드에도 제로샷으로 일반화한다. 차원 제거 실험은 표현의 품질이 2차원에서 3차원, 4차원으로 갈수록 단조롭게 향상됨을 보여, 부피 정보와 시간 정보의 중요성을 입증한다. 모델과 데이터셋, 대화형 탐색기는 공개되어 있어 4차원 표현형 스크리닝의 토대를 제공한다.","tags":["미토콘드리아","이미징 표현학습"],"doi":"10.1016/j.cell.2026.08.028","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01001-9","au":"Agarwal D et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Agarwal D et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.028. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":2,"ko":"노화 생물학 인공지능을 위한 공개 벤치마크와 언어 모델","en":"An open benchmark and language models for AI in aging biology","one":"","ab":"지난 20년 동안 사람의 노화는 DNA 메틸화, 전사체, 단백체, 임상 양식에 걸쳐 특성화되어 왔다. 그러나 인공지능 시스템이 이 이질적인 데이터 유형을 노화 생물학의 맥락에서 해석할 수 있는지를 평가하는 벤치마크는 없었다. 우리는 다섯 개 생물데이터 영역에 걸친 17개 과제로 이루어진 공개 모음 LongevityBench를 소개하고, 이를 이용해 여섯 개 개발 팀의 최신 인공지능 시스템 18종을 평가한다. 최근 인공지능의 발전에도 모든 과제를 지배하는 단일 모델은 없었으며, 오믹스 기반 연령 예측이 규모와 무관하게 가장 어려운 과제였다. 이 격차를 최신 규모의 자원 없이 좁힐 수 있는지 시험하기 위해, 우리는 영역 특이적 노화 데이터로 다중과제 Longevity-LLM 다섯 종을 미세조정했다. 파라미터 0.6B에서 9B 규모의 이 소형 Longevity-LLM들은 LongevityBench에서 훨씬 큰 최신 시스템과 대등하거나 그를 능가했으며, 이는 범용 언어 모델을 구조화된 오믹스 과제에 적응시킬 수 있음을 보여준다. 우리는 벤치마크와 모델, 그리고 노화 연구자를 위한 에이전트형 연구 인터페이스 Longevity Claw를 공개한다.","tags":["노화 생물학","인공지능 평가"],"doi":"10.1016/j.cell.2026.08.026","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00999-2","au":"Zhavoronkov A et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Zhavoronkov A et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.026. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":3,"ko":"종단 일상 임상 자료를 이용한 암 진단과 치료의 진전","en":"Advancing cancer detection and treatment using longitudinal routine clinical data","one":"","ab":"암 관리는 늦은 진단부터 구제 치료, 개인화되지 않은 추적 관찰까지 전 과정이 분절돼 있다. 저자들은 개인 367만 명과 진료 1,770만 건으로 이루어진 중국 COMPASS 코호트로 학습한 통합 다중모달 트랜스포머 Oncoformer를 제시하고, UK Biobank를 포함한 독립 외부 코호트에서 검증했다. 이 모델은 종단 전자의무기록과 흉부 X선 영상을 통합해 여러 임상 과제를 한꺼번에 다룬다. 범암종 진단에서 곡선하면적 0.956, 진단 1년 전까지의 미래 암 예측에서 0.869를 기록했고 종양 병기 추정은 평균 곡선하면적 0.90을 넘었다. 환자별 치료 반응 예측과 열 개 암종의 무재발 생존 층화도 모두 유의했다. 병기 예측은 수술 후 병리 결과로 독립 검증됐으며 핵심 암 유전체 경로로 수렴하는 것으로 나타났다.","tags":["의료 인공지능","암 진단"],"doi":"10.1016/j.cell.2026.07.009","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00807-X","au":"Liu F et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":4,"ko":"식이 아르기닌이 코돈 의존적 MHC 1형 번역을 이끌어 대장 종양 형성과 호흡기 바이러스 감염에서 면역을 개선한다","en":"Dietary arginine drives codon-dependent MHC class I translation and improves immunity in colon tumorigenesis and respiratory viral infection","one":"","ab":"아미노산 농도는 여러 병적 상태에서 변하지만, 이런 변화가 숙주 유전자 발현을 조절해 병태생리를 직접 빚는지는 알려지지 않았다. 저자들은 암과 감염에서 관찰되는 세포외 아르기닌 제한이 특정 아르기닌 tRNA를 억제해 MHC 1형의 번역과 항원 제시를 직접 떨어뜨린다는 것을 발견했다. 이 조절은 코돈 사용에 의존해, 동의 코돈 변이를 주면 MHC 1형 변화가 일어나지 않았다. 식이 아르기닌 제한은 인플루엔자와 SARS-CoV-2에 대한 항바이러스 면역을 약화하고 대장 종양 형성을 늘렸다. 반대로 식이 보충이나 골수계 특이적 arginase 1 제거로 아르기닌 가용성을 높이면 MHC 1형 단백질이 늘고 대장 종양 형성이 억제됐으며 바이러스 감염 경과가 좋아졌다. 이 효과들은 β2-microglobulin 결손 마우스에서 모두 사라졌다.","tags":["세포 대사","항원제시","암 면역"],"doi":"10.1016/j.cell.2026.07.020","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00818-4","au":"Wu Q et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":5,"ko":"도메인 재조합으로 설계한 합성 전사인자가 CAR T 세포의 항종양 기능을 높인다","en":"Synthetic transcription factors designed by domain recombination enhance CAR T cell antitumor function","one":"","ab":"사람의 단백질 코딩 유전자는 조상 유전자에서 유래한 도메인의 재배열을 통해 진화했다. 우리는 한 단백질 계통 안의 구성 도메인으로부터 새로운 유전자를 조립하는, 확장 가능하고 진화에 근거한 방법을 개발하고 그 산물을 DESynR 유전자라 부른다. 1차 사람 T 세포에서 DESynR 활성화 단백질 1(AP-1) 전사인자는 시험관과 생체 내 항종양 분석 전반에서 자연 AP-1 전사인자를 유의하게 능가한다. DESynR AP-1 전사인자는 광범위한 전사적, 후성유전적 재프로그래밍을 유도하고, 소진과 작동 및 세포독성 기능, 지속성의 특징을 최적화하는 비자연적 T 세포 상태를 확립하며, 때로는 전혀 다른 세포 유형의 유전자 모듈을 차용한다. 이 재프로그래밍은 고유한 결합이 아니라 이미 알려진 AP-1 결합 조절 요소의 차등 조절이 주로 이끈다. 끝으로 우리는 단백질 계통을 가로지르는 일반성을 뒷받침하기 위해 DESynR ETS 및 FOX 전사인자를 스크리닝한다. 전체적으로 우리는 기존 단백질 도메인을 재구성함으로써 치료적으로 의미 있는 세포 상태를 프로그래밍하는, 진화하지 않은 유전자를 발굴할 수 있음을 보인다.","tags":["세포치료","단백질 설계"],"doi":"10.1016/j.cell.2026.07.054","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00923-2","au":"Takacsi-Nagy O et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Takacsi-Nagy O et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.054. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":6,"ko":"근위축성 측삭경화증에서 언어 저하와 실행기능 저하의 서로 다른 세포 표현형","en":"Distinct cellular phenotypes of language and executive decline in amyotrophic lateral sclerosis","one":"","ab":"근위축성 측삭경화증에서는 언어와 실행기능 손상을 포함한 인지 증상이 나타나지만 그 기전은 분명하지 않았다. 저자들은 인지 기능으로 층화한 환자 코호트의 전전두피질을 공간 전사체와 단일핵 전사체를 통합해 지도화했다. 그 결과 인지 장애가 영역과 인지 아형에 따라 서로 다른 신경세포 기능 이상, 그리고 교세포와 혈관의 조절 이상 패턴과 연관됨을 밝혔다. 실행기능 장애는 배외측 전전두피질 심층 신경세포의 미토콘드리아 및 시냅스 활동 감소와 연결됐고, 언어 관련 결손은 교세포와 혈관 이상을 포함하는 전 영역에 걸친 확산성 반응과 함께 나타났다. 다중 이미징으로 검증한 분석에서는 다세포 교세포 증식 반응을 비롯해 운동 표현형과 인지 표현형을 아우르는 전전두피질 신호도 확인됐다. 임상적 이질성이 뇌의 운동 영역과 비운동 영역에서 표현형에 특이적인 세포 상호작용으로 생긴다는 결론이다.","tags":["신경퇴행","공간 오믹스"],"doi":"10.1016/j.cell.2026.07.008","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00806-8","au":"Petrescu J et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"CC BY-NC-ND 4.0. ND 조항이 번역 같은 2차적 저작물을 허용하지 않아 초록 전문 대신 요약으로 싣는다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":7,"ko":"내재성 심장 신경계는 심장 기능과 생존에 필수적이다","en":"The intrinsic cardiac nervous system is essential for cardiac function and survival","one":"","ab":"내재성 심장 신경계(ICNS)는 심장과 뇌의 소통에서 핵심 교점이자 심장 치료의 새로운 표적이지만, 그 생리적 중요성과 기능적 조직화는 충분히 이해되지 않았다. 여기서 우리는 ICNS가 여러 조건에 걸쳐 심장 기능과 생존에 필수적임을 보인다. 마우스에서 유전학적 접근과 이미징을 통합해, 외래 입력과 투사 구조, 생리적 역할이 서로 다른 분자적으로 구별되는 두 가지 내재성 심장 신경세포(ICN) 아형을 식별한다. Npy 양성 ICN은 미주신경 입력을 우선적으로 받아 심박수와 관상동맥 관류의 부교감 조절을 매개하며, 이들을 제거하면 치명적인 심부전에 이른다. 반면 Ddah1 양성 ICN은 교감신경 입력을 받으며 극단적인 생리적 또는 심리적 스트레스 아래에서 전기적 안정성을 보존하고 돌연 심정지를 방지하는 데 필요하고, 이들의 활성화는 심장 보호 효과를 제공한다. 종합하면 이 결과들은 ICNS를 심장 기능의 결정적 조절자로 확립하며, 정밀하고 세포 유형을 표적으로 하는 신경조절 치료의 틀을 제공한다.","tags":["심혈관","신경과학"],"doi":"10.1016/j.cell.2026.06.040","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00760-9","au":"Xu QJ et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Xu QJ et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.06.040. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":8,"ko":"장 근육의 성별과 생식 가소성이 장 크기를 결정한다","en":"The sex and reproductive plasticity of intestinal muscles instruct gut size","one":"","ab":"성체 기관은 기능적 요구에 반응해 커지거나 줄어들며, 이런 변화는 흔히 상주 줄기세포의 동역학으로 설명된다. 식이와 생식 상태에 따라 길이가 달라지는 장이 두드러진 예다. 우리는 성체 장의 크기가 주변 근육에 의해 외재적으로 조절된다는 것을 발견했다. 초파리에서 장 근육은 성별에 따라 크기와 구조가 다르며 암컷에서는 생식 중에 성장한다. 장 근육 세포의 성이나 생식 상태를 바꿈으로써, 우리는 근육에 내재한 성 결정 인자가 근원섬유 폭과 기관 크기의 기본적인 성차를 결정한다는 것을 확립한다. 암컷 근육은 생식 중에 호르몬 입력과 영양 입력을 통합해 근절을 늘리며, 이는 장 통과를 줄이고 기관 크기를 더욱 키운다. 이런 재편은 적응적이며 마우스에서도 일어난다. 우리 결과는 장 근육을, 성체의 기관 수준 특성을 조정하고 생식 요구를 지탱하는 특정 신호에 반응하는 존재로 다시 정의한다.","tags":["기관 크기","생리학"],"doi":"10.1016/j.cell.2026.07.024","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00822-6","au":"Mineo A et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Mineo A et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.024. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":9,"ko":"이합체의 이합체 구조가 사람 CNNM4의 마그네슘 수송을 규정한다","en":"Dynamic dimer-of-dimers architecture defines Mg2+ transport in human CNNM4","one":"","ab":"마그네슘은 모든 생물에 필수적이지만 포유류 막을 가로지르는 그 수송은 충분히 이해되지 않았다. 여기서 우리는 원형질막에 있는 전장 포유류 마그네슘 수송체인 사람 CNNM4의 극저온 전자현미경 구조를 바깥을 향한 상태와 폐색 상태로 제시하며, 예상치 못한 사합체 조립을 드러낸다. 이는 비대칭 이합체의 이합체로 조직되어, 원핵생물 상동체에서 보이고 진핵생물 CNNM에서 오랫동안 가정되어 온 대칭 이합체와 구별된다. 우리는 마그네슘과 ATP의 결합이 역동적인 세포 내 도메인을 안정화하고 사합체 형성을 촉진함을 보이며, 산성 패치가 추가 마그네슘을 결합해 세포질 마그네슘 농도를 수송 활성에 연결하는 감지기로 작동할 가능성을 제시한다. 막관통 도메인 안에서는 나트륨 결합 시 핵심 글루탐산이 뒤집히면서 바깥을 향한 상태의 마그네슘 결합 자리를 불안정하게 만들어 마그네슘과 나트륨의 교환을 촉진한다. 종합하면 이 결과들은 원핵생물 모형에서 갈라지는 CNNM 수송과 조절의 기전적 틀을 확립하고 CNNM 기능을 사람의 생리 및 질환과 연결한다.","tags":["구조생물학","이온수송"],"doi":"10.1016/j.cell.2026.06.039","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00759-2","au":"Bai Z et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Bai Z et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.06.039. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":10,"ko":"붕소로 가교된 GIPC가 세포벽 고정과 PIN 극성 영역을 안정화한다","en":"Boron-bridged GIPCs stabilize cell wall anchoring and PIN polar domains","one":"","ab":"붕소는 결핍 시 전 세계 작물 수확량을 떨어뜨리는 필수 미량 영양소다. 글리코실이노시톨포스포릴세라마이드는 원형질막의 주요 지질이고, PIN 단백질은 원형질막에 비대칭으로 자리 잡아 극성 옥신 수송을 매개한다. 저자들은 이 두 요소가 기능적으로 연결돼 있음을 보였다. 붕소는 거의 모든 GIPC 계열을 가교해 원형질막과 세포벽을 잇는 물리적 부착을 만들며, 이는 Hechtian 가닥으로 관찰된다. 붕소 매개 가교는 PIN2의 측면 확산과 세포내섭취도 제한해 GIPC와 PIN2의 직접 상호작용을 통해 극성 영역 형성을 안정화한다. 표현형 증거도 이 기전을 뒷받침해, 붕소 결핍과 GIPC 생합성 장애는 모두 고차 pin 변이체와 같은 표현형을 보이며 PIN 위치 이상과 옥신 최대치 감소가 나타났다.","tags":["식물 지질","극성 수송"],"doi":"10.1016/j.cell.2026.06.028","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00748-8","au":"He M et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"출판사 저작권. 초록 전문을 싣지 않고 요약으로 대신한다. 원문은 DOI 링크에서 볼 수 있다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":11,"ko":"사람 뇌 혈관의 공간 지도가 드러낸 특화된 세포 앙상블","en":"Spatial atlas of the human brain vasculature reveals specialized cell ensembles","one":"","ab":"뇌 혈관은 뇌 기능에 필수적인 다양한 특화 세포로 이루어지지만 그 공간적 조직화는 충분히 이해되지 않았다. 여기서 우리는 동정맥 축을 포착하고 합의 세포 상태를 정의하는 전사체 314,535건으로 이루어진 포괄적 뇌혈관 세포 지도를 구축한다. 이어 공간 전사체 분석을 수행해 사람 측두피질과 해마에 걸친 세포 1,529,740개를 지도화하고, 혈관 세포 앙상블이라 이름 붙인 정형화된 미세 공동체를 밝혀낸다. 이 앙상블은 내피세포와 벽세포, 섬유아세포, 혈관주위 대식세포의 특화된 하위집합으로 이루어지며, 동정맥 구조에 정렬되어 신경혈관 결합과 혈뇌장벽 수송, 면역 감시 같은 구간 특이적 기능을 조율한다. 유전적 위험과 약물 반응성을 겹쳐 봄으로써 우리는 소혈관질환과 뇌졸중을 포함한 여러 신경질환에 걸쳐 앙상블 특이적 감수성과 치료 표적 후보를 식별한다. 이 연구는 사람 뇌혈관 생물학의 바탕에 있는 공간적, 기능적 논리를 분해할 자원을 제공하고 신경질환 감수성과 치료 반응을 해독할 청사진을 확립한다.","tags":["공간 오믹스","뇌 혈관"],"doi":"10.1016/j.cell.2026.07.007","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00805-6","au":"Wang JC et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Wang JC et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.07.007. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-09-17","t":"T2","i":12,"ko":"조직 내 단일세포의 전사체 전체 규모 아이소폼 해상도 공간 이미징","en":"Whole-transcriptome-scale isoform-resolved spatial imaging of single cells in tissues","one":"","ab":"세포와 조직의 기능은 수많은 유전자 사이의 복잡한 상호작용에서 비롯되며, 이 기능을 체계적으로 이해하려면 높은 공간 해상도에서 단일세포의 아이소폼 해상도 전사체 분석이 필요하다. 여기서 우리는 원위치 RNA 증폭 방법과 이를 다중 오류 보정 형광 제자리 혼성화(MERFISH)와 통합하는 방식을 소개해, 짧은 RNA 서열을 검출하고 온전한 조직 안 개별 세포의 전사체 전체 규모 아이소폼 해상도 공간 전사체 분석을 가능하게 한다. 이 접근법으로 우리는 마우스 뇌에서 유전자 약 23,000종과 아이소폼 약 10,000종을 포함해 서로 다른 RNA 약 33,000종을 이미징했다. 우리 자료는 영역 특이적, 세포 유형 특이적 유전자 프로그램과 리간드 수용체 기반 세포 간 소통의 체계적 분석을 가능하게 했다. 이 자료는 나아가 수많은 유전자에 걸친 아이소폼 사용의 풍부한 공간적 다양성과 세포 유형 특이성, 그리고 아이소폼 특이성이 특히 풍부한 뇌 구조를 드러냈다. 우리는 이 방법이 조직 기능의 분자적, 세포적 기반을 특성화하는 데 널리 응용되어 그간 접근할 수 없었던 발견을 열어 주리라 기대한다.","tags":["공간 오믹스","전사체"],"doi":"10.1016/j.cell.2026.06.027","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)00747-6","au":"Cohen L et al.","aff":"","type":"","bg":"","ap":"","kf":[],"sig":"","lim":"","lab":"","lic":"초록 전문 번역. 출처 Cohen L et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.06.027. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[]},{"j":"Cell","w":"2026-10-01","t":"T1","i":1,"ko":"진핵생물 계통 전체를 가로지른 미토콘드리아 단백체 비교 분석","en":"Comparative analysis of mitochondrial proteomes across the tree of life","one":"진핵생물 8종의 실험 기반 미토콘드리아 단백체를 모아 비교하고 약 200종으로 예측을 확장해, 사람에게 없고 병원체에만 있는 미토콘드리아 표적 33개와 호기성 혐기성 능력을 함께 가진 조상 미토콘드리아를 제시한다.","ab":"미토콘드리아는 약 20억 년 전 세균이 고세균 계통의 숙주 세포와 공생을 이루면서 생겼다. 그 기원과 진화를 이해하기 위해 우리는 MitoCarta Tree of Life 과제에서 실험으로 정의한 미토콘드리아 단백체들을 비교했다. 8종에 걸쳐 3,199개 단백질 집단 안에서 서로 다른 미토콘드리아 단백질 8,619개를 확인했고, 그 가운데 43%는 Pfam 도메인이 없었다. 진핵 병원체에서는 보존되지만 사람에게는 없는 단백질 집단 33개를 보고하며, 이들은 원생동물 감염 질환의 유망한 후보 표적이다. 실험으로 정의한 미토콘드리아 단백체를 활용해 단백질 언어 모델 기반 분류기를 재학습시켜 약 200종 진핵생물의 미토콘드리아 단백체를 예측했다. 이렇게 확장한 집합에서 우리는 미토콘드리아의 진화 경로를 상세히 기술한다. 그 경로는 분류군 특이적 유전자 집단 확장에서부터 소기관 완전 소실로 향하는 듯한 극단적 단백체 축소까지 걸쳐 있다. 마지막으로 우리는 마지막 진핵생물 공통 조상(LECA)의 미토콘드리아 단백체를 재구성해, LECA가 호기성 대사와 혐기성 대사를 모두 수행할 수 있는 복잡한 미토콘드리아를 가지고 있었음을 밝힌다.","tags":["미토콘드리아","단백체","진화유전체","병원체 표적"],"doi":"10.1016/j.cell.2026.08.029","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01002-0","au":"Chen MZ, Stefely JA, …, Mootha VK","aff":"Department of Molecular Biology, Massachusetts General Hospital, Boston, MA, USA (제1저자 겸 교신저자 Chen MZ, 교신저자 Mootha VK); Department of Systems Biology, Harvard Medical School, Boston, MA, USA; Broad Institute of MIT and Harvard, Cambridge, MA, USA; Howard Hughes Medical Institute, Massachusetts General Hospital, Boston, MA, USA","type":"Article","bg":"미토콘드리아에 대한 교과서적 서술은 동물과 효모 연구로 만들어졌다. 그런데 미토콘드리아 단백질의 95%에서 100%는 핵 유전체가 암호화하고 그 구성은 계통마다 크게 다르다. 핵 유전자가 만드는 단백체가 진핵 계통별로 어떻게 달라지는지는 기술적 어려움 때문에 정의가 늦었다. 저자들은 가장 많이 분기한 미토콘드리아를 가진 병원성 원생동물까지 포함해 단백체를 실험으로 정의하면, 미토콘드리아의 진화 경로와 치료 표적을 함께 찾을 수 있을지 물었다.","ap":"MitoCarta Tree of Life(MitoTOL) 과제에서 진핵생물 6종을 골라 미토콘드리아 단백체를 질량분석으로 정의하고, 기존의 고품질 사람 및 효모 목록을 합쳐 8종을 분석 대상으로 삼았다. 이 6종에는 연간 약 10억 건의 감염을 일으키는 병원성 원생동물 5종이 들어 있다. 단백질 서열과 서열 프로파일, 구조 상동성을 함께 써서 orthogroup을 정의하고, 203종 대표 진핵생물에 존재하는 집단만 분석에 남겼다. 실험으로 정의한 단백체만으로 DeepLoc2.0-mito 분류기를 재학습시켜 203종의 미토콘드리아 단백체를 예측했다. 계통학적으로 해소한 orthogroup(PhROG)으로 병원체 공통 표적을 추렸고, 교정 stem length로 LECA 단백질의 획득 시점을 추정했다.","kf":["8종의 실험 기반 미토콘드리아 단백체에서 단백질 8,619개를 3,199개 집단으로 정리했고 그중 43%는 Pfam 도메인이 없었다.","사람에게는 상동체가 없고 병원체 분류군 둘 이상에서 공유되는 미토콘드리아 PhROG 33개를 후보 표적으로 추렸다. 그 가운데 ClpYQ protease, class I FH, PLD형 CLS 세 효소는 Plasmodium knowlesi에서 필수였다.","NDH2, AOX, 복합체 I의 gamma carbonic anhydrase 소단위, CCA 첨가 효소처럼 널리 분포하고 LECA 미토콘드리아에 재구성되지만 사람에게는 없는 단백질을 다수 확인했다.","DeepLoc2.0-mito는 실험 목록 어디에도 없던 고신뢰 미토콘드리아 orthogroup 1,420개를 추가로 예측했고 그중 943개(65%)는 외군 상동체 탐지 검정력을 갖췄다.","LECA 미토콘드리아 단백체는 약 1,438개(신뢰구간 842에서 1,868개, 1,056개 orthogroup)로 추정됐고, 핵심 호기성 전자전달계와 혐기성 단백질의 공통 부분집합이 계통 위상과 무관하게 함께 들어 있었다.","미토콘드리아 유래 LECA 단백질은 숙주 유래나 비미토콘드리아 LECA 단백질보다 교정 stem length가 길고 추정 기원이 늦어, 미토콘드리아가 진핵세포 형성 과정에서 늦게 획득됐다는 mito-late 쪽을 지지한다.","식물 병원체 여러 종의 미토콘드리아에는 공통으로 있으나 Arabidopsis에는 없는 단백질 집합도 따로 확인했다."],"sig":"사람 중심으로 정리돼 온 미토콘드리아 단백체 지식을 진핵생물 계통 전체로 넓혔다. 사람에게 없고 병원체에 보존된 표적 목록은 atovaquone 내성이 늘어나는 상황에서 항원생동물 약물 개발의 출발점이 된다. LECA 재구성은 미토콘드리아가 호기성과 혐기성 능력을 처음부터 함께 가지고 있었다는 그림을 제시한다.","lim":"저자들은 네 가지 한계를 인정한다. 분석 대상이 다양하지만 현존 생물의 시퀀싱이 불완전하고 잘 연구된 분류군에 치우쳐 있어 전체 진화사가 가려질 수 있다. 병원체 공통 표적은 단백질 구조와 약물성을 따로 검토해야 실제 표적이 된다. 원거리 상동체 탐지가 여전히 어려워 분류군 특이로 보이는 단백질 집단에 사실은 원거리 상동체가 있을 수 있다. 깊은 시간대의 계통 추론은 신호 감소와 long branch attraction 같은 인공물 때문에 LECA 같은 시점의 재구성 정확도에 영향을 줄 수 있다.","lab":"질량분석 기반 단백체를 직접 생산해 비교 분석의 기준 자료로 쓰는 설계가 우리 연구실의 작업 방식과 같다. 소기관 단위 단백체 목록을 만들고 이를 종이나 조건을 가로질러 비교하는 틀은 우리 데이터에도 적용할 수 있다. 미토콘드리아와 세포 대사도 우리 관심 분야다.","lic":"초록 전문 번역. 출처 Chen MZ et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.029. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-10-01_t1-1_fig1.jpg","label":"Figure 1","cap":"연구에 쓴 진핵생물 분류군과 원핵생물 외군을 담은 계통수, 그리고 고품질 실험 단백체를 확보한 8종을 표시한다. 종마다 전체 단백체 크기, 실험으로 정의한 미토콘드리아 단백체 크기, mtDNA가 암호화하는 단백질 수를 함께 보여주고 미토콘드리아 orthogroup을 정의하는 절차를 도식으로 제시한다."},{"src":"fig/CEL_2026-10-01_t1-1_fig6.jpg","label":"Figure 6","cap":"LECA 미토콘드리아의 에너지 생산 경로를 혐기성과 호기성으로 나누어 보여준다. 원핵생물 유래 orthogroup을 혐기성 대비 호기성 원핵생물 농축으로 순위화하고, 호기성 전자전달계와 혐기성 단백질이 공존하는 모자이크 구조를 제시한다."}]},{"j":"Cell","w":"2026-10-01","t":"T1","i":2,"ko":"Acanthamoeba 미토콘드리아 단백체가 산소로 조절되는 호기성 혐기성 경로를 드러낸다","en":"Mitochondrial proteome of Acanthamoeba delineates aerobic and anaerobic pathways dynamically regulated by oxygen","one":"실명을 일으키는 아메바 Acanthamoeba의 미토콘드리아 단백질 1,122개 목록을 질량분석으로 정의하고, 산소에 따라 생체에너지 기구가 재배선돼 혐기 조건에서 수소 기체를 만든다는 것을 실험으로 보였다.","ab":"Acanthamoeba castellanii는 감염성 실명을 일으키고 사람과 균류의 핵심 진화적 외군에 속한다. 이 생물의 분기한 미토콘드리아는 호기성 기능과 혐기성 기능을 함께 가질 것으로 예측돼 약물 표적 가능성과 함께 큰 관심을 받아 왔다. 그러나 생체에너지 기구와 그 활성, 조절에 대한 상세한 규명은 없었다. 여기서 우리는 미토콘드리아 면역침강, 밀도 구배 정제, 질량분석, protein correlation profiling, 현미경을 통합해 Acanthamoeba 미토콘드리아 단백체의 고신뢰 목록을 만들었다. 그 결과인 AcMitoCarta는 단백질 1,122개를 담고 있으며, 그중 381개는 사람과 효모 미토콘드리아에서 쉽게 식별되는 상동체가 없다. 복합체체 분석은 거대분자 조립체 20개를 짚어낸다. 단백체와 전사체를 상호 보완적으로 프로파일링한 결과, 산소에 의해 소기관의 생체에너지 기구가 광범위하게 재배선되는 것이 드러났고 무산소에서 혐기성 pyruvate:ferredoxin oxidoreductase에서 hydrogenase로 가는 경로가 유도됐다. 우리는 Acanthamoeba가 무산소 조건에서 미토콘드리아에 국재하고 산소에 불안정한 hydrogenase를 통해 H2 기체를 만들 수 있음을 실험으로 입증한다. AcMitoCarta는 호기성 에너지 대사와 혐기성 에너지 대사 사이의 상호작용을 해부하는 틀을 마련한다.","tags":["미토콘드리아","단백체","생체에너지","감염 병원체"],"doi":"10.1016/j.cell.2026.08.056","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01067-6","au":"Stefely JA, Deng FG, …, Mootha VK","aff":"Department of Molecular Biology, Massachusetts General Hospital, Boston, MA, USA (제1저자 Stefely JA, 교신저자 Mootha VK); Broad Institute of MIT and Harvard, Cambridge, MA, USA (교신저자 Udeshi ND); Department of Molecular and Cell Biology, Boston University Goldman School of Dental Medicine, Boston, MA, USA (교신저자 Samuelson J)","type":"Resource","bg":"Acanthamoeba castellanii는 사람 각막 감염으로 실명을 일으키고, 사람과 효모가 속한 opisthokont의 핵심 외군인 Amoebozoa에 속한다. 2014년 Gawryluk 등이 보고한 단백체는 수작업 정리에 크게 의존해 오염 165개를 직접 지우고 서열 상동성 예측 324개를 직접 더해 1,033개 목록을 만들었다. 당시 유전체 조립과 주석이 좋지 않았고 질량분석도 구세대여서 민감도와 특이도가 낮았다. 저자들은 핵 유전체를 깊은 전사체로 재주석해 정확도를 52%에서 98%로 올린 뒤, 실험으로 정의한 고정확도 단백체를 만들고 이 소기관의 생체에너지가 얼마나 유연한지를 묻고자 했다.","ap":"참조 유전체를 제공하는 Neff 균주를 썼다. 미토콘드리아 면역침강과 Percoll 밀도 구배 정제로 순도가 점점 높아지는 분획을 만들고 각 분획을 DIA 질량분석으로 측정했다. 보존된 미토콘드리아 표지 단백질 3개의 평균 프로파일과의 상관으로 protein correlation profiling 점수를 매겨 MitoViaPCP 목록을 정의했다. 여기에 에피토프 태깅과 공초점 현미경 검증을 더해 AcMitoCarta를 확정했다. BN-PAGE 겔을 레인마다 60조각으로 잘라 질량분석해 복합체체를 지도화했다. 교란 프로파일링은 영양 풍부 배지와 기아 배지에서 normoxia(21% O2), hypoxia(1% O2), near-anoxia(0.01% O2 미만) 24시간과 무산소 후 1시간 또는 6시간 재산소화 조건을 두고 질량분석과 RNA 시퀀싱을 함께 수행했다. 수소 기체 생산은 무산소 글러브박스에서 H2 특이 Clark형 전극과 methyl viologen 발색으로 측정했다.","kf":["AcMitoCarta는 실험으로 정의한 미토콘드리아 단백질 1,122개를 담으며 그중 381개는 사람과 효모 미토콘드리아에 쉽게 식별되는 상동체가 없다. 사람 또는 효모와 공유하는 741개는 Amorphea 공통 조상의 미토콘드리아 단백질 후보가 된다.","단백질 기원은 원핵 유래의 오래된 수직 전달이 약 65%, 진핵 고유 혁신이 약 30%, 원핵에서 온 최근 수평 유전자 전달이 약 5%였다. 수평 전달 단백질 중 AcHupA는 mtDNA 결합 단백질로 확인됐다.","BN-PAGE 질량분석으로 거대분자 조립체 20개를 지도화했다. 완전 조립된 복합체 I과 함께 N형 및 QP형 모듈이 관찰됐고, 포유류에서 보이는 OXPHOS 초복합체 증거는 없었다.","저산소와 무산소에서 단백체 신호 중 AcMitoCarta 비중이 늘었고, 전사체는 더 작은 부분집합만 변했다. 가장 많이 증가한 항목은 PFOR, HydA, HydE, HydF, HydG, HCP였다.","무산소에서 배양한 Acanthamoeba는 H2 기체를 만들었고, 같은 질량의 세포와 분리 미토콘드리아에서 모두 활성이 나타났다. 무산소에서 꺼낸 미토콘드리아를 21% O2에 30분 노출하면 활성이 줄어 hydrogenase가 산소에 불안정함을 보였다.","사람 각막 감염에서 유래한 임상 계통 T4A, T4B, T4C, T4D도 무산소에서 빠르게 형태를 회복하고 H2 생산과 hydrogenase 활성을 보였다. nitazoxanide는 무산소에서 유의한 활성을 보여 미토콘드리아 PFOR의 중요성을 뒷받침했고 oligomycin의 normoxia IC50은 약 9 마이크로몰이었다.","Acanthamoeba는 증식하지는 못하지만 진짜 무산소 상태에서 최소 5일을 견뎠다."],"sig":"사람과 효모 바깥의 분기한 미토콘드리아를 고정확도로 목록화한 공개 자원을 만들었다. 같은 소기관이 산소 농도에 따라 호기성 기구와 혐기성 기구 사이를 오간다는 것을 단백체와 전사체, 활성 측정으로 함께 보였다. nitazoxanide 민감도를 포함한 억제제 결과는 Acanthamoeba 감염 치료의 표적 선택에 쓸 수 있는 자료다.","lim":"저자들은 대량 배양이나 수확이 불가능한 생물에는 이 실험 방식을 쓸 수 없고 생물정보 기반 전략이 여전히 필요하다고 적는다. Percoll과 OptiPrep 구배의 직접 비교는 후속 과제로 남겼다. 최적화한 계면활성제 조건에서 복합체 III과 V의 이량체는 보였으나 포유류형 초복합체 증거는 없어, 생체 내 초복합체 존재 여부는 알 수 없다. 연구는 주로 trophozoite를 대상으로 했고 두꺼운 세포벽을 가진 cyst에서는 미토콘드리아를 분리하는 방법이 아직 없다.","lab":"미토콘드리아 면역침강과 밀도 구배, DIA 질량분석, protein correlation profiling, BN-PAGE 질량분석을 묶어 소기관 단백체와 복합체체를 함께 정의하는 설계는 우리 연구실이 바로 쓸 수 있는 조합이다. 단백체와 전사체를 같은 교란 조건에서 짝지어 비교해 번역 후 조절을 분리해 내는 방식도 참고할 만하다. 미토콘드리아와 세포 대사는 우리 관심 분야다.","lic":"초록 전문 번역. 출처 Stefely JA et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.056. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-10-01_t1-2_fig1.jpg","label":"Figure 1","cap":"질량분석 단백체와 현미경으로 Acanthamoeba MitoCarta를 실험으로 정의하는 과정을 보여준다. Acanthamoeba의 계통 위치, 미토콘드리아 분리 작업 흐름과 분획의 투과전자현미경 사진, DIA 질량분석으로 정량한 단백질을 미토콘드리아 표지 3개와의 상관으로 정렬한 열지도, 순도별 민감도 정밀도 곡선을 함께 담았다."},{"src":"fig/CEL_2026-10-01_t1-2_fig5.jpg","label":"Figure 5","cap":"산소 변동에 따라 Acanthamoeba 미토콘드리아의 생체에너지 경로가 재배선되는 양상을 보여준다. 교란 조건과 프로파일링 설계, 산소 농도별 세포 형태, 단백체와 전사체에서 가장 크게 증가한 PFOR와 HydA, HydE, HydF, HydG, HCP를 제시한다."}]},{"j":"Cell","w":"2026-10-01","t":"T1","i":3,"ko":"protein correlation profiling으로 만든 고신뢰 식물 미토콘드리아 단백체","en":"A high-confidence plant mitochondrial proteome via protein correlation profiling","one":"미토콘드리아를 단계적으로 농축하면서 DIA 질량분석과 protein correlation profiling을 결합해 Arabidopsis 미토콘드리아 단백질 1,609개 목록 AtMitoCarta를 만들고, 형질전환 없이 야생형 식물에도 쓸 수 있는 작업 흐름을 제시한다.","ab":"식물 미토콘드리아는 동물 미토콘드리아와 많은 특징을 공유하지만 고유한 성질도 가진다. 원형과 선형 미토콘드리아 DNA가 함께 있고 RNA 편집이 일어나며 전자전달계가 분기해 있고 광합성을 뒷받침하는 대사 경로가 있다. 보존된 기능과 계통 특이적 기능을 연구하려면 정확한 미토콘드리아 단백체가 꼭 필요하다. 여기서 우리는 미토콘드리아의 단계적 농축과 질량분석, protein correlation profiling을 결합해 식물 미토콘드리아 단백체를 정의하는 새로운 접근을 제시한다. 이 접근으로 민감도와 특이도가 높은 미토콘드리아 단백질 목록 1,462개를 실험으로 정의할 수 있었다. 우리의 실험 목록을 문헌과 현미경 검증과 통합하면 미토콘드리아 단백질 1,609개로 이루어진 Arabidopsis thaliana MitoCarta(AtMitoCarta) 아틀라스가 나오며, 여기에는 새로 정의한 단백질 236개와 기능이 알려지지 않은 단백질 147개가 들어 있다. 진핵생물 사이의 비교 분석은 미토콘드리아 단백질 집단의 15%가 식물 특이적이며 여기에 확장된 pentatricopeptide repeat 단백질이 포함됨을 보여준다. AtMitoCarta 목록과 야생형 식물에 적용할 수 있는 이 실험 작업 흐름은 식물 미토콘드리아의 비교 연구를 가능하게 할 것이다.","tags":["미토콘드리아","단백체","식물 생물학","대규모 자원"],"doi":"10.1016/j.cell.2026.08.027","url":"https://www.cell.com/cell/fulltext/S0092-8674(26)01000-7","au":"Kim M, Calvo SE, …, Mootha VK","aff":"Howard Hughes Medical Institute and Department of Molecular Biology, Massachusetts General Hospital, Boston, MA, USA (제1저자 Kim M, 교신저자 Mootha VK); Broad Institute of MIT and Harvard, Cambridge, MA, USA; Department of Systems Biology, Harvard Medical School, Boston, MA, USA","type":"Article","bg":"식물 단백체는 동적 범위가 넓고 복잡하다. 게다가 미토콘드리아를 정제하려는 절차는 peroxisome과 thylakoid 같은 오염이 계속 남아 왔다. 그래서 식물 미토콘드리아 단백체를 정확히 규명하는 일은 오래 어려웠다. protein correlation profiling(PCP)은 여러 분획에 걸친 프로파일을 미끼 단백질과 비교해 구획을 배정하는 방법으로 원래 소기관 단백체 정의를 위해 도입됐다. 저자들은 전체 식물 추출물부터 고순도 미토콘드리아까지 이어지는 농축 분획에 PCP를 적용하면 민감도와 정밀도가 더 좋아질 것이라고 보고 이를 검증했다.","ap":"두 가지 작업 흐름을 썼다. 하나는 야생형 Col-0 식물에서 순차 밀도 구배 원심분리로 미토콘드리아를 농축하는 방식이고, 다른 하나는 3xHA-GFP-TOM5 형질전환 식물에서 친화성 정제(MitoIP)를 추가하는 방식이다. Percoll 구배에 OptiPrep 단계 구배를 더해 peroxisome 오염을 더 걷어냈다. 분획 전부를 표지 없는 DIA 질량분석으로 측정했고 시료는 모두 30개였다. 보존된 미토콘드리아 표지 단백질 3개의 평균 프로파일과의 Pearson 상관으로 PCP 점수를 매기고 0.6 이상을 MitoViaPCP로 정의했다. 여기에 문헌 검토, 미토콘드리아 외막 상관 신호, GFP 융합 현미경 검증을 통합해 AtMitoCarta를 만들었다. 결과는 진핵생물 계통 분포와 식물 조직 분포로 나누어 분석했다.","kf":["PCP로 실험 정의한 MitoViaPCP 목록은 단백질 1,462개이고, 문헌과 현미경 검증을 통합한 AtMitoCarta는 1,609개다. 그중 236개는 새로 정의한 단백질이고 147개는 기능이 알려지지 않았다.","야생형 작업 흐름만으로도 형질전환 작업 흐름과 97% 겹치는 목록이 나왔다. 조건 3개와 시료 9개만 써도 비슷한 정확도에 이르렀다.","전체 식물 용해물 한 번의 DIA 질량분석에서 단백질 12,000개 이상을 검출했다. 오프라인 분획 24개를 돌린 기존 Mergner 등의 조직별 약 14,000개에 근접한 수치다.","진핵생물 사이 비교에서 미토콘드리아 단백질 집단의 15%가 식물 특이적이었고 여기에 확장된 pentatricopeptide repeat(PPR) 단백질이 들어 있었다.","상관 신호로 미토콘드리아 외막 단백질 후보와 이중 표적 단백질 후보를 따로 짚어냈다.","엽록체 국재로 보고됐던 MCU6를 포함해 국재가 엇갈렸던 단백질 24개의 위치를 정리했다. MCU6-GFP는 미토콘드리아에만 국재했다.","mtDNA가 암호화하는 단백질도 안정적으로 검출하고 농축했다."],"sig":"식물 미토콘드리아 단백체를 단일 실험 접근으로 가장 정확하게 규명한 목록을 공개 자원으로 내놓았다. 형질전환이 필요 없는 작업 흐름이라 다른 식물 종과 조직, 스트레스 조건으로 바로 확장할 수 있다. PCP 점수가 엇갈린 국재 보고를 정리하는 데 쓸 수 있음을 MCU6 사례로 보였다.","lim":"저자들은 네 가지 한계를 적는다. 안정 상태의 A. thaliana 유식물만 분석했으므로 발달 단계나 스트레스, 조직에 한정돼 발현되는 미토콘드리아 단백질은 빠질 수 있다. 이중 국재 단백질은 단일 구획 프로파일과 맞지 않아 PCP가 실패할 수 있다. MSH1(PCP.All 0.51)과 LIG1(PCP.All 0.15)이 그 예다. 분석을 유전자 좌위 수준에서 했으므로 미토콘드리아와 다른 구획으로 각각 가는 단백질 이성체를 구분하지 못한다. GFP 융합 현미경 검증 자체에도 오류가 들어갈 수 있어 다른 기법의 추가 검증이 필요하다.","lab":"순차 농축 분획에 DIA 질량분석을 걸고 상관 프로파일로 구획을 배정하는 방식은 소기관 단백체를 다룰 때 우리가 그대로 쓸 수 있는 설계다. 형질전환 없이 야생형 시료만으로 작동한다는 점은 임상 시료나 조직 시료에 적용할 때 특히 유용하다. 미토콘드리아는 우리 관심 분야다.","lic":"초록 전문 번역. 출처 Kim M et al., Cell 189, 2026, DOI 10.1016/j.cell.2026.08.027. CC BY 4.0에 따라 번역해 실었다.","dem":false,"figs":[{"src":"fig/CEL_2026-10-01_t1-3_fig1.jpg","label":"Figure 1","cap":"야생형 식물과 형질전환 식물에서 미토콘드리아를 단계적으로 농축하는 두 작업 흐름을 보여준다. OptiPrep 15%와 20% 층 경계의 미토콘드리아 띠, 각 분획의 투과전자현미경 사진, 구획별 표지 단백질 면역블롯, 표지 없는 DIA 질량분석 처리 도식을 함께 담았다."},{"src":"fig/CEL_2026-10-01_t1-3_fig5.jpg","label":"Figure 5","cap":"AtMitoCarta 목록의 구성과 그 분포를 보여준다. MitoViaPCP, 문헌 검토, 외막 신호, 현미경 검증의 합집합으로 1,609개 목록이 만들어진 과정을 벤 다이어그램으로 제시하고, 진핵생물 계통과 식물 조직에 걸친 분포를 함께 보여준다."}]},{"j":"Cell","w":"2026-10-01","t":"T1","i":4,"ko":"초고속 심층 3차원 조직학으로 수술 중에 glioma 침윤을 지도화한다","en":"Ultrarapid deep 3D histology enables intraoperative mapping of glioma infiltration","one":"한 단계 조직 투명화와 자기지도 딥러닝을 stimulated Raman scattering 현미경에 결합해 3차원 가상 조직학을 약 30분으로 줄이고, 사람 glioma 수술 시료에서 깊이에 따른 침윤 경계를 단일세포 해상도로 구획했다.","ab":"수술 중 조직학은 동결 절편에 의존해 2차원 표본만 보고 보통 절편 2개에서 3개로 판독한다
